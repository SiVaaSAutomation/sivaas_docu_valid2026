---
- name: IPC-Windows-Basiskonfiguration - Teilnehmer im Zielnetz erkennen
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  # Benoetigte Semaphore-/Extra-Variablen:
  #   target_network: "192.168.123.0/24"
  #   nmap_binary: "/usr/bin/nmap"
  #   win_user: "Administrator"
  #   win_password: "..."                  # als Secret/Vault-Variable
  #   winrm_transport: "ntlm"
  #   winrm_default_port: 5985
  #   result_dir: "./reports"
  #   ipc_windows_basis_validation_remote_dir: "C:\\Windows\\Temp\\AnsibleIPCWindowsBasis"
  #
  # Optionale Sollwerte:
  #   basis_login_user: "Administrator"    # Default: win_user
  #   basis_login_password: "..."          # Default: win_password, als Secret
  #   admin_l_user: "Admin_L"
  #   admin_l_password: "..."              # als Secret; ohne Wert werden IDs 0315/0317/0318 NICHT_PRUEFBAR
  #   admin_l_password_min_set_date: "2026-01-01T00:00:00"
  #
  #   id0023_expected_reboot_after: "2026-01-01T12:00:00"
  #   id0066_expected_reboot_after: "2026-01-01T13:00:00"
  #   id0314_expected_reboot_after: "2026-01-01T14:00:00"
  #   # Ohne Mindestzeitpunkt werden die Neustart-IDs als ISTWERT ausgegeben.
  #
  #   expected_ipc_partitions_by_host:
  #     EPO01:
  #       - drive: "C:"
  #         expected_size_gb: 125
  #         tolerance_gb: 5
  #       - drive: "D:"
  #         expected_size_gb: 200
  #         tolerance_gb: 5
  #     WSUS01:
  #       - drive: "C:"
  #         expected_size_gb: 125
  #       - drive: "D:"
  #         expected_size_gb: 500
  #     default:
  #       - drive: "C:"
  #         expected_size_gb: 125
  #       - drive: "D:"
  #         expected_size_gb: 100
  #   partition_size_tolerance_gb: 5
  #
  #   expected_search_icon_profiles: ["Admin_L"]
  #   # Leer = alle lokalen Benutzerprofile mit einer S-1-5-21-SID pruefen.

  tasks:
    - name: Pruefen, ob benoetigte Semaphore-Variablen uebergeben wurden
      ansible.builtin.assert:
        that:
          - target_network is defined
          - nmap_binary is defined
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - winrm_default_port is defined
          - result_dir is defined
          - ipc_windows_basis_validation_remote_dir is defined
          - target_network | string | length > 0
          - nmap_binary | string | length > 0
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - result_dir | string | length > 0
          - ipc_windows_basis_validation_remote_dir | string | length > 0
        fail_msg: >-
          Es fehlen benoetigte Variablen: target_network, nmap_binary,
          win_user, win_password, winrm_transport, winrm_default_port,
          result_dir und ipc_windows_basis_validation_remote_dir.

    - name: Zeitstempel fuer Report setzen
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        report_timestamp_iso: "{{ lookup('pipe', 'date -Iseconds') }}"

    - name: Pruefen, ob nmap auf dem Ansible-Controller vorhanden ist
      ansible.builtin.command: "{{ nmap_binary }} --version"
      register: nmap_check
      changed_when: false
      failed_when: false

    - name: Abbrechen, wenn nmap fehlt
      ansible.builtin.fail:
        msg: >-
          nmap ist auf dem Ansible-Controller unter {{ nmap_binary }}
          nicht ausfuehrbar. Installation z. B.: sudo apt install nmap
      when: nmap_check.rc != 0

    - name: Zielnetz nach Teilnehmern und offenen WinRM-Ports scannen
      ansible.builtin.shell: |
        set -euo pipefail
        tmpdir="$(mktemp -d)"
        trap 'rm -rf "$tmpdir"' EXIT

        # Alle per Ping oder ARP sichtbaren Teilnehmer aufnehmen.
        {{ nmap_binary }} -n -sn {{ target_network }} -oG "$tmpdir/ping.gnmap" >/dev/null
        awk '/Status: Up/{print $2}' "$tmpdir/ping.gnmap" | sort -u > "$tmpdir/live_ips.txt"

        # WinRM separat pruefen, damit auch Hosts ohne ICMP-Antwort gefunden werden.
        {{ nmap_binary }} -n -Pn -p 5985,5986 --open {{ target_network }} -oG "$tmpdir/winrm.gnmap" >/dev/null
        awk '
          /Ports:/ {
            host=$2
            has_http = ($0 ~ /5985\/open\/tcp/)
            has_https = ($0 ~ /5986\/open\/tcp/)

            if (has_https) {
              ports = has_http ? "5985,5986" : "5986"
              print host ";5986;https;" ports
            } else if (has_http) {
              print host ";5985;http;5985"
            }
          }
        ' "$tmpdir/winrm.gnmap" | sort -u > "$tmpdir/winrm_hosts.txt"

        awk -F';' '{print $1}' "$tmpdir/winrm_hosts.txt" >> "$tmpdir/live_ips.txt"
        sort -u "$tmpdir/live_ips.txt" > "$tmpdir/all_ips.txt"

        while read -r ip; do
          [ -z "$ip" ] && continue
          winrm_line="$(awk -F';' -v ip="$ip" '$1 == ip {print; exit}' "$tmpdir/winrm_hosts.txt")"
          if [ -n "$winrm_line" ]; then
            echo "$winrm_line"
          else
            echo "$ip;{{ winrm_default_port }};http;"
          fi
        done < "$tmpdir/all_ips.txt"
      args:
        executable: /bin/bash
      register: scan_result
      changed_when: false

    - name: Gefundene IPC-Teilnehmer und WinRM-Informationen speichern
      ansible.builtin.set_fact:
        discovered_ipc_windows_basis_hosts: "{{ scan_result.stdout_lines | unique | list }}"
        discovered_ips: >-
          {{ scan_result.stdout_lines
             | map('regex_replace', ';.*$', '')
             | unique
             | list }}

    - name: Gefundene IPC-Teilnehmer anzeigen
      ansible.builtin.debug:
        var: discovered_ipc_windows_basis_hosts

    - name: Hinweis ausgeben, wenn keine Teilnehmer gefunden wurden
      ansible.builtin.debug:
        msg: >-
          Es wurden keine Teilnehmer im Zielnetz {{ target_network }} gefunden.
          Der Report enthaelt dann nur die Kopfzeile. Pruefe Zielnetz,
          VLAN, Firewall und nmap-Rechte.
      when: discovered_ipc_windows_basis_hosts | length == 0

    - name: Gefundene Teilnehmer temporaer in das Inventory aufnehmen
      ansible.builtin.add_host:
        name: "{{ item.split(';')[0] }}"
        groups: ipc_windows_basis_targets
        ansible_host: "{{ item.split(';')[0] }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.split(';')[1] | int }}"
        ansible_winrm_scheme: "{{ item.split(';')[2] }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(180) }}"
        discovered_winrm_open_ports: "{{ item.split(';')[3] | default('') }}"
      loop: "{{ discovered_ipc_windows_basis_hosts }}"
      no_log: true

    - name: Dynamische IPC-Windows-Basis-Zielgruppe anzeigen
      ansible.builtin.debug:
        msg: "{{ groups['ipc_windows_basis_targets'] | default([]) }}"


- name: IPC-Windows-Basiskonfiguration auf Windows-Zielen pruefen
  hosts: ipc_windows_basis_targets
  gather_facts: false
  ignore_unreachable: true

  vars:
    remote_validation_dir: "{{ ipc_windows_basis_validation_remote_dir }}"
    remote_validation_script: "{{ ipc_windows_basis_validation_remote_dir }}\\ipc_windows_basis_validation.ps1"
    remote_validation_config: "{{ ipc_windows_basis_validation_remote_dir }}\\ipc_windows_basis_validation_config.json"
    remote_validation_json: "{{ ipc_windows_basis_validation_remote_dir }}\\ipc_windows_basis_validation.json"

  tasks:
    - name: Pruefen, ob Remote-Verzeichnis fuer IPC-Basispruefung gesetzt ist
      ansible.builtin.assert:
        that:
          - ipc_windows_basis_validation_remote_dir is defined
          - ipc_windows_basis_validation_remote_dir | string | length > 0
        fail_msg: >-
          Die Semaphore-Variable ipc_windows_basis_validation_remote_dir fehlt.
          Beispiel: C:\Windows\Temp\AnsibleIPCWindowsBasis

    - name: WinRM-Verbindung testen
      ansible.windows.win_ping:
      register: win_ping_result
      changed_when: false
      failed_when: false
      ignore_errors: true
      ignore_unreachable: true

    - name: IPC-Windows-Basispruefung ausfuehren
      block:
        - name: Temporaeres Verzeichnis fuer IPC-Windows-Basispruefung erstellen
          ansible.windows.win_file:
            path: "{{ remote_validation_dir }}"
            state: directory

        - name: IPC-Windows-Basis-PowerShell-Skript auf Zielsystem kopieren
          ansible.windows.win_copy:
            src: "{{ (playbook_dir | dirname) ~ '/PowershellBatch/ipc_windows_basis_validation.ps1' }}"
            dest: "{{ remote_validation_script }}"
            force: true
          register: ipc_basis_script_copy
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: Hostbezogene IPC-Windows-Basis-Konfiguration kopieren
          ansible.windows.win_copy:
            dest: "{{ remote_validation_config }}"
            content: |
              {
                "TargetIp": {{ (ansible_host | default(inventory_hostname)) | to_json }},
                "WinRmPort": {{ (ansible_port | default('')) | to_json }},
                "WinRmScheme": {{ (ansible_winrm_scheme | default('')) | to_json }},
                "WinRmOpenPorts": {{ (discovered_winrm_open_ports | default('')) | to_json }},
                "BasisLoginUser": {{ (basis_login_user | default(win_user)) | to_json }},
                "AdminLUser": {{ (admin_l_user | default('Admin_L')) | to_json }},
                "AdminLPasswordMinSetDate": {{ (admin_l_password_min_set_date | default('')) | to_json }},
                "ID0023ExpectedRebootAfter": {{ (id0023_expected_reboot_after | default('')) | to_json }},
                "ID0066ExpectedRebootAfter": {{ (id0066_expected_reboot_after | default('')) | to_json }},
                "ID0314ExpectedRebootAfter": {{ (id0314_expected_reboot_after | default('')) | to_json }},
                "ExpectedPartitionsByHost": {{ (expected_ipc_partitions_by_host | default({})) | to_json }},
                "PartitionSizeToleranceGb": {{ (partition_size_tolerance_gb | default(5) | float) | to_json }},
                "ExpectedNetworkBindingComponentIds": {{ (expected_network_binding_component_ids | default(['ms_msclient', 'ms_server'])) | to_json }},
                "NetworkAdapterNameRegex": {{ (network_adapter_name_regex | default('.*')) | to_json }},
                "ExcludedNetworkAdapterNameRegex": {{ (excluded_network_adapter_name_regex | default('(?i)Loopback|isatap|Teredo|Bluetooth')) | to_json }},
                "ExpectedInactivityTimeoutSeconds": {{ (expected_inactivity_timeout_seconds | default(600) | int) | to_json }},
                "RestartShortcutNameRegex": {{ (restart_shortcut_name_regex | default('(?i)neustart|restart')) | to_json }},
                "RestartShortcutTargetRegex": {{ (restart_shortcut_target_regex | default('(?i)(shutdown\\.exe|powershell\\.exe|cmd\\.exe)')) | to_json }},
                "RestartShortcutArgumentsRegex": {{ (restart_shortcut_arguments_regex | default('(?i)(/r|Restart-Computer|shutdown\\s+/r)')) | to_json }},
                "ExpectedShutdownPrivilegeSids": {{ (expected_shutdown_privilege_sids | default(['*S-1-5-32-544'])) | to_json }},
                "ExpectedUacConsentPromptBehaviorAdmin": {{ (expected_uac_consent_prompt_behavior_admin | default(2) | int) | to_json }},
                "ExpectedUacPromptOnSecureDesktop": {{ (expected_uac_prompt_on_secure_desktop | default(1) | int) | to_json }},
                "ExpectedUacEnableLua": {{ (expected_uac_enable_lua | default(1) | int) | to_json }},
                "ExpectedHidePowerOptions": {{ (expected_hide_power_options | default(1) | int) | to_json }},
                "AcceptLegacyNoClose": {{ (accept_legacy_noclose | default(true) | bool) | to_json }},
                "ExpectedLocalOnlyIconPolicy": {{ (expected_local_only_icon_policy | default(1) | int) | to_json }},
                "ExpectedSearchboxTaskbarMode": {{ (expected_searchbox_taskbar_mode | default(1) | int) | to_json }},
                "ExpectedSearchIconProfiles": {{ (expected_search_icon_profiles | default([])) | to_json }},
                "ExpectedCommonDesktopAbsentShortcuts": {{ (expected_common_desktop_absent_shortcuts | default(['WSUS Client Connect', 'SAS-DC 2024'])) | to_json }},
                "ExpectedEnableLmhosts": {{ (expected_enable_lmhosts | default(0) | int) | to_json }}
              }
            force: true
          register: ipc_basis_config_copy
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: Pruefen, ob Skript und Konfiguration vorhanden sind
          ansible.windows.win_stat:
            path: "{{ item }}"
          loop:
            - "{{ remote_validation_script }}"
            - "{{ remote_validation_config }}"
          register: ipc_basis_remote_files
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: Vorhandensein der temporaeren Pruefdateien auswerten
          ansible.builtin.set_fact:
            ipc_basis_script_exists: >-
              {{ ipc_basis_remote_files.results[0].stat.exists | default(false) }}
            ipc_basis_config_exists: >-
              {{ ipc_basis_remote_files.results[1].stat.exists | default(false) }}
          when:
            - ipc_basis_remote_files is defined
            - ipc_basis_remote_files.results is defined
            - ipc_basis_remote_files.results | length >= 2

        - name: Diagnose nach dem Kopieren anzeigen
          ansible.builtin.debug:
            msg:
              - "Host: {{ inventory_hostname }}"
              - "Skript vorhanden: {{ ipc_basis_script_exists | default(false) }}"
              - "Konfiguration vorhanden: {{ ipc_basis_config_exists | default(false) }}"
              - "Skript-Kopierfehler: {{ ipc_basis_script_copy.msg | default('') }}"
              - "Konfigurations-Kopierfehler: {{ ipc_basis_config_copy.msg | default('') }}"

        - name: IPC-Windows-Basis-PowerShell-Skript ausfuehren
          ansible.windows.win_shell: |
            $ScriptPath = {{ remote_validation_script | to_json }}
            $ConfigPath = {{ remote_validation_config | to_json }}
            $ResultPath = {{ remote_validation_json | to_json }}

            if (-not (Test-Path -LiteralPath $ScriptPath)) {
                Write-Error "Pruefskript nicht gefunden: $ScriptPath"
                exit 10
            }
            if (-not (Test-Path -LiteralPath $ConfigPath)) {
                Write-Error "Konfigurationsdatei nicht gefunden: $ConfigPath"
                exit 11
            }

            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File $ScriptPath `
              -ConfigPath $ConfigPath `
              -ResultJsonPath $ResultPath
            exit $LASTEXITCODE
          environment:
            IPC_BASIS_LOGIN_PASSWORD: >-
              {{ basis_login_password | default(win_password) }}
            IPC_ADMIN_L_PASSWORD: "{{ admin_l_password | default('') }}"
          register: ipc_basis_raw
          when:
            - ipc_basis_script_exists | default(false)
            - ipc_basis_config_exists | default(false)
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true
          no_log: true

        - name: Pruefen, ob Ergebnis-JSON auf Zielsystem erzeugt wurde
          ansible.windows.win_stat:
            path: "{{ remote_validation_json }}"
          register: ipc_basis_json_file
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: Ergebnis-JSON vom Zielsystem zum Ansible-Controller zurueckholen
          ansible.builtin.slurp:
            src: "{{ remote_validation_json }}"
          register: ipc_basis_json_slurp
          when:
            - ipc_basis_json_file is defined
            - ipc_basis_json_file.stat.exists | default(false)
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: IPC-Windows-Basis-JSON dekodieren
          ansible.builtin.set_fact:
            ipc_basis_json_text: >-
              {{
                ipc_basis_json_slurp.content
                | b64decode
                | regex_replace('^\ufeff', '')
                | trim
              }}
          when:
            - ipc_basis_json_slurp is defined
            - ipc_basis_json_slurp.content is defined
            - ipc_basis_json_slurp.content | length > 0

        - name: IPC-Windows-Basis-Pruefergebnis als Host-Fact speichern
          ansible.builtin.set_fact:
            ipc_windows_basis_validation: "{{ ipc_basis_json_text | from_json }}"
          when:
            - ipc_basis_json_text is defined
            - ipc_basis_json_text | length > 0
          failed_when: false
          ignore_errors: true

      always:
        - name: Temporaeres Verzeichnis der IPC-Windows-Basispruefung entfernen
          ansible.windows.win_file:
            path: "{{ remote_validation_dir }}"
            state: absent
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

      when:
        - win_ping_result is defined
        - win_ping_result.ping | default('') == 'pong'

    - name: Diagnose anzeigen, wenn kein IPC-Windows-Basis-JSON gespeichert wurde
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "WinRM-Ping: {{ win_ping_result.ping | default('KEIN_PONG') }}"
          - "WinRM-Unreachable: {{ win_ping_result.unreachable | default(false) }}"
          - "WinRM-Meldung: {{ win_ping_result.msg | default('') }}"
          - "Ergebnisdatei vorhanden: {{ ipc_basis_json_file.stat.exists | default(false) }}"
          - >-
            Das Ausfuehrungsergebnis der PowerShell-Task ist wegen no_log
            absichtlich nicht im Semaphore-Log sichtbar.
      when:
        - ipc_windows_basis_validation is not defined


- name: IPC-Windows-Basiskonfiguration - CSV-Report lokal erzeugen
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Zeitstempel fuer Report sicherstellen
      ansible.builtin.set_fact:
        report_timestamp: >-
          {{ hostvars['localhost']['report_timestamp']
             | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}
        report_timestamp_iso: >-
          {{ hostvars['localhost']['report_timestamp_iso']
             | default(lookup('pipe', 'date -Iseconds')) }}

    - name: Report-Verzeichnis erzeugen
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0755"

    - name: JSON-Report erzeugen
      ansible.builtin.copy:
        dest: "{{ result_dir }}/ipc_windows_basis_validation_{{ report_timestamp }}.json"
        mode: "0644"
        content: |
          [
          {% for h in groups['ipc_windows_basis_targets'] | default([]) %}
          {% set hv = hostvars[h] if h in hostvars else {} %}
          {% set fallback = {
            'scan_timestamp': report_timestamp_iso,
            'target_timestamp': '',
            'ip': h,
            'ansible_reachable': false,
            'computername': '',
            'fqdn': '',
            'domain': '',
            'workgroup': '',
            'part_of_domain': '',
            'os_caption': '',
            'os_version': '',
            'winrm_port': hv.ansible_port | default(''),
            'winrm_scheme': hv.ansible_winrm_scheme | default(''),
            'winrm_open_ports': hv.discovered_winrm_open_ports | default(''),
            'checks': {},
            'error': hv.win_ping_result.msg | default('Host nicht per WinRM erreichbar oder Zugriff verweigert')
          } %}
          {% if h in hostvars and hostvars[h].ipc_windows_basis_validation is defined %}
          {{ (hostvars[h].ipc_windows_basis_validation | combine({'scan_timestamp': report_timestamp_iso})) | to_nice_json }}{% if not loop.last %},{% endif %}
          {% else %}
          {{ fallback | to_nice_json }}{% if not loop.last %},{% endif %}
          {% endif %}
          {% endfor %}
          ]

    - name: CSV-Report aus JSON erzeugen
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import csv
        import json
        from pathlib import Path

        result_dir = Path("{{ result_dir }}")
        json_path = result_dir / "ipc_windows_basis_validation_{{ report_timestamp }}.json"
        csv_path = result_dir / "ipc_windows_basis_validation_{{ report_timestamp }}.csv"

        data = json.loads(json_path.read_text(encoding="utf-8"))

        check_columns = [
            ("ID0017_Anmelden_mit_Passwort", "ID0017_Anmelden_mit_Passwort"),
            ("ID0022_Passwort", "ID0022_Passwort"),
            ("ID0023_Rechner_neu_starten", "ID0023_Rechner_neu_starten"),
            ("ID0030_Festplatte_partitionieren", "ID0030_Festplatte_partitionieren"),
            ("ID0036_Netzwerkadapter_konfigurieren", "ID0036_Netzwerkadapter_konfigurieren"),
            ("ID0066_Rechner_neu_starten", "ID0066_Rechner_neu_starten"),
            ("ID0286_Bildschirmschoner_Inaktivitaet", "ID0286_Bildschirmschoner_Inaktivitaet"),
            ("ID0287_Neustart_nur_Administrator_Verknuepfung", "ID0287_Neustart_nur_Administrator_Verknuepfung"),
            ("ID0288_Neustart_nur_Administrator_GPO", "ID0288_Neustart_nur_Administrator_GPO"),
            ("ID0289_UAC_Einstellungen", "ID0289_UAC_Einstellungen"),
            ("ID0290_Power_Optionen_deaktivieren", "ID0290_Power_Optionen_deaktivieren"),
            ("ID0291_Netzwerksymbol", "ID0291_Netzwerksymbol"),
            ("ID0292_Suchsymbol", "ID0292_Suchsymbol"),
            ("ID0293_Desktopverknuepfungen_entfernt", "ID0293_Desktopverknuepfungen_entfernt"),
            ("ID0311_LMHOSTS_deaktiviert", "ID0311_LMHOSTS_deaktiviert"),
            ("ID0314_Rechner_neu_starten", "ID0314_Rechner_neu_starten"),
            ("ID0315_Admin_L_Kennwort", "ID0315_Admin_L_Kennwort"),
            ("ID0317_Admin_L_Anmeldung", "ID0317_Admin_L_Anmeldung"),
            ("ID0318_Admin_L_CMD_als_Administrator", "ID0318_Admin_L_CMD_als_Administrator"),
        ]

        base_fields = [
            "Zeitstempel_Pruefung",
            "Zeitstempel_Zielsystem",
            "IP",
            "Ansible_erreichbar",
            "Computername",
            "FQDN",
            "Domaene_Workgroup",
            "Domaenenmitglied",
            "Betriebssystem",
            "OS_Version",
            "WinRM_Port",
            "WinRM_Schema",
            "WinRM_Offene_Ports",
            "Fehler",
        ]

        fieldnames = list(base_fields)
        for _, column_name in check_columns:
            fieldnames.append(column_name)
            fieldnames.append(column_name + "_Details")

        def check_status(checks, key):
            if not checks:
                return ""
            value = checks.get(key)
            if not isinstance(value, dict):
                return "NICHT_PRUEFBAR"
            return value.get("status", "")

        def check_details(checks, key):
            if not checks:
                return ""
            value = checks.get(key)
            if not isinstance(value, dict):
                return ""
            details = value.get("details", "")
            evidence = value.get("evidence")
            if evidence not in (None, ""):
                try:
                    evidence_text = json.dumps(
                        evidence,
                        ensure_ascii=False,
                        sort_keys=True,
                    )
                except TypeError:
                    evidence_text = str(evidence)
                return f"{details} | Evidence={evidence_text}"
            return details

        rows = []
        for item in data:
            row = {
                "Zeitstempel_Pruefung": item.get("scan_timestamp", ""),
                "Zeitstempel_Zielsystem": item.get("target_timestamp", ""),
                "IP": item.get("ip", ""),
                "Ansible_erreichbar": item.get("ansible_reachable", False),
                "Computername": item.get("computername", ""),
                "FQDN": item.get("fqdn", ""),
                "Domaene_Workgroup": item.get("domain") or item.get("workgroup") or "",
                "Domaenenmitglied": item.get("part_of_domain", ""),
                "Betriebssystem": item.get("os_caption", ""),
                "OS_Version": item.get("os_version", ""),
                "WinRM_Port": item.get("winrm_port", ""),
                "WinRM_Schema": item.get("winrm_scheme", ""),
                "WinRM_Offene_Ports": item.get("winrm_open_ports", ""),
                "Fehler": item.get("error", ""),
            }
            checks = item.get("checks") or {}
            for key, column_name in check_columns:
                row[column_name] = check_status(checks, key)
                row[column_name + "_Details"] = check_details(checks, key)
            rows.append(row)

        with csv_path.open("w", encoding="utf-8-sig", newline="") as file_handle:
            writer = csv.DictWriter(
                file_handle,
                fieldnames=fieldnames,
                delimiter=";",
            )
            writer.writeheader()
            writer.writerows(rows)
        PY
      args:
        executable: /bin/bash
      changed_when: true

    - name: Pfade der erzeugten Reports anzeigen
      ansible.builtin.debug:
        msg:
          - "JSON: {{ result_dir }}/ipc_windows_basis_validation_{{ report_timestamp }}.json"
          - "CSV:  {{ result_dir }}/ipc_windows_basis_validation_{{ report_timestamp }}.csv"
