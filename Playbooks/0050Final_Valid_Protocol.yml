---
- name: Task-Status-Matrix aus vorhandenen CSV-Reports erzeugen
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Quellordner der vorhandenen CSV-Dateien aus 0010/0020/0030/0040.
    # In Semaphore am besten matrix_csv_source_dir setzen.
    matrix_source_dir: "{{ matrix_csv_source_dir | default(result_dir | default('/home/ansible/Dokumente/semaphore_reports/docu_valid')) }}"

    # Zielordner fuer die neue 0050-Matrix. Wenn nicht gesetzt, wird in den Quellordner geschrieben.
    # In Semaphore optional matrix_csv_output_dir setzen.
    matrix_output_dir: "{{ matrix_csv_output_dir | default(matrix_csv_source_dir | default(result_dir | default('/home/ansible/Dokumente/semaphore_reports/docu_valid'))) }}"

    # Vorlage: Excel-Datei mit Sheet "VM OS Server V10.0".
    # Falls die Datei im Repo-Root liegt und dieses Playbook im Ordner Playbooks liegt, passt der Default.
    matrix_template_xlsx: "{{ os_server_template_excel_path | default(playbook_dir + '/../Beispiel_Installationsliste_260209.xlsx') }}"

    # Python-Auswerteskript. Lege die Datei im Repo unter Python/task_status_matrix.py ab.
    matrix_python_script: "{{ task_status_matrix_script_path | default(playbook_dir + '/../Python/task_status_matrix.py') }}"

    # Name des Sheets in der Vorlagen-Excel.
    matrix_template_sheet: "{{ os_server_template_sheet | default('VM OS Server V10.0') }}"

  tasks:
    - name: Zeitstempel fuer Matrix-Report setzen
      ansible.builtin.set_fact:
        matrix_report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Zielverzeichnis fuer Matrix pruefen/anlegen
      ansible.builtin.file:
        path: "{{ matrix_output_dir }}"
        state: directory
        mode: "0750"

    - name: Quellverzeichnis der vorhandenen CSV-Reports pruefen
      ansible.builtin.stat:
        path: "{{ matrix_source_dir }}"
      register: matrix_source_dir_stat

    - name: Abbrechen, wenn Quellverzeichnis fehlt
      ansible.builtin.fail:
        msg: >-
          Der CSV-Quellordner wurde nicht gefunden: {{ matrix_source_dir }}.
          Setze in Semaphore matrix_csv_source_dir auf den Ordner, in dem die CSV-Dateien
          aus 0010/0020/0030/0040 liegen, z. B.
          /home/ansible/Dokumente/semaphore_reports/docu_valid.
      when: not matrix_source_dir_stat.stat.exists

    - name: Vorhandene CSV-Dateien im Quellordner suchen
      ansible.builtin.find:
        paths: "{{ matrix_source_dir }}"
        patterns: "*.csv"
        file_type: file
        recurse: false
      register: matrix_existing_csv_files

    - name: Gefundene CSV-Dateien anzeigen
      ansible.builtin.debug:
        msg:
          - "CSV-Quellordner: {{ matrix_source_dir }}"
          - "Matrix-Zielordner: {{ matrix_output_dir }}"
          - "Gefundene CSV-Dateien: {{ matrix_existing_csv_files.files | map(attribute='path') | list }}"

    - name: Abbrechen, wenn im Quellordner keine CSV-Dateien liegen
      ansible.builtin.fail:
        msg: >-
          Im CSV-Quellordner {{ matrix_source_dir }} wurden keine CSV-Dateien gefunden.
          Pruefe, ob 0010/0020/0030/0040 denselben result_dir verwenden oder setze
          matrix_csv_source_dir in Semaphore korrekt.
      when: matrix_existing_csv_files.matched | int == 0

    - name: Pruefen, ob Vorlagen-Excel vorhanden ist
      ansible.builtin.stat:
        path: "{{ matrix_template_xlsx }}"
      register: matrix_template_stat

    - name: Abbrechen, wenn Vorlagen-Excel fehlt
      ansible.builtin.fail:
        msg: >-
          Die Vorlagen-Excel wurde nicht gefunden: {{ matrix_template_xlsx }}.
          Setze in Semaphore die Variable os_server_template_excel_path auf den korrekten Pfad
          oder lege die Datei im Repo-Root ab.
      when: not matrix_template_stat.stat.exists

    - name: Pruefen, ob Python-Auswerteskript vorhanden ist
      ansible.builtin.stat:
        path: "{{ matrix_python_script }}"
      register: matrix_python_script_stat

    - name: Abbrechen, wenn Python-Auswerteskript fehlt
      ansible.builtin.fail:
        msg: >-
          Das Python-Auswerteskript wurde nicht gefunden: {{ matrix_python_script }}.
          Lege task_status_matrix.py im Repo unter Python/task_status_matrix.py ab
          oder setze in Semaphore task_status_matrix_script_path auf den korrekten Pfad.
      when: not matrix_python_script_stat.stat.exists

    - name: Task-Status-Matrix aus neuesten 0010/0020/0030/0040-CSV-Dateien erzeugen
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | default('/usr/bin/python3') }}"
          - "{{ matrix_python_script }}"
      environment:
        MATRIX_SOURCE_DIR: "{{ matrix_source_dir }}"
        MATRIX_OUTPUT_DIR: "{{ matrix_output_dir }}"
        MATRIX_TEMPLATE_XLSX: "{{ matrix_template_xlsx }}"
        MATRIX_TEMPLATE_SHEET: "{{ matrix_template_sheet }}"
        MATRIX_OUTPUT_BASENAME: "task_status_matrix_{{ matrix_report_timestamp }}"
        MATRIX_0010_PATTERN: "{{ matrix_0010_pattern | default('network_discovery_*.csv') }}"
        MATRIX_0020_PATTERN: "{{ matrix_0020_pattern | default('pcs7_installation_check_*.csv') }}"
        MATRIX_0030_PATTERN: "{{ matrix_0030_pattern | default('os_server_v10_validation_*.csv') }}"
        MATRIX_0040_PATTERN: "{{ matrix_0040_pattern | default('os_server_systemhardening_v10_validation_*.csv') }}"
        MATRIX_STATUS_OK: "{{ matrix_status_ok | default('OK') }}"
        MATRIX_STATUS_NOK: "{{ matrix_status_nok | default('NOK') }}"
        MATRIX_STATUS_NP: "{{ matrix_status_np | default('NICHT_PRUEFBAR') }}"
        MATRIX_SHOW_INDIRECT_VALUES: "{{ matrix_show_indirect_values | default(true) | ternary('true', 'false') }}"
        MATRIX_SHOW_DETAILS_FOR_NP: "{{ matrix_show_details_for_np | default(true) | ternary('true', 'false') }}"
        MATRIX_MAX_CELL_TEXT_LEN: "{{ matrix_max_cell_text_len | default(180) }}"
        PYTHONIOENCODING: "utf-8"
      register: matrix_script_result
      changed_when: true

    - name: Pfade der erzeugten Matrix anzeigen
      ansible.builtin.debug:
        msg:
          - "{{ matrix_script_result.stdout_lines | default([]) }}"
          - "CSV-Matrix: {{ matrix_output_dir }}/task_status_matrix_{{ matrix_report_timestamp }}.csv"
          - "Quelleninfo: {{ matrix_output_dir }}/task_status_matrix_{{ matrix_report_timestamp }}_quellen.txt"
