---
- name: Task-Status-Matrix aus vorhandenen CSV-Reports erzeugen
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # Ergebnisordner der bisherigen Reports. In Semaphore am besten als result_dir setzen.
    matrix_result_dir: "{{ result_dir | default('./reports') }}"

    # Vorlage: Excel-Datei mit Sheet "VM OS Server V10.0".
    # Falls die Datei im Repo-Root liegt und dieses Playbook im Ordner Playbooks liegt, passt der Default.
    matrix_template_xlsx: "{{ os_server_template_excel_path | default(playbook_dir + '/../Beispiel_Installationsliste_260209.xlsx') }}"

    # Python-Auswerteskript. Lege die Datei im Repo unter Python/task_status_matrix.py ab.
    matrix_python_script: "{{ task_status_matrix_script_path | default(playbook_dir + '/../Python/task_status_matrix.py') }}"

    # Name des Sheets in der Vorlagen-Excel.
    matrix_template_sheet: "{{ os_server_template_sheet | default('VM OS Server V10.0') }}"

    # CSV-Dateimuster der vier bisherigen Reports. Es wird jeweils automatisch die neueste Datei genommen.
    matrix_0010_pattern: "{{ matrix_0010_pattern | default('network_discovery_*.csv') }}"
    matrix_0020_pattern: "{{ matrix_0020_pattern | default('pcs7_installation_check_*.csv') }}"
    matrix_0030_pattern: "{{ matrix_0030_pattern | default('os_server_v10_validation_*.csv') }}"
    matrix_0040_pattern: "{{ matrix_0040_pattern | default('os_server_systemhardening_v10_validation_*.csv') }}"

    # Status-Texte im Zielreport.
    matrix_status_ok: "OK"
    matrix_status_nok: "NOK"
    matrix_status_np: "NICHT_PRUEFBAR"

  tasks:
    - name: Zeitstempel fuer Matrix-Report setzen
      ansible.builtin.set_fact:
        matrix_report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Report-Verzeichnis pruefen/anlegen
      ansible.builtin.file:
        path: "{{ matrix_result_dir }}"
        state: directory
        mode: "0750"

    - name: Pruefen, ob Vorlagen-Excel vorhanden ist
      ansible.builtin.stat:
        path: "{{ matrix_template_xlsx }}"
      register: matrix_template_stat

    - name: Abbrechen, wenn Vorlagen-Excel fehlt
      ansible.builtin.fail:
        msg: >-
          Die Vorlagen-Excel wurde nicht gefunden: {{ matrix_template_xlsx }}.
          Setze in Semaphore die Variable os_server_template_excel_path auf den korrekten Pfad
          oder lege die Datei im Repo-Root ab.
      when: not matrix_template_stat.stat.exists

    - name: Pruefen, ob Python-Auswerteskript vorhanden ist
      ansible.builtin.stat:
        path: "{{ matrix_python_script }}"
      register: matrix_python_script_stat

    - name: Abbrechen, wenn Python-Auswerteskript fehlt
      ansible.builtin.fail:
        msg: >-
          Das Python-Auswerteskript wurde nicht gefunden: {{ matrix_python_script }}.
          Lege task_status_matrix.py im Repo unter Python/task_status_matrix.py ab
          oder setze in Semaphore task_status_matrix_script_path auf den korrekten Pfad.
      when: not matrix_python_script_stat.stat.exists

    - name: Task-Status-Matrix aus neuesten 0010/0020/0030/0040-CSV-Dateien erzeugen
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python | default('/usr/bin/python3') }}"
          - "{{ matrix_python_script }}"
      environment:
        MATRIX_RESULT_DIR: "{{ matrix_result_dir }}"
        MATRIX_TEMPLATE_XLSX: "{{ matrix_template_xlsx }}"
        MATRIX_TEMPLATE_SHEET: "{{ matrix_template_sheet }}"
        MATRIX_OUTPUT_BASENAME: "task_status_matrix_{{ matrix_report_timestamp }}"
        MATRIX_0010_PATTERN: "{{ matrix_0010_pattern }}"
        MATRIX_0020_PATTERN: "{{ matrix_0020_pattern }}"
        MATRIX_0030_PATTERN: "{{ matrix_0030_pattern }}"
        MATRIX_0040_PATTERN: "{{ matrix_0040_pattern }}"
        MATRIX_STATUS_OK: "{{ matrix_status_ok }}"
        MATRIX_STATUS_NOK: "{{ matrix_status_nok }}"
        MATRIX_STATUS_NP: "{{ matrix_status_np }}"
        PYTHONIOENCODING: "utf-8"
      register: matrix_script_result
      changed_when: true

    - name: Pfade der erzeugten Matrix anzeigen
      ansible.builtin.debug:
        msg:
          - "{{ matrix_script_result.stdout_lines | default([]) }}"
          - "CSV-Matrix: {{ matrix_result_dir }}/task_status_matrix_{{ matrix_report_timestamp }}.csv"
          - "Quelleninfo: {{ matrix_result_dir }}/task_status_matrix_{{ matrix_report_timestamp }}_quellen.txt"
