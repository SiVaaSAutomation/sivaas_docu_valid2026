- name: Netzwerkteilnehmer im Zielnetz erkennen und Infos in JSON und CSV exportieren
  hosts: localhost
  connection: local
  gather_facts: no

 

  tasks:
    - name: Zeitstempel fuer Report setzen
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: Pruefen, ob benoetigte Semaphore-Variablen uebergeben wurden
      ansible.builtin.assert:
        that:
          - target_network is defined
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - nmap_binary is defined
          - result_dir is defined
          - target_network | string | length > 0
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - nmap_binary | string | length > 0
          - result_dir | string | length > 0
        fail_msg: >-
          Es fehlen benoetigte Variablen aus der Semaphore-Variablengruppe.
          Erforderlich sind: target_network, win_user, win_password,
          winrm_transport, nmap_binary und result_dir.


    - name: Pruefen, ob nmap auf dem Ansible-Controller vorhanden ist
      ansible.builtin.command: "{{ nmap_binary }} --version"
      register: nmap_check
      changed_when: false
      failed_when: false

    - name: Abbrechen, wenn nmap fehlt
      ansible.builtin.fail:
        msg: "nmap ist auf dem Ansible-Controller unter {{ nmap_binary }} nicht ausfuehrbar. Installation pruefen: sudo apt install nmap"
      when: nmap_check.rc != 0


    # - name: Diagnose nmap auf dem Ansible-Controller
    #   ansible.builtin.shell: |
    #     echo "USER=$(whoami)"
    #     echo "PATH=$PATH"
    #     echo "nmap_binary={{ nmap_binary }}"
    #     echo "--- ls -l {{ nmap_binary }} ---"
    #     ls -l {{ nmap_binary }} || true
    #     echo "--- file {{ nmap_binary }} ---"
    #     file {{ nmap_binary }} || true
    #     echo "--- test -x {{ nmap_binary }} ---"
    #     test -x {{ nmap_binary }}
    #     echo "test_x_rc=$?"
    #     echo "--- {{ nmap_binary }} --version ---"
    #     {{ nmap_binary }} --version
    #     echo "nmap_version_rc=$?"
    #   args:
    #     executable: /bin/bash
    #   register: nmap_diag
    #   changed_when: false
    #   failed_when: false

    # - name: Diagnoseausgabe nmap anzeigen
    #   ansible.builtin.debug:
    #     var: nmap_diag.stdout_lines

    # - name: Diagnosefehler nmap anzeigen
    #   ansible.builtin.debug:
    #     var: nmap_diag.stderr_lines

    # - name: Abbrechen, wenn nmap nicht ausfuehrbar ist
    #   ansible.builtin.fail:
    #     msg: >-
    #       nmap konnte durch Semaphore/Ansible nicht ausgefuehrt werden.
    #       Rueckgabecode: {{ nmap_diag.rc }}.
    #       Pruefe stdout/stderr der vorherigen Diagnoseausgabe.
    #   when: nmap_diag.rc != 0

    - name: Pruefen, ob Windows-Zugangsdaten uebergeben wurden
      ansible.builtin.assert:
        that:
          - win_user is defined
          - win_password is defined
          - win_user | string | length > 0
          - win_password | string | length > 0
        fail_msg: >-
          Fuer die Detailabfrage muessen win_user und win_password uebergeben werden,
          z. B. ueber Semaphore Environment/Extra Variables oder Ansible Vault.

    - name: Netzwerk nach offenen WinRM-Ports 5985 und 5986 scannen
      ansible.builtin.shell: |
        set -o pipefail
        {{ nmap_binary }} -n -Pn -p 5985,5986 --open {{ target_network }} -oG - |
        awk '
          /Ports:/ {
            host=$2
            has_http = ($0 ~ /5985\/open\/tcp/)
            has_https = ($0 ~ /5986\/open\/tcp/)

            if (has_https) {
              ports = has_http ? "5985,5986" : "5986"
              print host ";5986;https;" ports
            } else if (has_http) {
              print host ";5985;http;5985"
            }
          }
        '
      args:
        executable: /bin/bash
      register: scan_result
      changed_when: false

    - name: Gefundene IP-Adressen und WinRM-Infos speichern
      ansible.builtin.set_fact:
        discovered_winrm_hosts: "{{ scan_result.stdout_lines | unique | list }}"
        discovered_ips: "{{ scan_result.stdout_lines | map('regex_replace', ';.*$', '') | unique | list }}"

    - name: Gefundene WinRM-Teilnehmer anzeigen
      ansible.builtin.debug:
        var: discovered_winrm_hosts

    - name: Gefundene IP-Adressen anzeigen
      ansible.builtin.debug:
        var: discovered_ips

    - name: Gefundene Windows-Hosts dynamisch hinzufügen
      ansible.builtin.add_host:
        name: "{{ item.split(';')[0] }}"
        groups: discovered_windows
        ansible_host: "{{ item.split(';')[0] }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.split(';')[1] | int }}"
        ansible_winrm_scheme: "{{ item.split(';')[2] }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        discovered_winrm_open_ports: "{{ item.split(';')[3] }}"
      loop: "{{ discovered_winrm_hosts }}"
      no_log: true


- name: Windows-Kommunikationsdaten und Domaenenzugehoerigkeit abfragen
  hosts: discovered_windows
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: WinRM-Verbindung testen
      ansible.windows.win_ping:
      register: win_ping_result
      changed_when: false
      ignore_errors: true

    - name: Windows-Facts minimal erfassen
      ansible.windows.setup:
        gather_subset:
          - min
      register: windows_facts_result
      when: win_ping_result is defined and win_ping_result is succeeded
      changed_when: false

    - name: Computername, Domaene und Kommunikationseinstellungen auslesen
      ansible.windows.win_shell: |
        $ErrorActionPreference = "SilentlyContinue"
        $ProgressPreference = "SilentlyContinue"


 
        trap {
          $fallback = [ordered]@{
            ip = "{{ inventory_hostname }}"
            ansible_reachable = $true
            computername = $env:COMPUTERNAME
            error = $_.Exception.Message
          }
          $fallback | ConvertTo-Json -Depth 20 -Compress
          exit 0
        }

        function Convert-DateValueToString {
          param($Value)

          if ($null -eq $Value) {
            return $null
          }

          if ($Value -is [DateTime]) {
            return $Value.ToString("s")
          }

          return $Value.ToString()
        }

        function Get-PropertyValue {
          param(
            [object]$InputObject,
            [string]$Name
          )

          if ($null -eq $InputObject) {
            return $null
          }

          $property = $InputObject.PSObject.Properties[$Name]
          if ($null -eq $property) {
            return $null
          }

          return $property.Value
        }

        function Add-GroupMembership {
          param(
            [hashtable]$MembershipTable,
            [string]$AccountName,
            [string]$GroupName
          )

          if ([string]::IsNullOrWhiteSpace($AccountName)) {
            return
          }

          if (-not $MembershipTable.ContainsKey($AccountName)) {
            $MembershipTable[$AccountName] = @()
          }

          $MembershipTable[$AccountName] += $GroupName
        }

        $cs = $null
        $os = $null
        $bios = $null

        try { $cs = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop } catch {}
        try { $os = Get-CimInstance Win32_OperatingSystem -ErrorAction Stop } catch {}
        try { $bios = Get-CimInstance Win32_BIOS -ErrorAction Stop } catch {}

        $fqdn = $null
        try {
          $fqdn = [System.Net.Dns]::GetHostEntry($env:COMPUTERNAME).HostName
        } catch {}

        $workgroup = $null
        try {
          $partOfDomain = Get-PropertyValue -InputObject $cs -Name "PartOfDomain"
          if ($partOfDomain -eq $false) {
            $workgroup = Get-PropertyValue -InputObject $cs -Name "Workgroup"
          }
        } catch {}

        $adapters = @()
        try {
          $adapters = @(Get-CimInstance Win32_NetworkAdapterConfiguration -Filter "IPEnabled = True" -ErrorAction Stop | ForEach-Object {
            [ordered]@{
              description = Get-PropertyValue -InputObject $_ -Name "Description"
              dns_host_name = Get-PropertyValue -InputObject $_ -Name "DNSHostName"
              dns_domain = Get-PropertyValue -InputObject $_ -Name "DNSDomain"
              mac_address = Get-PropertyValue -InputObject $_ -Name "MACAddress"
              dhcp_enabled = Get-PropertyValue -InputObject $_ -Name "DHCPEnabled"
              dhcp_server = Get-PropertyValue -InputObject $_ -Name "DHCPServer"
              ip_address = @(Get-PropertyValue -InputObject $_ -Name "IPAddress")
              ip_subnet = @(Get-PropertyValue -InputObject $_ -Name "IPSubnet")
              default_gateway = @(Get-PropertyValue -InputObject $_ -Name "DefaultIPGateway")
              dns_server = @(Get-PropertyValue -InputObject $_ -Name "DNSServerSearchOrder")
              wins_primary_server = Get-PropertyValue -InputObject $_ -Name "WINSPrimaryServer"
              wins_secondary_server = Get-PropertyValue -InputObject $_ -Name "WINSSecondaryServer"
              tcpip_netbios_options = Get-PropertyValue -InputObject $_ -Name "TcpipNetbiosOptions"
            }
          })
        } catch {}

        $defaultRoutes = @()
        try {
          $defaultRoutes = @(Get-CimInstance Win32_IP4RouteTable -ErrorAction Stop |
            Where-Object { $_.Destination -eq "0.0.0.0" } |
            ForEach-Object {
              [ordered]@{
                gateway = Get-PropertyValue -InputObject $_ -Name "NextHop"
                interface_index = Get-PropertyValue -InputObject $_ -Name "InterfaceIndex"
                metric = Get-PropertyValue -InputObject $_ -Name "Metric1"
              }
            })
        } catch {}

        $firewallProfiles = @()
        try {
          $firewallProfiles = @(Get-NetFirewallProfile -ErrorAction Stop | ForEach-Object {
            $defaultInboundAction = Get-PropertyValue -InputObject $_ -Name "DefaultInboundAction"
            $defaultOutboundAction = Get-PropertyValue -InputObject $_ -Name "DefaultOutboundAction"

            if ($null -ne $defaultInboundAction) {
              $defaultInboundAction = $defaultInboundAction.ToString()
            }

            if ($null -ne $defaultOutboundAction) {
              $defaultOutboundAction = $defaultOutboundAction.ToString()
            }

            [ordered]@{
              name = Get-PropertyValue -InputObject $_ -Name "Name"
              enabled = Get-PropertyValue -InputObject $_ -Name "Enabled"
              default_inbound_action = $defaultInboundAction
              default_outbound_action = $defaultOutboundAction
              notify_on_listen = Get-PropertyValue -InputObject $_ -Name "NotifyOnListen"
            }
          })
        } catch {}

        $winrmListeners = @()
        try {
          $winrmListeners = @(Get-ChildItem WSMan:\localhost\Listener -ErrorAction Stop | ForEach-Object {
            $address = $null
            $port = $null
            $enabled = $null

            try { $address = (Get-Item "$($_.PSPath)\Address" -ErrorAction Stop).Value } catch {}
            try { $port = (Get-Item "$($_.PSPath)\Port" -ErrorAction Stop).Value } catch {}
            try { $enabled = (Get-Item "$($_.PSPath)\Enabled" -ErrorAction Stop).Value } catch {}

            [ordered]@{
              keys = ($_.Keys -join ";")
              address = $address
              port = $port
              enabled = $enabled
            }
          })
        } catch {}

        $groupMembershipByAccount = @{}
        $localGroups = @()

        try {
          $groupObjects = @(Get-LocalGroup -ErrorAction Stop)
        } catch {
          $groupObjects = @()
        }

        foreach ($group in $groupObjects) {
          $groupName = [string](Get-PropertyValue -InputObject $group -Name "Name")
          $members = @()

          try {
            $memberObjects = @(Get-LocalGroupMember -Group $groupName -ErrorAction Stop)
          } catch {
            $memberObjects = @()
          }

          foreach ($member in $memberObjects) {
            $memberName = [string](Get-PropertyValue -InputObject $member -Name "Name")
            $shortName = ($memberName -split '\\')[-1]
            $objectClass = [string](Get-PropertyValue -InputObject $member -Name "ObjectClass")
            $principalSource = Get-PropertyValue -InputObject $member -Name "PrincipalSource"

            if ($null -ne $principalSource) {
              $principalSource = [string]$principalSource
            }

            if ($objectClass -eq "User") {
              Add-GroupMembership -MembershipTable $groupMembershipByAccount -AccountName $memberName -GroupName $groupName
              Add-GroupMembership -MembershipTable $groupMembershipByAccount -AccountName $shortName -GroupName $groupName
              Add-GroupMembership -MembershipTable $groupMembershipByAccount -AccountName "$env:COMPUTERNAME\$shortName" -GroupName $groupName
            }

            $members += [ordered]@{
              name = $memberName
              object_class = $objectClass
              principal_source = $principalSource
            }
          }

          $localGroups += [ordered]@{
            name = $groupName
            description = Get-PropertyValue -InputObject $group -Name "Description"
            members = $members
          }
        }

        $localUsers = @()

        try {
          $userObjects = @(Get-LocalUser -ErrorAction Stop)
        } catch {
          $userObjects = @()
        }

        foreach ($user in $userObjects) {
          $userName = [string](Get-PropertyValue -InputObject $user -Name "Name")
          $groups = @()

          foreach ($key in @($userName, "$env:COMPUTERNAME\$userName")) {
            if ($groupMembershipByAccount.ContainsKey($key)) {
              $groups += @($groupMembershipByAccount[$key])
            }
          }

          $groups = @($groups | Sort-Object -Unique)

          $localUsers += [ordered]@{
            name = $userName
            enabled = Get-PropertyValue -InputObject $user -Name "Enabled"
            full_name = Get-PropertyValue -InputObject $user -Name "FullName"
            description = Get-PropertyValue -InputObject $user -Name "Description"
            groups = $groups
            password_required = Get-PropertyValue -InputObject $user -Name "PasswordRequired"
            password_expires = Convert-DateValueToString -Value (Get-PropertyValue -InputObject $user -Name "PasswordExpires")
            user_may_change_password = Get-PropertyValue -InputObject $user -Name "UserMayChangePassword"
            password_last_set = Convert-DateValueToString -Value (Get-PropertyValue -InputObject $user -Name "PasswordLastSet")
            last_logon = Convert-DateValueToString -Value (Get-PropertyValue -InputObject $user -Name "LastLogon")
            password_note = "Klartextpasswoerter koennen nicht ausgelesen werden"
          }
        }

        $result = [ordered]@{
          ip = "{{ inventory_hostname }}"
          ansible_reachable = $true
          computername = $env:COMPUTERNAME
          fqdn = $fqdn
          domain = Get-PropertyValue -InputObject $cs -Name "Domain"
          part_of_domain = Get-PropertyValue -InputObject $cs -Name "PartOfDomain"
          workgroup = $workgroup
          manufacturer = Get-PropertyValue -InputObject $cs -Name "Manufacturer"
          model = Get-PropertyValue -InputObject $cs -Name "Model"
          os_caption = Get-PropertyValue -InputObject $os -Name "Caption"
          os_version = Get-PropertyValue -InputObject $os -Name "Version"
          serial_number = Get-PropertyValue -InputObject $bios -Name "SerialNumber"
          adapters = $adapters
          default_routes = $defaultRoutes
          firewall_profiles = $firewallProfiles
          winrm_listeners = $winrmListeners
          local_users = $localUsers
          local_groups = $localGroups
        }

        $result | ConvertTo-Json -Depth 20 -Compress
        exit 0
      register: communication_raw
      when: win_ping_result is defined and win_ping_result is succeeded
      changed_when: false
      failed_when: false

    - name: Kommunikationsdaten als Host-Fact speichern
      ansible.builtin.set_fact:
        communication_info: "{{ communication_raw.stdout | from_json }}"
      when:
        - communication_raw is defined
        - communication_raw.stdout is defined
        - communication_raw.stdout | length > 0
        - communication_raw.stdout | trim is match('^[{]')





#################################### NEW PLAY, weil ich Benutzer wechseln muss um lokal zu speichern###########################################################
- name: Report lokal auf dem Ansible-Controller erzeugen
  hosts: localhost
  gather_facts: false

  tasks:

    - name: Pruefen, ob benoetigte Semaphore-Variablen uebergeben wurden
      ansible.builtin.assert:
        that:
          - target_network is defined
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - nmap_binary is defined
          - result_dir is defined
          - target_network | string | length > 0
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - nmap_binary | string | length > 0
          - result_dir | string | length > 0
        fail_msg: >-
          Es fehlen benoetigte Variablen aus der Semaphore-Variablengruppe.
          Erforderlich sind: target_network, win_user, win_password,
          winrm_transport, nmap_binary und result_dir.


    - name: Report-Verzeichnis erzeugen, falls es noch nicht existiert
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0750"


    - name: JSON-Report erzeugen
      ansible.builtin.copy:
        dest: "{{ result_dir }}/network_discovery_{{ hostvars['localhost'].report_timestamp }}.json"
        mode: "0644"
        content: |
          [
          {% for h in groups['discovered_windows'] | default([]) %}
          {{ (hostvars[h].communication_info | default({'ip': h, 'ansible_reachable': false, 'error': 'WinRM nicht erreichbar oder Zugriff verweigert'})) | to_nice_json }}{% if not loop.last %},{% endif %}
          {% endfor %}
          ]

    - name: CSV-Report erzeugen
      ansible.builtin.copy:
        dest: "{{ result_dir }}/network_discovery_{{ hostvars['localhost'].report_timestamp }}.csv"
        mode: "0644"
        content: |
          IP;Ansible_erreichbar;Computername;FQDN;Domaene;Domaenenmitglied;Workgroup;OS;IPv4;Subnetz;Gateway;DNS_Server;MAC;DHCP;Firewallprofile;WinRM_Listener;Lokale_Benutzer;Passwort_erforderlich;Passwort_laeuft_ab;Benutzer_darf_aendern;Passwort_zuletzt_gesetzt;Letzter_Login;Benutzer_Gruppen
          {% for h in groups['discovered_windows'] | default([]) %}
          {% set info = hostvars[h].communication_info | default({}) %}
          {{ h }};{{ info.ansible_reachable | default(false) }};{{ info.computername | default('') }};{{ info.fqdn | default('') }};{{ info.domain | default('') }};{{ info.part_of_domain | default('') }};{{ info.workgroup | default('') }};{{ info.os_caption | default('') }};"{% for a in info.adapters | default([]) %}{{ a.ip_address | default([]) | join(',') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for a in info.adapters | default([]) %}{{ a.ip_subnet | default([]) | join(',') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for a in info.adapters | default([]) %}{{ a.default_gateway | default([]) | join(',') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for a in info.adapters | default([]) %}{{ a.dns_server | default([]) | join(',') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for a in info.adapters | default([]) %}{{ a.mac_address | default('') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for a in info.adapters | default([]) %}{{ a.dhcp_enabled | default('') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for f in info.firewall_profiles | default([]) %}{{ f.name | default('') }}={{ f.enabled | default('') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for l in info.winrm_listeners | default([]) %}{{ l.keys | default('') }}:{{ l.port | default('') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for u in info.local_users | default([]) %}{{ u.name | default('') }} (aktiv={{ u.enabled | default('') }}){% if not loop.last %}|{% endif %}{% endfor %}";"{% for u in info.local_users | default([]) %}{{ u.name | default('') }}={{ u.password_required | default('') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for u in info.local_users | default([]) %}{{ u.name | default('') }}={{ u.password_expires | default('') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for u in info.local_users | default([]) %}{{ u.name | default('') }}={{ u.user_may_change_password | default('') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for u in info.local_users | default([]) %}{{ u.name | default('') }}={{ u.password_last_set | default('') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for u in info.local_users | default([]) %}{{ u.name | default('') }}={{ u.last_logon | default('') }}{% if not loop.last %}|{% endif %}{% endfor %}";"{% for u in info.local_users | default([]) %}{{ u.name | default('') }}={{ u.groups | default([]) | join(',') }}{% if not loop.last %}|{% endif %}{% endfor %}"
          {% endfor %}

    - name: Pfade der erzeugten Reports anzeigen
      ansible.builtin.debug:
        msg:
          - "JSON: {{ result_dir }}/network_discovery_{{ hostvars['localhost'].report_timestamp }}.json"
          - "CSV:  {{ result_dir }}/network_discovery_{{ hostvars['localhost'].report_timestamp }}.csv"