      when: "'IPC0246' in validation_enabled_ids"

    - name: Ergebnis IPC0259 Uhrzeitkontrolle
      ansible.builtin.set_fact:
        validation_results: "{{ validation_results + [ {
          'ansible_id': 'IPC0259',
          'schritt': validation_catalog['IPC0259'].schritt,
          'status': validation_status_info,
          'check_type': validation_catalog['IPC0259'].check_type,
          'istwert': (validation_w32time | to_json),
          'sollwert': 'Zeitdienst aktiv / Synchronisation projektabhängig prüfen',
          'pruefmethode': validation_catalog['IPC0259'].pruefmethode,
          'hinweis': 'Exakte Gegenprüfung gegen DC per stripchart ist in diesem Playbook nicht enthalten.',
          'evidence': (validation_w32time | to_json),
          'timestamp': validation_scan_timestamp
          } ] }}"
      when: "'IPC0259' in validation_enabled_ids"

    - name: Informationsschritte anhängen
      ansible.builtin.set_fact:
        validation_results: "{{ validation_results + [ {
          'ansible_id': item.ansible_id,
          'schritt': item.schritt,
          'status': validation_status_info,
          'check_type': 'info',
          'istwert': item.info_text,
          'sollwert': '',
          'pruefmethode': 'Protokolleintrag',
          'hinweis': 'Kein technischer Soll/Ist-Vergleich vorgesehen',
          'evidence': '',
          'timestamp': validation_scan_timestamp
          } ] }}"
      loop: "{{ validation_info_checks }}"

- name: "0110 Single Validation Report erzeugen"
  hosts: localhost
  gather_facts: false

  vars:
    validation_report_prefix: "0110_validation"

  tasks:
    - name: Report-Zeitstempel setzen
      ansible.builtin.set_fact:
        validation_report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        validation_report_timestamp_iso: "{{ lookup('pipe', 'date -Iseconds') }}"

    - name: Report-Verzeichnis erzeugen
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0755"

    - name: Reportdaten sammeln
      ansible.builtin.set_fact:
        validation_report_hosts: >-
          {{
            groups['all']
            | map('extract', hostvars)
            | selectattr('validation_results', 'defined')
            | list
          }}

    - name: JSON Report schreiben
      ansible.builtin.copy:
        dest: "{{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}.json"
        mode: "0644"
        content: |
          [
          {% for hv in validation_report_hosts %}
            {
              "scan_timestamp": {{ hv.validation_scan_timestamp | default('') | to_json }},
              "report_timestamp": {{ validation_report_timestamp_iso | to_json }},
              "host": {{ hv.inventory_hostname | default('') | to_json }},
              "computername": {{ hv.validation_hostname_raw.stdout | default('') | trim | to_json }},
              "os_caption": {{ hv.validation_os_info.Caption | default('') | to_json }},
              "os_version": {{ hv.validation_os_info.Version | default('') | to_json }},
              "checks": {{ hv.validation_results | default([]) | to_nice_json }}
            }{% if not loop.last %},{% endif %}
          {% endfor %}
          ]

    - name: CSV Report schreiben
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import csv
        import json
        from pathlib import Path

        json_path = Path("{{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}.json")
        csv_path = Path("{{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}.csv")

        data = json.loads(json_path.read_text(encoding="utf-8"))

        fieldnames = [
            "host",
            "computername",
            "os_caption",
            "os_version",
            "ansible_id",
            "schritt",
            "status",
            "check_type",
            "istwert",
            "sollwert",
            "pruefmethode",
            "hinweis",
            "evidence",
            "timestamp",
        ]

        rows = []
        for host in data:
            for check in host.get("checks", []):
                rows.append({
                    "host": host.get("host", ""),
                    "computername": host.get("computername", ""),
                    "os_caption": host.get("os_caption", ""),
                    "os_version": host.get("os_version", ""),
                    "ansible_id": check.get("ansible_id", ""),
                    "schritt": check.get("schritt", ""),
                    "status": check.get("status", ""),
                    "check_type": check.get("check_type", ""),
                    "istwert": check.get("istwert", ""),
                    "sollwert": check.get("sollwert", ""),
                    "pruefmethode": check.get("pruefmethode", ""),
                    "hinweis": check.get("hinweis", ""),
                    "evidence": check.get("evidence", ""),
                    "timestamp": check.get("timestamp", ""),
                })

        rows.sort(key=lambda r: (str(r["host"]), str(r["ansible_id"])))

        with csv_path.open("w", encoding="utf-8-sig", newline="") as f:
            writer = csv.DictWriter(f, fieldnames=fieldnames, delimiter=";")
            writer.writeheader()
            writer.writerows(rows)

        print(json.dumps({"json": str(json_path), "csv": str(csv_path), "rows": len(rows)}, ensure_ascii=False))
        PY
      args:
        executable: /bin/bash
      register: validation_csv_result
      changed_when: false

    - name: Reportpfade ausgeben
      ansible.builtin.debug:
        msg:
          - "JSON: {{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}.json"
          - "CSV: {{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}.csv"
          - "Zusammenfassung: {{ validation_csv_result.stdout }}"
