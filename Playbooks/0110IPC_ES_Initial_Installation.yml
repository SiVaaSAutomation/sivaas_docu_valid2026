---
- name: "0110 Single Validation Playbook"
  hosts: all
  gather_facts: false

  vars:
    validation_report_prefix: "0110_validation"
    validation_status_ok: "OK"
    validation_status_nok: "NOK"
    validation_status_nr: "Nicht relevant"
    validation_status_info: "Info"
    validation_status_not_testable: "Nicht_Pruefbar"

    # Aktivierbare Prüfungen innerhalb dieses Single-Playbooks
    validation_enabled_ids:
      - IPC0026
      - IPC0027
      - IPC0028
      - IPC0043
      - IPC0049
      - IPC0054
      - IPC0056
      - IPC0072
      - IPC0075
      - IPC0077
      - IPC0087
      - IPC0088
      - IPC0091
      - IPC0149
      - IPC0151
      - IPC0159
      - IPC0160
      - IPC0161
      - IPC0166
      - IPC0167
      - IPC0168
      - IPC0173
      - IPC0182
      - IPC0183
      - IPC0225
      - IPC0232
      - IPC0245
      - IPC0246
      - IPC0259

    validation_info_checks:
      - ansible_id: IPC0001
        schritt: "Hochfahren des Rechners"
        info_text: "Manueller Installationsschritt; nur Protokolleintrag."
      - ansible_id: IPC0002
        schritt: "IPC Restore bestätigen"
        info_text: "Manueller Installationsschritt; nur Protokolleintrag."
      - ansible_id: IPC0003
        schritt: "Ersteinrichtung (Deutsch)"
        info_text: "Indirekt über Spracheinstellungen prüfbar; hier nur Protokolleintrag."
      - ansible_id: IPC0015
        schritt: "Rechnernamen anpassen"
        info_text: "Kann bei Bedarf über erwarteten Hostnamen direkt geprüft werden."
      - ansible_id: IPC0029
        schritt: "Überprüfung Funktion UltraVNC"
        info_text: "Manueller Verbindungstest; technische Vollprüfung nicht im Playbook enthalten."
      - ansible_id: IPC0033
        schritt: "Rescan des Endpunkts durchführen"
        info_text: "Externe VEEAM-Aktion; nur Protokolleintrag."
      - ansible_id: IPC0064
        schritt: "Real VNC installieren"
        info_text: "Nicht in diesem Single-Playbook umgesetzt; nur Protokolleintrag."
      - ansible_id: IPC0109
        schritt: "Erneute STEP 7 Installation"
        info_text: "PCS7-spezifischer Installationsschritt; hier nur Protokolleintrag."
      - ansible_id: IPC0125
        schritt: "PCS 7 Lizenzen zuweisen"
        info_text: "Lizenzprüfung kann separat ergänzt werden; hier nur Protokolleintrag."

    validation_catalog:
      IPC0026:
        schritt: "UltraVNC 1.4.3.6 installieren"
        check_type: "indirect"
        pruefmethode: "Dienst + Datei + INI"
      IPC0027:
        schritt: "Windows Firewall Regeln für VNC anpassen"
        check_type: "direct"
        pruefmethode: "Get-NetFirewallRule/Get-NetFirewallPortFilter"
      IPC0028:
        schritt: "Registry Eintrag für VEEAM setzen"
        check_type: "direct"
        pruefmethode: "Registry"
      IPC0043:
        schritt: "Date and Time"
        check_type: "direct"
        pruefmethode: "Get-TimeZone"
      IPC0049:
        schritt: "Netzwerkadapter umbenennen"
        check_type: "direct"
        pruefmethode: "Get-NetAdapter"
      IPC0054:
        schritt: "Nicht benötigte Netzwerkadapter deaktivieren"
        check_type: "direct"
        pruefmethode: "Get-NetAdapter"
      IPC0056:
        schritt: "LMHOSTS-Abfrage deaktivieren"
        check_type: "direct"
        pruefmethode: "Registry Tcpip NetBT Parameters"
      IPC0072:
        schritt: "Partition"
        check_type: "direct"
        pruefmethode: "Get-Volume / Get-Partition"
      IPC0075:
        schritt: "Lupe zur Suche in Taskleiste"
        check_type: "direct"
        pruefmethode: "Registry SearchboxTaskbarMode"
      IPC0077:
        schritt: "Microsoft Edge Verknüpfung löschen"
        check_type: "direct"
        pruefmethode: "Desktop-Dateiprüfung"
      IPC0087:
        schritt: "Energieoptionen auf Höchstleistung setzen"
        check_type: "direct"
        pruefmethode: "powercfg"
      IPC0088:
        schritt: "Kontrolle Energieoptionen"
        check_type: "info"
        pruefmethode: "powercfg"
      IPC0091:
        schritt: ".NET Framework 3.5 SP1 installieren"
        check_type: "direct"
        pruefmethode: "Get-WindowsFeature"
      IPC0149:
        schritt: "Deinstallieren von Windows-Komponenten"
        check_type: "direct"
        pruefmethode: "Get-WindowsOptionalFeature"
      IPC0151:
        schritt: "Deaktivieren von Diensten"
        check_type: "direct"
        pruefmethode: "Get-Service"
      IPC0159:
        schritt: "Deaktivierung von veralteten SSL-/TLS-Kommunikationsverfahren"
        check_type: "direct"
        pruefmethode: "Registry Schannel Protocols"
      IPC0160:
        schritt: "Verwendung von sicheren Cipher Suites"
        check_type: "direct"
        pruefmethode: "Get-TlsCipherSuite"
      IPC0161:
        schritt: "Verwendung von sicheren Cipher Suites deaktivieren"
        check_type: "direct"
        pruefmethode: "Get-TlsCipherSuite"
      IPC0166:
        schritt: "Windows-Firewall"
        check_type: "direct"
        pruefmethode: "Get-NetFirewallProfile"
      IPC0167:
        schritt: "D:\\Projekt"
        check_type: "direct"
        pruefmethode: "Pfadprüfung"
      IPC0168:
        schritt: "Ordner freigeben"
        check_type: "direct"
        pruefmethode: "Get-SmbShare"
      IPC0173:
        schritt: "SNMP installieren"
        check_type: "direct"
        pruefmethode: "Get-WindowsCapability/Get-Service"
      IPC0182:
        schritt: "BGInfo/BGSiVaaS"
        check_type: "indirect"
        pruefmethode: "Pfad + Autostart"
      IPC0183:
        schritt: "BGInfo/BGSiVaaS als Administrator ausführen"
        check_type: "info"
        pruefmethode: "Datei-/Verknüpfungsprüfung eingeschränkt"
      IPC0225:
        schritt: "KB5050187"
        check_type: "direct"
        pruefmethode: "Get-HotFix"
      IPC0232:
        schritt: "KB5058385"
        check_type: "direct"
        pruefmethode: "Get-HotFix"
      IPC0245:
        schritt: "VNC-Viewer Firewallregel prüfen"
        check_type: "direct"
        pruefmethode: "Get-NetFirewallRule"
      IPC0246:
        schritt: "Firewall für alle Profile aktiviert"
        check_type: "direct"
        pruefmethode: "Get-NetFirewallProfile"
      IPC0259:
        schritt: "Kontrolle Uhrzeit"
        check_type: "info"
        pruefmethode: "w32tm / Get-Service"

  tasks:
    - name: Ergebnisliste initialisieren
      ansible.builtin.set_fact:
        validation_results: []

    - name: Scan-Zeitstempel setzen
      ansible.builtin.set_fact:
        validation_scan_timestamp: "{{ lookup('pipe', 'date -Iseconds') }}"

    - name: Hostname lesen
      ansible.windows.win_shell: |
        $env:COMPUTERNAME
      register: validation_hostname_raw
      changed_when: false
      failed_when: false

    - name: OS-Informationen lesen
      ansible.windows.win_shell: |
        Get-CimInstance Win32_OperatingSystem |
        Select-Object Caption, Version |
        ConvertTo-Json -Compress
      register: validation_os_raw
      changed_when: false
      failed_when: false

    - name: OS-Informationen parsen
      ansible.builtin.set_fact:
        validation_os_info: "{{ validation_os_raw.stdout | default('{}') | from_json }}"
      when:
        - validation_os_raw.stdout is defined
        - validation_os_raw.stdout | trim | length > 0

    - name: Netzwerkadapter lesen
      ansible.windows.win_shell: |
        Get-NetAdapter |
        Select-Object Name, Status, InterfaceDescription |
        ConvertTo-Json -Compress
      register: validation_netadapters_raw
      changed_when: false
      failed_when: false

    - name: Netzwerkadapter parsen
      ansible.builtin.set_fact:
        validation_netadapters: >-
          {{
            (validation_netadapters_raw.stdout | from_json)
            if (validation_netadapters_raw.stdout | default('') | trim).startswith('[')
            else ([validation_netadapters_raw.stdout | from_json] if (validation_netadapters_raw.stdout | default('') | trim | length > 0) else [])
          }}

    - name: Firewallprofile lesen
      ansible.windows.win_shell: |
        Get-NetFirewallProfile |
        Select-Object Name, Enabled, DefaultInboundAction, DefaultOutboundAction |
        ConvertTo-Json -Compress
      register: validation_firewall_profiles_raw
      changed_when: false
      failed_when: false

    - name: Firewallprofile parsen
      ansible.builtin.set_fact:
        validation_firewall_profiles: >-
          {{
            (validation_firewall_profiles_raw.stdout | from_json)
            if (validation_firewall_profiles_raw.stdout | default('') | trim).startswith('[')
            else ([validation_firewall_profiles_raw.stdout | from_json] if (validation_firewall_profiles_raw.stdout | default('') | trim | length > 0) else [])
          }}

    - name: Firewallregeln für VNC lesen
      ansible.windows.win_shell: |
        $rules = Get-NetFirewallRule -PolicyStore ActiveStore | Where-Object {
          $_.DisplayName -match 'VNC' -or $_.Name -match 'VNC'
        }
        $result = foreach ($rule in $rules) {
          $pf = Get-NetFirewallPortFilter -AssociatedNetFirewallRule $rule -ErrorAction SilentlyContinue
          [PSCustomObject]@{
            Name = $rule.Name
            DisplayName = $rule.DisplayName
            Enabled = $rule.Enabled
            Profile = $rule.Profile
            Action = $rule.Action
            Protocol = $pf.Protocol
            LocalPort = $pf.LocalPort
          }
        }
        $result | ConvertTo-Json -Compress
      register: validation_vnc_rules_raw
      changed_when: false
      failed_when: false

    - name: VNC-Firewallregeln parsen
      ansible.builtin.set_fact:
        validation_vnc_rules: >-
          {{
            (validation_vnc_rules_raw.stdout | from_json)
            if (validation_vnc_rules_raw.stdout | default('') | trim).startswith('[')
            else ([validation_vnc_rules_raw.stdout | from_json] if (validation_vnc_rules_raw.stdout | default('') | trim | length > 0) else [])
          }}

    - name: Zeitzone lesen
      ansible.windows.win_shell: |
        (Get-TimeZone).Id
      register: validation_timezone_raw
      changed_when: false
      failed_when: false

    - name: UltraVNC-Indikatoren lesen
      ansible.windows.win_shell: |
        $service = Get-Service -Name uvnc_service -ErrorAction SilentlyContinue
        $paths = @(
          'C:\\Program Files\\uvnc bvba\\UltraVNC\\winvnc.exe',
          'C:\\Program Files\\UltraVNC\\winvnc.exe'
        )
        $iniCandidates = @()
        {% raw %}
        {% endraw %}
        $iniPaths = @(
        {% for p in expected_vnc_ini_paths | default([]) %}
          '{{ p }}'{% if not loop.last %},{% endif %}
        {% endfor %}
        )
        foreach ($p in $iniPaths) {
          if (Test-Path $p) { $iniCandidates += $p }
        }
        [PSCustomObject]@{
          ServiceExists = [bool]$service
          ServiceStatus = if ($service) { $service.Status.ToString() } else { '' }
          BinaryExists = [bool](($paths | Where-Object { Test-Path $_ }).Count -gt 0)
          IniExists = [bool]($iniCandidates.Count -gt 0)
          IniPaths = ($iniCandidates -join ', ')
        } | ConvertTo-Json -Compress
      register: validation_ultravnc_raw
      changed_when: false
      failed_when: false

    - name: UltraVNC-Indikatoren parsen
      ansible.builtin.set_fact:
        validation_ultravnc: "{{ validation_ultravnc_raw.stdout | default('{}') | from_json }}"
      when:
        - validation_ultravnc_raw.stdout is defined
        - validation_ultravnc_raw.stdout | trim | length > 0

    - name: Registrywerte lesen
      ansible.windows.win_shell: |
        $result = [ordered]@{}

        $veeamPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        $veeam = Get-ItemProperty -Path $veeamPath -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue
        $result.LocalAccountTokenFilterPolicy = if ($null -ne $veeam.LocalAccountTokenFilterPolicy) { [int]$veeam.LocalAccountTokenFilterPolicy } else { $null }

        $searchPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Search'
        $searchMode = Get-ItemProperty -Path $searchPath -Name SearchboxTaskbarMode -ErrorAction SilentlyContinue
        $result.SearchboxTaskbarMode = if ($null -ne $searchMode.SearchboxTaskbarMode) { [int]$searchMode.SearchboxTaskbarMode } else { $null }

        $netbtPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
        $lmhosts = @()
        if (Test-Path $netbtPath) {
          Get-ChildItem $netbtPath -ErrorAction SilentlyContinue | ForEach-Object {
            $item = Get-ItemProperty -Path $_.PSPath -Name EnableLMHOSTS -ErrorAction SilentlyContinue
            $lmhosts += [PSCustomObject]@{
              Interface = $_.PSChildName
              EnableLMHOSTS = if ($null -ne $item.EnableLMHOSTS) { [int]$item.EnableLMHOSTS } else { $null }
            }
          }
        }
        $result.LMHOSTS = $lmhosts

        $result | ConvertTo-Json -Depth 6 -Compress
      register: validation_registry_raw
      changed_when: false
      failed_when: false

    - name: Registrywerte parsen
      ansible.builtin.set_fact:
        validation_registry: "{{ validation_registry_raw.stdout | default('{}') | from_json }}"
      when:
        - validation_registry_raw.stdout is defined
        - validation_registry_raw.stdout | trim | length > 0

    - name: Energieplan lesen
      ansible.windows.win_shell: |
        powercfg /GETACTIVESCHEME
      register: validation_powerplan_raw
      changed_when: false
      failed_when: false

    - name: Windows Features lesen
      ansible.windows.win_shell: |
        $result = [ordered]@{}
        $result.NetFx3 = (Get-WindowsFeature -Name NET-Framework-Core -ErrorAction SilentlyContinue | Select-Object Name, InstallState)
        $features = @()
        foreach ($name in @(
        {% for f in expected_disabled_windows_features | default([]) %}
          '{{ f }}'{% if not loop.last %},{% endif %}
        {% endfor %}
        )) {
          $item = Get-WindowsOptionalFeature -Online -FeatureName $name -ErrorAction SilentlyContinue
          if ($item) {
            $features += [PSCustomObject]@{ FeatureName = $item.FeatureName; State = $item.State.ToString() }
          }
          else {
            $features += [PSCustomObject]@{ FeatureName = $name; State = 'Unknown' }
          }
        }
        $result.DisabledWindowsFeatures = $features
        $result | ConvertTo-Json -Depth 6 -Compress
      register: validation_features_raw
      changed_when: false
      failed_when: false

    - name: Windows Features parsen
      ansible.builtin.set_fact:
        validation_features: "{{ validation_features_raw.stdout | default('{}') | from_json }}"
      when:
        - validation_features_raw.stdout is defined
        - validation_features_raw.stdout | trim | length > 0

    - name: Dienste lesen
      ansible.windows.win_shell: |
        Get-Service |
        Select-Object Name, DisplayName, Status, StartType |
        ConvertTo-Json -Depth 4 -Compress
      register: validation_services_raw
      changed_when: false
      failed_when: false

    - name: Dienste parsen
      ansible.builtin.set_fact:
        validation_services: >-
          {{
            (validation_services_raw.stdout | from_json)
            if (validation_services_raw.stdout | default('') | trim).startswith('[')
            else ([validation_services_raw.stdout | from_json] if (validation_services_raw.stdout | default('') | trim | length > 0) else [])
          }}

    - name: TLS Protokolle lesen
      ansible.windows.win_shell: |
        $protocols = @('SSL 2.0','SSL 3.0','TLS 1.0','TLS 1.1','TLS 1.2')
        $result = foreach ($p in $protocols) {
          $serverPath = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$p\Server"
          $clientPath = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$p\Client"
          $serverEnabled = $null
          $serverDisabledByDefault = $null
          $clientEnabled = $null
          $clientDisabledByDefault = $null
          if (Test-Path $serverPath) {
            $obj = Get-ItemProperty -Path $serverPath -ErrorAction SilentlyContinue
            $serverEnabled = $obj.Enabled
            $serverDisabledByDefault = $obj.DisabledByDefault
          }
          if (Test-Path $clientPath) {
            $obj = Get-ItemProperty -Path $clientPath -ErrorAction SilentlyContinue
            $clientEnabled = $obj.Enabled
            $clientDisabledByDefault = $obj.DisabledByDefault
          }
          [PSCustomObject]@{
            Protocol = $p
            ServerEnabled = $serverEnabled
            ServerDisabledByDefault = $serverDisabledByDefault
            ClientEnabled = $clientEnabled
            ClientDisabledByDefault = $clientDisabledByDefault
          }
        }
        $result | ConvertTo-Json -Compress
      register: validation_tls_raw
      changed_when: false
      failed_when: false

    - name: TLS Protokolle parsen
      ansible.builtin.set_fact:
        validation_tls: >-
          {{
            (validation_tls_raw.stdout | from_json)
            if (validation_tls_raw.stdout | default('') | trim).startswith('[')
            else ([validation_tls_raw.stdout | from_json] if (validation_tls_raw.stdout | default('') | trim | length > 0) else [])
          }}

    - name: Cipher Suites lesen
      ansible.windows.win_shell: |
        Get-TlsCipherSuite |
        Select-Object -ExpandProperty Name |
        ConvertTo-Json -Compress
      register: validation_cipher_raw
      changed_when: false
      failed_when: false

    - name: Cipher Suites parsen
      ansible.builtin.set_fact:
        validation_cipher_suites: >-
          {{
            (validation_cipher_raw.stdout | from_json)
            if (validation_cipher_raw.stdout | default('') | trim).startswith('[')
            else ([validation_cipher_raw.stdout | default('') | trim] if (validation_cipher_raw.stdout | default('') | trim | length > 0) else [])
          }}

    - name: Partitionen lesen
      ansible.windows.win_shell: |
        Get-Volume |
        Where-Object { $_.DriveLetter } |
        Select-Object DriveLetter, SizeRemaining, Size |
        ConvertTo-Json -Compress
      register: validation_volumes_raw
      changed_when: false
      failed_when: false

    - name: Partitionen parsen
      ansible.builtin.set_fact:
        validation_volumes: >-
          {{
            (validation_volumes_raw.stdout | from_json)
            if (validation_volumes_raw.stdout | default('') | trim).startswith('[')
            else ([validation_volumes_raw.stdout | from_json] if (validation_volumes_raw.stdout | default('') | trim | length > 0) else [])
          }}

    - name: Freigaben lesen
      ansible.windows.win_shell: |
        Get-SmbShare |
        Select-Object Name, Path, Description |
        ConvertTo-Json -Compress
      register: validation_shares_raw
      changed_when: false
      failed_when: false

    - name: Freigaben parsen
      ansible.builtin.set_fact:
        validation_shares: >-
          {{
            (validation_shares_raw.stdout | from_json)
            if (validation_shares_raw.stdout | default('') | trim).startswith('[')
            else ([validation_shares_raw.stdout | from_json] if (validation_shares_raw.stdout | default('') | trim | length > 0) else [])
          }}

    - name: Hotfixes lesen
      ansible.windows.win_shell: |
        Get-HotFix |
        Select-Object HotFixID, InstalledOn, Description |
        ConvertTo-Json -Compress
      register: validation_hotfixes_raw
      changed_when: false
      failed_when: false

    - name: Hotfixes parsen
      ansible.builtin.set_fact:
        validation_hotfixes: >-
          {{
            (validation_hotfixes_raw.stdout | from_json)
            if (validation_hotfixes_raw.stdout | default('') | trim).startswith('[')
            else ([validation_hotfixes_raw.stdout | from_json] if (validation_hotfixes_raw.stdout | default('') | trim | length > 0) else [])
          }}

    - name: Desktop und BGInfo-Indikatoren lesen
      ansible.windows.win_shell: |
        $publicDesktop = Join-Path $env:PUBLIC 'Desktop'
        $edgeLinks = @()
        if (Test-Path $publicDesktop) {
          $edgeLinks = Get-ChildItem -Path $publicDesktop -Filter '*Edge*.lnk' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
        }
        $bginfoPaths = @(
        {% for p in expected_bginfo_paths | default([]) %}
          '{{ p }}'{% if not loop.last %},{% endif %}
        {% endfor %}
        )
        $bgFound = @()
        foreach ($p in $bginfoPaths) {
          if (Test-Path $p) { $bgFound += $p }
        }
        $startupPath = Join-Path $env:ProgramData 'Microsoft\\Windows\\Start Menu\\Programs\\StartUp'
        $startupEntries = @()
        if (Test-Path $startupPath) {
          $startupEntries = Get-ChildItem -Path $startupPath -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
        }
        [PSCustomObject]@{
          EdgeLinks = $edgeLinks
          BgInfoPaths = $bgFound
          StartupEntries = $startupEntries
        } | ConvertTo-Json -Depth 6 -Compress
      register: validation_desktop_bginfo_raw
      changed_when: false
      failed_when: false

    - name: Desktop und BGInfo-Indikatoren parsen
      ansible.builtin.set_fact:
        validation_desktop_bginfo: "{{ validation_desktop_bginfo_raw.stdout | default('{}') | from_json }}"
      when:
        - validation_desktop_bginfo_raw.stdout is defined
        - validation_desktop_bginfo_raw.stdout | trim | length > 0

    - name: SNMP-Indikatoren lesen
      ansible.windows.win_shell: |
        $svc = Get-Service -Name SNMP -ErrorAction SilentlyContinue
        $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -match 'SNMP' } | Select-Object Name, State
        [PSCustomObject]@{
          ServiceExists = [bool]$svc
          ServiceStatus = if ($svc) { $svc.Status.ToString() } else { '' }
          Capabilities = $cap
        } | ConvertTo-Json -Depth 6 -Compress
      register: validation_snmp_raw
      changed_when: false
      failed_when: false

    - name: SNMP-Indikatoren parsen
      ansible.builtin.set_fact:
        validation_snmp: "{{ validation_snmp_raw.stdout | default('{}') | from_json }}"
      when:
        - validation_snmp_raw.stdout is defined
        - validation_snmp_raw.stdout | trim | length > 0

    - name: W32Time-Indikatoren lesen
      ansible.windows.win_shell: |
        $svc = Get-Service -Name W32Time -ErrorAction SilentlyContinue
        [PSCustomObject]@{
          ServiceExists = [bool]$svc
          ServiceStatus = if ($svc) { $svc.Status.ToString() } else { '' }
        } | ConvertTo-Json -Compress
      register: validation_w32time_raw
      changed_when: false
      failed_when: false

    - name: W32Time-Indikatoren parsen
      ansible.builtin.set_fact:
        validation_w32time: "{{ validation_w32time_raw.stdout | default('{}') | from_json }}"
      when:
        - validation_w32time_raw.stdout is defined
        - validation_w32time_raw.stdout | trim | length > 0

    - name: Ergebnis IPC0026 UltraVNC indirekt
      ansible.builtin.set_fact:
        validation_results: "{{ validation_results + [ {
          'ansible_id': 'IPC0026',
          'schritt': validation_catalog['IPC0026'].schritt,
          'status': (validation_status_ok if ((validation_ultravnc.ServiceExists | default(false)) and (validation_ultravnc.BinaryExists | default(false))) else validation_status_nok),
          'check_type': validation_catalog['IPC0026'].check_type,
          'istwert': ('ServiceExists=' ~ (validation_ultravnc.ServiceExists | default(false) | string) ~ ', ServiceStatus=' ~ (validation_ultravnc.ServiceStatus | default('')) ~ ', BinaryExists=' ~ (validation_ultravnc.BinaryExists | default(false) | string) ~ ', IniExists=' ~ (validation_ultravnc.IniExists | default(false) | string) ~ ', IniPaths=' ~ (validation_ultravnc.IniPaths | default(''))),
          'sollwert': 'UltraVNC Dienst und Binärdatei vorhanden',
          'pruefmethode': validation_catalog['IPC0026'].pruefmethode,
          'hinweis': 'Indirekte Prüfung über Dienst/Datei/INI.',
          'evidence': (validation_ultravnc | to_json),
          'timestamp': validation_scan_timestamp
          } ] }}"
      when: "'IPC0026' in validation_enabled_ids"

