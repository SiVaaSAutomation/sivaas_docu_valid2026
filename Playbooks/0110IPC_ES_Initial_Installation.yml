---
- name: "0110 IPC ES Validation vorbereiten"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Prüfen, ob benötigte Semaphore-Variablen übergeben wurden
      ansible.builtin.assert:
        that:
          - validation_target_host is defined
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - result_dir is defined
          - validation_target_host | string | length > 0
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - result_dir | string | length > 0
        fail_msg: >-
          Es fehlen benötigte Variablen aus Semaphore.
          Benötigt werden mindestens validation_target_host, win_user,
          win_password, winrm_transport und result_dir.

    - name: Zielhost temporär in das Inventory aufnehmen
      ansible.builtin.add_host:
        name: "{{ validation_target_host }}"
        groups: ipc_es_validation_targets
        ansible_host: "{{ validation_target_host }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ winrm_port | default(5985) }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: 60
        ansible_winrm_read_timeout_sec: 90
      no_log: true

    - name: Dynamische Zielgruppe anzeigen
      ansible.builtin.debug:
        msg: "{{ groups['ipc_es_validation_targets'] | default([]) }}"

- name: "0110 IPC ES Validation auf Windows-Zielsystem"
  hosts: ipc_es_validation_targets
  gather_facts: false
  ignore_unreachable: true
  any_errors_fatal: false

  vars:
    validation_report_prefix: "0110_ipc_es_validation"
    validation_status_ok: "OK"
    validation_status_nok: "NOK"
    validation_status_info: "Info"
    validation_status_nr: "Nicht relevant"

    expected_terminalbus_adapter_name: "{{ expected_terminalbus_adapter_name | default('Terminalbus') }}"
    expected_domain_name: "{{ expected_domain_name | default('') }}"
    expected_terminalbus_ip_regex: "{{ expected_terminalbus_ip_regex | default('^192\\.168\\.210\\.') }}"
    expected_terminalbus_gateway: "{{ expected_terminalbus_gateway | default('') }}"
    expected_terminalbus_dns_servers: "{{ expected_terminalbus_dns_servers | default([]) }}"
    expected_terminalbus_wins_servers: "{{ expected_terminalbus_wins_servers | default([]) }}"

  tasks:
    - name: WinRM-Verbindung testen
      ansible.windows.win_ping:
      register: validation_win_ping
      changed_when: false
      ignore_errors: true

    - name: Ergebnisliste initialisieren
      ansible.builtin.set_fact:
        validation_results: []
        validation_scan_timestamp: "{{ lookup('pipe', 'date -Iseconds') }}"
        validation_os_info: {}
        validation_hostname: ""
        validation_ip: "{{ ansible_host | default(inventory_hostname) }}"
        validation_timezone: ""
        validation_netadapters: []
        validation_netconfig: []
        validation_vnc_rules: []
        validation_ultravnc: {}
        validation_registry: {}
        validation_powerplan_text: ""
        validation_features: {}
        validation_services: []
        validation_tls: []
        validation_cipher_suites: []
        validation_volumes: []
        validation_shares: []
        validation_hotfixes: []
        validation_desktop_bginfo: {}
        validation_snmp: {}
        validation_w32time: {}
        validation_domain_info: {}
        validation_ou_info: {}
        validation_firewall_profiles: []

    - name: WinRM-Fehler als Ergebnis festhalten
      ansible.builtin.set_fact:
        validation_results: "{{ validation_results + [ {
          'ansible_id':'CONNECTIVITY',
          'schritt':'WinRM-Verbindung',
          'status': validation_status_nok,
          'check_type':'connectivity',
          'istwert':'win_ping fehlgeschlagen',
          'sollwert':'win_ping erfolgreich',
          'pruefmethode':'ansible.windows.win_ping',
          'hinweis': (validation_win_ping.msg | default('Host nicht erreichbar oder Authentifizierung fehlgeschlagen')),
          'evidence': (validation_win_ping | to_json),
          'timestamp': validation_scan_timestamp
          } ] }}"
      when: validation_win_ping is failed

    - block:
        - name: Computername lesen
          ansible.windows.win_shell: |
            $env:COMPUTERNAME
          register: validation_hostname_raw
          changed_when: false
          failed_when: false

        - name: Computername übernehmen
          ansible.builtin.set_fact:
            validation_hostname: "{{ validation_hostname_raw.stdout | default('') | string | trim }}"

        - name: OS-Informationen lesen
          ansible.windows.win_shell: |
            Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version |
            ConvertTo-Json -Compress
          register: validation_os_raw
          changed_when: false
          failed_when: false

        - name: OS-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_os_stdout: "{{ validation_os_raw.stdout | default('{}') | string }}"

        - name: OS-Informationen übernehmen
          ansible.builtin.set_fact:
            validation_os_info: "{{ validation_os_stdout | from_json }}"
          when: validation_os_stdout | trim | length > 0

        - name: Zeitzone lesen
          ansible.windows.win_shell: |
            (Get-TimeZone).Id
          register: validation_timezone_raw
          changed_when: false
          failed_when: false

        - name: Zeitzone übernehmen
          ansible.builtin.set_fact:
            validation_timezone: "{{ validation_timezone_raw.stdout | default('') | string | trim }}"

        - name: Netzwerkadapter lesen
          ansible.windows.win_shell: |
            $items = Get-NetAdapter | Select-Object Name, Status, InterfaceDescription
            @($items) | ConvertTo-Json -Compress
          register: validation_netadapters_raw
          changed_when: false
          failed_when: false

        - name: Netzwerkadapter-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_netadapters_stdout: "{{ validation_netadapters_raw.stdout | default('[]') | string }}"

        - name: Netzwerkadapter übernehmen
          ansible.builtin.set_fact:
            validation_netadapters: "{{ validation_netadapters_stdout | from_json }}"
          when: validation_netadapters_stdout | trim | length > 0

        - name: IP, Gateway und DNS lesen
          ansible.windows.win_shell: |
            $adapters = Get-NetIPConfiguration | ForEach-Object {
              [PSCustomObject]@{
                InterfaceAlias = $_.InterfaceAlias
                IPv4Address = @($_.IPv4Address | ForEach-Object { $_.IPAddress })
                IPv4DefaultGateway = @($_.IPv4DefaultGateway | ForEach-Object { $_.NextHop })
                DnsServer = @($_.DNSServer.ServerAddresses)
              }
            }
            @($adapters) | ConvertTo-Json -Depth 6 -Compress
          register: validation_netconfig_raw
          changed_when: false
          failed_when: false

        - name: Netconfig-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_netconfig_stdout: "{{ validation_netconfig_raw.stdout | default('[]') | string }}"

        - name: Netconfig übernehmen
          ansible.builtin.set_fact:
            validation_netconfig: "{{ validation_netconfig_stdout | from_json }}"
          when: validation_netconfig_stdout | trim | length > 0

        - name: WINS und Registrywerte lesen
          ansible.windows.win_shell: |
            $result = [ordered]@{}
            $veeamPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
            $veeam = Get-ItemProperty -Path $veeamPath -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue
            $result.LocalAccountTokenFilterPolicy = if ($null -ne $veeam.LocalAccountTokenFilterPolicy) { [int]$veeam.LocalAccountTokenFilterPolicy } else { $null }

            $searchPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Search'
            $searchMode = Get-ItemProperty -Path $searchPath -Name SearchboxTaskbarMode -ErrorAction SilentlyContinue
            $result.SearchboxTaskbarMode = if ($null -ne $searchMode.SearchboxTaskbarMode) { [int]$searchMode.SearchboxTaskbarMode } else { $null }

            $netbtPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
            $lmhosts = @()
            $wins = @()
            if (Test-Path $netbtPath) {
              Get-ChildItem $netbtPath -ErrorAction SilentlyContinue | ForEach-Object {
                $item = Get-ItemProperty -Path $_.PSPath -ErrorAction SilentlyContinue
                $lmhosts += [PSCustomObject]@{
                  Interface = $_.PSChildName
                  EnableLMHOSTS = if ($null -ne $item.EnableLMHOSTS) { [int]$item.EnableLMHOSTS } else { $null }
                }
                $wins += [PSCustomObject]@{
                  Interface = $_.PSChildName
                  NameServerList = if ($null -ne $item.NameServerList) { $item.NameServerList } else { '' }
                }
              }
            }
            $result.LMHOSTS = $lmhosts
            $result.WINS = $wins
            $result | ConvertTo-Json -Depth 8 -Compress
          register: validation_registry_raw
          changed_when: false
          failed_when: false

        - name: Registry-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_registry_stdout: "{{ validation_registry_raw.stdout | default('{}') | string }}"

        - name: Registry übernehmen
          ansible.builtin.set_fact:
            validation_registry: "{{ validation_registry_stdout | from_json }}"
          when: validation_registry_stdout | trim | length > 0

        - name: Firewallprofile lesen
          ansible.windows.win_shell: |
            $items = Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, DefaultOutboundAction
            @($items) | ConvertTo-Json -Compress
          register: validation_firewall_profiles_raw
          changed_when: false
          failed_when: false

        - name: Firewallprofile-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_firewall_profiles_stdout: "{{ validation_firewall_profiles_raw.stdout | default('[]') | string }}"

        - name: Firewallprofile übernehmen
          ansible.builtin.set_fact:
            validation_firewall_profiles: "{{ validation_firewall_profiles_stdout | from_json }}"
          when: validation_firewall_profiles_stdout | trim | length > 0

        - name: VNC Firewallregeln lesen
          ansible.windows.win_shell: |
            $rules = Get-NetFirewallRule -PolicyStore ActiveStore -ErrorAction SilentlyContinue | Where-Object {
              $_.DisplayName -match 'VNC' -or $_.Name -match 'VNC'
            }
            $result = foreach ($rule in $rules) {
              $pf = Get-NetFirewallPortFilter -AssociatedNetFirewallRule $rule -ErrorAction SilentlyContinue
              [PSCustomObject]@{
                Name = $rule.Name
                DisplayName = $rule.DisplayName
                Enabled = $rule.Enabled
                Profile = $rule.Profile
                Action = $rule.Action
                LocalPort = $pf.LocalPort
              }
            }
            @($result) | ConvertTo-Json -Compress
          register: validation_vnc_rules_raw
          changed_when: false
          failed_when: false

        - name: VNC-Regeln-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_vnc_rules_stdout: "{{ validation_vnc_rules_raw.stdout | default('[]') | string }}"

        - name: VNC-Regeln übernehmen
          ansible.builtin.set_fact:
            validation_vnc_rules: "{{ validation_vnc_rules_stdout | from_json }}"
          when: validation_vnc_rules_stdout | trim | length > 0

        - name: UltraVNC Indikatoren lesen
          ansible.windows.win_shell: |
            $service = Get-Service -Name uvnc_service -ErrorAction SilentlyContinue
            $paths = @('C:\Program Files\uvnc bvba\UltraVNC\winvnc.exe','C:\Program Files\UltraVNC\winvnc.exe')
            $iniPaths = @(
            {% for p in expected_vnc_ini_paths | default([]) %}
              '{{ p }}'{% if not loop.last %},{% endif %}
            {% endfor %}
            )
            $foundIni = @($iniPaths | Where-Object { Test-Path $_ })
            [PSCustomObject]@{
              ServiceExists = [bool]$service
              ServiceStatus = if ($service) { $service.Status.ToString() } else { '' }
              BinaryExists = [bool](($paths | Where-Object { Test-Path $_ }).Count -gt 0)
              IniExists = [bool]($foundIni.Count -gt 0)
              IniPaths = $foundIni
            } | ConvertTo-Json -Depth 6 -Compress
          register: validation_ultravnc_raw
          changed_when: false
          failed_when: false

        - name: UltraVNC-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_ultravnc_stdout: "{{ validation_ultravnc_raw.stdout | default('{}') | string }}"

        - name: UltraVNC übernehmen
          ansible.builtin.set_fact:
            validation_ultravnc: "{{ validation_ultravnc_stdout | from_json }}"
          when: validation_ultravnc_stdout | trim | length > 0

        - name: Energieplan lesen
          ansible.windows.win_shell: |
            powercfg /GETACTIVESCHEME
          register: validation_powerplan_raw
          changed_when: false
          failed_when: false

        - name: Energieplan übernehmen
          ansible.builtin.set_fact:
            validation_powerplan_text: "{{ validation_powerplan_raw.stdout | default('') | string | trim }}"

        - name: Windows Features lesen
          ansible.windows.win_shell: |
            $result = [ordered]@{}
            $result.NetFx3 = (Get-WindowsFeature -Name NET-Framework-Core -ErrorAction SilentlyContinue | Select-Object Name, InstallState)
            $features = @()
            foreach ($name in @(
            {% for f in expected_disabled_windows_features | default([]) %}
              '{{ f }}'{% if not loop.last %},{% endif %}
            {% endfor %}
            )) {
              $item = Get-WindowsOptionalFeature -Online -FeatureName $name -ErrorAction SilentlyContinue
              if ($item) {
                $features += [PSCustomObject]@{ FeatureName = $item.FeatureName; State = $item.State.ToString() }
              } else {
                $features += [PSCustomObject]@{ FeatureName = $name; State = 'Unknown' }
              }
            }
            $result.DisabledWindowsFeatures = $features
            $result | ConvertTo-Json -Depth 8 -Compress
          register: validation_features_raw
          changed_when: false
          failed_when: false

        - name: Feature-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_features_stdout: "{{ validation_features_raw.stdout | default('{}') | string }}"

        - name: Features übernehmen
          ansible.builtin.set_fact:
            validation_features: "{{ validation_features_stdout | from_json }}"
          when: validation_features_stdout | trim | length > 0

        - name: Dienste lesen
          ansible.windows.win_shell: |
            $items = Get-Service | Select-Object Name, DisplayName, Status, StartType
            @($items) | ConvertTo-Json -Depth 6 -Compress
          register: validation_services_raw
          changed_when: false
          failed_when: false

        - name: Dienste-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_services_stdout: "{{ validation_services_raw.stdout | default('[]') | string }}"

        - name: Dienste übernehmen
          ansible.builtin.set_fact:
            validation_services: "{{ validation_services_stdout | from_json }}"
          when: validation_services_stdout | trim | length > 0

        - name: TLS Protokolle lesen
          ansible.windows.win_shell: |
            $protocols = @('SSL 2.0','SSL 3.0','TLS 1.0','TLS 1.1','TLS 1.2')
            $result = foreach ($p in $protocols) {
              $serverPath = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$p\Server"
              $clientPath = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$p\Client"
              $serverEnabled = $null
              $clientEnabled = $null
              if (Test-Path $serverPath) { $serverEnabled = (Get-ItemProperty -Path $serverPath -ErrorAction SilentlyContinue).Enabled }
              if (Test-Path $clientPath) { $clientEnabled = (Get-ItemProperty -Path $clientPath -ErrorAction SilentlyContinue).Enabled }
              [PSCustomObject]@{ Protocol = $p; ServerEnabled = $serverEnabled; ClientEnabled = $clientEnabled }
            }
            @($result) | ConvertTo-Json -Compress
          register: validation_tls_raw
          changed_when: false
          failed_when: false

        - name: TLS-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_tls_stdout: "{{ validation_tls_raw.stdout | default('[]') | string }}"

        - name: TLS übernehmen
          ansible.builtin.set_fact:
            validation_tls: "{{ validation_tls_stdout | from_json }}"
          when: validation_tls_stdout | trim | length > 0

        - name: Cipher Suites lesen
          ansible.windows.win_shell: |
            $items = Get-TlsCipherSuite | Select-Object -ExpandProperty Name
            @($items) | ConvertTo-Json -Compress
          register: validation_cipher_raw
          changed_when: false
          failed_when: false

        - name: Cipher-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_cipher_stdout: "{{ validation_cipher_raw.stdout | default('[]') | string }}"

        - name: Cipher übernehmen
          ansible.builtin.set_fact:
            validation_cipher_suites: "{{ validation_cipher_stdout | from_json }}"
          when: validation_cipher_stdout | trim | length > 0

        - name: Partitionen lesen
          ansible.windows.win_shell: |
            $items = Get-Volume | Where-Object { $_.DriveLetter } | Select-Object DriveLetter, Size, SizeRemaining
            @($items) | ConvertTo-Json -Depth 6 -Compress
          register: validation_volumes_raw
          changed_when: false
          failed_when: false

        - name: Volumes-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_volumes_stdout: "{{ validation_volumes_raw.stdout | default('[]') | string }}"

        - name: Volumes übernehmen
          ansible.builtin.set_fact:
            validation_volumes: "{{ validation_volumes_stdout | from_json }}"
          when: validation_volumes_stdout | trim | length > 0

        - name: Shares lesen
          ansible.windows.win_shell: |
            $items = Get-SmbShare | Select-Object Name, Path, Description
            @($items) | ConvertTo-Json -Depth 6 -Compress
          register: validation_shares_raw
          changed_when: false
          failed_when: false

        - name: Shares-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_shares_stdout: "{{ validation_shares_raw.stdout | default('[]') | string }}"

        - name: Shares übernehmen
          ansible.builtin.set_fact:
            validation_shares: "{{ validation_shares_stdout | from_json }}"
          when: validation_shares_stdout | trim | length > 0

        - name: Hotfixes lesen
          ansible.windows.win_shell: |
            $items = Get-HotFix | Select-Object HotFixID, InstalledOn, Description
            @($items) | ConvertTo-Json -Depth 6 -Compress
          register: validation_hotfixes_raw
          changed_when: false
          failed_when: false

        - name: Hotfix-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_hotfixes_stdout: "{{ validation_hotfixes_raw.stdout | default('[]') | string }}"

        - name: Hotfixes übernehmen
          ansible.builtin.set_fact:
            validation_hotfixes: "{{ validation_hotfixes_stdout | from_json }}"
          when: validation_hotfixes_stdout | trim | length > 0

        - name: Desktop und BGInfo lesen
          ansible.windows.win_shell: |
            $publicDesktop = Join-Path $env:PUBLIC 'Desktop'
            $edgeLinks = @()
            if (Test-Path $publicDesktop) {
              $edgeLinks = Get-ChildItem -Path $publicDesktop -Filter '*Edge*.lnk' -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            }
            $bginfoPaths = @(
            {% for p in expected_bginfo_paths | default([]) %}
              '{{ p }}'{% if not loop.last %},{% endif %}
            {% endfor %}
            )
            $bgFound = @($bginfoPaths | Where-Object { Test-Path $_ })
            $startupPath = Join-Path $env:ProgramData 'Microsoft\Windows\Start Menu\Programs\StartUp'
            $startupEntries = @()
            if (Test-Path $startupPath) {
              $startupEntries = Get-ChildItem -Path $startupPath -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
            }
            [PSCustomObject]@{
              EdgeLinks = $edgeLinks
              BgInfoPaths = $bgFound
              StartupEntries = $startupEntries
            } | ConvertTo-Json -Depth 6 -Compress
          register: validation_desktop_bginfo_raw
          changed_when: false
          failed_when: false

        - name: BGInfo-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_desktop_bginfo_stdout: "{{ validation_desktop_bginfo_raw.stdout | default('{}') | string }}"

        - name: BGInfo übernehmen
          ansible.builtin.set_fact:
            validation_desktop_bginfo: "{{ validation_desktop_bginfo_stdout | from_json }}"
          when: validation_desktop_bginfo_stdout | trim | length > 0

        - name: SNMP lesen
          ansible.windows.win_shell: |
            $svc = Get-Service -Name SNMP -ErrorAction SilentlyContinue
            $cap = Get-WindowsCapability -Online | Where-Object { $_.Name -match 'SNMP' } | Select-Object Name, State
            [PSCustomObject]@{
              ServiceExists = [bool]$svc
              ServiceStatus = if ($svc) { $svc.Status.ToString() } else { '' }
              Capabilities = @($cap)
            } | ConvertTo-Json -Depth 6 -Compress
          register: validation_snmp_raw
          changed_when: false
          failed_when: false

        - name: SNMP-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_snmp_stdout: "{{ validation_snmp_raw.stdout | default('{}') | string }}"

        - name: SNMP übernehmen
          ansible.builtin.set_fact:
            validation_snmp: "{{ validation_snmp_stdout | from_json }}"
          when: validation_snmp_stdout | trim | length > 0

        - name: W32Time lesen
          ansible.windows.win_shell: |
            $svc = Get-Service -Name W32Time -ErrorAction SilentlyContinue
            [PSCustomObject]@{
              ServiceExists = [bool]$svc
              ServiceStatus = if ($svc) { $svc.Status.ToString() } else { '' }
            } | ConvertTo-Json -Compress
          register: validation_w32time_raw
          changed_when: false
          failed_when: false

        - name: W32Time-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_w32time_stdout: "{{ validation_w32time_raw.stdout | default('{}') | string }}"

        - name: W32Time übernehmen
          ansible.builtin.set_fact:
            validation_w32time: "{{ validation_w32time_stdout | from_json }}"
          when: validation_w32time_stdout | trim | length > 0

        - name: Domäne lesen
          ansible.windows.win_shell: |
            $cs = Get-CimInstance Win32_ComputerSystem
            [PSCustomObject]@{
              PartOfDomain = [bool]$cs.PartOfDomain
              Domain = $cs.Domain
            } | ConvertTo-Json -Compress
          register: validation_domain_raw
          changed_when: false
          failed_when: false

        - name: Domain-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_domain_stdout: "{{ validation_domain_raw.stdout | default('{}') | string }}"

        - name: Domäne übernehmen
          ansible.builtin.set_fact:
            validation_domain_info: "{{ validation_domain_stdout | from_json }}"
          when: validation_domain_stdout | trim | length > 0

        - name: OU lesen
          ansible.windows.win_shell: |
            try {
              $dn = ([adsisearcher]"(&(objectCategory=computer)(name=$env:COMPUTERNAME))").FindOne().Properties.distinguishedname
              [PSCustomObject]@{ DistinguishedName = $dn } | ConvertTo-Json -Compress
            } catch {
              [PSCustomObject]@{ DistinguishedName = '' } | ConvertTo-Json -Compress
            }
          register: validation_ou_raw
          changed_when: false
          failed_when: false

        - name: OU-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_ou_stdout: "{{ validation_ou_raw.stdout | default('{}') | string }}"

        - name: OU übernehmen
          ansible.builtin.set_fact:
            validation_ou_info: "{{ validation_ou_stdout | from_json }}"
          when: validation_ou_stdout | trim | length > 0

        - name: Terminalbus Konfiguration ableiten
          ansible.builtin.set_fact:
            validation_terminalbus_config: >-
              {{
                (validation_netconfig | selectattr('InterfaceAlias', 'equalto', expected_terminalbus_adapter_name) | list | first)
                if ((validation_netconfig | selectattr('InterfaceAlias', 'equalto', expected_terminalbus_adapter_name) | list | length) > 0)
                else {'InterfaceAlias': expected_terminalbus_adapter_name, 'IPv4Address': [], 'IPv4DefaultGateway': [], 'DnsServer': []}
              }}

        - name: IPC0043 Zeitzone
          ansible.builtin.set_fact:
            validation_results: "{{ validation_results + [ {
              'ansible_id':'IPC0043',
              'schritt':'Date and Time',
              'status': (validation_status_ok if validation_timezone == expected_timezone_id else validation_status_nok),
              'check_type':'direct',
              'istwert': ('Zeitzone=' ~ validation_timezone),
              'sollwert': ('Zeitzone=' ~ expected_timezone_id),
              'pruefmethode':'Get-TimeZone',
              'hinweis':'',
              'evidence': validation_timezone,
              'timestamp': validation_scan_timestamp
              } ] }}"

        - name: IPC0049 Adapter Namen
          ansible.builtin.set_fact:
            validation_results: "{{ validation_results + [ {
              'ansible_id':'IPC0049',
              'schritt':'Netzwerkadapter umbenennen',
              'status': (validation_status_ok if ((expected_present_adapters | difference(validation_netadapters | map(attribute='Name') | list) | length) == 0) else validation_status_nok),
              'check_type':'direct',
              'istwert': ('Adapter=' ~ ((validation_netadapters | map(attribute='Name') | list) | join(', '))),
              'sollwert': ('Erwartet=' ~ (expected_present_adapters | join(', '))),
              'pruefmethode':'Get-NetAdapter',
              'hinweis': ('Fehlend=' ~ ((expected_present_adapters | difference(validation_netadapters | map(attribute='Name') | list)) | join(', '))),
              'evidence': (validation_netadapters | to_json),
              'timestamp': validation_scan_timestamp
              } ] }}"

        - name: IPC0050 Terminalbus IP
          ansible.builtin.set_fact:
            validation_results: "{{ validation_results + [ {
              'ansible_id':'IPC0050',
              'schritt':'Terminalbus-Adresse einstellen',
              'status': (validation_status_ok if (((validation_terminalbus_config.IPv4Address | default([]) | select('match', expected_terminalbus_ip_regex) | list | length) > 0)) else validation_status_nok),
              'check_type':'direct',
              'istwert': ('Adapter=' ~ (validation_terminalbus_config.InterfaceAlias | default('')) ~ '; IP=' ~ ((validation_terminalbus_config.IPv4Address | default([])) | join(', '))),
              'sollwert': ('Adapter=' ~ expected_terminalbus_adapter_name ~ '; IP Regex=' ~ expected_terminalbus_ip_regex),
              'pruefmethode':'Get-NetIPConfiguration',
              'hinweis':'',
              'evidence': (validation_terminalbus_config | to_json),
              'timestamp': validation_scan_timestamp
              } ] }}"

        - name: IPC0051 Terminalbus Gateway
          ansible.builtin.set_fact:
            validation_results: "{{ validation_results + [ {
              'ansible_id':'IPC0051',
              'schritt':'Terminalbus Gateway korrigieren',
              'status': (validation_status_ok if ((expected_terminalbus_gateway | length > 0) and ((validation_terminalbus_config.IPv4DefaultGateway | default([])) | select('equalto', expected_terminalbus_gateway) | list | length > 0)) else validation_status_nok),
              'check_type':'direct',
              'istwert': ('Adapter=' ~ (validation_terminalbus_config.InterfaceAlias | default('')) ~ '; Gateway=' ~ ((validation_terminalbus_config.IPv4DefaultGateway | default([])) | join(', '))),
              'sollwert': ('Gateway=' ~ expected_terminalbus_gateway),
              'pruefmethode':'Get-NetIPConfiguration',
              'hinweis':'',
              'evidence': (validation_terminalbus_config | to_json),
              'timestamp': validation_scan_timestamp
              } ] }}"

        - name: IPC0055 DNS und WINS
          ansible.builtin.set_fact:
            validation_results: "{{ validation_results + [ {
              'ansible_id':'IPC0055',
              'schritt':'DNS und WINS-Server eintragen',
              'status': (validation_status_ok if (((expected_terminalbus_dns_servers | difference(validation_terminalbus_config.DnsServer | default([])) | length) == 0) and ((expected_terminalbus_wins_servers | length == 0) or ((expected_terminalbus_wins_servers | join(',')) in ((validation_registry.WINS | default([]) | map(attribute='NameServerList') | list | join(';')))))) else validation_status_nok),
              'check_type':'direct',
              'istwert': ('Adapter=' ~ (validation_terminalbus_config.InterfaceAlias | default('')) ~ '; DNS=' ~ ((validation_terminalbus_config.DnsServer | default([])) | join(', ')) ~ '; WINS=' ~ ((validation_registry.WINS | default([]) | map(attribute='NameServerList') | list | join(' | ')))),
              'sollwert': ('DNS=' ~ (expected_terminalbus_dns_servers | join(', ')) ~ '; WINS=' ~ (expected_terminalbus_wins_servers | join(', '))),
              'pruefmethode':'Get-NetIPConfiguration + Registry',
              'hinweis':'',
              'evidence': (({'netconfig': validation_terminalbus_config, 'wins': validation_registry.WINS | default([])}) | to_json),
              'timestamp': validation_scan_timestamp
              } ] }}"

        - name: IPC0056 LMHOSTS
          ansible.builtin.set_fact:
            validation_results: "{{ validation_results + [ {
              'ansible_id':'IPC0056',
              'schritt':'LMHOSTS-Abfrage deaktivieren',
              'status': (validation_status_ok if ((validation_registry.LMHOSTS | default([]) | map(attribute='EnableLMHOSTS') | reject('equalto', none) | list | unique) == [expected_enable_lmhosts]) else validation_status_nok),
              'check_type':'direct',
              'istwert': ('LMHOSTS=' ~ ((validation_registry.LMHOSTS | default([])) | to_json)),
              'sollwert': ('EnableLMHOSTS=' ~ (expected_enable_lmhosts | string)),
              'pruefmethode':'Registry Tcpip NetBT Parameters',
              'hinweis':'',
              'evidence': ((validation_registry.LMHOSTS | default([])) | to_json),
              'timestamp': validation_scan_timestamp
              } ] }}"

        - name: IPC0059 Domäne
          ansible.builtin.set_fact:
            validation_results: "{{ validation_results + [ {
              'ansible_id':'IPC0059',
              'schritt':'Rechner in die Domäne aufnehmen',
              'status': (validation_status_ok if ((expected_domain_name | length > 0) and ((validation_domain_info.Domain | default('')) | lower == (expected_domain_name | lower))) else validation_status_nok),
              'check_type':'direct',
              'istwert': ('PartOfDomain=' ~ (validation_domain_info.PartOfDomain | default(false) | string) ~ '; Domain=' ~ (validation_domain_info.Domain | default(''))),
              'sollwert': ('Domain=' ~ expected_domain_name),
              'pruefmethode':'Win32_ComputerSystem',
              'hinweis':'',
              'evidence': (validation_domain_info | to_json),
              'timestamp': validation_scan_timestamp
              } ] }}"
          when: expected_domain_name | length > 0

        - name: IPC0060 OU
          ansible.builtin.set_fact:
            validation_results: "{{ validation_results + [ {
              'ansible_id':'IPC0060',
              'schritt':'Rechner in der OU einsortieren',
              'status': (validation_status_ok if (((validation_ou_info.DistinguishedName | default('')) is regex(expected_computer_ou_regex))) else validation_status_nok),
              'check_type':'direct',
              'istwert': ('DistinguishedName=' ~ (validation_ou_info.DistinguishedName | default(''))),
              'sollwert': ('OU Regex=' ~ expected_computer_ou_regex),
              'pruefmethode':'ADSI Searcher',
              'hinweis':'',
              'evidence': (validation_ou_info | to_json),
              'timestamp': validation_scan_timestamp
              } ] }}"
          when: expected_computer_ou_regex | default('') | length > 0

      when: validation_win_ping is succeeded

- name: "0110 IPC ES Validation Report"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    validation_report_prefix: "0110_ipc_es_validation"

  tasks:
    - name: Report-Zeitstempel setzen
      ansible.builtin.set_fact:
        validation_report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        validation_report_timestamp_iso: "{{ lookup('pipe', 'date -Iseconds') }}"

    - name: Report-Verzeichnis erzeugen
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0755"

    - name: Reportdaten sammeln
      ansible.builtin.set_fact:
        validation_report_hosts: >-
          {%- set ns = namespace(items=[]) -%}
          {%- for host in (groups['ipc_es_validation_targets'] | default([])) -%}
            {%- set hv = hostvars[host] -%}
            {%- if hv.validation_results is defined and (hv.validation_results | length > 0) -%}
              {%- set ns.items = ns.items + [hv] -%}
            {%- endif -%}
          {%- endfor -%}
          {{ ns.items }}

    - name: Reportdaten Debug
      ansible.builtin.debug:
        msg:
          - "Targets: {{ groups['ipc_es_validation_targets'] | default([]) }}"
          - "Report hosts count: {{ validation_report_hosts | length }}"
          - "Report hosts ips: {{ validation_report_hosts | map(attribute='validation_ip') | list }}"
          - "Report hosts names: {{ validation_report_hosts | map(attribute='validation_hostname') | list }}"

    - name: JSON Report schreiben
      ansible.builtin.copy:
        dest: "{{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}.json"
        mode: "0644"
        content: |
          [
          {% for hv in validation_report_hosts | sort(attribute='validation_ip') %}
            {
              "pruefzeit": {{ hv.validation_scan_timestamp | default('') | to_json }},
              "ip": {{ hv.validation_ip | default(hv.inventory_hostname | default('')) | to_json }},
              "computername": {{ hv.validation_hostname | default('') | to_json }},
              "os_caption": {{ hv.validation_os_info.Caption | default('') | to_json }},
              "os_version": {{ hv.validation_os_info.Version | default('') | to_json }},
              "checks": {{ (hv.validation_results | default([]) | sort(attribute='ansible_id')) | to_nice_json }}
            }{% if not loop.last %},{% endif %}
          {% endfor %}
          ]

    - name: CSV Reports schreiben
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import csv, json
        from pathlib import Path

        json_path = Path("{{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}.json")
        detail_csv_path = Path("{{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}_details.csv")
        matrix_csv_path = Path("{{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}_matrix.csv")
        data = json.loads(json_path.read_text(encoding="utf-8"))

        detail_rows = []
        for host in data:
            for check in sorted(host.get("checks", []), key=lambda x: str(x.get("ansible_id", ""))):
                detail_rows.append({
                    "pruefzeit": host.get("pruefzeit", ""),
                    "ip": host.get("ip", ""),
                    "computername": host.get("computername", ""),
                    "ansible_id": check.get("ansible_id", ""),
                    "schritt": check.get("schritt", ""),
                    "status": check.get("status", ""),
                    "check_type": check.get("check_type", ""),
                    "istwert": check.get("istwert", ""),
                    "sollwert": check.get("sollwert", ""),
                    "pruefmethode": check.get("pruefmethode", ""),
                    "hinweis": check.get("hinweis", ""),
                    "evidence": check.get("evidence", ""),
                    "timestamp": check.get("timestamp", ""),
                })

        detail_rows.sort(key=lambda r: (str(r["ip"]), str(r["ansible_id"])))
        detail_fieldnames = [
            "pruefzeit", "ip", "computername", "ansible_id", "schritt", "status",
            "check_type", "istwert", "sollwert", "pruefmethode", "hinweis", "evidence", "timestamp"
        ]
        with detail_csv_path.open("w", encoding="utf-8-sig", newline="") as f:
            writer = csv.DictWriter(f, fieldnames=detail_fieldnames, delimiter=";")
            writer.writeheader()
            writer.writerows(detail_rows)

        hosts = sorted(data, key=lambda h: (str(h.get("ip", "")), str(h.get("computername", ""))))
        host_columns = [f"{h.get('ip', '')} | {h.get('computername', '')}" for h in hosts]

        descriptions = {}
        check_map = {}
        for host in hosts:
            host_key = f"{host.get('ip', '')} | {host.get('computername', '')}"
            for check in host.get("checks", []):
                cid = str(check.get("ansible_id", ""))
                descriptions[cid] = check.get("schritt", "")
                check_map.setdefault(cid, {})[host_key] = check.get("status", "")

        sorted_ids = sorted(descriptions.keys())
        with matrix_csv_path.open("w", encoding="utf-8-sig", newline="") as f:
            writer = csv.writer(f, delimiter=";")
            writer.writerow(["ansible_id", "beschreibung"] + [f"ES_{i+1}" for i in range(len(host_columns))])
            writer.writerow(["meta", "zielsystem"] + host_columns)
            for cid in sorted_ids:
                row = [cid, descriptions.get(cid, "")]
                for host_col in host_columns:
                    row.append(check_map.get(cid, {}).get(host_col, ""))
                writer.writerow(row)

        print(json.dumps({
            "json": str(json_path),
            "detail_csv": str(detail_csv_path),
            "matrix_csv": str(matrix_csv_path),
            "detail_rows": len(detail_rows),
            "matrix_rows": len(sorted_ids)
        }, ensure_ascii=False))
        PY
      args:
        executable: /bin/bash
      register: validation_csv_result
      changed_when: false

    - name: Reportpfade ausgeben
      ansible.builtin.debug:
        msg:
          - "JSON: {{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}.json"
          - "DETAIL CSV: {{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}_details.csv"
          - "MATRIX CSV: {{ result_dir }}/{{ validation_report_prefix }}_{{ validation_report_timestamp }}_matrix.csv"
          - "Zusammenfassung: {{ validation_csv_result.stdout }}"