---
- name: "0110 IPC ES Validation vorbereiten"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Pruefen, ob benoetigte Semaphore-Variablen uebergeben wurden
      ansible.builtin.assert:
        that:
          - target_network is defined
          - nmap_binary is defined
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - result_dir is defined
          - pcs7_setup_log_path is defined
          - target_network | string | length > 0
          - nmap_binary | string | length > 0
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - result_dir | string | length > 0
          - pcs7_setup_log_path | string | length > 0
        fail_msg: >-
          Es fehlen benoetigte Variablen aus Semaphore.
          Benoetigt werden mindestens target_network, nmap_binary, win_user,
          win_password, winrm_transport, result_dir und pcs7_setup_log_path.

    - name: Pruefen, ob nmap auf dem Ansible-Controller vorhanden ist
      ansible.builtin.command: "{{ nmap_binary }} --version"
      register: validation_nmap_check
      changed_when: false
      failed_when: false

    - name: Abbrechen, wenn nmap fehlt
      ansible.builtin.fail:
        msg: >-
          nmap ist auf dem Ansible-Controller nicht installiert.
          Installation zum Beispiel mit: sudo apt install nmap
      when: validation_nmap_check.rc != 0

    - name: Pfad zur Installationsliste festlegen
      ansible.builtin.set_fact:
        validation_installation_list_file: >-
          {{
            ipc_installation_list_path
            | default(playbook_dir ~ '/../IPC_Liste_Kompakt.csv')
          }}

    - name: Pruefen, ob die Installationsliste vorhanden ist
      ansible.builtin.stat:
        path: "{{ validation_installation_list_file }}"
      register: validation_installation_list_stat

    - name: Abbrechen, wenn die Installationsliste fehlt
      ansible.builtin.fail:
        msg: >-
          Die Installationsliste {{ validation_installation_list_file }} wurde
          nicht gefunden. Lege IPC_Liste_Kompakt.csv im Repository ab oder setze
          ipc_installation_list_path in Semaphore.
      when: not (validation_installation_list_stat.stat.exists | default(false))

    - name: Vollstaendigen IPC-Pruefkatalog aus der CSV einlesen
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import csv
        import json
        import os
        import re
        from pathlib import Path

        path = Path(os.environ["IPC_INSTALLATION_LIST_PATH"])
        raw = path.read_bytes()
        text = None
        used_encoding = None
        for encoding in ("utf-8-sig", "utf-8", "cp1252", "latin1"):
            try:
                text = raw.decode(encoding)
                used_encoding = encoding
                break
            except UnicodeDecodeError:
                continue
        if text is None:
            raise RuntimeError(f"Kodierung von {path} konnte nicht ermittelt werden")

        catalog = []
        seen = set()
        reader = csv.reader(text.splitlines(), delimiter=";")
        for row in reader:
            if not row:
                continue
            ansible_id = row[0].strip() if len(row) > 0 else ""
            if not re.fullmatch(r"IPC\d{4}", ansible_id):
                continue
            if ansible_id in seen:
                continue
            seen.add(ansible_id)
            catalog.append({
                "ansible_id": ansible_id,
                "schritt": row[1].strip() if len(row) > 1 else "",
                "anleitung": row[2].strip() if len(row) > 2 else "",
            })

        catalog.sort(key=lambda item: int(item["ansible_id"][3:]))
        if not catalog:
            raise RuntimeError(f"Keine IPC-IDs in {path} gefunden")
        print(json.dumps({
            "source": str(path),
            "encoding": used_encoding,
            "count": len(catalog),
            "catalog": catalog,
        }, ensure_ascii=False))
        PY
      args:
        executable: /bin/bash
      environment:
        IPC_INSTALLATION_LIST_PATH: "{{ validation_installation_list_file }}"
      register: validation_catalog_raw
      changed_when: false

    - name: IPC-Pruefkatalog speichern
      ansible.builtin.set_fact:
        validation_catalog_meta: "{{ validation_catalog_raw.stdout | from_json }}"
        validation_check_catalog: "{{ (validation_catalog_raw.stdout | from_json).catalog }}"

    - name: IPC-Pruefkatalog anzeigen
      ansible.builtin.debug:
        msg:
          - "Installationsliste: {{ validation_catalog_meta.source }}"
          - "Kodierung: {{ validation_catalog_meta.encoding }}"
          - "IPC-IDs: {{ validation_catalog_meta.count }}"

    - name: Pfad zur IPC-Discovery-Datei festlegen
      ansible.builtin.set_fact:
        validation_discovery_file: >-
          {{
            ipc_discovery_file
            | default(result_dir ~ '/ipc_discovery_groups_latest.json')
          }}

    - name: Pruefen, ob die IPC-Discovery-Datei vorhanden ist
      ansible.builtin.stat:
        path: "{{ validation_discovery_file }}"
      register: validation_discovery_file_stat

    - name: Abbrechen, wenn die IPC-Discovery-Datei fehlt
      ansible.builtin.fail:
        msg: >-
          Die IPC-Discovery-Datei {{ validation_discovery_file }} wurde nicht
          gefunden. Fuehre zuerst das Playbook
          0000IPC_Discovery_Classification.yml aus.
      when: not (validation_discovery_file_stat.stat.exists | default(false))

    - name: IPC-Discovery-Datei einlesen
      ansible.builtin.slurp:
        src: "{{ validation_discovery_file }}"
      register: validation_discovery_file_raw

    - name: IPC-Discovery-Daten speichern
      ansible.builtin.set_fact:
        validation_discovery_data: >-
          {{
            validation_discovery_file_raw.content
            | b64decode
            | from_json
          }}

    - name: IP-Adressen aus der Gruppe IPC ES speichern
      ansible.builtin.set_fact:
        validation_ipc_es_ips: >-
          {{
            validation_discovery_data.groups.ipc_es
            | default([])
            | selectattr('ip', 'defined')
            | map(attribute='ip')
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | unique
            | list
          }}

    - name: IPC-ES-IP-Adressen anzeigen
      ansible.builtin.debug:
        msg:
          - "Discovery-Datei: {{ validation_discovery_file }}"
          - "IPC-ES-Teilnehmer: {{ validation_ipc_es_ips | length }}"
          - "IPC-ES-IP-Adressen: {{ validation_ipc_es_ips }}"

    - name: Hinweis ausgeben, wenn die Gruppe IPC ES leer ist
      ansible.builtin.debug:
        msg: >-
          In {{ validation_discovery_file }} sind unter groups.ipc_es keine
          IP-Adressen eingetragen. Es werden deshalb keine Zielsysteme geprueft.
      when: validation_ipc_es_ips | length == 0

    - name: IPC-ES-IP-Adressen nach offenen WinRM-Ports 5985 und 5986 scannen
      ansible.builtin.shell: |
        set -o pipefail
        {{ nmap_binary }} -n -Pn -p 5985,5986 --open {{ validation_ipc_es_ips | join(' ') }} -oG - |
        awk '
          /Ports:/ {
            host=$2
            has_http = ($0 ~ /5985\/open\/tcp/)
            has_https = ($0 ~ /5986\/open\/tcp/)

            if (has_https) {
              ports = has_http ? "5985,5986" : "5986"
              print host ";5986;https;" ports
            } else if (has_http) {
              print host ";5985;http;5985"
            }
          }
        '
      args:
        executable: /bin/bash
      register: validation_scan_result
      changed_when: false
      when: validation_ipc_es_ips | length > 0

    - name: Gefundene IP-Adressen und WinRM-Infos speichern
      ansible.builtin.set_fact:
        validation_discovered_winrm_hosts: >-
          {{
            validation_scan_result.stdout_lines
            | default([])
            | unique
            | list
          }}
        validation_discovered_ips: >-
          {{
            validation_scan_result.stdout_lines
            | default([])
            | map('regex_replace', ';.*$', '')
            | unique
            | list
          }}

    - name: Gefundene WinRM-Teilnehmer anzeigen
      ansible.builtin.debug:
        var: validation_discovered_winrm_hosts

    - name: Gefundene IP-Adressen anzeigen
      ansible.builtin.debug:
        var: validation_discovered_ips

    - name: Hinweis ausgeben, wenn kein IPC-ES-Teilnehmer per WinRM erreichbar ist
      ansible.builtin.debug:
        msg: >-
          Von den IP-Adressen aus groups.ipc_es wurde kein Host mit offenem
          WinRM-Port 5985 oder 5986 gefunden.
          Pruefe Firewall, WinRM und die Discovery-Datei.
      when:
        - validation_ipc_es_ips | length > 0
        - validation_discovered_winrm_hosts | length == 0

    - name: WinRM-Ergebnisse als IP-Mapping vorbereiten
      ansible.builtin.set_fact:
        validation_winrm_map: {}

    - name: Gefundene WinRM-Verbindungen in Mapping eintragen
      ansible.builtin.set_fact:
        validation_winrm_map: >-
          {{
            validation_winrm_map
            | combine({
                item.split(';')[0]: {
                  'port': item.split(';')[1] | int,
                  'scheme': item.split(';')[2],
                  'open_ports': item.split(';')[3],
                  'nmap_reachable': true
                }
              })
          }}
      loop: "{{ validation_discovered_winrm_hosts }}"
      loop_control:
        label: "{{ item.split(';')[0] }}"

    - name: Alle IPC-ES-Hosts temporaer in das Inventory aufnehmen
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: ipc_es_validation_targets
        ansible_host: "{{ item }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ validation_winrm_map.get(item, {}).get('port', winrm_default_port | default(5985)) | int }}"
        ansible_winrm_scheme: "{{ validation_winrm_map.get(item, {}).get('scheme', 'http') }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(90) }}"
        discovered_winrm_open_ports: "{{ validation_winrm_map.get(item, {}).get('open_ports', '') }}"
        validation_nmap_winrm_reachable: "{{ validation_winrm_map.get(item, {}).get('nmap_reachable', false) }}"
      loop: "{{ validation_ipc_es_ips }}"
      loop_control:
        label: "{{ item }}"
      no_log: true

    - name: Dynamische IPC-ES-Zielgruppe anzeigen
      ansible.builtin.debug:
        msg: "{{ groups['ipc_es_validation_targets'] | default([]) }}"

- name: "0110 IPC ES Validation auf Windows-Zielsystem"
  hosts: ipc_es_validation_targets
  gather_facts: false
  ignore_unreachable: true
  any_errors_fatal: false

  vars:
    validation_report_prefix: "0110_ipc_es_validation"
    validation_status_ok: "OK"
    validation_status_nok: "NOK"
    validation_status_info: "Info"
    validation_status_nr: "Nicht relevant"
    validation_status_not_checked: "Nicht geprüft"
    validation_status_not_testable: "Nicht prüfbar"

    validation_expected_terminalbus_adapter_name: "{{ expected_terminalbus_adapter_name | default('Terminalbus') }}"
    validation_expected_domain_name: "{{ expected_domain_name | default('') }}"
    validation_expected_terminalbus_ip_regex: "{{ expected_terminalbus_ip_regex | default('^192\\.168\\.210\\.') }}"
    validation_expected_terminalbus_gateway: "{{ expected_terminalbus_gateway | default('') }}"
    validation_expected_terminalbus_dns_servers: "{{ expected_terminalbus_dns_servers | default([]) }}"
    validation_expected_terminalbus_wins_servers: "{{ expected_terminalbus_wins_servers | default([]) }}"

  tasks:
    - name: Ergebnisliste initialisieren
      ansible.builtin.set_fact:
        validation_results: []
        validation_scan_timestamp: "{{ lookup('pipe', 'date -Iseconds') }}"
        validation_os_info: {}
        validation_hostname: ""
        validation_ip: "{{ ansible_host | default(inventory_hostname) }}"
        validation_timezone: ""
        validation_language: {}
        validation_netadapters: []
        validation_netconfig: []
        validation_vnc_rules: []
        validation_ultravnc: {}
        validation_registry: {}
        validation_powerplan_text: ""
        validation_features: {}
        validation_services: []
        validation_tls: []
        validation_cipher_suites: []
        validation_volumes: []
        validation_shares: []
        validation_hotfixes: []
        validation_desktop_bginfo: {}
        validation_snmp: {}
        validation_w32time: {}
        validation_domain_info: {}
        validation_ou_info: {}
        validation_firewall_profiles: []
       

    - name: WinRM-Verbindung testen
      ansible.windows.win_ping:
      register: validation_win_ping
      changed_when: false
      ignore_errors: true
      ignore_unreachable: true

    - name: WinRM-Fehler als Ergebnis festhalten
      ansible.builtin.set_fact:
        validation_results: >-
          {{
            validation_results
            + [
              {
                'ansible_id': 'CONNECTIVITY',
                'schritt': 'WinRM-Verbindung',
                'status': validation_status_nok,
                'check_type': 'connectivity',
                'istwert': 'win_ping fehlgeschlagen',
                'sollwert': 'win_ping erfolgreich',
                'pruefmethode': 'ansible.windows.win_ping',
                'hinweis': (
                  validation_win_ping.msg
                  | default(
                      validation_win_ping.module_stderr
                      | default(
                          'Host nicht erreichbar oder Authentifizierung fehlgeschlagen'
                        )
                    )
                ),
                'evidence': validation_win_ping | to_json,
                'timestamp': validation_scan_timestamp
              }
            ]
          }}
      when: validation_win_ping.ping | default('') != 'pong'

    - block:
        - name: Computername lesen
          ansible.windows.win_shell: |
            $env:COMPUTERNAME
          register: validation_hostname_raw
          changed_when: false
          failed_when: false

        - name: Computername übernehmen
          ansible.builtin.set_fact:
            validation_hostname: "{{ validation_hostname_raw.stdout | default('') | string | trim }}"

        - name: OS-Informationen lesen
          ansible.windows.win_shell: |
            Get-CimInstance Win32_OperatingSystem |
            Select-Object Caption, Version |
            ConvertTo-Json -Compress
          register: validation_os_raw
          changed_when: false
          failed_when: false

        - name: OS-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_os_stdout: "{{ validation_os_raw.stdout | default('{}') | string }}"

        - name: OS-Informationen übernehmen
          ansible.builtin.set_fact:
            validation_os_info: "{{ validation_os_stdout | from_json }}"
          when: validation_os_stdout | trim | length > 0

        - name: Zeitzone lesen
          ansible.windows.win_shell: |
            (Get-TimeZone).Id
          register: validation_timezone_raw
          changed_when: false
          failed_when: false

        - name: Zeitzone übernehmen
          ansible.builtin.set_fact:
            validation_timezone: "{{ validation_timezone_raw.stdout | default('') | string | trim }}"

        - name: Sprache und Region lesen
          ansible.windows.win_shell: |
            [PSCustomObject]@{
              Culture = (Get-Culture).Name
              UICulture = (Get-UICulture).Name
              SystemLocale = (Get-WinSystemLocale).Name
              UserLanguageList = @((Get-WinUserLanguageList) | ForEach-Object { $_.LanguageTag })
              HomeLocation = (Get-WinHomeLocation).GeoId
            } | ConvertTo-Json -Depth 6 -Compress
          register: validation_language_raw
          changed_when: false
          failed_when: false

        - name: Sprache-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_language_stdout: "{{ validation_language_raw.stdout | default('{}') | string }}"

        - name: Sprache und Region uebernehmen
          ansible.builtin.set_fact:
            validation_language: "{{ validation_language_stdout | from_json }}"
          when: validation_language_stdout | trim | length > 0

        - name: Netzwerkadapter lesen
          ansible.windows.win_shell: |
            $items = Get-NetAdapter | Select-Object Name, Status, InterfaceDescription
            ConvertTo-Json -InputObject @($items) -Compress
          register: validation_netadapters_raw
          changed_when: false
          failed_when: false

        - name: Netzwerkadapter-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_netadapters_stdout: "{{ validation_netadapters_raw.stdout | default('[]') | string }}"

        - name: Netzwerkadapter übernehmen
          ansible.builtin.set_fact:
            validation_netadapters: "{{ validation_netadapters_stdout | from_json }}"
          when: validation_netadapters_stdout | trim | length > 0

        - name: IP, Gateway und DNS lesen
          ansible.windows.win_shell: |
            $adapters = Get-NetIPConfiguration | ForEach-Object {
              [PSCustomObject]@{
                InterfaceAlias = $_.InterfaceAlias
                IPv4Address = @($_.IPv4Address | ForEach-Object { $_.IPAddress })
                IPv4DefaultGateway = @($_.IPv4DefaultGateway | ForEach-Object { $_.NextHop })
                DnsServer = @($_.DNSServer.ServerAddresses)
              }
            }
            ConvertTo-Json -InputObject @($adapters) -Depth 6 -Compress
          register: validation_netconfig_raw
          changed_when: false
          failed_when: false

        - name: Netconfig-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_netconfig_stdout: "{{ validation_netconfig_raw.stdout | default('[]') | string }}"

        - name: Netconfig übernehmen
          ansible.builtin.set_fact:
            validation_netconfig: "{{ validation_netconfig_stdout | from_json }}"
          when: validation_netconfig_stdout | trim | length > 0

        - name: WINS und Registrywerte lesen
          ansible.windows.win_shell: |
            $result = [ordered]@{}
            $veeamPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
            $veeam = Get-ItemProperty -Path $veeamPath -Name LocalAccountTokenFilterPolicy -ErrorAction SilentlyContinue
            $result.LocalAccountTokenFilterPolicy = if ($null -ne $veeam.LocalAccountTokenFilterPolicy) { [int]$veeam.LocalAccountTokenFilterPolicy } else { $null }

            $searchPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Search'
            $searchMode = Get-ItemProperty -Path $searchPath -Name SearchboxTaskbarMode -ErrorAction SilentlyContinue
            $result.SearchboxTaskbarMode = if ($null -ne $searchMode.SearchboxTaskbarMode) { [int]$searchMode.SearchboxTaskbarMode } else { $null }

            $netbtPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
            $lmhosts = @()
            $wins = @()
            if (Test-Path $netbtPath) {
              Get-ChildItem $netbtPath -ErrorAction SilentlyContinue | ForEach-Object {
                $item = Get-ItemProperty -Path $_.PSPath -ErrorAction SilentlyContinue
                $lmhosts += [PSCustomObject]@{
                  Interface = $_.PSChildName
                  EnableLMHOSTS = if ($null -ne $item.EnableLMHOSTS) { [int]$item.EnableLMHOSTS } else { $null }
                }
                $wins += [PSCustomObject]@{
                  Interface = $_.PSChildName
                  NameServerList = if ($null -ne $item.NameServerList) { $item.NameServerList } else { '' }
                }
              }
            }
            $result.LMHOSTS = $lmhosts
            $result.WINS = $wins
            $result | ConvertTo-Json -Depth 8 -Compress
          register: validation_registry_raw
          changed_when: false
          failed_when: false

        - name: Registry-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_registry_stdout: "{{ validation_registry_raw.stdout | default('{}') | string }}"

        - name: Registry übernehmen
          ansible.builtin.set_fact:
            validation_registry: "{{ validation_registry_stdout | from_json }}"
          when: validation_registry_stdout | trim | length > 0

        - name: Firewallprofile lesen
          ansible.windows.win_shell: |
            $items = Get-NetFirewallProfile | ForEach-Object {
              [PSCustomObject]@{
                Name = $_.Name.ToString()
                Enabled = [bool]($_.Enabled.ToString() -eq 'True')
                DefaultInboundAction = $_.DefaultInboundAction.ToString()
                DefaultOutboundAction = $_.DefaultOutboundAction.ToString()
              }
            }
            ConvertTo-Json -InputObject @($items) -Compress
          register: validation_firewall_profiles_raw
          changed_when: false
          failed_when: false

        - name: Firewallprofile-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_firewall_profiles_stdout: "{{ validation_firewall_profiles_raw.stdout | default('[]') | string }}"

        - name: Firewallprofile übernehmen
          ansible.builtin.set_fact:
            validation_firewall_profiles: "{{ validation_firewall_profiles_stdout | from_json }}"
          when: validation_firewall_profiles_stdout | trim | length > 0

        - name: VNC Firewallregeln lesen
          ansible.windows.win_shell: |
            $rules = Get-NetFirewallRule -PolicyStore ActiveStore -ErrorAction SilentlyContinue | Where-Object {
              $_.DisplayName -match 'VNC' -or $_.Name -match 'VNC'
            }
            $result = foreach ($rule in $rules) {
              $pf = Get-NetFirewallPortFilter -AssociatedNetFirewallRule $rule -ErrorAction SilentlyContinue
              [PSCustomObject]@{
                Name = $rule.Name
                DisplayName = $rule.DisplayName
                Enabled = [bool]($rule.Enabled.ToString() -eq 'True')
                Profile = $rule.Profile.ToString()
                AllProfiles = [bool]($rule.Profile.ToString() -eq 'Any')
                Action = $rule.Action.ToString()
                LocalPort = @($pf.LocalPort)
                ExpectedPorts = @($pf.LocalPort | Where-Object { $_ -in @('5800','5900',5800,5900) })
              }
            }
            ConvertTo-Json -InputObject @($result) -Compress
          register: validation_vnc_rules_raw
          changed_when: false
          failed_when: false

        - name: VNC-Regeln-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_vnc_rules_stdout: "{{ validation_vnc_rules_raw.stdout | default('[]') | string }}"

        - name: VNC-Regeln übernehmen
          ansible.builtin.set_fact:
            validation_vnc_rules: "{{ validation_vnc_rules_stdout | from_json }}"
          when: validation_vnc_rules_stdout | trim | length > 0

        - name: UltraVNC Indikatoren lesen
          ansible.windows.win_shell: |
            $service = Get-Service -Name uvnc_service -ErrorAction SilentlyContinue
            $paths = @('C:\Program Files\uvnc bvba\UltraVNC\winvnc.exe','C:\Program Files\UltraVNC\winvnc.exe')
            $viewerPaths = @('C:\Program Files\uvnc bvba\UltraVNC\vncviewer.exe','C:\Program Files\UltraVNC\vncviewer.exe')
            $binaryPath = @($paths | Where-Object { Test-Path $_ } | Select-Object -First 1)
            $viewerPath = @($viewerPaths | Where-Object { Test-Path $_ } | Select-Object -First 1)
            $version = ''
            if ($binaryPath.Count -gt 0) {
              $version = (Get-Item -LiteralPath $binaryPath[0]).VersionInfo.ProductVersion
            }
            $listeningPorts = @(
              Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
              Where-Object { $_.LocalPort -in @(5800,5900) } |
              Select-Object -ExpandProperty LocalPort -Unique
            )
            $iniPaths = @(
            {% for p in expected_vnc_ini_paths | default([]) %}
              '{{ p }}'{% if not loop.last %},{% endif %}
            {% endfor %}
            )
            $foundIni = @($iniPaths | Where-Object { Test-Path $_ })
            [PSCustomObject]@{
              ServiceExists = [bool]$service
              ServiceStatus = if ($service) { $service.Status.ToString() } else { '' }
              BinaryExists = [bool]($binaryPath.Count -gt 0)
              BinaryPath = if ($binaryPath.Count -gt 0) { $binaryPath[0] } else { '' }
              Version = $version
              ViewerExists = [bool]($viewerPath.Count -gt 0)
              ViewerPath = if ($viewerPath.Count -gt 0) { $viewerPath[0] } else { '' }
              ListeningPorts = $listeningPorts
              IniExists = [bool]($foundIni.Count -gt 0)
              IniPaths = $foundIni
            } | ConvertTo-Json -Depth 6 -Compress
          register: validation_ultravnc_raw
          changed_when: false
          failed_when: false

        - name: UltraVNC-stdout sicher vorbereiten
          ansible.builtin.set_fact:
            validation_ultravnc_stdout: "{{ validation_ultravnc_raw.stdout | default('{}') | string }}"

        - name: UltraVNC übernehmen
          ansible.builtin.set_fact:
            validation_ultravnc: "{{ validation_ultravnc_stdout | from_json }}"
          when: validation_ultravnc_stdout | trim | length > 0

