              information: null
              quelle: "0180 Live-WinRM"
              hinweis: "Direkte Prüfung konnte aktuell nicht ausgeführt werden; dies ist kein Konfigurations-NOK."
            IPC0076:
              pruefart: INDIREKT
              status: KEINE_INFORMATION
              manuelle_bewertung_erforderlich: true
              aufgabe: "Desktop-Verknüpfungen bereinigen"
              information: null
              quelle: "0180 Live-WinRM"
              hinweis: "Direkte Prüfung konnte aktuell nicht ausgeführt werden; dies ist kein Konfigurations-NOK."
            IPC0089:
              pruefart: INDIREKT
              status: KEINE_INFORMATION
              manuelle_bewertung_erforderlich: true
              aufgabe: "Starten und Wiederherstellen anpassen"
              information: null
              quelle: "0180 Live-WinRM"
              hinweis: "Direkte Prüfung konnte aktuell nicht ausgeführt werden; dies ist kein Konfigurations-NOK."
            IPC0160:
              pruefart: INDIREKT
              status: KEINE_INFORMATION
              manuelle_bewertung_erforderlich: true
              aufgabe: "Verwendung von sicheren Cipher Suites"
              information: null
              quelle: "0180 Live-WinRM"
              hinweis: "Get-TlsCipherSuite konnte aktuell nicht ausgeführt werden."
            IPC0161:
              pruefart: INDIREKT
              status: KEINE_INFORMATION
              manuelle_bewertung_erforderlich: true
              aufgabe: "Cipher Suites deaktivieren"
              information: null
              quelle: "0180 Live-WinRM"
              hinweis: "Get-TlsCipherSuite konnte aktuell nicht ausgeführt werden."
            IPC0167:
              pruefart: INDIREKT
              status: KEINE_INFORMATION
              manuelle_bewertung_erforderlich: true
              aufgabe: "Projektordner anlegen"
              information: null
              quelle: "0180 Live-WinRM"
              hinweis: "Test-Path konnte aktuell nicht ausgeführt werden."
            IPC0200:
              pruefart: INDIREKT
              status: KEINE_INFORMATION
              manuelle_bewertung_erforderlich: true
              aufgabe: "WSUSClientManager ablegen"
              information: null
