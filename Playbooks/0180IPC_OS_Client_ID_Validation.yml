      when: id_validation_live_result is not defined


- name: "0180 IPC OS Client - Live-Ergebnisse in JSON und CSV integrieren"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    id_validation_output_file: >-
      {{
        ipc_os_client_id_validation_file
        | default(result_dir ~ '/ipc_os_client_id_validation_latest.json')
      }}
    id_validation_csv_file: >-
      {{
        ipc_os_client_id_validation_csv_file
        | default(result_dir ~ '/ipc_os_client_id_validation_matrix_latest.csv')
      }}
    id_validation_merge_python_file: "/tmp/0180_ipc_os_client_merge.py"
    live_direct_ids:
      - IPC0028
      - IPC0047
      - IPC0073
      - IPC0076
      - IPC0089
      - IPC0160
      - IPC0161
      - IPC0167
      - IPC0200
      - IPC0236
      - IPC0252
    live_information_ids:
      - IPC0077
      - IPC0241

  tasks:
    - name: Live-Ergebnisse aller OS-Client sammeln
      ansible.builtin.set_fact:
        id_validation_live_results: >-
          {{
            id_validation_live_results | default({})
            | combine({ item: hostvars[item].id_validation_live_result | default({'checks': {}, 'informationen': {}}) })
          }}
      loop: "{{ groups['ipc_os_client_0180_live_targets'] | default([]) }}"
      loop_control:
        label: "{{ item }}"

    - name: 0180-Merge-Auswerter schreiben
      ansible.builtin.copy:
        dest: "{{ id_validation_merge_python_file }}"
        mode: "0700"
        content: |
          #!/usr/bin/env python3
          import argparse
          import csv
          import ipaddress
          import json
          import os
          import re
          from pathlib import Path

          def as_dict(value):
              return value if isinstance(value, dict) else {}

          def ip_sort_key(value):
              try:
                  return (0, int(ipaddress.ip_address(str(value))))
              except ValueError:
                  return (1, str(value))

          def id_sort_key(value):
              match = re.fullmatch(r"IPC(\d+)", str(value).strip(), re.IGNORECASE)
              if match:
                  return (0, int(match.group(1)), str(value))
              return (1, str(value))

          def matrix_information_value(item):
              item = as_dict(item)
              if item.get("status") == "KEINE_INFORMATION":
                  return "KEINE_INFORMATION"
              value = item.get("information")
              if value is None:
                  return "KEINE_INFORMATION"
              if isinstance(value, str):
                  return value
              return json.dumps(value, ensure_ascii=False, separators=(",", ":"))

          parser = argparse.ArgumentParser()
          parser.add_argument("--json-output", required=True)
          parser.add_argument("--csv-output", required=True)
          parser.add_argument("--live-results", required=True)
          parser.add_argument("--live-direct-ids", required=True)
          parser.add_argument("--live-information-ids", required=True)
          args = parser.parse_args()

          output_path = Path(args.json_output)
          csv_path = Path(args.csv_output)
          live_results = json.loads(args.live_results)
          live_direct_ids = json.loads(args.live_direct_ids)
          live_information_ids = json.loads(args.live_information_ids)

          with output_path.open("r", encoding="utf-8-sig") as handle:
              output = json.load(handle)
          hosts = as_dict(output.get("hosts"))

          for ip, result in as_dict(live_results).items():
              host = as_dict(hosts.get(ip))
              if host.get("validation_scope") != "OS_CLIENT_SOLLSWERTPRUEFUNG":
                  continue
              direct = as_dict(host.get("pruefungen"))
              indirect = as_dict(host.get("informationen"))
              result = as_dict(result)
              for task_id, item in as_dict(result.get("checks")).items():
                  direct[task_id] = item
                  indirect.pop(task_id, None)
              for task_id, item in as_dict(result.get("informationen")).items():
                  if task_id not in direct:
                      indirect[task_id] = item
              host["pruefungen"] = {key: direct[key] for key in sorted(direct, key=id_sort_key)}
              host["informationen"] = {key: indirect[key] for key in sorted(indirect, key=id_sort_key) if key not in direct}
              host["summary"] = {
                  "evaluated": len(host["pruefungen"]),
                  "ok": sum(1 for x in host["pruefungen"].values() if as_dict(x).get("status") == "OK"),
                  "nok": sum(1 for x in host["pruefungen"].values() if as_dict(x).get("status") == "NOK"),
                  "information": len(host["informationen"]),
              }

          evaluated_ids = sorted({
              task_id for host in hosts.values()
              if as_dict(host).get("validation_scope") == "OS_CLIENT_SOLLSWERTPRUEFUNG"
              for task_id in as_dict(as_dict(host).get("pruefungen")).keys()
          }, key=id_sort_key)
          information_ids = sorted({
              task_id for host in hosts.values()
              if as_dict(host).get("validation_scope") == "OS_CLIENT_SOLLSWERTPRUEFUNG"
              for task_id in as_dict(as_dict(host).get("informationen")).keys()
          }, key=id_sort_key)

          output["evaluated_ids"] = evaluated_ids
          output["indirect_information_ids"] = information_ids
          scope = as_dict(output.get("scope"))
          scope["live_direct_ids"] = live_direct_ids
          scope["live_information_ids"] = live_information_ids
          output["scope"] = scope
          summary = as_dict(output.get("summary"))
          summary["checks_ok_total"] = sum(
              1 for host in hosts.values()
              if as_dict(host).get("validation_scope") == "OS_CLIENT_SOLLSWERTPRUEFUNG"
              for item in as_dict(as_dict(host).get("pruefungen")).values()
              if as_dict(item).get("status") == "OK"
          )
          summary["checks_nok_total"] = sum(
              1 for host in hosts.values()
              if as_dict(host).get("validation_scope") == "OS_CLIENT_SOLLSWERTPRUEFUNG"
              for item in as_dict(as_dict(host).get("pruefungen")).values()
              if as_dict(item).get("status") == "NOK"
          )
          summary["information_total"] = sum(
              len(as_dict(as_dict(host).get("informationen")))
              for host in hosts.values()
              if as_dict(host).get("validation_scope") == "OS_CLIENT_SOLLSWERTPRUEFUNG"
          )
          output["summary"] = summary
          sources = as_dict(output.get("sources"))
          upstream = sources.get("upstream") if isinstance(sources.get("upstream"), list) else []
          if "0180_Direct_PowerShell_Live_Checks" not in upstream:
              upstream.append("0180_Direct_PowerShell_Live_Checks")
          sources["upstream"] = upstream
          output["sources"] = sources

          tmp = output_path.with_name(output_path.name + ".tmp")
          with tmp.open("w", encoding="utf-8", newline="\n") as handle:
              json.dump(output, handle, ensure_ascii=False, indent=2)
              handle.write("\n")
              handle.flush()
              os.fsync(handle.fileno())
          os.replace(str(tmp), str(output_path))

          matrix_ids = sorted(
              set(evaluated_ids) | set(information_ids) | set(live_direct_ids) | set(live_information_ids),
              key=id_sort_key,
          )
          csv_tmp = csv_path.with_name(csv_path.name + ".tmp")
          with csv_tmp.open("w", encoding="utf-8-sig", newline="") as handle:
              writer = csv.writer(handle, delimiter=";", quoting=csv.QUOTE_MINIMAL)
              writer.writerow(["IP-Adresse", "Rechnername", "Computerart", "Ansible-Zugriff", *matrix_ids])
              for ip in sorted(hosts, key=ip_sort_key):
                  host = as_dict(hosts[ip])
                  row = [
                      ip,
                      host.get("computer_name") or "",
                      host.get("computer_type") or "",
                      "JA" if bool(host.get("ansible_access")) else "NEIN",
                  ]
                  direct = as_dict(host.get("pruefungen"))
                  indirect = as_dict(host.get("informationen"))
                  is_os = host.get("validation_scope") == "OS_CLIENT_SOLLSWERTPRUEFUNG"
                  for task_id in matrix_ids:
                      if not is_os:
                          row.append("")
                      elif task_id in direct:
                          row.append(as_dict(direct[task_id]).get("status") or "NOK")
                      elif task_id in indirect:
                          row.append(matrix_information_value(indirect[task_id]))
                      else:
                          row.append("")
                  writer.writerow(row)
              handle.flush()
              os.fsync(handle.fileno())
          os.replace(str(csv_tmp), str(csv_path))

          print(json.dumps({"summary": output.get("summary", {}), "evaluated_ids": evaluated_ids, "information_ids": information_ids}, ensure_ascii=False))

    - name: Live-Ergebnisse in 0180-Ausgaben zusammenfuehren
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ id_validation_merge_python_file }}"
          - "--json-output"
          - "{{ id_validation_output_file }}"
          - "--csv-output"
          - "{{ id_validation_csv_file }}"
          - "--live-results"
          - "{{ id_validation_live_results | default({}) | to_json }}"
          - "--live-direct-ids"
          - "{{ live_direct_ids | to_json }}"
          - "--live-information-ids"
          - "{{ live_information_ids | to_json }}"
      register: id_validation_live_merge
      changed_when: true

    - name: Temporaeren Merge-Auswerter entfernen
      ansible.builtin.file:
        path: "{{ id_validation_merge_python_file }}"
        state: absent

    - name: Finale 0180-Ergebnisdatei einlesen
      ansible.builtin.slurp:
        src: "{{ id_validation_output_file }}"
      register: id_validation_final_raw

    - name: Finale 0180-Zusammenfassung anzeigen
      ansible.builtin.debug:
        msg:
          - "JSON-Ausgabedatei: {{ id_validation_output_file }}"
          - "CSV-Matrix: {{ id_validation_csv_file }}"
          - "OS Client Live-Ziele: {{ groups['ipc_os_client_0180_live_targets'] | default([]) | length }}"
          - >-
            Finale Zusammenfassung:
            {{ (id_validation_final_raw.content | b64decode | from_json).summary }}