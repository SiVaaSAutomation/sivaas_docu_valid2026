                  None,
                  "Aktuelle JSON-Snapshots",
                  "Pfad/Inhalt/Referenzstand der autoload.pas werden von den aktuellen Collectors nicht erfasst.",
              )

              # IPC0245 / IPC0246 - Firewall.
              checks["IPC0245"] = make_check(
                  "IPC0245", "VNC-Viewer Firewallregel prüfen", vnc_fw_ok,
                  "VNC-Regeln aktiviert, Inbound Allow, alle Profile",
                  pattern_results,
                  "Firewall_SMB_Patch_Valid.Firewall.Rules",
                  "Semaphore: expected_firewall_rule_name_patterns + Aufgabenliste",
              )
              required = {"domain", "private", "public"}
              profile_map = {
                  text(item.get("Name")).lower(): item
                  for item in fw_profiles if isinstance(item, dict)
              }
              fw_all_ok = all(
                  name in profile_map and bool_value(profile_map[name].get("Enabled")) is True
                  for name in required
              )
              checks["IPC0246"] = make_check(
                  "IPC0246", "Firewall für alle Profile aktiviert",
                  fw_all_ok,
                  {"Domain": True, "Private": True, "Public": True},
                  fw_profiles,
                  "Firewall_SMB_Patch_Valid.Firewall.Profiles", "Aufgabenliste",
              )

              # IPC0247 / IPC0248 / IPC0249 - Defender OS-Client-spezifisch.
              defender_status = as_dict(as_dict(defender).get("ComputerStatus"))
              defender_preferences = as_dict(as_dict(defender).get("Preferences"))
              tamper = defender_status.get("IsTamperProtected")
              maps_reporting = defender_preferences.get("MAPSReporting")
              submit_samples = defender_preferences.get("SubmitSamplesConsent")
              checks["IPC0247"] = make_check(
                  "IPC0247", "Defender Einstellungen korrigieren - Manipulationsschutz",
                  bool_value(tamper) is False,
                  "IsTamperProtected = false",
                  {"IsTamperProtected": tamper},
                  "Initial_Valid.MicrosoftDefender.ComputerStatus.IsTamperProtected",
                  "Aufgabenliste",
              )
              checks["IPC0248"] = make_check(
                  "IPC0248", "Defender Einstellungen korrigieren - Cloudbasierter Schutz",
                  int_value(maps_reporting) == 0 or text(maps_reporting).lower() == "disabled",
                  "MAPSReporting = Disabled (0)",
                  {"MAPSReporting": maps_reporting},
                  "Initial_Valid.MicrosoftDefender.Preferences.MAPSReporting",
                  "Aufgabenliste / Microsoft Defender Preference",
              )
              checks["IPC0249"] = make_check(
                  "IPC0249", "Defender Einstellungen korrigieren - Automatische Übermittlung von Beispielen",
                  int_value(submit_samples) == 2 or text(submit_samples).lower() in {"neversend", "never send"},
                  "SubmitSamplesConsent = NeverSend (2)",
                  {"SubmitSamplesConsent": submit_samples},
                  "Initial_Valid.MicrosoftDefender.Preferences.SubmitSamplesConsent",
                  "Aufgabenliste / Microsoft Defender Preference",
              )

              info["IPC0250"] = make_information(
                  "IPC0250", "Defender Zuverlässigkeitsbasierter Schutz / Downloads",
                  defender,
                  "Initial_Valid.MicrosoftDefender",
                  "Defender-Status/Preferences werden fuer manuellen Abgleich ausgegeben; konkrete UI-Checkbox fuer Downloads ist nicht als einzelnes Feld normalisiert.",
              )
              info["IPC0251"] = make_information(
                  "IPC0251", "Defender Sicherheitsstatus i.O.", defender,
                  "Initial_Valid.MicrosoftDefender",
                  "Vollstaendiger vorhandener Defender-Status.",
              )

              # IPC0254 / IPC0255 - SIMATIC Shell / WinCC Autostart.
              info["IPC0255"] = make_information(
                  "IPC0255", "WinCC Autostart aktivieren",
                  {"SiemensRegistryEvidence": wincc_registry, "Autoruns": wincc_autoruns},
                  "SiemensRegistryEvidence + Autoruns",
                  "Autostart-Evidenz wird ausgegeben; die vier WinCC-UI-Schalter sind nicht als normierte Felder verfuegbar.",
              )

              info["IPC0257"] = make_information(
                  "IPC0257", "Kontrolle WinCC Autostart",
                  None,
                  "Aktuelle JSON-Snapshots",
                  "Der funktionale Neustart-/Runtime-Test wird nicht als Snapshotzustand erfasst.",
              )
              info["IPC0258"] = make_information(
                  "IPC0258", "Kontrolle PM-Logon",
                  None,
                  "Aktuelle JSON-Snapshots",
                  "Kartenleser-/Logon-Funktionstest wird nicht als Snapshotzustand erfasst.",
              )

              # IPC0259 - Windows-Zeitstatus.
              info["IPC0259"] = make_information(
                  "IPC0259", "Kontrolle Uhrzeit", time_config,
                  "Initial_Valid.TimeConfiguration",
                  "W32Time-Service, w32tm-Status, Konfiguration, Peers und Registry werden ausgegeben; ein einmaliger stripchart-Test zu DC01 wird nicht nachgestellt.",
              )

              info["IPC0262"] = make_information(
                  "IPC0262", "Geänderte autoload.pas auf OS-Client kopieren",
                  None,
                  "Aktuelle JSON-Snapshots",
                  "Pfad/Inhalt/Referenzstand der autoload.pas werden von den aktuellen Collectors nicht erfasst.",
              )

              # IPC0263 - Safety-Matrix-Lizenzen: nur ALM-Evidenz ohne Schluessel.
              info["IPC0263"] = make_information(
                  "IPC0263", "Safety Matrix Lizenzen entrollen", alm_evidence,
                  "Software_PCS7_Components_Valid.AutomationLicenseManagerEvidence",
                  "ALM-/Lizenz-Evidenz wird ausgegeben; Lizenzschluessel und konkrete Lizenzaktionen werden absichtlich nicht exportiert.",
              )

              return (
                  {key: checks[key] for key in sorted(checks, key=id_sort_key)},
                  {key: info[key] for key in sorted(info, key=id_sort_key) if key not in checks},
              )

          EXPLICITLY_IGNORED_IDS = [
              "IPC0001", "IPC0002", "IPC0005", "IPC0010", "IPC0014",
              "IPC0016", "IPC0017", "IPC0020", "IPC0021", "IPC0023",
              "IPC0031", "IPC0033", "IPC0040", "IPC0057", "IPC0061",
              "IPC0062", "IPC0116", "IPC0137", "IPC0138", "IPC0165",
              "IPC0196", "IPC0201", "IPC0206", "IPC0237",
              "IPC0256", "IPC0260",
          ]

          ROLE_EXCLUDED_IDS = [
              "IPC0052", "IPC0053", "IPC0101", "IPC0180", "IPC0224",
              "IPC0225", "IPC0238", "IPC0242",
          ]

          NOT_DIRECTLY_AVAILABLE_IDS = {
              "IPC0148": "Windows-Systemschutz/System Restore ist in den aktuellen JSON-Snapshots nicht als belastbarer Aktiv/Deaktiviert-Endzustand normalisiert.",
              "IPC0243": "Inhalt und erwartete Zielversion der OS-Client-autoload.pas werden nicht erfasst.",
              "IPC0262": "Inhalt und erwartete Zielversion der geaenderten autoload.pas werden nicht erfasst.",
          }

          LIVE_DIRECT_IDS = [
              "IPC0028", "IPC0047", "IPC0073", "IPC0076", "IPC0089",
              "IPC0160", "IPC0161", "IPC0167", "IPC0200",
              "IPC0236", "IPC0252",
          ]

          LIVE_INFORMATION_IDS = [
              "IPC0077", "IPC0241",
          ]

          def write_csv(output, csv_path):
              hosts = as_dict(output.get("hosts"))
              matrix_ids = sorted(
                  set(output.get("evaluated_ids", []))
                  | set(output.get("indirect_information_ids", []))
                  | set(LIVE_DIRECT_IDS)
                  | set(LIVE_INFORMATION_IDS),
                  key=id_sort_key,
              )
              tmp = csv_path.with_name(csv_path.name + ".tmp")
              with tmp.open("w", encoding="utf-8-sig", newline="") as handle:
                  writer = csv.writer(handle, delimiter=";", quoting=csv.QUOTE_MINIMAL)
                  writer.writerow(["IP-Adresse", "Rechnername", "Computerart", "Ansible-Zugriff", *matrix_ids])
                  for ip in sorted(hosts, key=ip_sort_key):
                      host = as_dict(hosts[ip])
                      row = [
                          ip,
                          host.get("computer_name") or "",
                          host.get("computer_type") or "",
                          "JA" if bool(host.get("ansible_access")) else "NEIN",
                      ]
                      direct = as_dict(host.get("pruefungen"))
                      indirect = as_dict(host.get("informationen"))
                      is_os_client = host.get("validation_scope") == "OS_CLIENT_SOLLSWERTPRUEFUNG"
                      for task_id in matrix_ids:
                          if not is_os_client:
                              row.append("")
                              continue
                          if task_id in direct:
                              row.append(as_dict(direct[task_id]).get("status") or "NOK")
                          elif task_id in indirect:
                              row.append(matrix_information_value(indirect[task_id]))
                          else:
                              row.append("")
                      writer.writerow(row)
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(str(tmp), str(csv_path))

          def main():
              args = args_parse()
              library_path = Path(args.library)
              config_path = Path(args.config)
              output_path = Path(args.json_output)
              csv_path = Path(args.csv_output)

              with library_path.open("r", encoding="utf-8-sig") as handle:
                  library = json.load(handle)
              with config_path.open("r", encoding="utf-8-sig") as handle:
                  expected = json.load(handle)

              if library.get("library_type") != "IPC_Information_Library":
                  raise RuntimeError("Unerwarteter Bibliothekstyp; erwartet IPC_Information_Library.")
              hosts = library.get("hosts")
              if not isinstance(hosts, dict):
                  raise RuntimeError("0150-Informationsbibliothek enthaelt kein gueltiges hosts-Objekt.")

              output_hosts = {}
              total_ok = 0
              total_nok = 0
              total_information = 0
              os_client_total = 0
              ungrouped_total = 0

              for ip in sorted(hosts, key=ip_sort_key):
                  host = hosts[ip]
                  if not isinstance(host, dict):
                      continue
                  classification = text(host.get("classification")).strip()
                  # 0150 fuehrt nicht erreichbare/ungegroupte IPs als Kein_Zugriff.
                  include = classification in {"OS_Client", "Kein_Zugriff"} or not classification
                  if not include:
                      continue

                  access = as_dict(host.get("zugriff"))
                  ansible_access = bool(access.get("ansible_access"))
                  computer_type = "OS Client" if classification == "OS_Client" else "Nicht gruppiert"
                  entry = {
                      "ip_address": ip,
                      "computer_name": host.get("computer_name"),
                      "computer_type": computer_type,
                      "classification_raw": classification or None,
                      "ansible_access": ansible_access,
                      "ansible_access_status": access.get("status"),
                      "ansible_access_error_code": access.get("error_code"),
                      "ansible_access_error_reason": access.get("error_reason"),
                  }

                  if classification == "OS_Client":
                      os_client_total += 1
                      checks, information = evaluate_os_client(host, expected)
                      ok_count = sum(1 for item in checks.values() if item.get("status") == "OK")
                      nok_count = sum(1 for item in checks.values() if item.get("status") == "NOK")
                      total_ok += ok_count
                      total_nok += nok_count
                      total_information += len(information)
                      entry["validation_scope"] = "OS_CLIENT_SOLLSWERTPRUEFUNG"
                      entry["summary"] = {
                          "evaluated": len(checks),
                          "ok": ok_count,
                          "nok": nok_count,
                          "information": len(information),
                      }
                      entry["pruefungen"] = checks
                      entry["informationen"] = information
                  else:
                      ungrouped_total += 1
                      entry["validation_scope"] = "NICHT_GRUPPIERT_KEIN_ZUGRIFF"
                      entry["summary"] = {"evaluated": 0, "ok": 0, "nok": 0, "information": 0}
                      entry["pruefungen"] = {}
                      entry["informationen"] = {}

                  output_hosts[ip] = entry

              evaluated_ids = sorted({
                  task_id
                  for host in output_hosts.values()
                  for task_id in as_dict(host.get("pruefungen")).keys()
              }, key=id_sort_key)
              information_ids = sorted({
                  task_id
                  for host in output_hosts.values()
                  for task_id in as_dict(host.get("informationen")).keys()
              }, key=id_sort_key)

              output = {
                  "schema_version": "1.0",
                  "validation_type": "IPC_OS_Client_ID_Validation",
                  "generated_at_utc": datetime.now(timezone.utc).isoformat(),
                  "scope": {
                      "evaluated_computer_type": "OS_Client",
                      "included_non_grouped": True,
                      "included_classifications": ["OS_Client", "Kein_Zugriff"],
                      "es_and_os_server_checks": "IGNORED",
                      "explicitly_ignored_ids": EXPLICITLY_IGNORED_IDS,
                      "role_excluded_ids": ROLE_EXCLUDED_IDS,
                      "not_directly_available_ids": NOT_DIRECTLY_AVAILABLE_IDS,
                      "live_direct_ids": LIVE_DIRECT_IDS,
                      "live_information_ids": LIVE_INFORMATION_IDS,
                      "rule": (
                          "Direkte OK/NOK-Pruefungen werden nur fuer OS_Client erzeugt. "
                          "Nicht gruppierte/Kein-Zugriff-IP-Adressen bleiben sichtbar, erhalten aber keine erfundente Bewertung."
                      ),
                  },
                  "sources": {
                      "information_library": str(library_path),
                      "upstream": [
                          "0000IPC_Discovery_Classification",
                          "0130IPC_OS_Client_Initial_Installation",
                          "0150IPC_Information_Library",
                      ],
                  },
                  "evaluated_ids": evaluated_ids,
                  "indirect_information_ids": information_ids,
                  "summary": {
                      "ip_addresses_total": len(output_hosts),
                      "os_client_total": os_client_total,
                      "non_grouped_total": ungrouped_total,
                      "checks_ok_total": total_ok,
                      "checks_nok_total": total_nok,
                      "information_total": total_information,
                  },
                  "hosts": output_hosts,
              }

              output_path.parent.mkdir(parents=True, exist_ok=True)
              tmp = output_path.with_name(output_path.name + ".tmp")
              with tmp.open("w", encoding="utf-8", newline="\n") as handle:
                  json.dump(output, handle, ensure_ascii=False, indent=2)
                  handle.write("\n")
                  handle.flush()
                  os.fsync(handle.fileno())
              os.replace(str(tmp), str(output_path))
              write_csv(output, csv_path)

              print(json.dumps({
                  "output_file": str(output_path),
                  "csv_file": str(csv_path),
                  "summary": output["summary"],
                  "evaluated_ids": evaluated_ids,
                  "indirect_information_ids": information_ids,
              }, ensure_ascii=False))

          if __name__ == "__main__":
              main()

    - name: 0180 JSON- und CSV-Basis aus 0150 erzeugen
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ id_validation_python_file }}"
          - "--library"
          - "{{ id_validation_library_file }}"
          - "--config"
          - "{{ id_validation_config_file }}"
          - "--json-output"
          - "{{ id_validation_output_file }}"
          - "--csv-output"
          - "{{ id_validation_csv_file }}"
      register: id_validation_build
      changed_when: true

    - name: 0180-Basisdateien pruefen
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ id_validation_output_file }}"
        - "{{ id_validation_csv_file }}"
      register: id_validation_output_stats

    - name: Abbrechen wenn 0180-Basisdatei fehlt
      ansible.builtin.fail:
        msg: >-
          0180 konnte nicht alle Ausgabedateien erzeugen.
          Generator: {{ id_validation_build.stdout | default('') }}
      when: id_validation_output_stats.results | selectattr('stat.exists', 'equalto', false) | list | length > 0

    - name: Temporaeren 0180-Auswerter entfernen
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ id_validation_python_file }}"
        - "{{ id_validation_config_file }}"


- name: "0180 IPC OS Client - Direkte Read-only PowerShell-Pruefungen"
  hosts: ipc_os_client_0180_live_targets
  gather_facts: false
  become: false
  any_errors_fatal: false

  vars:
    live_expected_allowed_ciphers: "{{ expected_allowed_tls12_cipher_suites }}"
    live_expected_disabled_ciphers: "{{ expected_disabled_cipher_suites }}"
    live_expected_project_folder: "{{ expected_project_folder | default('D:\\Projekt') }}"

  tasks:
    - name: WinRM-Verbindung fuer direkte 0180-Pruefungen testen
      ansible.windows.win_ping:
      register: id_validation_live_ping
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Direkte 0180-PowerShell-Pruefungen ausfuehren
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'

        function New-Check {
            param(
                [Parameter(Mandatory=$true)][string]$Name,
                [Parameter(Mandatory=$true)][bool]$Ok,
                [Parameter(Mandatory=$true)]$Soll,
                [Parameter(Mandatory=$false)]$Ist,
                [Parameter(Mandatory=$true)][string]$Quelle,
                [Parameter(Mandatory=$true)][string]$Sollwertquelle
            )
            [pscustomobject][ordered]@{
                status = if ($Ok) { 'OK' } else { 'NOK' }
                aufgabe = $Name
                soll = $Soll
                ist = $Ist
                quelle = $Quelle
                sollwertquelle = $Sollwertquelle
            }
        }

        function New-Information {
            param(
                [Parameter(Mandatory=$true)][string]$Name,
                [Parameter(Mandatory=$false)]$Information,
                [Parameter(Mandatory=$true)][string]$Quelle,
                [Parameter(Mandatory=$true)][string]$Hinweis
            )
            $hasInformation = $null -ne $Information
            [pscustomobject][ordered]@{
                pruefart = 'INDIREKT'
                status = if ($hasInformation) { 'INFORMATION' } else { 'KEINE_INFORMATION' }
                manuelle_bewertung_erforderlich = $true
                aufgabe = $Name
                information = $Information
                quelle = $Quelle
                hinweis = $Hinweis
            }
        }

        $checks = [ordered]@{}
        $information = [ordered]@{}

        # IPC0028 - LocalAccountTokenFilterPolicy = 1.
        $tokenFilterPath = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        $tokenFilterValue = $null
        if (Test-Path -LiteralPath $tokenFilterPath) {
            $tokenFilterValue = (Get-ItemProperty -LiteralPath $tokenFilterPath -Name 'LocalAccountTokenFilterPolicy' -ErrorAction SilentlyContinue).LocalAccountTokenFilterPolicy
        }
        $checks['IPC0028'] = New-Check `
            -Name 'Registry Eintrag für VEEAM setzen' `
            -Ok ([int]$tokenFilterValue -eq 1) `
            -Soll @{ LocalAccountTokenFilterPolicy=1 } `
            -Ist @{ Path=$tokenFilterPath; LocalAccountTokenFilterPolicy=$tokenFilterValue } `
            -Quelle 'Direkt/PowerShell/HKLM Policies System' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0047 - klassische Eingabesprachen-Hotkeys auf "Nicht zugewiesen".
        $togglePath = 'HKCU:\Keyboard Layout\Toggle'
        $toggleExists = Test-Path -LiteralPath $togglePath
        $toggle = if ($toggleExists) { Get-ItemProperty -LiteralPath $togglePath -ErrorAction Stop } else { $null }
        $toggleState = [ordered]@{
            RegistryPath = $togglePath
            RegistryExists = $toggleExists
            RunAsUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            Hotkey = if ($toggle) { [string]$toggle.Hotkey } else { $null }
            LanguageHotkey = if ($toggle) { [string]$toggle.'Language Hotkey' } else { $null }
            LayoutHotkey = if ($toggle) { [string]$toggle.'Layout Hotkey' } else { $null }
        }
        $checks['IPC0047'] = New-Check `
            -Name 'Tastenkombination für Eingabesprachen deaktivieren' `
            -Ok ($toggleExists -and $toggleState.Hotkey -eq '3' -and $toggleState.LanguageHotkey -eq '3' -and $toggleState.LayoutHotkey -eq '3') `
            -Soll @{ Hotkey='3'; LanguageHotkey='3'; LayoutHotkey='3'; Bedeutung='Nicht zugewiesen' } `
            -Ist $toggleState `
            -Quelle 'Direkt/PowerShell/HKCU Keyboard Layout Toggle' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0073 - D:\Images muss geloescht sein.
        $imagesPath = 'D:\Images'
        $imagesExists = Test-Path -LiteralPath $imagesPath
        $checks['IPC0073'] = New-Check `
            -Name 'Restore Image löschen' `
            -Ok (-not $imagesExists) `
            -Soll @{ Path=$imagesPath; Exists=$false } `
            -Ist @{ Path=$imagesPath; Exists=$imagesExists } `
            -Quelle 'Direkt/PowerShell/Test-Path' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0076 - explizit zu loeschende Verknuepfungen duerfen nicht existieren.
        $desktopDirs = @(
            [Environment]::GetFolderPath('CommonDesktopDirectory'),
            [Environment]::GetFolderPath('DesktopDirectory')
        ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique
        $forbiddenNames = @('Create Restore USB','File Explorer','Internet Explorer')
        $foundForbidden = @()
        foreach ($desktopDir in $desktopDirs) {
            if (-not (Test-Path -LiteralPath $desktopDir -PathType Container)) { continue }
            $foundForbidden += @(Get-ChildItem -LiteralPath $desktopDir -File -Force -ErrorAction SilentlyContinue | Where-Object { $forbiddenNames -contains $_.BaseName } | Select-Object Name, BaseName, FullName)
        }
        $checks['IPC0076'] = New-Check `
            -Name 'Desktop-Verknüpfungen bereinigen' `
            -Ok (@($foundForbidden).Count -eq 0) `
            -Soll @{ AbsentShortcuts=$forbiddenNames } `
            -Ist @{ CheckedDesktopDirectories=@($desktopDirs); FoundForbiddenShortcuts=@($foundForbidden) } `
            -Quelle 'Direkt/PowerShell/Desktop und CommonDesktop' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0077 - Edge-Verknuepfung: Dateizustand ist direkt lesbar, die
        # konkrete REG-Datei/Policy wird ohne bekanntes Schema nur als Evidenz ausgegeben.
        $edgeShortcuts = @()
        foreach ($desktopDir in $desktopDirs) {
            if (-not (Test-Path -LiteralPath $desktopDir -PathType Container)) { continue }
            $edgeShortcuts += @(Get-ChildItem -LiteralPath $desktopDir -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.BaseName -match '(?i)Microsoft\s*Edge|^Edge$' } | Select-Object Name, BaseName, FullName)
        }
        $information['IPC0077'] = New-Information `
            -Name 'Microsoft Edge Verknüpfung löschen' `
            -Information @{ EdgeShortcuts=@($edgeShortcuts); ShortcutAbsent=(@($edgeShortcuts).Count -eq 0) } `
            -Quelle 'Direkt/PowerShell/Desktop und CommonDesktop' `
            -Hinweis 'Verknuepfungszustand wird direkt ausgegeben; der genaue Registry-Wert der verwendeten REG-Datei ist nicht vorgegeben.'

        # IPC0089 - Bootliste aus + AutoReboot an. Die 5-s-Recovery-Anzeige
        # bleibt Zusatzinformation, da kein stabiler eindeutiger Registry-Key vorgegeben ist.
        $recovery = Get-CimInstance -ClassName Win32_OSRecoveryConfiguration -ErrorAction Stop
        $bcdRaw = (& bcdedit.exe /enum '{bootmgr}' 2>&1 | Out-String).Trim()
        $bootTimeout = $null
        $timeoutMatch = [regex]::Match($bcdRaw, '(?im)^\s*(?:timeout|zeitlimit)\s+(\d+)\s*$')
        if ($timeoutMatch.Success) { $bootTimeout = [int]$timeoutMatch.Groups[1].Value }
        $displayBootMenu = $null
        $displayMatch = [regex]::Match($bcdRaw, '(?im)^\s*displaybootmenu\s+(Yes|No|Ja|Nein)\s*$')
        if ($displayMatch.Success) { $displayBootMenu = $displayMatch.Groups[1].Value }
        $bootListDisabled = ($bootTimeout -eq 0 -or $displayBootMenu -in @('No','Nein'))
        $autoReboot = [bool]$recovery.AutoReboot
        $checks['IPC0089'] = New-Check `
            -Name 'Starten und Wiederherstellen anpassen' `
            -Ok ($bootListDisabled -and $autoReboot) `
            -Soll @{ OperatingSystemListDisplayed=$false; AutoReboot=$true; RecoveryOptionsDisplaySeconds=5; RecoveryOptionsDisplaySecondsEvaluation='INFORMATION_ONLY' } `
            -Ist @{ BootManagerTimeoutSeconds=$bootTimeout; DisplayBootMenu=$displayBootMenu; OperatingSystemListDisabled=$bootListDisabled; AutoReboot=$autoReboot; BcdBootManagerRaw=$bcdRaw } `
            -Quelle 'Direkt/PowerShell/bcdedit + Win32_OSRecoveryConfiguration' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0160 / IPC0161 - tatsaechlich aktive Cipher Suites direkt lesen.
        $activeCipherNames = @()
        if (Get-Command Get-TlsCipherSuite -ErrorAction SilentlyContinue) {
            $activeCipherNames = @(Get-TlsCipherSuite -ErrorAction Stop | ForEach-Object { [string]$_.Name } | Where-Object { $_ } | Select-Object -Unique)
        }
        $requiredCiphers = @('{{ live_expected_allowed_ciphers | to_json }}' | ConvertFrom-Json)
        $disabledCiphers = @('{{ live_expected_disabled_ciphers | to_json }}' | ConvertFrom-Json)
        $missingRequired = @($requiredCiphers | Where-Object { $_ -notin $activeCipherNames })
        $stillEnabledForbidden = @($disabledCiphers | Where-Object { $_ -in $activeCipherNames })
        $checks['IPC0160'] = New-Check `
            -Name 'Verwendung von sicheren Cipher Suites' `
            -Ok ($requiredCiphers.Count -gt 0 -and $missingRequired.Count -eq 0) `
            -Soll @{ RequiredActive=$requiredCiphers } `
            -Ist @{ ActiveCipherSuites=$activeCipherNames; MissingRequired=$missingRequired } `
            -Quelle 'Direkt/PowerShell/Get-TlsCipherSuite' `
            -Sollwertquelle 'Semaphore: expected_allowed_tls12_cipher_suites'
        $checks['IPC0161'] = New-Check `
            -Name 'Unsichere/nicht freigegebene Cipher Suites deaktivieren' `
            -Ok ($disabledCiphers.Count -gt 0 -and $stillEnabledForbidden.Count -eq 0) `
            -Soll @{ RequiredDisabled=$disabledCiphers } `
            -Ist @{ ActiveCipherSuites=$activeCipherNames; StillEnabledForbidden=$stillEnabledForbidden } `
            -Quelle 'Direkt/PowerShell/Get-TlsCipherSuite' `
            -Sollwertquelle 'Semaphore: expected_disabled_cipher_suites'

        # IPC0167 - Projektordner direkt pruefen.
        $projectPath = '{{ live_expected_project_folder }}'
        $projectExists = Test-Path -LiteralPath $projectPath -PathType Container
        $checks['IPC0167'] = New-Check `
            -Name 'Projektordner anlegen' `
            -Ok $projectExists `
            -Soll @{ Path=$projectPath; Exists=$true } `
            -Ist @{ Path=$projectPath; Exists=$projectExists } `
            -Quelle 'Direkt/PowerShell/Test-Path' `
            -Sollwertquelle 'Semaphore: expected_project_folder'

        # IPC0200 - WSUSClientManager-Verzeichnis.
        $wsusClientPath = 'C:\Programme\WSUSClientManager'
        $wsusClientExists = Test-Path -LiteralPath $wsusClientPath -PathType Container
        $checks['IPC0200'] = New-Check `
            -Name 'WSUSClientManager ablegen' `
            -Ok $wsusClientExists `
            -Soll @{ Path=$wsusClientPath; Exists=$true } `
            -Ist @{ Path=$wsusClientPath; Exists=$wsusClientExists } `
            -Quelle 'Direkt/PowerShell/Test-Path' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0236 - Windows Autologin fuer WinCC_RT.
        # Das Passwort wird bewusst weder gelesen noch ausgegeben.
        $winlogonPath = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Winlogon'
        $winlogon = if (Test-Path -LiteralPath $winlogonPath) {
            Get-ItemProperty -LiteralPath $winlogonPath -ErrorAction Stop
        } else {
            $null
        }
        $autoLogonState = [ordered]@{
            RegistryPath = $winlogonPath
            AutoAdminLogon = if ($winlogon) { [string]$winlogon.AutoAdminLogon } else { $null }
            DefaultUserName = if ($winlogon) { [string]$winlogon.DefaultUserName } else { $null }
            DefaultDomainName = if ($winlogon) { [string]$winlogon.DefaultDomainName } else { $null }
            PasswordRead = $false
        }
        $autoLogonOk = (
            $autoLogonState.AutoAdminLogon -eq '1' -and
            $autoLogonState.DefaultUserName -eq 'WinCC_RT'
        )
        $checks['IPC0236'] = New-Check `
            -Name 'Windows Autologin konfigurieren' `
            -Ok $autoLogonOk `
            -Soll @{ AutoAdminLogon='1'; DefaultUserName='WinCC_RT' } `
            -Ist $autoLogonState `
            -Quelle 'Direkt/PowerShell/HKLM Winlogon' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0241 - derselbe sichere Autologon-Zustand als Information fuer
        # die spaetere Runtime-Kontrolle; ein echter GUI-Logontest wird nicht simuliert.
        $information['IPC0241'] = New-Information `
            -Name 'Kontrolle Runtime - Standardbenutzer meldet sich automatisch an' `
            -Information $autoLogonState `
            -Quelle 'Direkt/PowerShell/HKLM Winlogon' `
            -Hinweis 'Autologon-Konfiguration wird ausgegeben; erfolgreicher SIMATIC-Logon-/Runtime-Funktionstest ist damit nicht bewiesen.'

        # IPC0252 - UltraVNC Viewer muss als Binary vorhanden sein.
        $viewerCandidates = @(
            'C:\Program Files\uvnc bvba\UltraVNC\vncviewer.exe',
            'C:\Program Files\UltraVNC\vncviewer.exe',
            'C:\Program Files (x86)\uvnc bvba\UltraVNC\vncviewer.exe',
            'C:\Program Files (x86)\UltraVNC\vncviewer.exe'
        )
        $viewerFound = @(
            $viewerCandidates |
                Where-Object { Test-Path -LiteralPath $_ -PathType Leaf } |
                ForEach-Object {
                    $item = Get-Item -LiteralPath $_ -ErrorAction SilentlyContinue
                    [pscustomobject][ordered]@{
                        Path = $_
                        FileVersion = if ($item) { $item.VersionInfo.FileVersion } else { $null }
                        ProductVersion = if ($item) { $item.VersionInfo.ProductVersion } else { $null }
                    }
                }
        )
        $checks['IPC0252'] = New-Check `
            -Name 'UltraVNC-Viewer nachinstallieren' `
            -Ok (@($viewerFound).Count -gt 0) `
            -Soll @{ VncViewerBinaryPresent=$true } `
            -Ist @{ Candidates=$viewerCandidates; Found=@($viewerFound) } `
            -Quelle 'Direkt/PowerShell/Test-Path vncviewer.exe' `
            -Sollwertquelle 'Aufgabenliste'

        [pscustomobject][ordered]@{
            checks = [pscustomobject]$checks
            informationen = [pscustomobject]$information
        } | ConvertTo-Json -Depth 20 -Compress
      register: id_validation_live_raw
      when: id_validation_live_ping.ping | default('') == 'pong'
      changed_when: false
      failed_when: false

    - name: Direkte 0180-Ergebnisse uebernehmen
      ansible.builtin.set_fact:
        id_validation_live_result: >-
          {{ id_validation_live_raw.stdout | trim | from_json }}
      when:
        - id_validation_live_ping.ping | default('') == 'pong'
        - id_validation_live_raw.rc | default(1) == 0
        - id_validation_live_raw.stdout | default('') | trim | length > 0

    - name: Nicht ausfuehrbare Live-Pruefungen als Information dokumentieren
      ansible.builtin.set_fact:
        id_validation_live_result:
          checks: {}
          informationen:
            IPC0028:
              pruefart: INDIREKT
              status: KEINE_INFORMATION
              manuelle_bewertung_erforderlich: true
              aufgabe: "Registry Eintrag für VEEAM setzen"
              information: null
              quelle: "0180 Live-WinRM"
              hinweis: "LocalAccountTokenFilterPolicy konnte aktuell nicht direkt gelesen werden."
            IPC0047:
