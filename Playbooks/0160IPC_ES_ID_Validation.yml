---
- name: "0160 IPC ES - ID-Pruefung aus Informationsbibliothek"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    # 0150 erzeugt diese IP-zentrierte Informationsbibliothek.
    ipc_es_validation_library_file: >-
      {{
        ipc_information_library_file
        | default(result_dir ~ '/ipc_information_library_latest.json')
      }}

    # Stabile Ausgabedateien fuer die ES-Pruefmatrix.
    ipc_es_validation_output_file: >-
      {{
        ipc_es_id_validation_file
        | default(result_dir ~ '/ipc_es_id_validation_latest.json')
      }}

    ipc_es_validation_csv_file: >-
      {{
        ipc_es_id_validation_csv_file
        | default(result_dir ~ '/ipc_es_id_validation_matrix_latest.csv')
      }}

    # Discovery-Datei wird nur fuer die wenigen Live-Sollwertpruefungen genutzt,
    # deren Endzustand in den 0110-Snapshots nicht vollstaendig enthalten ist.
    ipc_es_validation_discovery_file: >-
      {{
        ipc_discovery_file
        | default(result_dir ~ '/ipc_discovery_groups_latest.json')
      }}

  tasks:
    - name: Benoetigte Semaphore-Variablen fuer 0160 pruefen
      ansible.builtin.assert:
        that:
          - result_dir is defined
          - result_dir | string | length > 0
          - win_user is defined
          - win_user | string | length > 0
          - win_password is defined
          - win_password | string | length > 0
          - winrm_transport is defined
          - winrm_transport | string | length > 0
          - ipc_es_validation_expected is defined
          - ipc_es_validation_expected is mapping
          - ipc_es_validation_expected.language is defined
          - ipc_es_validation_expected.language.tag is defined
          - ipc_es_validation_expected.region is defined
          - ipc_es_validation_expected.region.iso is defined
          - ipc_es_validation_expected.keyboard is defined
          - ipc_es_validation_expected.keyboard.allowed_layout_ids is defined
          - ipc_es_validation_expected.keyboard.allowed_layout_ids | length > 0
          - ipc_es_validation_expected.keyboard.exact_layout_count is defined
          - ipc_es_validation_expected.chipset is defined
          - ipc_es_validation_expected.chipset.regex is defined
          - ipc_es_validation_expected.ultravnc is defined
          - ipc_es_validation_expected.ultravnc.required is defined
          - ipc_es_validation_expected.ultravnc.name_regex is defined
          - ipc_es_validation_expected.ultravnc.version_regex is defined
          - ipc_es_validation_expected.vnc_firewall is defined
          - ipc_es_validation_expected.vnc_firewall.rules is defined
          - ipc_es_validation_expected.vnc_firewall.rules | length > 0
          - ipc_es_validation_expected.local_account_token_filter_policy is defined
          - ipc_es_validation_expected.builtin_admin is defined
          - ipc_es_validation_expected.builtin_admin.password_expires is defined
          - ipc_es_validation_expected.network is defined
          - ipc_es_validation_expected.network is mapping
          - ipc_es_validation_expected.network.adapter_policy is defined
          - ipc_es_validation_expected.network.adapter_policy.allowed_names is defined
          - ipc_es_validation_expected.network.adapter_policy.allowed_names | length > 0
          - ipc_es_validation_expected.network.adapter_policy.max_enabled_physical_adapters is defined
          - ipc_es_validation_expected.network.terminalbus is defined
          - ipc_es_validation_expected.network.terminalbus.name_regex is defined
          - ipc_es_validation_expected.network.terminalbus.gateway is defined
          - ipc_es_validation_expected.network.terminalbus.dns_servers is defined
          - ipc_es_validation_expected.network.terminalbus.dns_servers is iterable
          - ipc_es_validation_expected.network.terminalbus.wins_servers is defined
          - ipc_es_validation_expected.network.terminalbus.wins_servers is iterable
          - ipc_es_validation_expected.network.anlagenbus is defined
          - ipc_es_validation_expected.network.anlagenbus.name_regex is defined
          - ipc_es_validation_expected.network.redundanzbus is defined
          - ipc_es_validation_expected.network.redundanzbus.name_regex is defined
          - ipc_es_validation_expected.domain is defined
          - ipc_es_validation_expected.domain.name is defined
          - ipc_es_validation_expected.domain.name | string | length > 0
          - ipc_es_validation_expected.storage is defined
          - ipc_es_validation_expected.storage.system_drive is defined
          - ipc_es_validation_expected.storage.system_drive.minimum_size_gb is defined
          - ipc_es_validation_expected.storage.data_drive is defined
          - ipc_es_validation_expected.storage.data_drive.expected_size_gb_by_type is defined
          - ipc_es_validation_expected.storage.data_drive.expected_size_gb_by_type.ES is defined
          - ipc_es_validation_expected.storage.data_drive.tolerance_gb is defined
          - ipc_es_validation_expected.software is defined
          - ipc_es_validation_expected.software.hup is defined
          - ipc_es_validation_expected.software.hup.expected_name_regexes is defined
          - ipc_es_validation_expected.software.hup.expected_name_regexes is iterable
        fail_msg: >-
          Fuer 0160 fehlt der strukturierte Semaphore-Block
          ipc_es_validation_expected oder darin benoetigte Sollwerte.

    - name: Informationsbibliothek von 0150 pruefen
      ansible.builtin.stat:
        path: "{{ ipc_es_validation_library_file }}"
      register: ipc_es_validation_library_stat

    - name: Abbrechen wenn Informationsbibliothek fehlt
      ansible.builtin.fail:
        msg: >-
          {{ ipc_es_validation_library_file }} wurde nicht gefunden.
          Fuehre zuerst 0000, danach 0110 und anschliessend 0150 aus.
      when: not (ipc_es_validation_library_stat.stat.exists | default(false))

    - name: Ausgabeordner fuer 0160 anlegen
      ansible.builtin.file:
        path: "{{ ipc_es_validation_output_file | dirname }}"
        state: directory
        mode: "0755"

    # ------------------------------------------------------------------
    # Direkte Read-only-Pruefungen fuer Endzustaende, die in den
    # 0110-Snapshots nicht vollstaendig enthalten sind (u. a. Sprach-Hotkeys,
    # NetBT-WINS, Netzwerkfreigabe, UltraVNC-Konfiguration und Desktop).
    # 0000, 0110 und 0150 bleiben dabei unveraendert.
    # ------------------------------------------------------------------
    - name: Discovery-Datei fuer direkte 0160-Pruefungen pruefen
      ansible.builtin.stat:
        path: "{{ ipc_es_validation_discovery_file }}"
      register: ipc_es_validation_discovery_stat

    - name: Abbrechen wenn Discovery-Datei fuer direkte Pruefungen fehlt
      ansible.builtin.fail:
        msg: >-
          {{ ipc_es_validation_discovery_file }} wurde nicht gefunden.
          Fuehre zuerst 0000IPC_Discovery_Classification.yml aus.
      when: not (ipc_es_validation_discovery_stat.stat.exists | default(false))

    - name: Discovery-Datei fuer direkte 0160-Pruefungen einlesen
      ansible.builtin.slurp:
        src: "{{ ipc_es_validation_discovery_file }}"
      register: ipc_es_validation_discovery_raw

    - name: Discovery-Daten fuer direkte 0160-Pruefungen speichern
      ansible.builtin.set_fact:
        ipc_es_validation_discovery_data: >-
          {{ ipc_es_validation_discovery_raw.content | b64decode | from_json }}

    - name: ES-Gruppe in Discovery-Datei pruefen
      ansible.builtin.assert:
        that:
          - ipc_es_validation_discovery_data.groups is defined
          - ipc_es_validation_discovery_data.groups.ipc_es is defined
          - ipc_es_validation_discovery_data.groups.ipc_es is iterable
        fail_msg: >-
          In {{ ipc_es_validation_discovery_file }} wurde groups.ipc_es nicht gefunden.

    - name: ES-Ziele fuer direkte Read-only-Pruefungen dynamisch anlegen
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: ipc_es_0160_live_targets
        ansible_host: "{{ item.ip }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.winrm_port | default(winrm_default_port | default(5985)) | int }}"
        ansible_winrm_scheme: "{{ item.winrm_scheme | default('http') }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(180) }}"
      loop: "{{ ipc_es_validation_discovery_data.groups.ipc_es | default([]) }}"
      loop_control:
        label: "{{ item.ip }}"
      no_log: true

    - name: Alte direkte 0160-Zwischenergebnisse entfernen
      ansible.builtin.file:
        path: "{{ result_dir }}/.0160_live"
        state: absent

    - name: Verzeichnis fuer direkte 0160-Ergebnisse vorbereiten
      ansible.builtin.file:
        path: "{{ result_dir }}/.0160_live"
        state: directory
        mode: "0755"

    - name: Erste IPC-ES-IDs aus Informationsbibliothek pruefen
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import csv
        import ipaddress
        import json
        import os
        import re
        from datetime import datetime, timezone
        from pathlib import Path

        library_path = Path({{ ipc_es_validation_library_file | to_json }})
        output_path = Path({{ ipc_es_validation_output_file | to_json }})
        csv_path = Path({{ ipc_es_validation_csv_file | to_json }})
        expected = json.loads({{ ipc_es_validation_expected | to_json | to_json }})

        TASK_IDS = [
            "IPC0007",
            "IPC0008",
            "IPC0009",
            "IPC0013",
            "IPC0015",
            "IPC0019",
            "IPC0024",
            "IPC0025",
            "IPC0026",
            "IPC0027",
            "IPC0028",
            "IPC0036",
            "IPC0038",
            "IPC0043",
            "IPC0044",
            "IPC0045",
            "IPC0046",
            "IPC0047",
            "IPC0048",
            "IPC0049",
            "IPC0050",
            "IPC0051",
            "IPC0052",
            "IPC0053",
            "IPC0054",
            "IPC0055",
            "IPC0056",
            "IPC0059",
            "IPC0060",
            "IPC0063",
            "IPC0065",
            "IPC0066",
            "IPC0070",
            "IPC0072",
            "IPC0073",
            "IPC0074",
            "IPC0075",
            "IPC0076",
            "IPC0078",
            "IPC0079",
            "IPC0080",
            "IPC0081",
            "IPC0082",
        ]

        def as_dict(value):
            return value if isinstance(value, dict) else {}

        def as_list(value):
            if value is None:
                return []
            return value if isinstance(value, list) else [value]

        def text(value):
            return "" if value is None else str(value)

        def ip_sort_key(value):
            try:
                return (0, int(ipaddress.ip_address(str(value))))
            except ValueError:
                return (1, str(value))

        def section(host, area, validation_type, section_name):
            return (
                as_dict(
                    as_dict(
                        as_dict(host.get("bereiche")).get(area)
                    ).get(validation_type)
                ).get(section_name)
            )

        def make_check(task_id, task_name, state, soll, ist, source, note=None):
            if state is True:
                status = "OK"
            elif state is False:
                status = "NOK"
            else:
                status = "NICHT_PRUEFBAR"

            result = {
                "id": task_id,
                "aufgabe": task_name,
                "pruefart": "SOLLWERT",
                "status": status,
                "soll": soll,
                "ist": ist,
                "quelle": source,
            }
            if note:
                result["hinweis"] = note
            return result

        def make_information(task_id, task_name, value, source, note=None):
            result = {
                "id": task_id,
                "aufgabe": task_name,
                "pruefart": "INFORMATION",
                "status": "INFORMATION" if value is not None else "NICHT_PRUEFBAR",
                "ist": value,
                "quelle": source,
            }
            if note:
                result["hinweis"] = note
            return result

        def make_ignored(task_id, task_name, reason, source=None):
            return {
                "id": task_id,
                "aufgabe": task_name,
                "pruefart": "IGNORIERT",
                "status": "IGNORIERT",
                "soll": None,
                "ist": None,
                "quelle": source or "0160-Prueflogik",
                "hinweis": reason,
            }

        def bool_value(value):
            if isinstance(value, bool):
                return value
            if isinstance(value, (int, float)):
                return value != 0
            normalized = text(value).strip().lower()
            if normalized in {"true", "1", "yes", "enabled", "enable", "on"}:
                return True
            if normalized in {"false", "0", "no", "disabled", "disable", "off"}:
                return False
            return None

        def int_value(value):
            if isinstance(value, bool):
                return int(value)
            if isinstance(value, int):
                return value
            try:
                return int(str(value).strip(), 0)
            except Exception:
                try:
                    return int(float(str(value).strip()))
                except Exception:
                    return None

        def regex_match(pattern, value):
            try:
                return re.search(str(pattern), text(value), re.IGNORECASE) is not None
            except re.error:
                return False

        def locale_equal(actual, wanted):
            return text(actual).strip().lower() == text(wanted).strip().lower()

        def normalize_keyboard_layout(value):
            raw = text(value).strip().lower()
            if raw.startswith("0x"):
                raw = raw[2:]
            raw = raw.lstrip("0")
            return raw or "0"

        def software_products(installed_software):
            return [
                item
                for item in as_list(as_dict(installed_software).get("AllProducts"))
                if isinstance(item, dict)
            ]

        def find_products(products, name_regex, version_regex=None):
            matches = []
            for product in products:
                if not regex_match(name_regex, product.get("DisplayName")):
                    continue
                if version_regex and not regex_match(version_regex, product.get("DisplayVersion")):
                    continue
                matches.append({
                    "DisplayName": product.get("DisplayName"),
                    "DisplayVersion": product.get("DisplayVersion"),
                    "Publisher": product.get("Publisher"),
                    "Architecture": product.get("Architecture"),
                    "RegistrySource": product.get("RegistrySource"),
                })
            return matches

        def service_records(service_snapshot):
            if not isinstance(service_snapshot, dict):
                return []
            return [
                item
                for item in as_list(service_snapshot.get("Services"))
                if isinstance(item, dict)
            ]

        def find_services(services, pattern):
            matches = []
            for service in services:
                searchable = " ".join([
                    text(service.get("Name")),
                    text(service.get("DisplayName")),
                    text(service.get("PathName")),
                ])
                if not regex_match(pattern, searchable):
                    continue
                binary = as_dict(service.get("Binary"))
                matches.append({
                    "Name": service.get("Name"),
                    "DisplayName": service.get("DisplayName"),
                    "State": service.get("State"),
                    "StartMode": service.get("StartMode"),
                    "PathName": service.get("PathName"),
                    "BinaryFileVersion": binary.get("FileVersion"),
                    "BinaryProductVersion": binary.get("ProductVersion"),
                })
            return matches

        def profile_is_all(value):
            normalized = text(value).strip().lower()
            if normalized in {"any", "all", "alle", "all profiles", "alle profile"}:
                return True

            tokens = {
                token.strip()
                for token in re.split(r"[,;|+]", normalized)
                if token.strip()
            }
            return {"domain", "private", "public"}.issubset(tokens)

        def firewall_rule_has_port(rule, expected_port):
            expected_port = text(expected_port).strip()
            if not expected_port:
                return True

            for port_filter in as_list(rule.get("PortFilters")):
                if not isinstance(port_filter, dict):
                    continue
                for local_port in as_list(port_filter.get("LocalPort")):
                    if text(local_port).strip() == expected_port:
                        return True
            return False

        def registry_values(registry_snapshot):
            if isinstance(registry_snapshot, dict):
                return [
                    row
                    for row in as_list(registry_snapshot.get("Values"))
                    if isinstance(row, dict)
                ]
            return [
                row
                for row in as_list(registry_snapshot)
                if isinstance(row, dict)
            ]

        def compact_users(users):
            parts = []
            for user in as_list(users):
                if not isinstance(user, dict):
                    continue
                groups = ",".join(text(x) for x in as_list(user.get("LocalGroups")) if text(x))
                parts.append(
                    "{name} [Enabled={enabled}; PasswordExpires={expires}; Groups={groups}]".format(
                        name=text(user.get("Name")) or "?",
                        enabled=text(user.get("Enabled")) or "?",
                        expires=text(user.get("PasswordExpires")) or "?",
                        groups=groups or "-",
                    )
                )
            return " | ".join(parts)

        def compact_network(adapters):
            parts = []
            for adapter in as_list(adapters):
                if not isinstance(adapter, dict):
                    continue

                ipv4 = []
                for address in as_list(adapter.get("IPAddresses")):
                    if not isinstance(address, dict):
                        continue
                    if text(address.get("AddressFamily")).lower() not in {"ipv4", "2"}:
                        continue
                    ip = text(address.get("IPAddress"))
                    prefix = text(address.get("PrefixLength"))
                    if ip:
                        ipv4.append(ip + ("/" + prefix if prefix else ""))

                dns = []
                for dns_record in as_list(adapter.get("DnsServers")):
                    if not isinstance(dns_record, dict):
                        continue
                    if text(dns_record.get("AddressFamily")).lower() not in {"ipv4", "2"}:
                        continue
                    dns.extend(text(x) for x in as_list(dns_record.get("ServerAddresses")) if text(x))

                gateways = [text(x) for x in as_list(adapter.get("Gateway")) if text(x)]
                parts.append(
                    "{name} [Status={status}; IPv4={ipv4}; Gateway={gateway}; DNS={dns}; MAC={mac}]".format(
                        name=text(adapter.get("Name")) or "?",
                        status=text(adapter.get("Status")) or "?",
                        ipv4=",".join(ipv4) or "-",
                        gateway=",".join(gateways) or "-",
                        dns=",".join(dns) or "-",
                        mac=text(adapter.get("MacAddress")) or "-",
                    )
                )
            return " | ".join(parts)

        def physical_network_adapters(adapters):
            selected = []
            for adapter in as_list(adapters):
                if not isinstance(adapter, dict):
                    continue
                if bool_value(adapter.get("Virtual")) is True:
                    continue
                if adapter.get("HardwareInterface") is not None and bool_value(adapter.get("HardwareInterface")) is False:
                    continue
                selected.append(adapter)
            return selected

        def adapter_is_enabled(adapter):
            status = text(as_dict(adapter).get("Status")).strip().lower()
            if not status:
                return None
            return status not in {"disabled", "deaktiviert", "not present", "nicht vorhanden"}

        def find_adapters_by_name_regex(adapters, pattern):
            return [
                adapter
                for adapter in as_list(adapters)
                if isinstance(adapter, dict) and regex_match(pattern, adapter.get("Name"))
            ]

        def binding_matches(adapter, component_id=None, display_regex=None):
            matches = []
            for binding in as_list(as_dict(adapter).get("Bindings")):
                if not isinstance(binding, dict):
                    continue
                if component_id is not None and text(binding.get("ComponentID")).strip().lower() != text(component_id).strip().lower():
                    continue
                if display_regex is not None and not regex_match(display_regex, binding.get("DisplayName")):
                    continue
                matches.append(binding)
            return matches

        def ordered_string_list(values):
            return [text(value).strip() for value in as_list(values) if text(value).strip()]

        def normalize_domain(value):
            return text(value).strip().rstrip(".").lower()

        def bytes_to_gb(value):
            try:
                return float(value) / (1024.0 ** 3)
            except (TypeError, ValueError):
                return None

        def component_enabled(item):
            item = as_dict(item)
            if "Installed" in item:
                value = bool_value(item.get("Installed"))
                if value is not None:
                    return value
            state = text(item.get("State") or item.get("InstallState")).strip().lower()
            if state in {"enabled", "enabled pending", "installed", "install pending"}:
                return True
            if state in {"disabled", "disabled with payload removed", "available", "removed"}:
                return False
            return None

        def component_records(windows_components):
            components = as_dict(windows_components)
            rows = []
            for item in as_list(components.get("OptionalFeatures")):
                if isinstance(item, dict):
                    row = dict(item)
                    row["Source"] = "OptionalFeatures"
                    rows.append(row)
            server = as_dict(components.get("ServerRolesAndFeatures"))
            for item in as_list(server.get("Features")):
                if isinstance(item, dict):
                    row = dict(item)
                    row["Source"] = "ServerRolesAndFeatures"
                    rows.append(row)
            return rows

        def component_matches(records, pattern):
            return [
                row for row in as_list(records)
                if isinstance(row, dict) and regex_match(
                    pattern,
                    "{0} {1}".format(text(row.get("Name") or row.get("FeatureName")), text(row.get("DisplayName")))
                )
            ]

        def compact_info(task_id, value):
            if value is None:
                return "NICHT_PRUEFBAR"

            if task_id == "IPC0013":
                return compact_users(value)

            if task_id == "IPC0015":
                identity = as_dict(value)
                return text(identity.get("ComputerName") or identity.get("DNSHostName") or identity.get("FQDN"))

            if task_id == "IPC0019":
                data = as_dict(value)
                installed = "JA" if data.get("Installed") else "NEIN"
                versions = [
                    text(item.get("DisplayVersion"))
                    for item in as_list(data.get("Products"))
                    if isinstance(item, dict) and text(item.get("DisplayVersion"))
                ]
                return "Installiert: {0}; Version: {1}".format(
                    installed,
                    ",".join(sorted(set(versions))) if versions else "-"
                )

            if task_id == "IPC0024":
                return compact_network(value)

            if task_id in {"IPC0050", "IPC0053"}:
                return compact_network(value)

            if task_id == "IPC0060":
                data = as_dict(value)
                if not data:
                    return "NICHT_PRUEFBAR"
                return "Domain={domain}; OU={ou}; DN={dn}".format(
                    domain=text(data.get("Domain")) or "-",
                    ou=text(data.get("ComputerAccountOU") or data.get("ComputerAccountParentDN")) or "-",
                    dn=text(data.get("ComputerAccountDN")) or "-",
                )

            return json.dumps(value, ensure_ascii=False, separators=(",", ":"))

        def evaluate_es(host):
            checks = {}
            information = {}

            identity = section(host, "system_und_hardware", "Initial_Valid", "Identity")
            language = section(host, "sprache_und_region", "Initial_Valid", "LanguageAndRegion")
            time_config = section(host, "zeitkonfiguration", "Initial_Valid", "TimeConfiguration")
            system_info = section(host, "system_und_hardware", "Initial_Valid", "SystemInformation")
            bios = section(host, "system_und_hardware", "Initial_Valid", "BIOS")
            local_users = section(host, "benutzer_und_gruppen", "Initial_Valid", "LocalUsers")
            network_adapters = section(host, "netzwerk_und_domaene", "Initial_Valid", "NetworkAdapters")
            domain_info = section(host, "netzwerk_und_domaene", "Initial_Valid", "DomainInformation")
            storage = section(host, "system_und_hardware", "Initial_Valid", "Storage")
            windows_components = section(host, "windows_software_und_features", "Initial_Valid", "WindowsComponents")
            installed_software = section(host, "software_und_pcs7", "Software_PCS7_Components_Valid", "InstalledSoftware")
            services_snapshot = section(host, "dienste_treiber_und_geraete", "Certificates_Services_Drivers_Valid", "Services")
            firewall = section(host, "firewall_smb_und_endpunkte", "Firewall_SMB_Patch_Valid", "Firewall")
            explicit_policy = section(host, "gruppenrichtlinien", "GPOs_Valid", "ExplicitlyConfiguredPolicyRegistry")

            # --------------------------------------------------------------
            # IPC0007 - Sprache Deutsch
            # --------------------------------------------------------------
            wanted_language = text(as_dict(expected.get("language")).get("tag"))
            if isinstance(language, dict):
                language_ist = {
                    "WindowsSystemLocale": as_dict(language.get("WindowsSystemLocale")).get("Name"),
                    "CurrentCulture": as_dict(language.get("CurrentCulture")).get("Name"),
                    "CurrentUICulture": as_dict(language.get("CurrentUICulture")).get("Name"),
                    "CurrentUserLanguageList": language.get("CurrentUserLanguageList"),
                }
                required_values = [
                    language_ist["WindowsSystemLocale"],
                    language_ist["CurrentCulture"],
                    language_ist["CurrentUICulture"],
                ]
                state = all(locale_equal(value, wanted_language) for value in required_values)
            else:
                language_ist = None
                state = None

            checks["IPC0007"] = make_check(
                "IPC0007",
