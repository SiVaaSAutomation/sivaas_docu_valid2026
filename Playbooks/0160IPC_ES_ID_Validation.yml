---
- name: "0160 IPC ES - ID-Sollwertpruefung aus Informationsbibliothek"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    # 0150 fasst die von 0110, 0120 und 0130 erzeugten JSON-Snapshots
    # IP-zentriert zusammen und waehlt pro ValidationType den neuesten Datensatz.
    id_validation_library_file: >-
      {{
        ipc_information_library_file
        | default(
            ipc_es_library_file
            | default(result_dir ~ '/ipc_information_library_latest.json')
          )
      }}

    # Stabile Ausgabedatei fuer nachfolgende Protokoll-/Matrix-Playbooks.
    id_validation_output_file: >-
      {{
        ipc_es_id_validation_file
        | default(result_dir ~ '/ipc_es_id_validation_latest.json')
      }}

    # Zusaetzliche CSV-Matrix: eine Zeile pro IP, eine Spalte pro ID.
    id_validation_csv_file: >-
      {{
        ipc_es_id_validation_csv_file
        | default(result_dir ~ '/ipc_es_id_validation_matrix_latest.csv')
      }}

    # Fuer die wenigen direkten Live-Pruefungen wird bewusst dieselbe
    # Discovery-Datei und dieselbe WinRM-Zielkonfiguration wie in 0110 verwendet.
    # add_host-Daten aus einem vorherigen Playbook-Lauf sind nicht persistent;
    # deshalb baut 0160 die Zielgruppe aus derselben Discovery-Quelle erneut auf.
    id_validation_discovery_file: >-
      {{
        ipc_discovery_file
        | default(result_dir ~ '/ipc_discovery_groups_latest.json')
      }}

  tasks:
    - name: Benoetigte Semaphore-Sollwerte pruefen
      ansible.builtin.assert:
        that:
          - result_dir is defined
          - result_dir | string | length > 0
          - win_user is defined
          - win_user | string | length > 0
          - win_password is defined
          - win_password | string | length > 0
          - winrm_transport is defined
          - winrm_transport | string | length > 0
          - expected_timezone_id is defined
          - expected_timezone_id | string | length > 0
          - expected_firewall_rule_name_patterns is defined
          - expected_firewall_rule_name_patterns | length > 0
          - admin_l_user is defined
          - admin_l_user | string | length > 0
          - expected_terminalbus_adapter_regex is defined
          - expected_terminalbus_adapter_regex | string | length > 0
          - expected_enable_lmhosts is defined
          - expected_power_plan_regex is defined
          - expected_power_plan_regex | string | length > 0
          - network_adapter_name_regex is defined
          - network_adapter_name_regex | string | length > 0
          - excluded_network_adapter_name_regex is defined
          - expected_disabled_service_patterns is defined
          - expected_disabled_service_patterns | length > 0
          - expected_disabled_schannel_protocols is defined
          - expected_disabled_schannel_protocols | length > 0
          - expected_enabled_schannel_protocols is defined
          - expected_enabled_schannel_protocols | length > 0
        fail_msg: >-
          Fuer 0160 fehlen benoetigte Semaphore-Sollwerte. Es werden bewusst keine
          stillen Ersatzwerte fuer diese projektabhaengigen Sollwerte verwendet.

    - name: Informationsbibliothek von 0150 pruefen
      ansible.builtin.stat:
        path: "{{ id_validation_library_file }}"
      register: id_validation_library_stat

    - name: Abbrechen wenn Informationsbibliothek fehlt
      ansible.builtin.fail:
        msg: >-
          {{ id_validation_library_file }} wurde nicht gefunden.
          Fuehre zuerst 0000, danach 0110/0120/0130 und anschliessend
          0150IPC_ES_Information_Library.yml aus.
      when: not (id_validation_library_stat.stat.exists | default(false))

    - name: Ausgabeordner anlegen
      ansible.builtin.file:
        path: "{{ id_validation_output_file | dirname }}"
        state: directory
        

    # ------------------------------------------------------------------
    # Fuer wenige IDs reicht der gespeicherte Snapshot nicht aus.
    #
    # Fuer diese Read-only-Live-Pruefungen wird dieselbe Discovery-Quelle
    # und dieselbe WinRM-Konfiguration wie in 0110 verwendet. Dadurch gibt
    # es zwischen 0110 und 0160 keine zweite, abweichende Logik fuer Port,
    # Scheme oder Zielauswahl. Nur der Gruppenname ist 0160-spezifisch.
    # ------------------------------------------------------------------
    - name: IPC-Discovery-Datei fuer direkte PowerShell-Pruefungen pruefen
      ansible.builtin.stat:
        path: "{{ id_validation_discovery_file }}"
      register: id_validation_discovery_stat

    - name: Abbrechen wenn IPC-Discovery-Datei fuer Live-Pruefungen fehlt
      ansible.builtin.fail:
        msg: >-
          {{ id_validation_discovery_file }} wurde nicht gefunden.
          0160 verwendet fuer seine direkten PowerShell-Pruefungen dieselbe
          Discovery-Datei wie 0110. Fuehre zuerst
          0000IPC_Discovery_Classification.yml aus.
      when: not (id_validation_discovery_stat.stat.exists | default(false))

    - name: IPC-Discovery-Datei fuer direkte PowerShell-Pruefungen einlesen
      ansible.builtin.slurp:
        src: "{{ id_validation_discovery_file }}"
      register: id_validation_discovery_raw

    - name: IPC-Discovery-Daten fuer direkte PowerShell-Pruefungen speichern
      ansible.builtin.set_fact:
        id_validation_discovery_data: >-
          {{ id_validation_discovery_raw.content | b64decode | from_json }}

    - name: Pruefen ob Discovery-Gruppe ipc_es vorhanden ist
      ansible.builtin.assert:
        that:
          - id_validation_discovery_data.groups is defined
          - id_validation_discovery_data.groups.ipc_es is defined
          - id_validation_discovery_data.groups.ipc_es is iterable
        fail_msg: >-
          In {{ id_validation_discovery_file }} wurde groups.ipc_es nicht gefunden.
          0160 erwartet fuer den direkten Zugriff dieselbe ES-Zielgruppe wie 0110.

    - name: ES-Ziele fuer direkte PowerShell-Pruefungen wie in 0110 dynamisch anlegen
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: ipc_es_0160_live_targets
        ansible_host: "{{ item.ip }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.winrm_port | default(winrm_default_port | default(5985)) | int }}"
        ansible_winrm_scheme: "{{ item.winrm_scheme | default('http') }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(90) }}"
      loop: "{{ id_validation_discovery_data.groups.ipc_es | default([]) }}"
      loop_control:
        label: "{{ item.ip }}"
      no_log: true

    - name: Direkte 0160-ES-Ziele anzeigen
      ansible.builtin.debug:
        msg:
          - "Discovery-Datei: {{ id_validation_discovery_file }}"
          - "IPC ES Anzahl fuer Live-Pruefung: {{ id_validation_discovery_data.groups.ipc_es | default([]) | length }}"
          - "IPC ES IPs: {{ id_validation_discovery_data.groups.ipc_es | default([]) | map(attribute='ip') | list }}"

    - name: Hinweis wenn keine IPC ES fuer Live-Pruefungen vorhanden sind
      ansible.builtin.debug:
        msg: >-
          In groups.ipc_es sind keine Zielsysteme enthalten.
          Die JSON-basierte 0160-Auswertung wird trotzdem erzeugt;
          die direkten PowerShell-Pruefungen IPC0047, IPC0073, IPC0076
          und IPC0089 werden fuer keine ES ausgefuehrt.
      when: id_validation_discovery_data.groups.ipc_es | default([]) | length == 0

    - name: ES-Aufgaben gegen vorhandene JSON-Informationen pruefen
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import csv
        import ipaddress
        import json
        import os
        import re
        from datetime import datetime, timezone
        from pathlib import Path

        library_path = Path({{ id_validation_library_file | to_json }})
        output_path = Path({{ id_validation_output_file | to_json }})
        csv_output_path = Path({{ id_validation_csv_file | to_json }})

        # ------------------------------------------------------------------
        # Projektabhaengige Sollwerte kommen ausschliesslich aus Semaphore.
        # Aufgabenlisten-Sollwerte, die fachlich fest in der ID beschrieben
        # sind, werden weiter unten direkt der jeweiligen ID zugeordnet.
        # ------------------------------------------------------------------
        expected = {
            "timezone_id": {{ expected_timezone_id | to_json }},
            "firewall_rule_name_patterns": {{ expected_firewall_rule_name_patterns | to_json }},
            "admin_l_user": {{ admin_l_user | to_json }},
            "terminalbus_adapter_regex": {{ expected_terminalbus_adapter_regex | to_json }},
            "enable_lmhosts": {{ expected_enable_lmhosts | to_json }},
            "power_plan_regex": {{ expected_power_plan_regex | to_json }},
            "network_adapter_name_regex": {{ network_adapter_name_regex | to_json }},
            "excluded_network_adapter_name_regex": {{ excluded_network_adapter_name_regex | to_json }},
            "disabled_service_patterns": {{ expected_disabled_service_patterns | to_json }},
            "disabled_schannel_protocols": {{ expected_disabled_schannel_protocols | to_json }},
            "enabled_schannel_protocols": {{ expected_enabled_schannel_protocols | to_json }},
            "project_folder": {{ expected_project_folder | default('D:\\Projekt') | to_json }},
            "project_share": {{ expected_project_share | default('Projekt') | to_json }},
        }

        # Ein Backslash als chr(92) vermeidet eine bekannte split_args-Falle
        # bei Ansible 2.13: Stringliterale, deren schliessendes Anfuehrungszeichen
        # direkt auf einen Backslash folgt, koennen beim Laden falsch geparst werden.
        BACKSLASH = chr(92)

        # ------------------------------------------------------------------
        # Hilfsfunktionen
        # ------------------------------------------------------------------
        def ip_sort_key(value):
            try:
                return (0, int(ipaddress.ip_address(str(value))))
            except ValueError:
                return (1, str(value))

        def as_list(value):
            if value is None:
                return []
            return value if isinstance(value, list) else [value]

        def as_dict(value):
            return value if isinstance(value, dict) else {}

        def text(value):
            return "" if value is None else str(value)

        def bool_value(value):
            if isinstance(value, bool):
                return value
            if isinstance(value, (int, float)):
                return value != 0
            value_text = text(value).strip().lower()
            if value_text in {"true", "1", "yes", "enabled", "enable", "on"}:
                return True
            if value_text in {"false", "0", "no", "disabled", "disable", "off"}:
                return False
            return None

        def int_value(value):
            if isinstance(value, bool):
                return int(value)
            if isinstance(value, int):
                return value
            try:
                return int(str(value).strip(), 0)
            except Exception:
                try:
                    return int(float(str(value).strip()))
                except Exception:
                    return None

        def compile_regex(pattern, default_flags=re.IGNORECASE):
            try:
                return re.compile(str(pattern))
            except re.error:
                return re.compile(str(pattern), default_flags)

        def regex_search(pattern, value):
            try:
                return re.search(str(pattern), text(value)) is not None
            except re.error:
                return re.search(str(pattern), text(value), re.IGNORECASE) is not None

        def library_section(host, area, validation_type, section_name):
            return (
                as_dict(host.get("bereiche"))
                .get(area, {})
                .get(validation_type, {})
                .get(section_name)
            )

        def make_check(task_id, task_name, ok, soll, ist, source, soll_source):
            return {
                "status": "OK" if bool(ok) else "NOK",
                "aufgabe": task_name,
                "soll": soll,
                "ist": ist,
                "quelle": source,
                "sollwertquelle": soll_source,
            }

        def missing_check(task_id, task_name, soll, source, soll_source):
            return make_check(
                task_id,
                task_name,
                False,
                soll,
                "Keine auswertbare Information in der aktuellen Informationsbibliothek gefunden.",
                source,
                soll_source,
            )

        def german_language_snapshot(language):
            language = as_dict(language)
            system_locale = text(as_dict(language.get("WindowsSystemLocale")).get("Name"))
            ui_culture = text(as_dict(language.get("CurrentUICulture")).get("Name"))
            current_culture = text(as_dict(language.get("CurrentCulture")).get("Name"))
            return {
                "WindowsSystemLocale": system_locale or None,
                "CurrentUICulture": ui_culture or None,
                "CurrentCulture": current_culture or None,
            }

        def is_german(value):
            value = text(value).strip().lower()
            return value == "de" or value.startswith("de-")

        def registry_records(value):
            if isinstance(value, dict) and isinstance(value.get("Values"), list):
                return value["Values"]
            return as_list(value)

        def registry_matches(records, name=None, path_contains=None):
            matches = []
            wanted_name = None if name is None else str(name).lower()
            wanted_path = None if path_contains is None else str(path_contains).replace("/", BACKSLASH).lower()
            for row in as_list(records):
                if not isinstance(row, dict):
                    continue
                row_name = text(row.get("Name")).lower()
                row_path = text(row.get("Path")).replace("/", BACKSLASH).lower()
                if wanted_name is not None and row_name != wanted_name:
                    continue
                if wanted_path is not None and wanted_path not in row_path:
                    continue
                matches.append(row)
            return matches

        def first_registry_value(records, name=None, path_contains=None):
            matches = registry_matches(records, name=name, path_contains=path_contains)
            if not matches:
                return None, []
            return matches[0].get("Value"), matches

        def get_target_network_adapters(initial):
            adapters = as_list(initial)
            include_rx = compile_regex(expected["network_adapter_name_regex"])
            exclude_pattern = text(expected["excluded_network_adapter_name_regex"]).strip()
            exclude_rx = compile_regex(exclude_pattern) if exclude_pattern else None

            selected = []
            for adapter in adapters:
                if not isinstance(adapter, dict):
                    continue
                name = text(adapter.get("Name"))
                if not include_rx.search(name):
                    continue
                if exclude_rx and exclude_rx.search(name):
                    continue

                hardware = adapter.get("HardwareInterface")
                virtual = adapter.get("Virtual")
                # Wenn die Felder vorhanden sind, nur echte Hardwareadapter pruefen.
                if hardware is not None and bool_value(hardware) is False:
                    continue
                if virtual is not None and bool_value(virtual) is True:
                    continue
                selected.append(adapter)
            return selected

        def find_terminalbus_adapter(adapters):
            pattern = expected["terminalbus_adapter_regex"]
            matches = [
                adapter
                for adapter in as_list(adapters)
                if isinstance(adapter, dict) and regex_search(pattern, adapter.get("Name"))
            ]
            return matches

        def software_products(software):
            return as_list(as_dict(software).get("AllProducts"))

        def product_matches(products, name_pattern, version_pattern=None):
            matches = []
            for product in as_list(products):
                if not isinstance(product, dict):
                    continue
                if not regex_search(name_pattern, product.get("DisplayName")):
                    continue
                if version_pattern and not regex_search(version_pattern, product.get("DisplayVersion")):
                    continue
                matches.append({
                    "DisplayName": product.get("DisplayName"),
                    "DisplayVersion": product.get("DisplayVersion"),
                    "Publisher": product.get("Publisher"),
                })
            return matches

        def catalog_component(catalog, component_id):
            for item in as_list(catalog):
                if isinstance(item, dict) and text(item.get("ComponentId")) == component_id:
                    return item
            return None

        def profile_is_all(profile):
            value = text(profile).strip().lower()
            if value in {"any", "all", "alle"}:
                return True
            return all(token in value for token in ("domain", "private", "public"))

        def firewall_rule_matches(rules, pattern):
            matched = []
            for rule in as_list(rules):
                if not isinstance(rule, dict):
                    continue
                haystack = " ".join(
                    text(rule.get(key))
                    for key in ("Name", "DisplayName", "Description", "DisplayGroup")
                )
                if regex_search(pattern, haystack):
                    matched.append(rule)
            return matched

        def smb_config_value(configuration, registry_snapshot, key):
            config = as_dict(configuration)
            if key in config:
                return config.get(key)

            registry = as_dict(registry_snapshot)
            values = as_dict(registry.get("Values"))
            return values.get(key)

        def schannel_state(records, protocol, side):
            path_fragment = (
                "\\SYSTEM\\CurrentControlSet\\Control\\SecurityProviders\\SCHANNEL\\Protocols"
                + BACKSLASH + protocol + BACKSLASH + side
            )
            enabled, enabled_rows = first_registry_value(
                records, name="Enabled", path_contains=path_fragment
            )
            disabled_by_default, dbd_rows = first_registry_value(
                records, name="DisabledByDefault", path_contains=path_fragment
            )
            return {
                "protocol": protocol,
                "side": side,
                "Enabled": enabled,
                "DisabledByDefault": disabled_by_default,
                "evidence_found": bool(enabled_rows or dbd_rows),
            }

        def check_schannel_protocols(records):
            details = []
            ok = True

            for protocol in as_list(expected["disabled_schannel_protocols"]):
                for side in ("Client", "Server"):
                    state = schannel_state(records, text(protocol), side)
                    enabled = int_value(state["Enabled"])
                    dbd = int_value(state["DisabledByDefault"])
                    state["expected"] = {"Enabled": 0, "DisabledByDefault": 1}
                    state["ok"] = enabled == 0 and dbd == 1
                    ok = ok and state["ok"]
                    details.append(state)

            for protocol in as_list(expected["enabled_schannel_protocols"]):
                for side in ("Client", "Server"):
                    state = schannel_state(records, text(protocol), side)
                    enabled = int_value(state["Enabled"])
                    dbd = int_value(state["DisabledByDefault"])
                    # Windows verwendet fuer "Enabled" je nach Quelle 1 oder 0xFFFFFFFF.
                    enabled_ok = enabled in {1, 4294967295, -1}
                    state["expected"] = {
                        "Enabled": "1 oder 0xFFFFFFFF",
                        "DisabledByDefault": 0,
                    }
                    state["ok"] = enabled_ok and dbd == 0
                    ok = ok and state["ok"]
                    details.append(state)

            return ok, details

        def check_disabled_services(service_data):
            # Ein fehlender Service-Snapshot darf nicht als "alle Dienste fehlen"
            # und damit faelschlich als konform interpretiert werden.
            if not isinstance(service_data, dict) or "Services" not in service_data:
                return False, [{
                    "status": "DATEN_FEHLEN",
                    "ok": False,
                    "reason": "Services.Services ist in der Informationsbibliothek nicht vorhanden.",
                }]

            services = as_list(service_data.get("Services"))
            details = []
            ok = True

            for pattern in as_list(expected["disabled_service_patterns"]):
                matches = []
                for service in services:
                    if not isinstance(service, dict):
                        continue
                    haystack = text(service.get("Name")) + " " + text(service.get("DisplayName"))
                    if regex_search(pattern, haystack):
                        matches.append(service)

                if not matches:
                    # Nicht vorhandener Dienst kann nicht laufen und ist damit hinsichtlich
                    # des geforderten Hardening-Zustands unkritisch.
                    details.append({
                        "pattern": pattern,
                        "status": "NICHT_VORHANDEN",
                        "ok": True,
                        "matches": [],
                    })
                    continue

                matched_status = []
                pattern_ok = True
                for service in matches:
                    start_class = text(service.get("StartClassification")).lower()
                    start_mode = text(service.get("StartMode")).lower()
                    service_ok = start_class == "disabled" or start_mode == "disabled"
                    pattern_ok = pattern_ok and service_ok
                    matched_status.append({
                        "Name": service.get("Name"),
                        "DisplayName": service.get("DisplayName"),
                        "StartClassification": service.get("StartClassification"),
                        "StartMode": service.get("StartMode"),
                        "ok": service_ok,
                    })

                ok = ok and pattern_ok
                details.append({
                    "pattern": pattern,
                    "status": "GEFUNDEN",
                    "ok": pattern_ok,
                    "matches": matched_status,
                })

            return ok, details

        def make_information(task_id, task_name, information, source, note):
            available = information not in (None, "", [], {})
            return {
                "pruefart": "INDIREKT",
                "status": "INFORMATION" if available else "KEINE_INFORMATION",
                "manuelle_bewertung_erforderlich": True,
                "aufgabe": task_name,
                "information": information if available else None,
                "quelle": source,
                "hinweis": note,
            }

        def service_rows(service_inventory):
            return as_list(as_dict(service_inventory).get("Services"))

        def matching_services(service_inventory, pattern):
            result = []
            for service in service_rows(service_inventory):
                if not isinstance(service, dict):
                    continue
                haystack = " ".join(text(service.get(k)) for k in ("Name", "DisplayName", "Description", "PathName"))
                if regex_search(pattern, haystack):
                    result.append({
                        "Name": service.get("Name"),
                        "DisplayName": service.get("DisplayName"),
                        "State": service.get("State"),
                        "StartMode": service.get("StartMode"),
                        "StartClassification": service.get("StartClassification"),
                        "PathName": service.get("PathName"),
                    })
            return result

        def software_matches(installed_software, name_pattern, version_pattern=None):
            return product_matches(software_products(installed_software), name_pattern, version_pattern)

        def software_presence_check(task_id, task_name, installed_software, name_pattern, version_pattern, soll):
            products = software_products(installed_software)
            if not products:
                return missing_check(
                    task_id, task_name, soll,
                    "Software_PCS7_Components_Valid.InstalledSoftware.AllProducts",
                    "Aufgabenliste"
                )
            matches = product_matches(products, name_pattern, version_pattern)
            return make_check(
                task_id, task_name, bool(matches), soll, matches,
                "Software_PCS7_Components_Valid.InstalledSoftware.AllProducts",
                "Aufgabenliste"
            )

        def registry_evidence_matches(evidence_section, pattern):
            evidence = as_list(as_dict(evidence_section).get("Evidence"))
            result = []
            for item in evidence:
                if not isinstance(item, dict):
                    continue
                haystack = " ".join(text(item.get(k)) for k in ("Path", "ValueName", "Value"))
                if regex_search(pattern, haystack):
                    result.append(item)
            return result

        def startup_matches(autoruns, pattern):
            result = []
            autoruns = as_dict(autoruns)
            for item in as_list(autoruns.get("RegistryEntries")):
                if not isinstance(item, dict):
                    continue
                haystack = " ".join(text(item.get(k)) for k in ("Path", "Name", "Value", "Command"))
                if regex_search(pattern, haystack):
                    result.append({"type": "Registry", "item": item})
            for folder in as_list(autoruns.get("StartupFolders")):
                folder = as_dict(folder)
                for item in as_list(folder.get("Items")):
                    if not isinstance(item, dict):
                        continue
                    shortcut = as_dict(item.get("Shortcut"))
                    haystack = " ".join([
                        text(item.get("Name")), text(item.get("FullName")),
                        text(shortcut.get("TargetPath")), text(shortcut.get("Arguments")),
                    ])
                    if regex_search(pattern, haystack):
                        result.append({
                            "type": folder.get("Scope") or "StartupFolder",
                            "folder": folder.get("Path"),
                            "item": item,
                        })
            return result

        def certificate_rows(cert_inventory):
            return as_list(as_dict(cert_inventory).get("Certificates"))

        def matching_certificates(cert_inventory, pattern):
            result = []
            for cert in certificate_rows(cert_inventory):
                if not isinstance(cert, dict):
                    continue
                haystack = " ".join(text(cert.get(k)) for k in ("Subject", "Issuer", "FriendlyName", "StoreLocation", "StoreName"))
                if regex_search(pattern, haystack):
                    result.append({
                        "StoreLocation": cert.get("StoreLocation"),
                        "StoreName": cert.get("StoreName"),
                        "Subject": cert.get("Subject"),
                        "Issuer": cert.get("Issuer"),
                        "FriendlyName": cert.get("FriendlyName"),
                        "Thumbprint": cert.get("Thumbprint"),
                        "NotAfter": cert.get("NotAfter"),
                        "ExpirationStatus": cert.get("ExpirationStatus"),
                    })
            return result

        def current_kb_evidence(patch_status, installed_software, kb):
            kb = text(kb).upper()
            patch_status = as_dict(patch_status)
            evidence = {"HotFixes": [], "InstalledWindowsPackages": [], "InstalledSoftware": []}
            for item in as_list(patch_status.get("HotFixes")):
                if isinstance(item, dict) and text(item.get("HotFixID")).upper() == kb:
                    evidence["HotFixes"].append(item)
            for item in as_list(patch_status.get("WindowsPackages")):
                if not isinstance(item, dict):
                    continue
                state = text(item.get("PackageState")).lower()
                haystack = " ".join([
                    text(item.get("PackageName")), text(item.get("Description")),
                    " ".join(text(x) for x in as_list(item.get("KBs"))),
                ]).upper()
                if state == "installed" and kb in haystack:
                    evidence["InstalledWindowsPackages"].append(item)
            evidence["InstalledSoftware"] = product_matches(
                software_products(installed_software), re.escape(kb), None
            )
            present = any(bool(v) for v in evidence.values())
            return present, evidence

        def normalize_windows_path(value):
            return text(value).strip().replace("/", "\\").rstrip("\\").lower()

        def project_share_state(smb):
            target_folder = normalize_windows_path(expected.get("project_folder"))
            target_share = text(expected.get("project_share")).strip().lower()
            matches = []
            for share in as_list(as_dict(smb).get("Shares")):
                if not isinstance(share, dict):
                    continue
                share_path = normalize_windows_path(share.get("Path"))
                share_name = text(share.get("Name")).strip().lower()
                path_match = bool(target_folder) and share_path == target_folder
                name_match = bool(target_share) and share_name == target_share
                if path_match or name_match:
                    acl = as_dict(share.get("NtfsRootAcl"))
                    matches.append({
                        "Name": share.get("Name"),
                        "Path": share.get("Path"),
                        "ShareState": share.get("ShareState"),
                        "SharePermissions": share.get("SharePermissions"),
                        "NtfsRootAcl": share.get("NtfsRootAcl"),
                        "FolderExists": bool_value(acl.get("Exists")),
                    })
            folder_confirmed = any(item.get("FolderExists") is True for item in matches)
            share_confirmed = bool(matches)
            return folder_confirmed, share_confirmed, matches

        def cipher_policy_functions(policy_areas):
            crypto = as_list(as_dict(policy_areas).get("Cryptography"))
            candidates = []
            for row in crypto:
                if not isinstance(row, dict):
                    continue
                if text(row.get("Name")).lower() != "functions":
                    continue
                path = text(row.get("Path")).replace("/", BACKSLASH).lower()
                if "cryptography\\configuration\\ssl\\00010002" not in path:
                    continue
                value = row.get("Value")
                values = []
                if isinstance(value, list):
                    values = [text(x).strip() for x in value if text(x).strip()]
                elif isinstance(value, dict):
                    candidate_text = value.get("Preview") or value.get("Value")
                    if candidate_text is not None:
                        values = [x.strip() for x in re.split(r"[,;\\r\\n]+", text(candidate_text)) if x.strip()]
                else:
                    values = [x.strip() for x in re.split(r"[,;\\r\\n]+", text(value)) if x.strip()]
                candidates.extend(values)
            # Reihenfolge behalten, Duplikate entfernen.
            seen = set()
            unique = []
            for item in candidates:
                key = item.upper()
                if key not in seen:
                    seen.add(key)
                    unique.append(item)
            return unique

        def cipher_enabled_check(task_id, task_name, policy_areas, ciphers):
            active = cipher_policy_functions(policy_areas)
            active_upper = {x.upper() for x in active}
            details = [
                {"CipherSuite": cipher, "Aktiviert": cipher.upper() in active_upper}
                for cipher in ciphers
            ]
            ok = bool(active) and all(item["Aktiviert"] for item in details)
            return make_check(
                task_id, task_name, ok,
                "Alle aufgefuehrten Cipher Suites aktiviert; deaktiviert = NOK",
                {"PolicyFunctions": active, "Pruefung": details},
                "GPOs_Valid.PolicyAreaSnapshots.Cryptography (SSL\\00010002\\Functions)",
                "Benutzeranweisung fuer 0160/0161"
            )

        def id_sort_key(value):
            match = re.fullmatch(r"IPC(\\d+)", text(value).strip(), re.IGNORECASE)
            if match:
                return (0, int(match.group(1)), text(value))
            return (1, text(value))

        def matrix_information_value(item):
            item = as_dict(item)
            if item.get("status") == "KEINE_INFORMATION":
                return "KEINE_INFORMATION"
            value = item.get("information")
            if value is None:
                return "KEINE_INFORMATION"
            if isinstance(value, str):
                return value
            return json.dumps(value, ensure_ascii=False, separators=(",", ":"), sort_keys=False)

