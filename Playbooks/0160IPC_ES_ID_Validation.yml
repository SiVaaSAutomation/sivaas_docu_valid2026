            information["IPC0019"] = make_information(
                "IPC0019",
                "SIMATIC Management Agent",
                sma_info,
                (
                    "Software_PCS7_Components_Valid.InstalledSoftware.AllProducts + "
                    "Certificates_Services_Drivers_Valid.Services"
                ),
