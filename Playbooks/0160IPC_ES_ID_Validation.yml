---
- name: "0160 IPC ES - ID-Pruefung aus Informationsbibliothek"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    # 0150 erzeugt diese IP-zentrierte Informationsbibliothek.
    ipc_es_validation_library_file: >-
      {{
        ipc_information_library_file
        | default(result_dir ~ '/ipc_information_library_latest.json')
      }}

    # Stabile Ausgabedateien fuer die ES-Pruefmatrix.
    ipc_es_validation_output_file: >-
      {{
        ipc_es_id_validation_file
        | default(result_dir ~ '/ipc_es_id_validation_latest.json')
      }}

    ipc_es_validation_csv_file: >-
      {{
        ipc_es_id_validation_csv_file
        | default(result_dir ~ '/ipc_es_id_validation_matrix_latest.csv')
      }}

    # Discovery-Datei wird nur fuer die wenigen Live-Sollwertpruefungen genutzt,
    # deren Endzustand in den 0110-Snapshots nicht vollstaendig enthalten ist.
    ipc_es_validation_discovery_file: >-
      {{
        ipc_discovery_file
        | default(result_dir ~ '/ipc_discovery_groups_latest.json')
      }}

  tasks:
    - name: Benoetigte Semaphore-Variablen fuer 0160 pruefen
      ansible.builtin.assert:
        that:
          - result_dir is defined
          - result_dir | string | length > 0
          - win_user is defined
          - win_user | string | length > 0
          - win_password is defined
          - win_password | string | length > 0
          - winrm_transport is defined
          - winrm_transport | string | length > 0
          - ipc_es_validation_expected is defined
          - ipc_es_validation_expected is mapping
          - ipc_es_validation_expected.language is defined
          - ipc_es_validation_expected.language.tag is defined
          - ipc_es_validation_expected.region is defined
          - ipc_es_validation_expected.region.iso is defined
          - ipc_es_validation_expected.keyboard is defined
          - ipc_es_validation_expected.keyboard.allowed_layout_ids is defined
          - ipc_es_validation_expected.keyboard.allowed_layout_ids | length > 0
          - ipc_es_validation_expected.keyboard.exact_layout_count is defined
          - ipc_es_validation_expected.chipset is defined
          - ipc_es_validation_expected.chipset.regex is defined
          - ipc_es_validation_expected.vnc_firewall is defined
          - ipc_es_validation_expected.vnc_firewall.rules is defined
          - ipc_es_validation_expected.vnc_firewall.rules | length > 0
          - ipc_es_validation_expected.local_account_token_filter_policy is defined
          - ipc_es_validation_expected.builtin_admin is defined
          - ipc_es_validation_expected.builtin_admin.password_expires is defined
          - ipc_es_validation_expected.network is defined
          - ipc_es_validation_expected.network is mapping
          - ipc_es_validation_expected.network.adapter_policy is defined
          - ipc_es_validation_expected.network.adapter_policy.allowed_names is defined
          - ipc_es_validation_expected.network.adapter_policy.allowed_names | length > 0
          - ipc_es_validation_expected.network.adapter_policy.max_enabled_physical_adapters is defined
          - ipc_es_validation_expected.network.terminalbus is defined
          - ipc_es_validation_expected.network.terminalbus.name_regex is defined
          - ipc_es_validation_expected.network.terminalbus.gateway is defined
          - ipc_es_validation_expected.network.terminalbus.dns_servers is defined
          - ipc_es_validation_expected.network.terminalbus.dns_servers is iterable
          - ipc_es_validation_expected.network.terminalbus.wins_servers is defined
          - ipc_es_validation_expected.network.terminalbus.wins_servers is iterable
