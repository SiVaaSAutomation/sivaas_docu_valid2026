            # --------------------------------------------------------------
            network_expected = as_dict(expected.get("network"))
            adapter_policy = as_dict(network_expected.get("adapter_policy"))
            allowed_adapter_names = [
                text(name).strip()
                for name in as_list(adapter_policy.get("allowed_names"))
                if text(name).strip()
            ]
            allowed_adapter_names_normalized = {name.lower() for name in allowed_adapter_names}
            physical_adapters = physical_network_adapters(network_adapters)

            ipc0049_state = None
            ipc0049_ist = None
            if isinstance(network_adapters, list):
                ipc0049_ist = [
                    {
                        "Name": adapter.get("Name"),
                        "Status": adapter.get("Status"),
                        "HardwareInterface": adapter.get("HardwareInterface"),
                        "Virtual": adapter.get("Virtual"),
                        "AllowedName": text(adapter.get("Name")).strip().lower() in allowed_adapter_names_normalized,
                    }
                    for adapter in physical_adapters
                ]
                ipc0049_state = bool(physical_adapters) and all(
                    text(adapter.get("Name")).strip().lower() in allowed_adapter_names_normalized
                    for adapter in physical_adapters
                )

            checks["IPC0049"] = make_check(
                "IPC0049",
                "Netzwerkadapter umbenennen",
                ipc0049_state,
                {"AllowedPhysicalAdapterNames": allowed_adapter_names},
                ipc0049_ist,
                "Initial_Valid.NetworkAdapters",
                "Nur physische Hardwareadapter werden bewertet; virtuelle/Softwareadapter werden nicht als Fehler gewertet.",
            )

            terminalbus_expected = as_dict(network_expected.get("terminalbus"))
            anlagenbus_expected = as_dict(network_expected.get("anlagenbus"))
            redundanzbus_expected = as_dict(network_expected.get("redundanzbus"))
            terminalbus = find_adapters_by_name_regex(network_adapters, terminalbus_expected.get("name_regex"))
            anlagenbus = find_adapters_by_name_regex(network_adapters, anlagenbus_expected.get("name_regex"))
            redundanzbus = find_adapters_by_name_regex(network_adapters, redundanzbus_expected.get("name_regex"))

            # --------------------------------------------------------------
            # IPC0050 - Terminalbus-Informationen ausgeben. Die IP-Adresse
            # wird bewusst nicht als Sollwert bewertet; IPv4/IPv6, Gateway,
            # DNS, WINS, Bindings, Routen usw. bleiben im Istwert sichtbar.
            # --------------------------------------------------------------
            information["IPC0050"] = make_information(
                "IPC0050",
                "Terminalbus-Adresse einstellen",
                terminalbus if terminalbus else None,
                "Initial_Valid.NetworkAdapters",
                "Ausgabe des vollstaendigen Terminalbus-Adapters; keine IP-Sollwertpruefung in dieser ID.",
            )

            # --------------------------------------------------------------
            # IPC0051 - finaler Terminalbus-Gatewaywert.
            # Projekt-/kundenspezifischer Wert aus Semaphore.
            # --------------------------------------------------------------
            wanted_gateway = text(terminalbus_expected.get("gateway")).strip()
            ipc0051_state = None
            ipc0051_ist = None
            if isinstance(network_adapters, list):
                ipc0051_ist = [
                    {
                        "Name": adapter.get("Name"),
                        "Gateway": ordered_string_list(adapter.get("Gateway")),
                    }
                    for adapter in terminalbus
                ]
                ipc0051_state = bool(terminalbus) and all(
                    wanted_gateway in ordered_string_list(adapter.get("Gateway"))
                    for adapter in terminalbus
                )
            checks["IPC0051"] = make_check(
                "IPC0051",
                "Terminalbus Gateway korrigieren",
                ipc0051_state,
                {"Gateway": wanted_gateway},
                ipc0051_ist,
                "Initial_Valid.NetworkAdapters[].Gateway",
            )

            # --------------------------------------------------------------
            # IPC0052 - Anlagenbus-Informationen + feste Binding-Sollwerte.
            # ms_msclient und ms_server muessen deaktiviert sein;
            # SIMATIC Industrial Ethernet (ISO) muss aktiviert sein.
            # --------------------------------------------------------------
            ipc0052_state = None
            ipc0052_ist = None
            if isinstance(network_adapters, list):
                adapter_results = []
                all_ok = bool(anlagenbus)
                for adapter in anlagenbus:
                    client_bindings = binding_matches(adapter, component_id="ms_msclient")
                    server_bindings = binding_matches(adapter, component_id="ms_server")
                    simatic_bindings = binding_matches(
                        adapter,
                        display_regex=r"SIMATIC.*Industrial.*Ethernet.*\(ISO\)|SIMATIC.*Industrial.*Ethernet.*ISO",
                    )
                    client_ok = bool(client_bindings) and all(
                        bool_value(binding.get("Enabled")) is False for binding in client_bindings
                    )
                    server_ok = bool(server_bindings) and all(
                        bool_value(binding.get("Enabled")) is False for binding in server_bindings
                    )
                    simatic_ok = bool(simatic_bindings) and any(
                        bool_value(binding.get("Enabled")) is True for binding in simatic_bindings
                    )
                    adapter_ok = client_ok and server_ok and simatic_ok
                    all_ok = all_ok and adapter_ok
                    adapter_results.append({
                        "Adapter": adapter,
                        "BindingCheck": {
                            "ClientForMicrosoftNetworks": {"OK": client_ok, "Matches": client_bindings},
                            "FileAndPrinterSharingForMicrosoftNetworks": {"OK": server_ok, "Matches": server_bindings},
                            "SIMATICIndustrialEthernetISO": {"OK": simatic_ok, "Matches": simatic_bindings},
                        },
                    })
                ipc0052_state = all_ok
                ipc0052_ist = adapter_results

            checks["IPC0052"] = make_check(
                "IPC0052",
                "Anlagenbus-Adresse einstellen",
                ipc0052_state,
                {
                    "AdapterInformation": "ausgeben",
                    "Bindings": {
                        "ms_msclient": False,
                        "ms_server": False,
                        "SIMATIC Industrial Ethernet (ISO)": True,
                    },
                },
                ipc0052_ist,
                "Initial_Valid.NetworkAdapters[].Bindings",
                "Die Anlagenbus-IP wird gemaess Vorgabe nur dokumentiert; OK/NOK dieser ID bezieht sich auf die drei Binding-Einstellungen.",
            )

            # --------------------------------------------------------------
            # IPC0053 - Redundanzbus-Informationen ausgeben.
            # --------------------------------------------------------------
            information["IPC0053"] = make_information(
                "IPC0053",
                "Redundanzbus-Adresse einstellen",
                redundanzbus if redundanzbus else None,
                "Initial_Valid.NetworkAdapters",
                "Ausgabe des vollstaendigen Redundanzbus-Adapters; keine IP-Sollwertpruefung in dieser ID.",
            )

            # --------------------------------------------------------------
            # IPC0054 - nicht benoetigte physische Adapter deaktivieren.
            # Ein physisch vorhandener, aber deaktivierter Adapter ist erlaubt.
            # Fuer ES wird die maximal erlaubte Zahl aktivierter Hardware-NICs
            # ueber Semaphore vorgegeben.
            # --------------------------------------------------------------
            max_enabled = int_value(adapter_policy.get("max_enabled_physical_adapters"))
            ipc0054_state = None
            ipc0054_ist = None
            if isinstance(network_adapters, list) and physical_adapters:
                enabled_physical = [
                    adapter for adapter in physical_adapters
                    if adapter_is_enabled(adapter) is True
                ]
                ipc0054_ist = {
                    "PhysicalAdapters": [
                        {
                            "Name": adapter.get("Name"),
                            "Status": adapter.get("Status"),
                            "EnabledByStatus": adapter_is_enabled(adapter),
                        }
                        for adapter in physical_adapters
                    ],
                    "EnabledPhysicalAdapterCount": len(enabled_physical),
                }
                ipc0054_state = (
                    max_enabled is not None
                    and len(enabled_physical) <= max_enabled
                    and all(
                        text(adapter.get("Name")).strip().lower() in allowed_adapter_names_normalized
                        for adapter in enabled_physical
                    )
                )

            checks["IPC0054"] = make_check(
                "IPC0054",
                "Nicht benoetigte Netzwerkadapter deaktivieren",
                ipc0054_state,
                {
                    "MaxEnabledPhysicalAdapters": max_enabled,
                    "AllowedNames": allowed_adapter_names,
                },
                ipc0054_ist,
                "Initial_Valid.NetworkAdapters",
                "Status 'Disabled' gilt als deaktiviert; ein vorhandener deaktivierter Hardwareadapter fuehrt nicht zu NOK.",
            )

            # IPC0055 wird nachfolgend direkt/read-only geprueft, damit neben
            # DNS auch die vollstaendige NetBT NameServerList fuer WINS
            # ausgewertet werden kann.

            # --------------------------------------------------------------
            # IPC0056 - LMHOSTS-Abfrage am Terminalbus deaktiviert.
            # Fester technischer Sollwert, daher keine zusaetzliche Semaphore-
            # Variable: EnableLMHostsLookup = false.
            # --------------------------------------------------------------
            ipc0056_state = None
            ipc0056_ist = None
            if isinstance(network_adapters, list):
                lmhosts_rows = []
                for adapter in terminalbus:
                    wins = as_dict(adapter.get("WINS"))
                    lmhosts_rows.append({
                        "Name": adapter.get("Name"),
                        "EnableLMHostsLookup": wins.get("EnableLMHostsLookup") if wins else None,
                    })
                ipc0056_ist = lmhosts_rows
                if terminalbus and all(row.get("EnableLMHostsLookup") is not None for row in lmhosts_rows):
                    ipc0056_state = all(
                        bool_value(row.get("EnableLMHostsLookup")) is False
                        for row in lmhosts_rows
                    )

            checks["IPC0056"] = make_check(
                "IPC0056",
                "LMHOSTS-Abfrage deaktivieren",
                ipc0056_state,
                {"EnableLMHostsLookup": False},
                ipc0056_ist,
                "Initial_Valid.NetworkAdapters[].WINS.EnableLMHostsLookup",
            )

            # --------------------------------------------------------------
            # IPC0059 - Domainmitgliedschaft und Domainname.
            # Domainname ist kunden-/projektspezifisch und kommt aus Semaphore.
            # --------------------------------------------------------------
            domain_expected = as_dict(expected.get("domain"))
            wanted_domain = text(domain_expected.get("name")).strip()
            domain = as_dict(domain_info)
            ipc0059_state = None
            ipc0059_ist = None
            if domain:
                part_of_domain = bool_value(domain.get("PartOfDomain"))
                actual_domain = text(domain.get("Domain")).strip()
                ipc0059_ist = {
                    "PartOfDomain": domain.get("PartOfDomain"),
                    "Domain": domain.get("Domain"),
                    "Workgroup": domain.get("Workgroup"),
                    "ComputerAccountDN": domain.get("ComputerAccountDN"),
                }
                ipc0059_state = (
                    part_of_domain is True
                    and normalize_domain(actual_domain) == normalize_domain(wanted_domain)
                )

            checks["IPC0059"] = make_check(
                "IPC0059",
                "Rechner in die Domaene aufnehmen",
                ipc0059_state,
                {"PartOfDomain": True, "Domain": wanted_domain},
                ipc0059_ist,
                "Initial_Valid.DomainInformation",
            )

            # --------------------------------------------------------------
            # IPC0060 - OU nur als Information ausgeben, sofern ermittelbar.
            # 0110 bevorzugt den lokal gecachten Group-Policy-DN und nutzt
            # LDAP nur als Fallback; 0160 wertet ausschliesslich das Ergebnis aus.
            # --------------------------------------------------------------
            ou_info = None
            if domain:
                ou_info = {
                    "PartOfDomain": domain.get("PartOfDomain"),
                    "Domain": domain.get("Domain"),
                    "ComputerAccountDN": domain.get("ComputerAccountDN"),
                    "ComputerAccountParentDN": domain.get("ComputerAccountParentDN"),
                    "ComputerAccountOU": domain.get("ComputerAccountOU"),
                    "OrganizationalUnits": domain.get("OrganizationalUnits"),
                    "DistinguishedNameSource": domain.get("DistinguishedNameSource"),
                    "DirectoryLookupError": domain.get("DirectoryLookupError"),
                }
            information["IPC0060"] = make_information(
                "IPC0060",
                "Rechner in der OU einsortieren",
                ou_info,
                "Initial_Valid.DomainInformation",
                "OU/DN wird nur dokumentiert; fuer IPC0060 ist aktuell kein OU-Sollwert definiert.",
            )

            # --------------------------------------------------------------
            # IPC0065 - VNC-Gruppe / New MS-Logon ACL.
            # Der geforderte Endzustand umfasst die konkrete Gruppe sowie
            # FullControl/Interact/View. Diese ACL wird durch die aktuellen
            # 0110-Snapshots nicht belastbar erfasst. Eine Teilpruefung nur der
            # INI-Schalter waere fuer diese ID fachlich unvollstaendig.
            # --------------------------------------------------------------
            checks["IPC0065"] = make_ignored(
                "IPC0065",
                "VNC-Gruppe einstellen",
                (
                    "IGNORIERT: Die konkrete New-MS-Logon-ACL inklusive Gruppenname und "
                    "FullControl/Interact/View wird von den vorhandenen Snapshots nicht "
                    "belastbar erfasst. Eine reine Schalterpruefung waere kein Nachweis "
                    "des geforderten Endzustands."
                ),
                "UltraVNC New MS-Logon ACL",
            )

            # --------------------------------------------------------------
            # IPC0072 - Partitionen. C: muss mindestens die projektweit
            # definierte Mindestgroesse besitzen. D: ist rechnertypabhaengig
            # und wird fuer diese Ausbaustufe ausschliesslich fuer ES bewertet.
            # --------------------------------------------------------------
            storage_expected = as_dict(expected.get("storage"))
            system_drive_expected = as_dict(storage_expected.get("system_drive"))
            data_drive_expected = as_dict(storage_expected.get("data_drive"))
            c_min_gb = float(system_drive_expected.get("minimum_size_gb"))
            d_expected_by_type = as_dict(data_drive_expected.get("expected_size_gb_by_type"))
            d_expected_gb = float(d_expected_by_type.get("ES"))
            d_tolerance_gb = float(data_drive_expected.get("tolerance_gb"))

            ipc0072_state = None
            ipc0072_ist = None
            if isinstance(storage, dict):
                volumes = [row for row in as_list(storage.get("Volumes")) if isinstance(row, dict)]
                c_rows = [row for row in volumes if text(row.get("DriveLetter")).upper() == "C"]
                d_rows = [row for row in volumes if text(row.get("DriveLetter")).upper() == "D"]
                c_gb = bytes_to_gb(c_rows[0].get("SizeBytes")) if c_rows else None
                d_gb = bytes_to_gb(d_rows[0].get("SizeBytes")) if d_rows else None
                ipc0072_ist = {
                    "C": {"SizeGB": round(c_gb, 2) if c_gb is not None else None, "Raw": c_rows[0] if c_rows else None},
                    "D": {"SizeGB": round(d_gb, 2) if d_gb is not None else None, "Raw": d_rows[0] if d_rows else None},
                }
                if c_gb is not None and d_gb is not None:
                    ipc0072_state = (
                        c_gb >= c_min_gb
                        and abs(d_gb - d_expected_gb) <= d_tolerance_gb
                    )

            checks["IPC0072"] = make_check(
                "IPC0072",
                "Partition (C: mindestens 100 GB; D Rest)",
                ipc0072_state,
                {
                    "ComputerType": "ES",
                    "C_MinimumSizeGB": c_min_gb,
                    "D_ExpectedSizeGB": d_expected_gb,
                    "D_ToleranceGB": d_tolerance_gb,
                },
                ipc0072_ist,
                "Initial_Valid.Storage.Volumes",
                "C: wird als Mindestgroesse bewertet; D: gegen den ES-Sollwert mit Toleranz.",
            )

            # --------------------------------------------------------------
            # IPC0078 - HUP nur pruefen, wenn in Semaphore mindestens ein
            # erwartetes Produktregex hinterlegt wurde. Leere Liste = bewusst
            # ignoriert, nicht NOK und nicht NICHT_PRUEFBAR.
            # --------------------------------------------------------------
            software_expected = as_dict(expected.get("software"))
            hup_expected = as_dict(software_expected.get("hup"))
            hup_patterns = [text(x) for x in as_list(hup_expected.get("expected_name_regexes")) if text(x).strip()]
            if not hup_patterns:
                checks["IPC0078"] = make_ignored(
                    "IPC0078",
                    "HUP installieren",
                    "IGNORIERT: In Semaphore sind keine erwarteten HUP-Produktnamen/Regexe eingetragen.",
                    "Semaphore: ipc_es_validation_expected.software.hup.expected_name_regexes",
                )
            elif isinstance(installed_software, dict):
                products = software_products(installed_software)
                per_pattern = []
                overall_hup = True
                for pattern in hup_patterns:
                    matches = find_products(products, pattern)
                    ok = bool(matches)
                    overall_hup = overall_hup and ok
                    per_pattern.append({"ExpectedNameRegex": pattern, "Matches": matches, "OK": ok})
                checks["IPC0078"] = make_check(
                    "IPC0078",
                    "HUP installieren",
                    overall_hup,
                    {"ExpectedNameRegexes": hup_patterns},
                    per_pattern,
                    "Software_PCS7_Components_Valid.InstalledSoftware.AllProducts",
                )
            else:
                checks["IPC0078"] = make_check(
                    "IPC0078",
                    "HUP installieren",
                    None,
                    {"ExpectedNameRegexes": hup_patterns},
                    None,
                    "Software_PCS7_Components_Valid.InstalledSoftware.AllProducts",
                )

            # --------------------------------------------------------------
            # IPC0079 - Speed & Duplex auf Auto Negotiation fuer alle
            # aktivierten physischen Netzwerkadapter.
            # --------------------------------------------------------------
            ipc0079_state = None
            ipc0079_ist = None
            if isinstance(network_adapters, list):
                active_physical = [a for a in physical_adapters if adapter_is_enabled(a) is True]
                details = []
                explicit_failure = False
                missing_property = False
                for adapter in active_physical:
                    candidates = []
                    for prop in as_list(as_dict(adapter).get("AdvancedProperties")):
                        if not isinstance(prop, dict):
                            continue
                        searchable = "{0} {1}".format(text(prop.get("DisplayName")), text(prop.get("RegistryKeyword")))
                        if regex_match(r"speed.*duplex|geschwindigkeit.*duplex|\*?speedduplex", searchable):
                            candidates.append(prop)
                    if not candidates:
                        missing_property = True
                        adapter_ok = None
                    else:
                        adapter_ok = any(
                            regex_match(r"^(auto|automatisch|auto negotiation|automatische aushandlung)$", text(prop.get("DisplayValue")).strip())
                            or any(text(v).strip() == "0" for v in as_list(prop.get("RegistryValue")))
                            for prop in candidates
                        )
                        if adapter_ok is False:
                            explicit_failure = True
                    details.append({"Name": adapter.get("Name"), "Properties": candidates, "OK": adapter_ok})
                ipc0079_ist = details
                if active_physical:
                    if explicit_failure:
                        ipc0079_state = False
                    elif missing_property:
                        ipc0079_state = None
                    else:
                        ipc0079_state = True

            checks["IPC0079"] = make_check(
                "IPC0079",
                "Einstellungen Netzwerkkarte ueberpruefen (Speed & Duplex)",
                ipc0079_state,
                {"SpeedAndDuplex": "Auto Negotiation"},
                ipc0079_ist,
                "Initial_Valid.NetworkAdapters[].AdvancedProperties",
            )

            # --------------------------------------------------------------
            # IPC0080 - Energiesparoption der aktivierten physischen NICs.
            # Disabled/False sowie Unsupported gelten als nicht aktivierte
            # Abschaltfunktion. Ein explizites Enabled ergibt NOK.
            # --------------------------------------------------------------
            ipc0080_state = None
            ipc0080_ist = None
            if isinstance(network_adapters, list):
                active_physical = [a for a in physical_adapters if adapter_is_enabled(a) is True]
                details = []
                explicit_failure = False
                unknown = False
                for adapter in active_physical:
                    pm = as_dict(adapter.get("PowerManagement"))
                    raw = pm.get("AllowComputerToTurnOffDevice") if pm else None
                    normalized = text(raw).strip().lower()
                    if normalized in {"disabled", "false", "0", "unsupported", "not supported", "nicht unterstuetzt"}:
                        adapter_ok = True
                    elif normalized in {"enabled", "true", "1"}:
                        adapter_ok = False
                        explicit_failure = True
                    else:
                        adapter_ok = None
                        unknown = True
                    details.append({"Name": adapter.get("Name"), "AllowComputerToTurnOffDevice": raw, "OK": adapter_ok})
                ipc0080_ist = details
                if active_physical:
                    if explicit_failure:
                        ipc0080_state = False
                    elif unknown:
                        ipc0080_state = None
                    else:
                        ipc0080_state = True

            checks["IPC0080"] = make_check(
                "IPC0080",
                "Energiesparoptionen fuer Netzwerkkarten deaktivieren",
                ipc0080_state,
                {"AllowComputerToTurnOffDevice": False},
                ipc0080_ist,
                "Initial_Valid.NetworkAdapters[].PowerManagement.AllowComputerToTurnOffDevice",
            )

            # --------------------------------------------------------------
            # IPC0081 / IPC0082 - Windows Features. 0110 sammelt sowohl
            # OptionalFeatures als auch ServerRolesAndFeatures, daher kann die
            # Pruefung ohne zusaetzlichen Live-Zugriff erfolgen.
            # --------------------------------------------------------------
            component_rows = component_records(windows_components)
            netfx35 = component_matches(component_rows, r"^(NET-Framework-Core|NetFx3)(?:\s|$)")
            wcf35 = component_matches(
                component_rows,
                r"^(NET-WCF-HTTP-Activation|NET-WCF-NonHTTP-Activ|WCF-HTTP-Activation|WCF-NonHTTP-Activation)(?:\s|$)",
            )
            netfx_known = bool(netfx35)
            netfx_ok = netfx_known and any(component_enabled(row) is True for row in netfx35)
            wcf_ok = all(component_enabled(row) is not True for row in wcf35)
            ipc0081_state = (netfx_ok and wcf_ok) if netfx_known else None
            checks["IPC0081"] = make_check(
                "IPC0081",
                "Microsoft .NET Framework 3.5 aktivieren",
                ipc0081_state,
                {"NETFramework35": "aktiviert", "WCFActivation35": "nicht aktiviert"},
                {"NetFx35": netfx35, "WCFActivation35": wcf35},
                "Initial_Valid.WindowsComponents",
            )

            msmq = component_matches(component_rows, r"^MSMQ-Server(?:\s|$)")
            ipc0082_state = None if not component_rows else (bool(msmq) and any(component_enabled(row) is True for row in msmq))
            checks["IPC0082"] = make_check(
                "IPC0082",
                "Microsoft Message Queue (MSMQ) Server aktivieren",
                ipc0082_state,
                {"MSMQ-Server": "aktiviert"},
                msmq if msmq else None,
                "Initial_Valid.WindowsComponents",
            )

            # IPC0046, IPC0047, IPC0048, IPC0055, IPC0063, IPC0066,
            # IPC0070, IPC0073, IPC0074, IPC0075 und IPC0076 werden
            # nachfolgend per direkter read-only PowerShell-Pruefung ergaenzt.

            return checks, information

        with library_path.open("r", encoding="utf-8-sig") as handle:
            library = json.load(handle)

        if not isinstance(library, dict) or library.get("library_type") != "IPC_Information_Library":
            raise RuntimeError("Die Eingabedatei ist keine gueltige IPC_Information_Library von 0150.")

        library_hosts = as_dict(library.get("hosts"))
        output_hosts = {}
        ok_total = 0
        nok_total = 0
        not_testable_total = 0
        ignored_total = 0
        information_total = 0

        # Wichtig: OS Server und OS Client werden in 0160 bewusst komplett ignoriert.
        for ip in sorted(library_hosts, key=ip_sort_key):
            source_host = as_dict(library_hosts[ip])
            if text(source_host.get("classification")) != "ES":
                continue

            checks, information = evaluate_es(source_host)

            ok_total += sum(
                1 for item in checks.values()
                if as_dict(item).get("status") == "OK"
            )
            nok_total += sum(
                1 for item in checks.values()
                if as_dict(item).get("status") == "NOK"
            )
            not_testable_total += sum(
                1 for item in checks.values()
                if as_dict(item).get("status") == "NICHT_PRUEFBAR"
            )
            ignored_total += sum(
                1 for item in checks.values()
                if as_dict(item).get("status") == "IGNORIERT"
            )
            information_total += sum(
                1 for item in information.values()
                if as_dict(item).get("status") == "INFORMATION"
            )

            access = as_dict(source_host.get("zugriff"))
            output_hosts[ip] = {
                "ip_address": ip,
                "computer_name": source_host.get("computer_name"),
                "classification": "ES",
                "ansible_access": bool(access.get("ansible_access")),
                "data_quality": source_host.get("datenqualitaet"),
                "pruefungen": {
                    task_id: checks[task_id]
                    for task_id in TASK_IDS
                    if task_id in checks
                },
                "informationen": {
                    task_id: information[task_id]
                    for task_id in TASK_IDS
                    if task_id in information
                },
            }

        output = {
            "schema_version": "2.0",
            "validation_type": "IPC_ES_ID_Validation",
            "generated_at_utc": datetime.now(timezone.utc).isoformat(),
            "scope": {
                "included_classifications": ["ES"],
                "ignored_classifications": ["OS_Server", "OS_Client", "Kein_Zugriff"],
                "ids": TASK_IDS,
            },
            "sources": {
                "information_library": str(library_path),
                "source_playbooks_unchanged": [
                    "0000IPC_Discovery_Classification",
                    "0110IPC_ES_Initial_Installation",
                    "0150IPC_Information_Library",
                ],
            },
            "summary": {
                "es_hosts_total": len(output_hosts),
                "checks_ok_total": ok_total,
                "checks_nok_total": nok_total,
                "checks_not_testable_total": not_testable_total,
                "checks_ignored_total": ignored_total,
                "information_total": information_total,
            },
            "hosts": output_hosts,
        }

        output_path.parent.mkdir(parents=True, exist_ok=True)
        csv_path.parent.mkdir(parents=True, exist_ok=True)

        json_tmp = output_path.with_name(output_path.name + ".tmp")
        with json_tmp.open("w", encoding="utf-8", newline="\n") as handle:
            json.dump(output, handle, ensure_ascii=False, indent=2)
            handle.write("\n")
            handle.flush()
            os.fsync(handle.fileno())
        os.replace(str(json_tmp), str(output_path))

        csv_tmp = csv_path.with_name(csv_path.name + ".tmp")
        with csv_tmp.open("w", encoding="utf-8-sig", newline="") as handle:
            writer = csv.writer(handle, delimiter=";", quoting=csv.QUOTE_MINIMAL)
            writer.writerow([
                "IP-Adresse",
                "Rechnername",
                "Computerart",
                "Ansible-Zugriff",
                *TASK_IDS,
            ])

            for ip in sorted(output_hosts, key=ip_sort_key):
                host = output_hosts[ip]
                row = [
                    ip,
                    host.get("computer_name") or "",
                    "ES",
                    "JA" if host.get("ansible_access") else "NEIN",
                ]

                checks = as_dict(host.get("pruefungen"))
                information = as_dict(host.get("informationen"))
                for task_id in TASK_IDS:
                    if task_id in checks:
                        row.append(as_dict(checks[task_id]).get("status") or "NICHT_PRUEFBAR")
                    elif task_id in information:
                        info = as_dict(information[task_id])
                        if info.get("status") != "INFORMATION":
                            row.append("NICHT_PRUEFBAR")
                        else:
                            row.append(compact_info(task_id, info.get("ist")))
                    else:
                        row.append("")
                writer.writerow(row)

            handle.flush()
            os.fsync(handle.fileno())
        os.replace(str(csv_tmp), str(csv_path))

        print(json.dumps({
            "json": str(output_path),
            "csv": str(csv_path),
            "summary": output["summary"],
        }, ensure_ascii=False))
        PY
      args:
        executable: /bin/bash
      register: ipc_es_validation_build
      changed_when: true

    - name: Erzeugte 0160-JSON-Datei pruefen
      ansible.builtin.stat:
        path: "{{ ipc_es_validation_output_file }}"
      register: ipc_es_validation_output_stat

    - name: Abbrechen wenn 0160 keine JSON-Datei erzeugt hat
      ansible.builtin.fail:
        msg: >-
          {{ ipc_es_validation_output_file }} wurde nicht erzeugt.
          Generatorausgabe: {{ ipc_es_validation_build.stdout | default('') }}
      when: not (ipc_es_validation_output_stat.stat.exists | default(false))

    - name: 0160-Ergebnis einlesen
      ansible.builtin.slurp:
        src: "{{ ipc_es_validation_output_file }}"
      register: ipc_es_validation_output_raw

    - name: Bibliotheksbasierte 0160-Vorpruefung anzeigen
      ansible.builtin.debug:
        msg:
          - "Nur Computerart ES wurde ausgewertet."
          - "Die Live-Pruefungen IPC0046, IPC0047, IPC0048, IPC0055, IPC0063, IPC0066, IPC0070, IPC0073, IPC0074, IPC0075 und IPC0076 folgen im naechsten Play."
          - "JSON: {{ ipc_es_validation_output_file }}"
          - "CSV: {{ ipc_es_validation_csv_file }}"

- name: "0160 IPC ES - Direkte Read-only-Pruefungen fuer Hotkeys, Copy Settings und DNS/WINS"
  hosts: ipc_es_0160_live_targets
  gather_facts: false
  become: false
  any_errors_fatal: false

  tasks:
    - name: WinRM-Verbindung fuer direkte 0160-Pruefungen testen
      ansible.windows.win_ping:
      register: ipc_0160_live_ping
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Direkte read-only Pruefungen fuer Sprache Netzwerk UltraVNC und Desktop ausfuehren
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'

        function New-ValidationResult {
            param(
                [Parameter(Mandatory=$true)][string]$Id,
                [Parameter(Mandatory=$true)][string]$Name,
                [Parameter(Mandatory=$true)][string]$Status,
                [Parameter(Mandatory=$true)]$Soll,
                [Parameter(Mandatory=$false)]$Ist,
                [Parameter(Mandatory=$true)][string]$Quelle,
                [Parameter(Mandatory=$false)][string]$Hinweis
            )

            $result = [ordered]@{
                id       = $Id
                aufgabe  = $Name
                pruefart = 'SOLLWERT'
                status   = $Status
                soll     = $Soll
                ist      = $Ist
                quelle   = $Quelle
            }
            if ($Hinweis) {
                $result.hinweis = $Hinweis
            }
            return [pscustomobject]$result
        }

        function Get-InternationalState {
            param([Parameter(Mandatory=$true)][string]$Path)

            if (-not (Test-Path -LiteralPath $Path)) {
                return [pscustomobject][ordered]@{
                    RegistryPath = $Path
                    Exists       = $false
                    LocaleName   = $null
                    Locale       = $null
                    sLanguage    = $null
                }
            }

            $value = Get-ItemProperty -LiteralPath $Path -ErrorAction Stop
            return [pscustomobject][ordered]@{
                RegistryPath = $Path
                Exists       = $true
                LocaleName   = if ($null -ne $value.LocaleName) { [string]$value.LocaleName } else { $null }
                Locale       = if ($null -ne $value.Locale) { [string]$value.Locale } else { $null }
                sLanguage    = if ($null -ne $value.sLanguage) { [string]$value.sLanguage } else { $null }
            }
        }

        function Test-GermanInternationalState {
            param($State)

            if ($null -eq $State -or -not $State.Exists) {
                return $false
            }

            $localeName = [string]$State.LocaleName
            $locale = [string]$State.Locale
            return (
                $localeName -match '^de-DE$' -or
                $locale -match '^(0000)?0407$'
            )
        }

        $checks = [ordered]@{}

        # --------------------------------------------------------------
        # IPC0046 / IPC0047
        # Windows legt die klassische Hotkey-Auswahl unter
        # HKCU:\Keyboard Layout\Toggle ab. Der Wert 3 bedeutet
        # "Nicht zugewiesen". Beide Installationsschritte beschreiben
        # denselben technischen Endzustand und werden deshalb gegen
        # dieselbe belastbare Registryquelle bewertet.
        # --------------------------------------------------------------
        $togglePath = 'HKCU:\Keyboard Layout\Toggle'
        $toggleExists = Test-Path -LiteralPath $togglePath
        $toggle = $null
        if ($toggleExists) {
            $toggle = Get-ItemProperty -LiteralPath $togglePath -ErrorAction Stop
        }

        $toggleState = [ordered]@{
            RegistryPath   = $togglePath
            RegistryExists = $toggleExists
            RunAsUser      = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            Hotkey         = if ($toggle) { [string]$toggle.Hotkey } else { $null }
            LanguageHotkey = if ($toggle) { [string]$toggle.'Language Hotkey' } else { $null }
            LayoutHotkey   = if ($toggle) { [string]$toggle.'Layout Hotkey' } else { $null }
        }

        $hotkeysDisabled = (
            $toggleExists -and
            $toggleState.Hotkey -eq '3' -and
            $toggleState.LanguageHotkey -eq '3' -and
            $toggleState.LayoutHotkey -eq '3'
        )
        $hotkeyStatus = if ($hotkeysDisabled) { 'OK' } else { 'NOK' }
        $hotkeySoll = [ordered]@{
            Hotkey         = '3'
            LanguageHotkey = '3'
            LayoutHotkey   = '3'
            Bedeutung      = 'Nicht zugewiesen'
        }

        $checks['IPC0046'] = New-ValidationResult `
            -Id 'IPC0046' `
            -Name 'Hot-Keys abschalten (Auswahl: Keine)' `
            -Status $hotkeyStatus `
            -Soll $hotkeySoll `
            -Ist $toggleState `
            -Quelle 'Direkt/PowerShell/HKCU:\Keyboard Layout\Toggle' `
            -Hinweis 'Die Pruefung bezieht sich auf den Benutzer, unter dem die WinRM-Verbindung ausgefuehrt wird.'

        $checks['IPC0047'] = New-ValidationResult `
            -Id 'IPC0047' `
            -Name 'Tastenkombination fuer Eingabesprachen deaktivieren' `
            -Status $hotkeyStatus `
            -Soll $hotkeySoll `
            -Ist $toggleState `
            -Quelle 'Direkt/PowerShell/HKCU:\Keyboard Layout\Toggle' `
            -Hinweis 'IPC0046 und IPC0047 beschreiben denselben technischen Registry-Endzustand und werden deshalb konsistent bewertet.'

        # --------------------------------------------------------------
        # IPC0048 - Copy Settings fuer Willkommensseite und neue Benutzer
        # .DEFAULT ist der System-/Welcome-Screen-Account. Das Profil fuer
        # neue Benutzer liegt dagegen in C:\Users\Default\NTUSER.DAT.
        # Fuer die Pruefung wird dieses Hive nur temporaer eingebunden,
        # ausgelesen und in jedem Fall wieder entladen. Es werden keine
        # Registrywerte veraendert.
        # --------------------------------------------------------------
        $currentUserIntl = Get-InternationalState 'HKCU:\Control Panel\International'
        $welcomeIntl = Get-InternationalState 'Registry::HKEY_USERS\.DEFAULT\Control Panel\International'

        $defaultHivePath = 'C:\Users\Default\NTUSER.DAT'
        $mountName = 'ANSIBLE_0160_DEFAULT_' + $PID
        $mountRegPath = 'HKU\' + $mountName
        $mountProviderPath = 'Registry::HKEY_USERS\' + $mountName
        $defaultUserIntl = $null
        $defaultUserReadError = $null
        $hiveLoaded = $false

        try {
            if (-not (Test-Path -LiteralPath $defaultHivePath)) {
                throw "Default-User-Hive wurde nicht gefunden: $defaultHivePath"
            }

            $loadOutput = & reg.exe load $mountRegPath $defaultHivePath 2>&1
            if ($LASTEXITCODE -ne 0) {
                throw ("reg.exe load fehlgeschlagen: " + ($loadOutput -join ' '))
            }
            $hiveLoaded = $true

            $defaultUserIntl = Get-InternationalState ($mountProviderPath + '\Control Panel\International')
        }
        catch {
            $defaultUserReadError = $_.Exception.Message
        }
        finally {
            if ($hiveLoaded) {
                [GC]::Collect()
                [GC]::WaitForPendingFinalizers()
                $unloadOutput = & reg.exe unload $mountRegPath 2>&1
                if ($LASTEXITCODE -ne 0 -and -not $defaultUserReadError) {
                    $defaultUserReadError = "Default-User-Hive konnte nach der Read-only-Pruefung nicht entladen werden: " + ($unloadOutput -join ' ')
                }
            }
        }

        $welcomeGerman = Test-GermanInternationalState $welcomeIntl
        $defaultUserGerman = if ($null -ne $defaultUserIntl) {
            Test-GermanInternationalState $defaultUserIntl
        } else {
            $false
        }

        if ($defaultUserReadError) {
            $ipc0048Status = 'NICHT_PRUEFBAR'
        }
        elseif ($welcomeGerman -and $defaultUserGerman) {
            $ipc0048Status = 'OK'
        }
        else {
            $ipc0048Status = 'NOK'
        }

        $copySettingsIst = [ordered]@{
            CurrentUser      = $currentUserIntl
            WelcomeScreen    = $welcomeIntl
            DefaultUser      = $defaultUserIntl
            DefaultUserHive  = $defaultHivePath
            DefaultUserError = $defaultUserReadError
        }

        $checks['IPC0048'] = New-ValidationResult `
            -Id 'IPC0048' `
            -Name 'Region - Copy Settings fuer Willkommensseite und neue Benutzer' `
            -Status $ipc0048Status `
            -Soll ([ordered]@{
                WelcomeScreen = 'Deutsch (de-DE)'
                NewUsers      = 'Deutsch (de-DE)'
            }) `
            -Ist $copySettingsIst `
            -Quelle 'Direkt/PowerShell/Registry International + C:\Users\Default\NTUSER.DAT' `
            -Hinweis 'Das Default-User-Hive wird nur temporaer eingebunden und ohne Aenderung von Einstellungen wieder entladen.'

        # --------------------------------------------------------------
        # IPC0055 - DNS/WINS am Terminalbus. DNS wird ueber die Windows-
        # Netzwerkschnittstelle gelesen. Fuer WINS wird zusaetzlich die
        # NetBT-NameServerList verwendet, weil sie mehr als nur Primary/
        # Secondary enthalten kann. Alles ist rein lesend.
        # --------------------------------------------------------------
        $terminalbusNameRegex = {{ ipc_es_validation_expected.network.terminalbus.name_regex | to_json }}
        # Ansible/Jinja gibt die Listen als JSON-Array aus. ConvertFrom-Json
        # macht daraus verlaesslich PowerShell-Arrays, auch bei nur einem Wert.
        $expectedDnsServers = @(({{ ipc_es_validation_expected.network.terminalbus.dns_servers | to_json | quote }}) | ConvertFrom-Json)
        $expectedWinsServers = @(({{ ipc_es_validation_expected.network.terminalbus.wins_servers | to_json | quote }}) | ConvertFrom-Json)

        function Convert-ToStringArray {
            param($Value)
            if ($null -eq $Value) { return @() }
            $items = @()
            foreach ($entry in @($Value)) {
                if ($null -eq $entry) { continue }
                $raw = [string]$entry
                if ([string]::IsNullOrWhiteSpace($raw)) { continue }
                if ($raw -match ',') {
                    $items += @($raw -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
                }
                else {
                    $items += $raw.Trim()
                }
            }
            return @($items)
        }

        function Test-OrderedStringArrayEqual {
            param([string[]]$Actual, [string[]]$Expected)
            $actualValues = @(Convert-ToStringArray $Actual)
            $expectedValues = @(Convert-ToStringArray $Expected)
            if ($actualValues.Count -ne $expectedValues.Count) { return $false }
            for ($i = 0; $i -lt $expectedValues.Count; $i++) {
                if (-not [string]::Equals($actualValues[$i], $expectedValues[$i], [System.StringComparison]::OrdinalIgnoreCase)) {
                    return $false
                }
            }
            return $true
        }

        $terminalAdapters = @(Get-NetAdapter -IncludeHidden -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -match $terminalbusNameRegex })

        $networkResults = @()
        $networkOK = ($terminalAdapters.Count -gt 0)

        foreach ($adapter in $terminalAdapters) {
            $dnsEntry = @(Get-DnsClientServerAddress -InterfaceIndex $adapter.ifIndex -AddressFamily IPv4 -ErrorAction SilentlyContinue | Select-Object -First 1)
            $dnsActual = if ($dnsEntry.Count -gt 0) { @($dnsEntry[0].ServerAddresses) } else { @() }

            $guidText = ([string]$adapter.InterfaceGuid).Trim('{}')
            $netbtRoot = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
            $candidatePaths = @(
                (Join-Path $netbtRoot ('Tcpip_{' + $guidText + '}')),
                (Join-Path $netbtRoot ('Tcpip_' + $guidText))
            )
            $netbtPath = $candidatePaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1

            $winsActual = @()
            $winsSource = $null
            if ($netbtPath) {
                $netbt = Get-ItemProperty -LiteralPath $netbtPath -ErrorAction SilentlyContinue
                if ($null -ne $netbt -and $null -ne $netbt.NameServerList) {
                    $winsActual = @(Convert-ToStringArray $netbt.NameServerList)
                    $winsSource = 'NetBT NameServerList'
                }
            }

            # Rueckfall auf WMI/CIM Primary/Secondary, falls NameServerList
            # auf diesem Windows-Stand nicht vorhanden ist.
            if ($winsActual.Count -eq 0) {
                $cim = @(Get-CimInstance Win32_NetworkAdapterConfiguration -Filter ("InterfaceIndex=" + $adapter.ifIndex) -ErrorAction SilentlyContinue | Select-Object -First 1)
                if ($cim.Count -gt 0) {
                    $winsActual = @(
                        [string]$cim[0].WINSPrimaryServer,
                        [string]$cim[0].WINSSecondaryServer
                    ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
                    $winsSource = 'Win32_NetworkAdapterConfiguration Primary/Secondary'
                }
            }

            $dnsOK = Test-OrderedStringArrayEqual -Actual $dnsActual -Expected $expectedDnsServers
            $winsOK = Test-OrderedStringArrayEqual -Actual $winsActual -Expected $expectedWinsServers
            $adapterOK = $dnsOK -and $winsOK
            $networkOK = $networkOK -and $adapterOK

            $networkResults += [pscustomobject][ordered]@{
                Name          = $adapter.Name
                InterfaceIndex = $adapter.ifIndex
                InterfaceGuid = [string]$adapter.InterfaceGuid
                DNS = [ordered]@{
                    Expected = @($expectedDnsServers)
                    Actual   = @($dnsActual)
                    OK       = $dnsOK
                }
                WINS = [ordered]@{
                    Expected = @($expectedWinsServers)
                    Actual   = @($winsActual)
                    Source   = $winsSource
                    RegistryPath = $netbtPath
                    OK       = $winsOK
                }
            }
        }

        $ipc0055Status = if ($terminalAdapters.Count -eq 0) { 'NOK' } elseif ($networkOK) { 'OK' } else { 'NOK' }
        $checks['IPC0055'] = New-ValidationResult `
            -Id 'IPC0055' `
            -Name 'DNS und WINS-Server eintragen' `
            -Status $ipc0055Status `
            -Soll ([ordered]@{
                TerminalbusNameRegex = $terminalbusNameRegex
                DNSServers  = @($expectedDnsServers)
                WINSServers = @($expectedWinsServers)
                Comparison  = 'Reihenfolge und Anzahl muessen exakt uebereinstimmen'
            }) `
            -Ist $networkResults `
            -Quelle 'Direkt/PowerShell/Get-DnsClientServerAddress + NetBT NameServerList' `
            -Hinweis 'Die Sollwerte sind rechnertyp-/projektspezifisch in Semaphore hinterlegt.'

        # --------------------------------------------------------------
        # IPC0063 - Netzwerkermittlung und Datei-/Druckerfreigabe.
        # Geprueft wird der wirksame Firewall-Endzustand. Deutsche und
        # englische Anzeigenamen werden beruecksichtigt.
        # --------------------------------------------------------------
        $allFirewallRules = @(Get-NetFirewallRule -PolicyStore ActiveStore -ErrorAction SilentlyContinue)
        $discoveryRules = @($allFirewallRules | Where-Object {
            $_.DisplayGroup -match '^(Netzwerkerkennung|Network Discovery)$'
        })
        $sharingRules = @($allFirewallRules | Where-Object {
            $_.DisplayGroup -match '^(Datei- und Druckerfreigabe|File and Printer Sharing)$'
        })
        function Test-EnabledInboundAllowRule {
            param($Rules)
            return (@($Rules | Where-Object {
                ([string]$_.Enabled -match '^(True|1)$') -and
                ([string]$_.Direction -eq 'Inbound') -and
                ([string]$_.Action -eq 'Allow')
            }).Count -gt 0)
        }
        $discoveryOK = Test-EnabledInboundAllowRule $discoveryRules
        $sharingOK = Test-EnabledInboundAllowRule $sharingRules
        $ipc0063Status = if ($allFirewallRules.Count -eq 0) { 'NICHT_PRUEFBAR' } elseif ($discoveryOK -and $sharingOK) { 'OK' } else { 'NOK' }
        $checks['IPC0063'] = New-ValidationResult `
            -Id 'IPC0063' `
            -Name 'Sichtbarkeit im Netzwerk' `
            -Status $ipc0063Status `
            -Soll ([ordered]@{ NetworkDiscovery='Enabled'; FileAndPrinterSharing='Enabled' }) `
            -Ist ([ordered]@{
                NetworkDiscovery = [ordered]@{ OK=$discoveryOK; Rules=@($discoveryRules | Select-Object Name,DisplayName,DisplayGroup,Enabled,Direction,Action,Profile) }
                FileAndPrinterSharing = [ordered]@{ OK=$sharingOK; Rules=@($sharingRules | Select-Object Name,DisplayName,DisplayGroup,Enabled,Direction,Action,Profile) }
            }) `
            -Quelle 'Direkt/PowerShell/Get-NetFirewallRule ActiveStore'

        # Gemeinsame UltraVNC-Dateipfade fuer IPC0066 und IPC0070.
        $uvncRoots = @(
            'C:\Program Files\uvnc bvba\UltraVNC',
            'C:\Program Files\UltraVNC',
            'C:\Program Files (x86)\uvnc bvba\UltraVNC',
            'C:\Program Files (x86)\UltraVNC'
        )
        $uvncServices = @(Get-CimInstance Win32_Service -ErrorAction SilentlyContinue | Where-Object {
            ([string]$_.Name -match '(?i)uvnc|winvnc|ultravnc') -or
            ([string]$_.DisplayName -match '(?i)uvnc|winvnc|ultravnc') -or
            ([string]$_.PathName -match '(?i)uvnc|winvnc|ultravnc')
        })
        foreach ($svc in $uvncServices) {
            $rawPath = [string]$svc.PathName
            if ($rawPath -match '^\s*"([^"]+\.exe)"') { $exe = $Matches[1] }
            elseif ($rawPath -match '^\s*([^\s]+\.exe)') { $exe = $Matches[1] }
            else { $exe = $null }
            if ($exe) {
                $root = Split-Path -Parent $exe
                if ($root -and $uvncRoots -notcontains $root) { $uvncRoots += $root }
            }
        }
        $uvncRoots = @($uvncRoots | Select-Object -Unique)

        # --------------------------------------------------------------
        # IPC0066 - File Transfer und User Impersonation deaktiviert.
        # --------------------------------------------------------------
        $iniCandidates = @('C:\ProgramData\UltraVNC\ultravnc.ini')
        foreach ($root in $uvncRoots) { $iniCandidates += (Join-Path $root 'ultravnc.ini') }
        $iniPath = @($iniCandidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1)
        $iniValues = [ordered]@{}
        if ($iniPath.Count -gt 0) {
            foreach ($line in @(Get-Content -LiteralPath $iniPath[0] -ErrorAction SilentlyContinue)) {
                if ($line -match '^\s*([^;#\[=][^=]*)=(.*)$') {
                    $iniValues[$Matches[1].Trim()] = $Matches[2].Trim()
                }
            }
        }
        $ftPresent = $iniValues.Contains('FileTransferEnabled')
        $impPresent = $iniValues.Contains('FTUserImpersonation')
        if ($iniPath.Count -eq 0 -or -not $ftPresent -or -not $impPresent) {
            $ipc0066Status = 'NICHT_PRUEFBAR'
        }
        elseif ([string]$iniValues['FileTransferEnabled'] -eq '0' -and [string]$iniValues['FTUserImpersonation'] -eq '0') {
            $ipc0066Status = 'OK'
        }
        else {
            $ipc0066Status = 'NOK'
        }
        $checks['IPC0066'] = New-ValidationResult `
            -Id 'IPC0066' `
            -Name 'VNC-Einstellungen konfigurieren - File Transfer' `
            -Status $ipc0066Status `
            -Soll ([ordered]@{ FileTransferEnabled='0'; FTUserImpersonation='0' }) `
            -Ist ([ordered]@{
                IniPath = if ($iniPath.Count -gt 0) { $iniPath[0] } else { $null }
                FileTransferEnabled = if ($ftPresent) { $iniValues['FileTransferEnabled'] } else { $null }
                FTUserImpersonation = if ($impPresent) { $iniValues['FTUserImpersonation'] } else { $null }
            }) `
            -Quelle 'Direkt/PowerShell/ultravnc.ini'

        # --------------------------------------------------------------
        # IPC0070 - UltraVNC Server und Viewer vorhanden.
        # --------------------------------------------------------------
        $serverPaths = @()
        $viewerPaths = @()
        foreach ($root in $uvncRoots) {
            $serverPaths += (Join-Path $root 'winvnc.exe')
            $viewerPaths += (Join-Path $root 'vncviewer.exe')
        }
        $serverExisting = @($serverPaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -Unique)
        $viewerExisting = @($viewerPaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -Unique)
        $serverPresent = ($serverExisting.Count -gt 0 -or $uvncServices.Count -gt 0)
        $viewerPresent = ($viewerExisting.Count -gt 0)
        $checks['IPC0070'] = New-ValidationResult `
            -Id 'IPC0070' `
            -Name 'UltraVNC Viewer installieren' `
            -Status $(if ($serverPresent -and $viewerPresent) { 'OK' } else { 'NOK' }) `
            -Soll ([ordered]@{ UltraVNCServer=$true; UltraVNCViewer=$true }) `
            -Ist ([ordered]@{
                ServerPresent=$serverPresent
                ViewerPresent=$viewerPresent
                ServerPaths=@($serverExisting)
                ViewerPaths=@($viewerExisting)
                Services=@($uvncServices | Select-Object Name,DisplayName,State,StartMode,PathName)
            }) `
            -Quelle 'Direkt/PowerShell/Dateisystem + Win32_Service'

        # --------------------------------------------------------------
        # IPC0073 - Restore-Image-Ordner muss geloescht sein.
        # --------------------------------------------------------------
        $imagesPath = 'D:\Images'
        $imagesExists = Test-Path -LiteralPath $imagesPath
        $checks['IPC0073'] = New-ValidationResult `
            -Id 'IPC0073' `
            -Name 'Restore Image loeschen' `
            -Status $(if (-not $imagesExists) { 'OK' } else { 'NOK' }) `
            -Soll ([ordered]@{ Path=$imagesPath; Exists=$false }) `
            -Ist ([ordered]@{ Path=$imagesPath; Exists=$imagesExists }) `
            -Quelle 'Direkt/PowerShell/Test-Path'

        # --------------------------------------------------------------
        # IPC0074 / IPC0075 - Taskleisten-Endzustand im aktuellen Benutzer.
        # --------------------------------------------------------------
        $explorerAdvanced = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        $advanced = if (Test-Path -LiteralPath $explorerAdvanced) { Get-ItemProperty -LiteralPath $explorerAdvanced -ErrorAction SilentlyContinue } else { $null }
        $disablePreview = if ($advanced -and $advanced.PSObject.Properties.Name -contains 'DisablePreviewDesktop') { [int]$advanced.DisablePreviewDesktop } else { $null }
        $glomLevel = if ($advanced -and $advanced.PSObject.Properties.Name -contains 'TaskbarGlomLevel') { [int]$advanced.TaskbarGlomLevel } else { $null }
        $searchMode = if ($advanced -and $advanced.PSObject.Properties.Name -contains 'SearchboxTaskbarMode') { [int]$advanced.SearchboxTaskbarMode } else { $null }
        $ipc0074Status = if ($null -eq $advanced -or $null -eq $disablePreview -or $null -eq $glomLevel) { 'NICHT_PRUEFBAR' } elseif ($disablePreview -eq 1 -and $glomLevel -eq 1) { 'OK' } else { 'NOK' }
        $checks['IPC0074'] = New-ValidationResult `
            -Id 'IPC0074' `
            -Name 'Taskleiste' `
            -Status $ipc0074Status `
            -Soll ([ordered]@{ AeroPeek='aus'; DisablePreviewDesktop=1; Gruppierung='wenn Taskleiste voll'; TaskbarGlomLevel=1 }) `
            -Ist ([ordered]@{ RegistryPath=$explorerAdvanced; DisablePreviewDesktop=$disablePreview; TaskbarGlomLevel=$glomLevel }) `
            -Quelle 'Direkt/PowerShell/HKCU Explorer Advanced' `
            -Hinweis 'HKCU bezieht sich auf den Benutzer, unter dem WinRM ausgefuehrt wird.'

        $ipc0075Status = if ($null -eq $advanced -or $null -eq $searchMode) { 'NICHT_PRUEFBAR' } elseif ($searchMode -eq 1) { 'OK' } else { 'NOK' }
        $checks['IPC0075'] = New-ValidationResult `
            -Id 'IPC0075' `
            -Name 'Lupe zur Suche in Taskleiste' `
            -Status $ipc0075Status `
            -Soll ([ordered]@{ SearchboxTaskbarMode=1; Darstellung='Suchsymbol' }) `
            -Ist ([ordered]@{ RegistryPath=$explorerAdvanced; SearchboxTaskbarMode=$searchMode }) `
            -Quelle 'Direkt/PowerShell/HKCU Explorer Advanced' `
            -Hinweis 'HKCU bezieht sich auf den Benutzer, unter dem WinRM ausgefuehrt wird.'

        # --------------------------------------------------------------
        # IPC0076 - Desktopicons Computer/Netzwerk/Papierkorb sichtbar und
        # drei unerwuenschte Common-Desktop-Verknuepfungen nicht vorhanden.
        # --------------------------------------------------------------
        $iconPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel'
        $iconProps = if (Test-Path -LiteralPath $iconPath) { Get-ItemProperty -LiteralPath $iconPath -ErrorAction SilentlyContinue } else { $null }
        function Get-DesktopIconVisible {
            param([string]$Clsid, [bool]$DefaultVisible)
            if ($iconProps -and $iconProps.PSObject.Properties.Name -contains $Clsid) {
                return ([int]$iconProps.$Clsid -eq 0)
            }
            return $DefaultVisible
        }
        $computerClsid = '{20D04FE0-3AEA-1069-A2D8-08002B30309D}'
        $networkClsid = '{F02C1A0D-BE21-4350-88B0-7367FC96EF3C}'
        $recycleClsid = '{645FF040-5081-101B-9F08-00AA002F954E}'
        $computerVisible = Get-DesktopIconVisible $computerClsid $false
        $networkVisible = Get-DesktopIconVisible $networkClsid $false
        $recycleVisible = Get-DesktopIconVisible $recycleClsid $true
        $commonDesktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
        if ([string]::IsNullOrWhiteSpace($commonDesktop)) { $commonDesktop = 'C:\Users\Public\Desktop' }
        $forbiddenNames = @('Create Restore USB','File Explorer','Internet Explorer')
        $forbiddenFound = @()
        if (Test-Path -LiteralPath $commonDesktop) {
            foreach ($item in @(Get-ChildItem -LiteralPath $commonDesktop -Force -ErrorAction SilentlyContinue)) {
                $base = [System.IO.Path]::GetFileNameWithoutExtension($item.Name)
                if ($forbiddenNames -contains $base) { $forbiddenFound += $item.FullName }
            }
        }
        $desktopOK = $computerVisible -and $networkVisible -and $recycleVisible -and ($forbiddenFound.Count -eq 0)
        $checks['IPC0076'] = New-ValidationResult `
            -Id 'IPC0076' `
            -Name 'Desktop: Computer Netzwerk Papierkorb' `
            -Status $(if ($desktopOK) { 'OK' } else { 'NOK' }) `
            -Soll ([ordered]@{
                ComputerVisible=$true
                NetworkVisible=$true
                RecycleBinVisible=$true
                CommonDesktopAbsent=@($forbiddenNames)
            }) `
            -Ist ([ordered]@{
                RegistryPath=$iconPath
                ComputerVisible=$computerVisible
                NetworkVisible=$networkVisible
                RecycleBinVisible=$recycleVisible
                CommonDesktop=$commonDesktop
                ForbiddenFound=@($forbiddenFound)
            }) `
            -Quelle 'Direkt/PowerShell/HKCU DesktopIcons + CommonDesktopDirectory' `
            -Hinweis 'HKCU bezieht sich auf den Benutzer, unter dem WinRM ausgefuehrt wird.'

        [pscustomobject][ordered]@{
            host   = $env:COMPUTERNAME
            ip     = '{{ ansible_host | default(inventory_hostname) }}'
            checks = $checks
        } | ConvertTo-Json -Depth 12 -Compress
      register: ipc_0160_live_checks
      changed_when: false
      failed_when: false
      when: ipc_0160_live_ping.ping | default('') == 'pong'

    - name: Direkte 0160-Pruefergebnisse lokal speichern
      ansible.builtin.copy:
        content: "{{ ipc_0160_live_checks.stdout | trim }}\n"
        dest: "{{ result_dir }}/.0160_live/{{ ansible_host | default(inventory_hostname) }}.json"
        mode: "0644"
      delegate_to: localhost
      become: false
      when:
        - ipc_0160_live_ping.ping | default('') == 'pong'
        - ipc_0160_live_checks is defined
        - ipc_0160_live_checks.rc | default(1) == 0
        - ipc_0160_live_checks.stdout | default('') | trim | length > 0


- name: "0160 IPC ES - Live-Ergebnisse in JSON und CSV zusammenfuehren"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    ipc_es_validation_output_file: >-
      {{
        ipc_es_id_validation_file
        | default(result_dir ~ '/ipc_es_id_validation_latest.json')
      }}
    ipc_es_validation_csv_file: >-
      {{
        ipc_es_id_validation_csv_file
        | default(result_dir ~ '/ipc_es_id_validation_matrix_latest.csv')
      }}

  tasks:
    - name: Direkte Ergebnisse atomar in 0160-Protokolle uebernehmen
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import csv
        import json
        import os
        from pathlib import Path

        output_path = Path({{ ipc_es_validation_output_file | to_json }})
        csv_path = Path({{ ipc_es_validation_csv_file | to_json }})
        live_dir = Path({{ (result_dir ~ '/.0160_live') | to_json }})
        direct_ids = ["IPC0046", "IPC0047", "IPC0048", "IPC0055", "IPC0063", "IPC0066", "IPC0070", "IPC0073", "IPC0074", "IPC0075", "IPC0076"]

        with output_path.open("r", encoding="utf-8-sig") as handle:
            output = json.load(handle)

        hosts = output.get("hosts") if isinstance(output, dict) else None
        if not isinstance(hosts, dict):
            raise RuntimeError("0160-Ausgabe enthaelt kein gueltiges hosts-Objekt.")

        def missing_direct_check(task_id):
            names = {
                "IPC0046": "Hot-Keys abschalten (Auswahl: Keine)",
                "IPC0047": "Tastenkombination fuer Eingabesprachen deaktivieren",
                "IPC0048": "Region - Copy Settings fuer Willkommensseite und neue Benutzer",
                "IPC0055": "DNS und WINS-Server eintragen",
                "IPC0063": "Sichtbarkeit im Netzwerk",
                "IPC0066": "VNC-Einstellungen konfigurieren - File Transfer",
                "IPC0070": "UltraVNC Viewer installieren",
                "IPC0073": "Restore Image loeschen",
                "IPC0074": "Taskleiste",
                "IPC0075": "Lupe zur Suche in Taskleiste",
                "IPC0076": "Desktop: Computer Netzwerk Papierkorb",
            }
            return {
                "id": task_id,
                "aufgabe": names[task_id],
                "pruefart": "SOLLWERT",
                "status": "NICHT_PRUEFBAR",
                "soll": "Fester Sollwert gemaess Aufgabenliste",
                "ist": None,
                "quelle": "Direkt/PowerShell",
                "hinweis": "Direkte WinRM-Pruefung lieferte fuer dieses ES kein verwertbares Ergebnis.",
            }

        for ip, host in hosts.items():
            if not isinstance(host, dict):
                continue
            checks = host.setdefault("pruefungen", {})
            live_file = live_dir / f"{ip}.json"
            live_checks = {}

            if live_file.exists():
                try:
                    with live_file.open("r", encoding="utf-8-sig") as handle:
                        live_payload = json.load(handle)
                    candidate = live_payload.get("checks") if isinstance(live_payload, dict) else None
                    if isinstance(candidate, dict):
                        live_checks = candidate
                except Exception:
                    live_checks = {}

            for task_id in direct_ids:
                item = live_checks.get(task_id)
                checks[task_id] = item if isinstance(item, dict) else missing_direct_check(task_id)

        ok_total = 0
        nok_total = 0
        not_testable_total = 0
        ignored_total = 0
        information_total = 0
        for host in hosts.values():
            if not isinstance(host, dict):
                continue
            for item in (host.get("pruefungen") or {}).values():
                if not isinstance(item, dict):
                    continue
                status = item.get("status")
                if status == "OK":
                    ok_total += 1
                elif status == "NOK":
                    nok_total += 1
                elif status == "NICHT_PRUEFBAR":
                    not_testable_total += 1
                elif status == "IGNORIERT":
                    ignored_total += 1
            for item in (host.get("informationen") or {}).values():
                if isinstance(item, dict) and item.get("status") == "INFORMATION":
                    information_total += 1

        output["summary"] = {
            "es_hosts_total": len(hosts),
            "checks_ok_total": ok_total,
            "checks_nok_total": nok_total,
            "checks_not_testable_total": not_testable_total,
            "checks_ignored_total": ignored_total,
            "information_total": information_total,
        }
        output.setdefault("scope", {})["live_validation_ids"] = direct_ids
        output.setdefault("sources", {})["direct_live_checks"] = [
            "IPC0046/IPC0047: HKCU\\Keyboard Layout\\Toggle",
            "IPC0048: Welcome Screen + Default User International Registry",
            "IPC0055: Terminalbus DNS + NetBT WINS NameServerList",
            "IPC0063: aktive Windows-Firewallregeln fuer Netzwerkerkennung und Datei-/Druckerfreigabe",
            "IPC0066: UltraVNC ultravnc.ini",
            "IPC0070: UltraVNC Server/Viewer Dateien und Dienst",
            "IPC0073: D:\\Images",
            "IPC0074/IPC0075: HKCU Explorer Advanced",
            "IPC0076: HKCU DesktopIcons + Common Desktop",
        ]

        json_tmp = output_path.with_name(output_path.name + ".tmp")
        with json_tmp.open("w", encoding="utf-8", newline="\n") as handle:
            json.dump(output, handle, ensure_ascii=False, indent=2)
            handle.write("\n")
            handle.flush()
            os.fsync(handle.fileno())
        os.replace(str(json_tmp), str(output_path))

        if csv_path.exists():
            with csv_path.open("r", encoding="utf-8-sig", newline="") as handle:
                reader = csv.DictReader(handle, delimiter=";")
                fieldnames = list(reader.fieldnames or [])
                rows = list(reader)

            for task_id in direct_ids:
                if task_id not in fieldnames:
                    fieldnames.append(task_id)

            for row in rows:
                ip = row.get("IP-Adresse", "")
                host = hosts.get(ip, {})
                checks = host.get("pruefungen", {}) if isinstance(host, dict) else {}
                for task_id in direct_ids:
                    item = checks.get(task_id, {}) if isinstance(checks, dict) else {}
                    row[task_id] = item.get("status", "NICHT_PRUEFBAR") if isinstance(item, dict) else "NICHT_PRUEFBAR"

            csv_tmp = csv_path.with_name(csv_path.name + ".tmp")
            with csv_tmp.open("w", encoding="utf-8-sig", newline="") as handle:
                writer = csv.DictWriter(
                    handle,
                    fieldnames=fieldnames,
                    delimiter=";",
                    quoting=csv.QUOTE_MINIMAL,
                    extrasaction="ignore",
                )
                writer.writeheader()
                writer.writerows(rows)
                handle.flush()
                os.fsync(handle.fileno())
            os.replace(str(csv_tmp), str(csv_path))

        print(json.dumps({
            "json": str(output_path),
            "csv": str(csv_path),
            "summary": output["summary"],
        }, ensure_ascii=False))
        PY
      args:
        executable: /bin/bash
      register: ipc_0160_merge
      changed_when: true

    - name: Finale 0160-Ergebnisse einlesen
      ansible.builtin.slurp:
        src: "{{ ipc_es_validation_output_file }}"
      register: ipc_0160_final_raw

    - name: Finale 0160-Zusammenfassung anzeigen
      ansible.builtin.debug:
        msg:
          - "Nur IPC ES wurde ausgewertet; OS Server und OS Client wurden ignoriert."
          - "JSON: {{ ipc_es_validation_output_file }}"
          - "CSV: {{ ipc_es_validation_csv_file }}"
          - >-
            Zusammenfassung:
            {{ (ipc_0160_final_raw.content | b64decode | from_json).summary }}
