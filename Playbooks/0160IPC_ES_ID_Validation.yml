        # ------------------------------------------------------------------
        # Bibliothek laden und Grundschema pruefen
        # ------------------------------------------------------------------
        with library_path.open("r", encoding="utf-8-sig") as handle:
            library = json.load(handle)

        if not isinstance(library, dict):
            raise RuntimeError("0150-Informationsbibliothek muss ein JSON-Objekt sein.")

        if library.get("library_type") != "IPC_Information_Library":
            raise RuntimeError(
                "Unerwarteter Bibliothekstyp. Erwartet: IPC_Information_Library."
            )

        hosts = library.get("hosts")
        if not isinstance(hosts, dict):
            raise RuntimeError("0150-Informationsbibliothek enthaelt kein gueltiges hosts-Objekt.")

        role_names = {
            "ES": "ES",
            "OS_Server": "OS Server",
            "OS_Client": "OS Client",
            "Kein_Zugriff": "Unbekannt",
        }

        output_hosts = {}
        total_ok = 0
        total_nok = 0
        es_total = 0

        for ip in sorted(hosts, key=ip_sort_key):
            host = hosts[ip]
            if not isinstance(host, dict):
                continue

            classification = text(host.get("classification")).strip()
            access = as_dict(host.get("zugriff"))
            ansible_access = bool(access.get("ansible_access"))
            computer_type = role_names.get(classification, classification or "Unbekannt")

            entry = {
                "ip_address": ip,
                "computer_name": host.get("computer_name"),
                "computer_type": computer_type,
                "classification_raw": classification or None,
                "ansible_access": ansible_access,
                "ansible_access_status": access.get("status"),
                "ansible_access_error_code": access.get("error_code"),
                "ansible_access_error_reason": access.get("error_reason"),
            }

            if classification == "ES":
                es_total += 1
                checks = evaluate_es(host)
                ok_count = sum(
                    1 for item in checks.values()
                    if item.get("status") == "OK"
                )
                nok_count = sum(
                    1 for item in checks.values()
                    if item.get("status") == "NOK"
                )
                total_ok += ok_count
                total_nok += nok_count

                entry["validation_scope"] = "ES_SOLLSWERTPRUEFUNG"
                entry["summary"] = {
                    "evaluated": len(checks),
                    "ok": ok_count,
                    "nok": nok_count,
                }
                entry["pruefungen"] = checks
            else:
                # OS Server, OS Client und Teilnehmer ohne Zugriff bleiben in
                # der IP-Liste sichtbar, erhalten in dieser ersten Ausbaustufe
                # aber bewusst keine ID-Bewertung.
                entry["validation_scope"] = "IGNORIERT_AKTUELL_NUR_ES"
                entry["summary"] = {
                    "evaluated": 0,
                    "ok": 0,
                    "nok": 0,
                }
                entry["pruefungen"] = {}

            output_hosts[ip] = entry

        evaluated_ids = []
        for host in output_hosts.values():
            if host.get("validation_scope") == "ES_SOLLSWERTPRUEFUNG":
                evaluated_ids = list(host.get("pruefungen", {}).keys())
                break

        output = {
            "schema_version": "1.0",
            "validation_type": "IPC_ES_ID_Sollwertpruefung",
            "generated_at_utc": datetime.now(timezone.utc).isoformat(),
            "scope": {
                "evaluated_computer_type": "ES",
                "os_server_and_os_client_checks": "IGNORED",
                "non_checkable_ids": "IGNORED",
                "status_values": ["OK", "NOK"],
                "rule": (
                    "OK wird nur vergeben, wenn der aktuelle JSON-Datenbestand "
                    "den fuer die ID definierten Sollzustand bestaetigt. "
                    "Fehlende oder widersprechende auswertbare Information ergibt NOK. "
                    "IDs ohne belastbare Sollwertpruefung sind nicht enthalten."
                ),
            },
            "sources": {
                "information_library": str(library_path),
                "upstream": [
                    "0000IPC_Discovery_Classification",
                    "0110IPC_ES_Initial_Installation",
                    "0120IPC_OS_Server_Initial_Installation",
                    "0130IPC_OS_Client_Initial_Installation",
                    "0150IPC_ES_Information_Library",
                ],
            },
            "evaluated_ids": evaluated_ids,
            "summary": {
                "ip_addresses_total": len(output_hosts),
                "es_total": es_total,
                "checks_ok_total": total_ok,
                "checks_nok_total": total_nok,
            },
            # Python >= 3.7 behaelt Einfuegereihenfolge; die IPs wurden oben
            # numerisch sortiert in dieses Objekt eingefuegt.
            "hosts": output_hosts,
        }

        output_path.parent.mkdir(parents=True, exist_ok=True)

        # Atomisches Schreiben: Leser sehen nie eine halb geschriebene Datei.
        tmp_path = output_path.with_name(output_path.name + ".tmp")
        with tmp_path.open("w", encoding="utf-8", newline="\n") as handle:
            json.dump(output, handle, ensure_ascii=False, indent=2)
            handle.write("\n")
            handle.flush()
            os.fsync(handle.fileno())

        os.replace(str(tmp_path), str(output_path))

        print(json.dumps({
            "output_file": str(output_path),
            "summary": output["summary"],
            "evaluated_ids": output["evaluated_ids"],
        }, ensure_ascii=False))
        PY
      args:
        executable: /bin/bash
      register: id_validation_build
      changed_when: true

    - name: Ergebnisdatei pruefen
      ansible.builtin.stat:
        path: "{{ id_validation_output_file }}"
      register: id_validation_output_stat

    - name: Abbrechen wenn Ergebnisdatei nicht erzeugt wurde
      ansible.builtin.fail:
        msg: >-
          {{ id_validation_output_file }} wurde nicht erzeugt.
          Generator-Ausgabe:
          {{ id_validation_build.stdout | default('') }}
      when: not (id_validation_output_stat.stat.exists | default(false))

    - name: Ergebnisdatei einlesen
      ansible.builtin.slurp:
        src: "{{ id_validation_output_file }}"
      register: id_validation_output_raw

    - name: Ergebnisstruktur validieren
      ansible.builtin.set_fact:
        id_validation_output_data: >-
          {{ id_validation_output_raw.content | b64decode | from_json }}

    - name: Ergebnisstruktur pruefen
      ansible.builtin.assert:
        that:
          - id_validation_output_data.schema_version is defined
          - id_validation_output_data.validation_type == 'IPC_ES_ID_Sollwertpruefung'
          - id_validation_output_data.hosts is mapping
          - id_validation_output_data.summary is mapping
        fail_msg: >-
          Die erzeugte ID-Sollwertdatei besitzt nicht die erwartete Struktur.

    - name: Zusammenfassung anzeigen
      ansible.builtin.debug:
        msg:
          - "Ausgabedatei: {{ id_validation_output_file }}"
          - "IP-Adressen gesamt: {{ id_validation_output_data.summary.ip_addresses_total }}"
          - "ES gesamt: {{ id_validation_output_data.summary.es_total }}"
          - "OK gesamt: {{ id_validation_output_data.summary.checks_ok_total }}"
          - "NOK gesamt: {{ id_validation_output_data.summary.checks_nok_total }}"
          - "Bewertete IDs: {{ id_validation_output_data.evaluated_ids }}"