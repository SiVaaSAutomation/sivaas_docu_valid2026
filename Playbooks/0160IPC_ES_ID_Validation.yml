                    "ComputerName": identity.get("ComputerName"),
                    "DNSHostName": identity.get("DNSHostName"),
                    "FQDN": identity.get("FQDN"),
                }

            information["IPC0015"] = make_information(
                "IPC0015",
                "Rechnernamen anpassen",
