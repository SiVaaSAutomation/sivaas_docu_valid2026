            for adapter in target_adapters:
                properties = as_list(adapter.get("AdvancedProperties"))
                candidates = []
                for prop in properties:
                    if not isinstance(prop, dict):
                        continue
                    display_name = text(prop.get("DisplayName"))
                    keyword = text(prop.get("RegistryKeyword"))
                    if (
                        regex_search(r"(?i)(speed.*duplex|geschwindigkeit.*duplex|link.*speed)", display_name)
                        or regex_search(r"(?i)\*?speedduplex", keyword)
                    ):
                        candidates.append(prop)

                adapter_ok = bool(candidates) and any(
                    regex_search(r"(?i)(auto|automatisch)", prop.get("DisplayValue"))
                    for prop in candidates
                )
                speed_ok = speed_ok and adapter_ok
                speed_details.append({
                    "Name": adapter.get("Name"),
                    "Status": adapter.get("Status"),
                    "LinkSpeed": adapter.get("LinkSpeed"),
