---
# Erkennt erreichbare Netzwerkteilnehmer ueber nmap, prueft bei vorhandenem
# WinRM-Port den Ansible-Zugriff und gruppiert die Teilnehmer in:
#   - ipc_es
#   - ipc_os
#   - ipc_os_client
#   - sonstige
#   - kein_zugriff
#
# Ergebnisdatei:
#   {{ result_dir }}/ipc_discovery_groups_latest.json

- name: IPC-Teilnehmer mit nmap erkennen und temporaer aufnehmen
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    discovery_group: "ipc_discovery_candidates"

  tasks:
    - name: Zeitstempel fuer Discovery setzen
      ansible.builtin.set_fact:
        discovery_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        discovery_timestamp_iso: "{{ lookup('pipe', 'date -Iseconds') }}"

    - name: Benoetigte Semaphore-Variablen pruefen
      ansible.builtin.assert:
        that:
          - target_network is defined
          - nmap_binary is defined
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - result_dir is defined
          - target_network | string | length > 0
          - nmap_binary | string | length > 0
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - result_dir | string | length > 0
        fail_msg: >-
          Erforderlich sind target_network, nmap_binary, win_user,
          win_password, winrm_transport und result_dir.

    - name: nmap auf dem Ansible-Controller pruefen
      ansible.builtin.command: "{{ nmap_binary }} --version"
      register: nmap_check
      changed_when: false
      failed_when: false

    - name: Abbrechen, wenn nmap nicht ausfuehrbar ist
      ansible.builtin.fail:
        msg: "nmap ist unter {{ nmap_binary }} nicht ausfuehrbar."
      when: nmap_check.rc != 0

    # Zuerst werden alle von nmap als erreichbar erkannten Netzwerkteilnehmer
    # aufgenommen. Dadurch landen auch Teilnehmer ohne offenen WinRM-Port
    # spaeter in der Gruppe kein_zugriff.
    - name: Erreichbare Netzwerkteilnehmer mit nmap erkennen
      ansible.builtin.shell: |
        set -o pipefail
        {{ nmap_binary }} -n -sn {{ target_network }} -oG - |
        awk '/Status: Up/ { print $2 }'
      args:
        executable: /bin/bash
      register: discovery_reachable_scan
      changed_when: false

    - name: Erreichbare Netzwerkteilnehmer speichern
      ansible.builtin.set_fact:
        discovered_reachable_hosts: "{{ discovery_reachable_scan.stdout_lines | default([]) | unique | list }}"

    # Die vorhandene WinRM-nmap-Struktur bleibt erhalten. Sie ermittelt,
    # welche der Teilnehmer Port 5985 und/oder 5986 offen haben und welche
    # Verbindung Ansible anschliessend testen soll.
    - name: Zielnetz nach offenen WinRM-Ports scannen
      ansible.builtin.shell: |
        set -o pipefail
        {{ nmap_binary }} -n -Pn -p 5985,5986 --open {{ target_network }} -oG - |
        awk '
          /Ports:/ {
            host=$2
            has_http = ($0 ~ /5985\/open\/tcp/)
            has_https = ($0 ~ /5986\/open\/tcp/)

            if (has_https) {
              ports = has_http ? "5985,5986" : "5986"
              print host ";5986;https;" ports
            } else if (has_http) {
              print host ";5985;http;5985"
            }
          }
        '
      args:
        executable: /bin/bash
      register: discovery_scan
      changed_when: false

    - name: Gefundene WinRM-Teilnehmer speichern
      ansible.builtin.set_fact:
        discovered_winrm_hosts: "{{ discovery_scan.stdout_lines | default([]) | unique | list }}"

    - name: Discovery-Ergebnis anzeigen
      ansible.builtin.debug:
        msg:
          - "Zielnetz: {{ target_network }}"
          - "Von nmap erreichbare Netzwerkteilnehmer: {{ discovered_reachable_hosts | length }}"
          - "Teilnehmer mit offenem WinRM-Port: {{ discovered_winrm_hosts | length }}"
          - "Erreichbare IPs: {{ discovered_reachable_hosts }}"
          - "WinRM-IP-Adressen: {{ discovered_winrm_hosts | map('regex_replace', ';.*$', '') | list }}"

    # Zuerst alle erreichbaren Teilnehmer aufnehmen. Ohne erkannten WinRM-Port
    # werden sie nicht per win_ping angesprochen, sondern direkt als
    # kein_zugriff behandelt.
    - name: Alle erreichbaren Netzwerkteilnehmer temporaer aufnehmen
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: "{{ discovery_group }}"
        ansible_host: "{{ item }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: 5985
        ansible_winrm_scheme: http
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(180) }}"
        discovery_open_ports: ""
        discovery_winrm_detected: false
      loop: "{{ discovered_reachable_hosts }}"
      no_log: true

    # Teilnehmer mit offenem WinRM-Port werden mit den vom vorhandenen Scan
    # ermittelten Verbindungsdaten aktualisiert. Dieser Schritt nimmt auch
    # Hosts auf, die auf Host-Discovery nicht antworten, aber WinRM offen haben.
    - name: Teilnehmer mit offenem WinRM-Port aktualisieren
      ansible.builtin.add_host:
        name: "{{ item.split(';')[0] }}"
        groups: "{{ discovery_group }}"
        ansible_host: "{{ item.split(';')[0] }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.split(';')[1] | int }}"
        ansible_winrm_scheme: "{{ item.split(';')[2] }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(180) }}"
        discovery_open_ports: "{{ item.split(';')[3] }}"
        discovery_winrm_detected: true
      loop: "{{ discovered_winrm_hosts }}"
      no_log: true


- name: Ansible-Zugriff pruefen und Rollenmerkmale auslesen
  hosts: ipc_discovery_candidates
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: WinRM-Verbindung mit Ansible testen
      ansible.windows.win_ping:
      register: discovery_ping
      when: discovery_winrm_detected | default(false) | bool
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Ansible-Zugriff als Host-Fact speichern
      ansible.builtin.set_fact:
        discovery_ansible_access: >-
          {{
            (discovery_winrm_detected | default(false) | bool)
            and discovery_ping is defined
            and not (discovery_ping.unreachable | default(false) | bool)
            and not (discovery_ping.failed | default(false) | bool)
            and discovery_ping.ping | default('') == 'pong'
          }}

    - name: Rueckmeldung des WinRM-Tests fuer Diagnose speichern
      ansible.builtin.set_fact:
        discovery_access_detail: >-
          {{
            discovery_ping.msg
            | default(discovery_ping.stderr
            | default(discovery_ping.exception
            | default('')))
            | string
            | trim
          }}

    - name: Ursache des Ansible-Zugriffs bestimmen
      ansible.builtin.set_fact:
        discovery_access_error_code: >-
          {% set detail = discovery_access_detail | default('') | lower %}
          {% if discovery_ansible_access | bool %}
          OK
          {% elif not (discovery_winrm_detected | default(false) | bool) %}
          WINRM_PORT_CLOSED
          {% elif '401' in detail or 'unauthorized' in detail or 'authentication' in detail or 'credentials' in detail or 'logon failure' in detail or 'user name or password' in detail or 'access is denied' in detail %}
          AUTHENTICATION_FAILED
          {% elif 'timed out' in detail or 'timeout' in detail %}
          WINRM_TIMEOUT
          {% elif 'certificate' in detail or 'ssl' in detail or 'tls' in detail %}
          WINRM_TLS_ERROR
          {% elif discovery_ping.unreachable | default(false) | bool %}
          WINRM_UNREACHABLE
          {% elif discovery_ping.failed | default(false) | bool %}
          WIN_PING_FAILED
          {% elif discovery_ping.ping | default('') != 'pong' %}
          WIN_PING_NO_PONG
          {% else %}
          UNKNOWN_ACCESS_ERROR
          {% endif %}
        discovery_access_reason: >-
          {% set detail = discovery_access_detail | default('') | lower %}
          {% if discovery_ansible_access | bool %}
          Ansible-/WinRM-Zugriff erfolgreich
          {% elif not (discovery_winrm_detected | default(false) | bool) %}
          Kein offener WinRM-Port 5985/5986 durch nmap erkannt
          {% elif '401' in detail or 'unauthorized' in detail or 'authentication' in detail or 'credentials' in detail or 'logon failure' in detail or 'user name or password' in detail or 'access is denied' in detail %}
          WinRM erreichbar, aber Anmeldung bzw. Authentifizierung fehlgeschlagen
          {% elif 'timed out' in detail or 'timeout' in detail %}
          WinRM-Port offen, aber die Verbindung ist in ein Timeout gelaufen
          {% elif 'certificate' in detail or 'ssl' in detail or 'tls' in detail %}
          WinRM-Verbindung wegen TLS-/Zertifikatsproblem fehlgeschlagen
          {% elif discovery_ping.unreachable | default(false) | bool %}
          WinRM-Port offen, Ziel fuer Ansible jedoch nicht erreichbar
          {% elif discovery_ping.failed | default(false) | bool %}
          Ansible win_ping wurde ausgefuehrt, ist aber fehlgeschlagen
          {% elif discovery_ping.ping | default('') != 'pong' %}
          Ansible win_ping lieferte keine gueltige pong-Antwort
          {% else %}
          Ansible-/WinRM-Zugriff aus unbekanntem Grund fehlgeschlagen
          {% endif %}

    - name: Betriebssystem, Siemens-Produkte und relevante Dienste auslesen
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'
        $ProgressPreference = 'SilentlyContinue'

        $cs = Get-CimInstance Win32_ComputerSystem
        $os = Get-CimInstance Win32_OperatingSystem

        $registryRoots = @(
          'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
          'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
        )

        $roleProductPattern = '(?i)(Siemens|SIMATIC|PCS\s*7|PCS7|WinCC|STEP\s*7|SIMATIC\s+Manager|Engineering\s+System|OS\s*Server|OS\s*Client|CFC|SFC|SQL\s+Server)'
        $products = @()
        foreach ($root in $registryRoots) {
          $products += @(
            Get-ItemProperty $root -ErrorAction SilentlyContinue |
              Where-Object {
                $_.DisplayName -and ([string]$_.DisplayName -match $roleProductPattern)
              } |
              ForEach-Object {
                [ordered]@{
                  name = [string]$_.DisplayName
                  version = [string]$_.DisplayVersion
                  publisher = [string]$_.Publisher
                }
              }
          )
        }

        $products = @($products | Sort-Object name, version -Unique)

        $servicePattern = '(?i)(Siemens|SIMATIC|WinCC|S7|PCS7|SQL)'
        $services = @(
          Get-CimInstance Win32_Service |
            Where-Object {
              ([string]$_.Name -match $servicePattern) -or
              ([string]$_.DisplayName -match $servicePattern)
            } |
            ForEach-Object {
              [ordered]@{
                name = [string]$_.Name
                display_name = [string]$_.DisplayName
                state = [string]$_.State
                start_mode = [string]$_.StartMode
              }
            } |
            Sort-Object name -Unique
        )

        $result = [ordered]@{
          ip = [string]$env:ANSIBLE_DISCOVERY_IP
          ansible_access = $true
          computername = [string]$env:COMPUTERNAME
          domain = [string]$cs.Domain
          part_of_domain = [bool]$cs.PartOfDomain
          manufacturer = [string]$cs.Manufacturer
          model = [string]$cs.Model
          os_caption = [string]$os.Caption
          os_version = [string]$os.Version
          os_build_number = [string]$os.BuildNumber
          os_product_type = [int]$os.ProductType
          installed_products = @($products)
          relevant_services = @($services)
          error = $null
        }

        $result | ConvertTo-Json -Depth 8 -Compress
      args:
        no_profile: true
      environment:
        ANSIBLE_DISCOVERY_IP: "{{ ansible_host | default(inventory_hostname) }}"
      register: discovery_raw
      when: discovery_ansible_access | bool
      changed_when: false
      failed_when: false

    - name: Ausgelesene Rollenmerkmale als Host-Fact speichern
      ansible.builtin.set_fact:
        ipc_discovery_info: "{{ discovery_raw.stdout | trim | from_json }}"
      when:
        - discovery_ansible_access | bool
        - discovery_raw is defined
        - discovery_raw.stdout is defined
        - discovery_raw.stdout | trim | length > 0

    - name: Teilnehmer ohne Ansible-Zugriff vormerken
      ansible.builtin.set_fact:
        ipc_discovery_info:
          ip: "{{ ansible_host | default(inventory_hostname) }}"
          ansible_access: false
          computername: ""
          domain: ""
          part_of_domain: false
          manufacturer: ""
          model: ""
          os_caption: ""
          os_version: ""
          os_build_number: ""
          os_product_type: 0
          installed_products: []
          relevant_services: []
          access_error_code: "{{ discovery_access_error_code | default('UNKNOWN_ACCESS_ERROR') | trim }}"
          access_error_reason: "{{ discovery_access_reason | default('Ansible-/WinRM-Zugriff fehlgeschlagen') | trim }}"
          access_error_detail: "{{ discovery_access_detail | default('') | trim }}"
          error: "{{ discovery_access_reason | default('Ansible-/WinRM-Zugriff fehlgeschlagen') | trim }}"
      when: not (discovery_ansible_access | bool)

    - name: Teilnehmer mit Zugriff aber ohne auswertbare Discovery-Daten vormerken
      ansible.builtin.set_fact:
        ipc_discovery_info:
          ip: "{{ ansible_host | default(inventory_hostname) }}"
          ansible_access: true
          computername: ""
          domain: ""
          part_of_domain: false
          manufacturer: ""
          model: ""
          os_caption: ""
          os_version: ""
          os_build_number: ""
          os_product_type: 0
          installed_products: []
          relevant_services: []
          error: "Ansible-Zugriff vorhanden, Rollenmerkmale konnten nicht ausgelesen werden"
      when:
        - discovery_ansible_access | bool
        - ipc_discovery_info is not defined


- name: IPC-Rollen klassifizieren und JSON erzeugen
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    discovery_group: "ipc_discovery_candidates"
    discovery_latest_file: "{{ ipc_discovery_file | default(result_dir ~ '/ipc_discovery_groups_latest.json') }}"

    # Namensmuster fuer die drei bekannten IPC-Rollen.
    es_name_regex: "{{ ipc_es_name_regex | default('(?i)^(ES[0-9]|ES[-_]|ENG)') }}"
    os_server_name_regex: "{{ ipc_os_server_name_regex | default('(?i)^(OSS|OS[-_]?S|.*OSSERVER)') }}"
    os_client_name_regex: "{{ ipc_os_client_name_regex | default('(?i)^(OSC|OS[-_]?C|.*OSCLIENT)') }}"

    es_product_regex: "{{ ipc_es_product_regex | default('(?i)(PCS\\s*7.*Engineering|Engineering\\s+System|STEP\\s*7|SIMATIC\\s+Manager|(^|[^A-Z])CFC([^A-Z]|$)|(^|[^A-Z])SFC([^A-Z]|$))') }}"
    os_server_product_regex: "{{ ipc_os_server_product_regex | default('(?i)(PCS\\s*7.*OS\\s*Server|WinCC.*Server|OS\\s*Server)') }}"
    os_client_product_regex: "{{ ipc_os_client_product_regex | default('(?i)(PCS\\s*7.*OS\\s*Client|WinCC.*Client|OS\\s*Client)') }}"

    es_service_regex: "{{ ipc_es_service_regex | default('(?i)(STEP|S7|CFC|SFC|Engineering)') }}"
    os_server_service_regex: "{{ ipc_os_server_service_regex | default('(?i)(WinCC|CCEServer|CCArchive|SQL)') }}"
    os_client_service_regex: "{{ ipc_os_client_service_regex | default('(?i)(WinCC|CCClient)') }}"

    classification_min_score: "{{ ipc_classification_min_score | default(5) }}"
    classification_min_margin: "{{ ipc_classification_min_margin | default(2) }}"
    role_overrides: "{{ ipc_role_overrides | default({}) }}"

  tasks:
    - name: Ergebnisverzeichnis erzeugen
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0755"

    # Diese Datei dient nur als interne Uebergabe an den lokalen Python-Block
    # und wird nach der Klassifizierung wieder entfernt.
    - name: Discovery-Rohdaten temporaer als JSON bereitstellen
      ansible.builtin.copy:
        dest: "{{ result_dir }}/.ipc_discovery_raw_{{ hostvars['localhost'].discovery_timestamp }}.json"
        mode: "0600"
        content: |
          [
          {% for h in groups[discovery_group] | default([]) %}
          {{
            (hostvars[h].ipc_discovery_info | default({
              'ip': hostvars[h].ansible_host | default(h),
              'ansible_access': false,
              'computername': '',
              'installed_products': [],
              'relevant_services': [],
              'error': 'Keine Discovery-Daten vorhanden'
            }))
            | combine({
              'winrm_detected': hostvars[h].discovery_winrm_detected | default(false),
              'winrm_port': hostvars[h].ansible_port | default(5985),
              'winrm_scheme': hostvars[h].ansible_winrm_scheme | default('http'),
              'winrm_open_ports': hostvars[h].discovery_open_ports | default(''),
              'access_error_code': hostvars[h].discovery_access_error_code | default('UNKNOWN_ACCESS_ERROR') | trim,
              'access_error_reason': hostvars[h].discovery_access_reason | default('Keine Zugriffsinformation vorhanden') | trim,
              'access_error_detail': hostvars[h].discovery_access_detail | default('') | trim
            })
            | to_nice_json
          }}{% if not loop.last %},{% endif %}
          {% endfor %}
          ]

    - name: Teilnehmer klassifizieren und gruppierte JSON-Datei schreiben
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import ipaddress
        import json
        import re
        from pathlib import Path

        result_dir = Path({{ result_dir | to_json }})
        timestamp = {{ hostvars['localhost'].discovery_timestamp | to_json }}
        timestamp_iso = {{ hostvars['localhost'].discovery_timestamp_iso | to_json }}
        target_network = {{ target_network | to_json }}

        raw_path = result_dir / f".ipc_discovery_raw_{timestamp}.json"
        latest_path = Path({{ discovery_latest_file | to_json }})

        patterns = {
            "es_name": re.compile({{ es_name_regex | to_json }}),
            "os_server_name": re.compile({{ os_server_name_regex | to_json }}),
            "os_client_name": re.compile({{ os_client_name_regex | to_json }}),
            "es_product": re.compile({{ es_product_regex | to_json }}),
            "os_server_product": re.compile({{ os_server_product_regex | to_json }}),
            "os_client_product": re.compile({{ os_client_product_regex | to_json }}),
            "es_service": re.compile({{ es_service_regex | to_json }}),
            "os_server_service": re.compile({{ os_server_service_regex | to_json }}),
            "os_client_service": re.compile({{ os_client_service_regex | to_json }}),
        }

        min_score = int({{ classification_min_score | int }})
        min_margin = int({{ classification_min_margin | int }})
        overrides = {{ role_overrides | to_json }}

        canonical_override = {
            "ES": "ES",
            "IPC_ES": "ES",
            "OS": "OS_Server",
            "OS_SERVER": "OS_Server",
            "IPC_OS": "OS_Server",
            "CLIENT": "OS_Client",
            "OS_CLIENT": "OS_Client",
            "IPC_OS_CLIENT": "OS_Client",
            "SONSTIGE": "Sonstige",
            "OTHER": "Sonstige",
            "UNCLASSIFIED": "Sonstige",
        }

        def ip_sort_key(host):
            value = str(host.get("ip") or "")
            try:
                return (0, int(ipaddress.ip_address(value)))
            except ValueError:
                return (1, value)

        def text_products(host):
            values = []
            for item in host.get("installed_products") or []:
                if isinstance(item, dict):
                    values.append(" ".join(str(item.get(k, "")) for k in ("name", "version", "publisher")))
                else:
                    values.append(str(item))
            return " | ".join(values)

        def text_services(host):
            values = []
            for item in host.get("relevant_services") or []:
                if isinstance(item, dict):
                    values.append(" ".join(str(item.get(k, "")) for k in ("name", "display_name")))
                else:
                    values.append(str(item))
            return " | ".join(values)

        def add(scores, reasons, role, points, reason):
            scores[role] += points
            reasons[role].append(f"+{points} {reason}")

        raw_hosts = json.loads(raw_path.read_text(encoding="utf-8"))
        classified = []

        for host in raw_hosts:
            ip = str(host.get("ip") or "")
            name = str(host.get("computername") or "")

            # Offener WinRM-Port allein bedeutet noch nicht, dass Ansible
            # sich erfolgreich anmelden und Befehle ausfuehren kann.
            if not bool(host.get("ansible_access", False)):
                host["classification"] = "Kein_Zugriff"
                host["classification_confidence"] = "none"
                host["classification_reason"] = host.get("error") or "Kein Ansible-/WinRM-Zugriff"
                host["classification_scores"] = {"ES": 0, "OS_Server": 0, "OS_Client": 0}
                host["classification_evidence"] = {"ES": [], "OS_Server": [], "OS_Client": []}
                classified.append(host)
                continue

            product_type = int(host.get("os_product_type") or 0)
            os_caption = str(host.get("os_caption") or "")
            products = text_products(host)
            services = text_services(host)

            scores = {"ES": 0, "OS_Server": 0, "OS_Client": 0}
            reasons = {"ES": [], "OS_Server": [], "OS_Client": []}

            override_raw = overrides.get(ip)
            if override_raw is None and name:
                override_raw = overrides.get(name) or overrides.get(name.upper())

            override = None
            if override_raw is not None:
                override = canonical_override.get(str(override_raw).strip().upper())

            if patterns["es_name"].search(name):
                add(scores, reasons, "ES", 6, f"Rechnername {name!r} passt zum ES-Muster")
            if patterns["os_server_name"].search(name):
                add(scores, reasons, "OS_Server", 6, f"Rechnername {name!r} passt zum OS-Server-Muster")
            if patterns["os_client_name"].search(name):
                add(scores, reasons, "OS_Client", 6, f"Rechnername {name!r} passt zum OS-Client-Muster")

            if patterns["es_product"].search(products):
                add(scores, reasons, "ES", 8, "installierte Engineering-Komponente erkannt")
            if patterns["os_server_product"].search(products):
                add(scores, reasons, "OS_Server", 8, "installierte OS-Server-Komponente erkannt")
            if patterns["os_client_product"].search(products):
                add(scores, reasons, "OS_Client", 8, "installierte OS-Client-Komponente erkannt")

            if patterns["es_service"].search(services):
                add(scores, reasons, "ES", 2, "Engineering-/S7-Dienst erkannt")
            if patterns["os_server_service"].search(services):
                add(scores, reasons, "OS_Server", 2, "WinCC-/Server-Dienst erkannt")
            if patterns["os_client_service"].search(services):
                add(scores, reasons, "OS_Client", 2, "WinCC-/Client-Dienst erkannt")

            # Win32_OperatingSystem.ProductType: 1 = Workstation, 2/3 = Server.
            if product_type == 1:
                add(scores, reasons, "OS_Client", 4, f"Windows-Workstation erkannt ({os_caption})")
                scores["ES"] -= 2
                scores["OS_Server"] -= 2
            elif product_type in (2, 3):
                add(scores, reasons, "ES", 1, f"Windows-Server erkannt ({os_caption})")
                add(scores, reasons, "OS_Server", 1, f"Windows-Server erkannt ({os_caption})")
                scores["OS_Client"] -= 2

            ordered = sorted(scores.items(), key=lambda x: (-x[1], x[0]))
            best_role, best_score = ordered[0]
            second_score = ordered[1][1]
            margin = best_score - second_score

            if override in ("ES", "OS_Server", "OS_Client", "Sonstige"):
                classification = override
                confidence = "override"
                classification_reason = f"Manuelle Zuordnung ueber ipc_role_overrides: {override_raw}"
            elif best_score >= min_score and margin >= min_margin:
                classification = best_role
                confidence = "high" if best_score >= 10 and margin >= 4 else "medium"
                classification_reason = "; ".join(reasons[best_role]) or "hoechster Klassifizierungswert"
            else:
                classification = "Sonstige"
                confidence = "low"
                classification_reason = (
                    f"Keine eindeutige Zuordnung: bester Wert {best_role}={best_score}, "
                    f"Abstand={margin}, Mindestwert={min_score}, Mindestabstand={min_margin}"
                )

            host["classification"] = classification
            host["classification_confidence"] = confidence
            host["classification_reason"] = classification_reason
            host["classification_scores"] = scores
            host["classification_evidence"] = reasons
            classified.append(host)

        classified = sorted(classified, key=ip_sort_key)

        groups = {
            "ipc_es": [h for h in classified if h.get("classification") == "ES"],
            "ipc_os": [h for h in classified if h.get("classification") == "OS_Server"],
            "ipc_os_client": [h for h in classified if h.get("classification") == "OS_Client"],
            "sonstige": [h for h in classified if h.get("classification") == "Sonstige"],
            "kein_zugriff": [h for h in classified if h.get("classification") == "Kein_Zugriff"],
        }

        kein_zugriff_reasons = {}
        for host in groups["kein_zugriff"]:
            code = str(host.get("access_error_code") or "UNKNOWN_ACCESS_ERROR")
            kein_zugriff_reasons[code] = kein_zugriff_reasons.get(code, 0) + 1

        output = {
            "generated_at": timestamp_iso,
            "target_network": target_network,
            "classification_version": 3,
            "groups": groups,
            "hosts": classified,
            "summary": {key: len(value) for key, value in groups.items()},
            "kein_zugriff_summary": kein_zugriff_reasons,
        }

        latest_path.parent.mkdir(parents=True, exist_ok=True)
        latest_path.write_text(
            json.dumps(output, ensure_ascii=False, indent=2),
            encoding="utf-8"
        )

        print(json.dumps({
            "latest_json": str(latest_path),
            "summary": output["summary"],
        }, ensure_ascii=False))
        PY
      args:
        executable: /bin/bash
      register: classification_result
      changed_when: false

    - name: Temporaere Discovery-Rohdaten entfernen
      ansible.builtin.file:
        path: "{{ result_dir }}/.ipc_discovery_raw_{{ hostvars['localhost'].discovery_timestamp }}.json"
        state: absent

    - name: Klassifizierungsdatei erneut einlesen
      ansible.builtin.slurp:
        src: "{{ discovery_latest_file }}"
      register: classification_latest_raw

    - name: Klassifizierungsdaten speichern
      ansible.builtin.set_fact:
        classification_latest: "{{ classification_latest_raw.content | b64decode | from_json }}"

    - name: ES-IPCs im aktuellen Lauf gruppieren
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: "ipc_es"
      loop: "{{ classification_latest.groups.ipc_es | default([]) }}"
      loop_control:
        label: "{{ item.ip }} -> ipc_es"

    - name: OS-Server-IPCs im aktuellen Lauf gruppieren
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: "ipc_os"
      loop: "{{ classification_latest.groups.ipc_os | default([]) }}"
      loop_control:
        label: "{{ item.ip }} -> ipc_os"

    - name: OS-Client-IPCs im aktuellen Lauf gruppieren
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: "ipc_os_client"
      loop: "{{ classification_latest.groups.ipc_os_client | default([]) }}"
      loop_control:
        label: "{{ item.ip }} -> ipc_os_client"

    - name: Sonstige Teilnehmer im aktuellen Lauf gruppieren
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: "sonstige"
      loop: "{{ classification_latest.groups.sonstige | default([]) }}"
      loop_control:
        label: "{{ item.ip }} -> sonstige"

    - name: Teilnehmer ohne Ansible-Zugriff im aktuellen Lauf gruppieren
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: "kein_zugriff"
      loop: "{{ classification_latest.groups.kein_zugriff | default([]) }}"
      loop_control:
        label: "{{ item.ip }} -> kein_zugriff"

    - name: Ergebnis und Gruppengroessen anzeigen
      ansible.builtin.debug:
        msg:
          - "JSON: {{ discovery_latest_file }}"
          - "ES: {{ classification_latest.summary.ipc_es | default(0) }}"
          - "OS Server: {{ classification_latest.summary.ipc_os | default(0) }}"
          - "OS Client: {{ classification_latest.summary.ipc_os_client | default(0) }}"
          - "Sonstige: {{ classification_latest.summary.sonstige | default(0) }}"
          - "Kein Zugriff: {{ classification_latest.summary.kein_zugriff | default(0) }}"
          - "Kein-Zugriff-Ursachen: {{ classification_latest.kein_zugriff_summary | default({}) }}"