      title: "HOSTS/LMHOSTS anpassen bzw. aktualisieren\n"
      description: "Nur bei Arbeitsgruppe\n\n C:\\Windows\\System32\\drivers\\etc\n\nEmpfehlung SUP PA:\nNach der Rechnerinstallation müssen die HOSTS und LMHOSTS gleich aussehen. Beim Diagnose-Workshop wurde darauf noch extra hingewiesen.\nWir brauchen beide Dateien mit identischem Inhalt.\n\nDie LMHOSTS muss wie folgt aussehen:\n102.54.94.97    OSSERVER1    #PRE    #OS SERVER\nMit der Erweiterung #PRE wird diese Zeile sofort beim Rechnerstart in den NetBios-Cache geladen. Laut CS2 sehr wichtig.\n \nDie HOSTS sieht dann wie folgt aus:\n102.54.94.97    OSSERVER1    #OS SERVER\nDa wird #PRE nicht benötigt, muss entfernt werden!\n \nZusätzlich muss in der HOSTS noch folgende Zeile eingefügt werden:\n127.0.0.1        localhost\nDieser Eintrag wird nur in der HOSTS benötigt!"
      master_values:
        F_TLGDE1064DE001: "x"
        H_ES0180705: "x"
        J_ENG4X31: "n"
        K_ENG4X32: "n"
      master_note: "Bei Domäne nicht erforderlich"
