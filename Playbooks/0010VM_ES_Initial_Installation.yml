  tasks:
    - name: Report-Zeitstempel und Katalog persistent speichern
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        report_timestamp_iso: "{{ lookup('pipe', 'date -Iseconds') }}"
        vm_es_validation_catalog: "{{ validation_catalog }}"

    - name: Benoetigte Semaphore-Variablen pruefen
      ansible.builtin.assert:
        that:
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - nmap_binary is defined
          - result_dir is defined
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - nmap_binary | string | length > 0
          - result_dir | string | length > 0
        fail_msg: >-
          Erforderlich sind win_user, win_password, winrm_transport,
          nmap_binary und result_dir.

    - name: Masterlistenprofil pruefen
      ansible.builtin.assert:
        that:
          - masterlist_profile in
            ['ALL', 'F_TLGDE1064DE001', 'H_ES0180705',
             'J_ENG4X31', 'K_ENG4X32']
        fail_msg: >-
          vm_es_masterlist_profile muss ALL, F_TLGDE1064DE001,
          H_ES0180705, J_ENG4X31 oder K_ENG4X32 sein.

    - name: Discovery-Gruppendatei pruefen
      ansible.builtin.stat:
        path: "{{ discovery_latest_file }}"
      register: discovery_file_stat

    - name: Abbrechen, wenn die VM-Discovery-Datei fehlt
      ansible.builtin.assert:
        that:
          - discovery_file_stat.stat.exists | default(false)
          - discovery_file_stat.stat.isreg | default(false)
        fail_msg: >-
          {{ discovery_latest_file }} wurde nicht gefunden.
          Zuerst 0000VM_Discovery_Classification.yml ausfuehren oder
          vm_discovery_file auf die richtige Datei setzen.

    - name: VM-Discovery-Datei einlesen
      ansible.builtin.slurp:
        src: "{{ discovery_latest_file }}"
      register: discovery_file_raw

    - name: VM-Discovery-Daten aus JSON uebernehmen
      ansible.builtin.set_fact:
        vm_discovery_data: >-
          {{ discovery_file_raw.content | b64decode | from_json }}

    - name: Struktur der VM-Discovery-Datei pruefen
      ansible.builtin.assert:
        that:
          - vm_discovery_data is mapping
          - vm_discovery_data.groups is defined
          - vm_discovery_data.groups is mapping
          - vm_discovery_data.groups.vm_es is defined
          - vm_discovery_data.groups.vm_es is sequence
        fail_msg: >-
          {{ discovery_latest_file }} enthaelt keine gueltige Gruppe
          groups.vm_es. Bitte 0000VM_Discovery_Classification.yml erneut
          ausfuehren.

    - name: VM-ES-Teilnehmer aus der Discovery uebernehmen
      ansible.builtin.set_fact:
        vm_es_discovery_hosts: >-
          {{
            vm_discovery_data.groups.vm_es
            | selectattr('ip', 'defined')
            | selectattr('ip', 'string')
            | unique(attribute='ip')
            | list
          }}

    - name: Geladene VM-ES-Zielmenge anzeigen
      ansible.builtin.debug:
        msg:
          - "Discovery-Datei: {{ discovery_latest_file }}"
          - "Discovery-Zeit: {{ vm_discovery_data.generated_at | default('') }}"
          - "Masterlistenblatt: {{ masterlist_sheet }}"
          - "Masterlistenprofil: {{ masterlist_profile }}"
          - "VM-ES-IP-Adressen: {{ vm_es_discovery_hosts | map(attribute='ip') | list }}"
          - "Anzahl VM-ES-Zielrechner: {{ vm_es_discovery_hosts | length }}"
          - "Anzahl Ansible-IDs: {{ validation_catalog | length }}"

    - name: Hinweis ausgeben, wenn keine VM ES klassifiziert wurde
      ansible.builtin.debug:
        msg: >-
          groups.vm_es ist leer. JSON und CSV werden mit Kopfzeile, aber
          ohne Host-Ergebniszeilen erzeugt.
      when: vm_es_discovery_hosts | length == 0

    - name: nmap auf dem Ansible-Controller pruefen
      ansible.builtin.command: "{{ nmap_binary }} --version"
      register: nmap_check
      changed_when: false
      failed_when: false

    - name: Abbrechen, wenn nmap nicht ausfuehrbar ist
      ansible.builtin.fail:
        msg: "nmap ist unter {{ nmap_binary }} nicht ausfuehrbar."
      when: nmap_check.rc != 0

    - name: Alle VM-ES-IP-Adressen erneut mit nmap auf WinRM pruefen
      ansible.builtin.shell: |
        set -o pipefail
        target_ip={{ item.ip | quote }}
        scan="$({{ nmap_binary }} -n -Pn -p 5985,5986 --open "$target_ip" -oG - 2>/dev/null || true)"

        open_ports=""
        if grep -q '5985/open/tcp' <<<"$scan"; then
          open_ports="5985"
        fi
        if grep -q '5986/open/tcp' <<<"$scan"; then
          if [[ -n "$open_ports" ]]; then
            open_ports="${open_ports},5986"
          else
            open_ports="5986"
          fi
        fi

        if grep -q '5986/open/tcp' <<<"$scan"; then
          printf '%s;true;5986;https;%s' "$target_ip" "$open_ports"
        elif grep -q '5985/open/tcp' <<<"$scan"; then
          printf '%s;true;5985;http;%s' "$target_ip" "$open_ports"
        else
          printf '%s;false;5985;http;' "$target_ip"
        fi
      args:
        executable: /bin/bash
      loop: "{{ vm_es_discovery_hosts }}"
      loop_control:
        label: "{{ item.ip }}"
      register: vm_es_nmap_scan_results
      changed_when: false
      failed_when: false

    - name: nmap-Ergebnisse der VM-ES-IP-Adressen anzeigen
      ansible.builtin.debug:
        msg: >-
          {{ item.item.ip }}:
          erreichbar={{ item.stdout.split(';')[1] | default('false') }},
          Port={{ item.stdout.split(';')[2] | default('5985') }},
          Schema={{ item.stdout.split(';')[3] | default('http') }},
          offene Ports={{ item.stdout.split(';')[4] | default('') }}
      loop: "{{ vm_es_nmap_scan_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.ip }}"

    - name: Alle VM-ES-Zielrechner dynamisch aufnehmen
      ansible.builtin.add_host:
        name: "{{ scan_parts[0] }}"
        groups: "{{ station_group }}"
        ansible_host: "{{ scan_parts[0] }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ scan_parts[2] | int }}"
        ansible_winrm_scheme: "{{ scan_parts[3] }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: >-
          {{ winrm_operation_timeout_sec | default(60) }}
        ansible_winrm_read_timeout_sec: >-
          {{ winrm_read_timeout_sec | default(180) }}

        validation_station_type: "{{ station_type }}"
        validation_station_group: "{{ station_group }}"
        validation_masterlist_sheet: "{{ masterlist_sheet }}"
        validation_masterlist_profile: "{{ masterlist_profile }}"
        validation_report_prefix: "{{ report_prefix }}"
        validation_remote_dir: >-
          {{
            vm_es_validation_remote_dir
            | default('C:\\Windows\\Temp\\AnsibleVMESValidation')
          }}
        validation_check_catalog: "{{ validation_catalog }}"
        validation_discovery_group: "vm_es"
        validation_discovery_file: "{{ discovery_latest_file }}"
        validation_discovery_generated_at: >-
          {{ vm_discovery_data.generated_at | default('') }}
        validation_discovery_computername: >-
          {{ item.item.computername | default('') }}
        validation_nmap_reachable: "{{ scan_parts[1] | bool }}"
        validation_nmap_winrm_port: "{{ scan_parts[2] | int }}"
        validation_nmap_winrm_scheme: "{{ scan_parts[3] }}"
        validation_nmap_open_ports: "{{ scan_parts[4] | default('') }}"
        validation_parameters: >-
          {{
            vm_es_validation_parameters
            | combine({
                'target_ip': scan_parts[0],
                'expected_computername':
                  (
                    vm_es_expected_computername_by_ip
                    | default({})
                  ).get(
                    item.item.ip,
                    item.item.computername | default('')
                  ),
                'expected_partitions':
                  (
                    vm_es_expected_partitions_map.get(
                      item.item.ip,
                      vm_es_expected_partitions_map.get(
                        item.item.computername | default(''),
                        vm_es_expected_partitions_map.get(
                          'default',
                          vm_es_default_partitions
                        )
                      )
                    )
                  )
              })
          }}
      vars:
        scan_parts: "{{ (item.stdout | trim).split(';') }}"
      loop: "{{ vm_es_nmap_scan_results.results | default([]) }}"
      loop_control:
        label: "{{ item.item.ip }}"
      no_log: true


- name: "Alle Ansible-IDs des Masterlistenblatts VM ES pruefen"
  hosts: vm_es_validation_targets
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: WinRM-Verbindung testen
      ansible.windows.win_ping:
      register: win_ping_result
      when: validation_nmap_reachable | default(false) | bool
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Temporaeres VM-ES-Pruefverzeichnis erzeugen
      ansible.windows.win_file:
        path: "{{ validation_remote_dir }}"
        state: directory
      when:
        - validation_nmap_reachable | default(false) | bool
        - win_ping_result is defined
        - win_ping_result.ping | default('') == 'pong'
      failed_when: false

    - name: VM-ES-Pruefkatalog auf Zielsystem kopieren
      ansible.windows.win_copy:
        dest: "{{ validation_remote_dir }}\\validation_catalog.json"
        content: "{{ validation_check_catalog | to_nice_json }}"
        force: true
      when:
        - validation_nmap_reachable | default(false) | bool
        - win_ping_result is defined
        - win_ping_result.ping | default('') == 'pong'
      failed_when: false

    - name: VM-ES-Pruefparameter auf Zielsystem kopieren
      ansible.windows.win_copy:
        dest: "{{ validation_remote_dir }}\\validation_parameters.json"
        content: "{{ validation_parameters | to_nice_json }}"
        force: true
      when:
        - validation_nmap_reachable | default(false) | bool
        - win_ping_result is defined
        - win_ping_result.ping | default('') == 'pong'
      failed_when: false

    - name: VM-ES-Einstellungen pruefen und Ergebnis kodiert ausgeben
      ansible.windows.win_shell: |
        $ErrorActionPreference = "SilentlyContinue"
        $ProgressPreference = "SilentlyContinue"

        $catalog = @(
          Get-Content -LiteralPath $env:VALIDATION_CATALOG_PATH -Raw -Encoding UTF8 |
            ConvertFrom-Json
        )
        $params = Get-Content `
          -LiteralPath $env:VALIDATION_PARAMETERS_PATH `
          -Raw `
          -Encoding UTF8 |
            ConvertFrom-Json
        $catalogByKey = @{}
        foreach ($entry in $catalog) {
          $catalogByKey[[string]$entry.key] = $entry
        }

        $checks = @()
        $addedChecks = @{}
        $masterProfile = [string]$env:VALIDATION_MASTERLIST_PROFILE
        $masterSheet = [string]$env:VALIDATION_MASTERLIST_SHEET

        function Convert-ToText {
          param([object]$Value)
          if ($null -eq $Value) { return "" }
          if ($Value -is [string]) { return $Value }
          if ($Value -is [System.Collections.IDictionary]) {
            return ($Value | ConvertTo-Json -Depth 8 -Compress)
          }
          if ($Value -is [System.Management.Automation.PSCustomObject]) {
            return ($Value | ConvertTo-Json -Depth 8 -Compress)
          }
          if (
            $Value -is [System.Collections.IEnumerable] -and
            -not ($Value -is [string])
          ) {
            return (($Value | ForEach-Object {
              if ($null -eq $_) { "" }
              elseif (
                $_ -is [System.Collections.IDictionary] -or
                $_ -is [System.Management.Automation.PSCustomObject]
              ) {
                $_ | ConvertTo-Json -Depth 8 -Compress
              } else {
                [string]$_
              }
            }) -join " | ")
          }
          return [string]$Value
        }

        function Get-Param {
          param([string]$Name, [object]$Default = $null)
          if ($null -eq $params) { return $Default }
          $property = $params.PSObject.Properties[$Name]
          if ($null -eq $property) { return $Default }
          if ($null -eq $property.Value) { return $Default }
          return $property.Value
        }

        function Convert-ToBool {
          param([object]$Value, [bool]$Default = $false)
          if ($null -eq $Value) { return $Default }
          if ($Value -is [bool]) { return [bool]$Value }
          $text = ([string]$Value).Trim().ToLowerInvariant()
          if ($text -in @("true", "1", "yes", "ja", "on")) { return $true }
          if ($text -in @("false", "0", "no", "nein", "off")) { return $false }
          return $Default
        }

        function Get-MasterValue {
          param([object]$Meta)
          if ($masterProfile -eq "ALL") { return "ALL" }
          if ($null -eq $Meta.master_values) { return "" }
          $property = $Meta.master_values.PSObject.Properties[$masterProfile]
          if ($null -eq $property) { return "" }
          return [string]$property.Value
        }

        function Add-Check {
          param(
            [string]$Key,
            [string]$Status,
            [object]$Actual,
            [object]$Expected,
            [string]$Method,
            [string]$Note = ""
          )
          if (-not $catalogByKey.ContainsKey($Key)) { return }
          if ($addedChecks.ContainsKey($Key)) { return }

          $meta = $catalogByKey[$Key]
          $masterValue = Get-MasterValue $meta
          $notes = @()
          if ($Note) { $notes += $Note }
          if ([string]$meta.master_note) {
            $notes += ("Masterlistenhinweis: " + [string]$meta.master_note)
          }

          if ($masterProfile -ne "ALL") {
            if (
              [string]::IsNullOrWhiteSpace($masterValue) -or
              $masterValue.Trim().ToLowerInvariant() -eq "n"
            ) {
              $Status = "Nicht_Pruefbar"
              $notes += (
                "Im gewaehlten Masterlistenprofil " + $masterProfile +
                " ist diese Zeile mit '" + $masterValue +
                "' markiert und damit nicht als auszufuehrender Schritt vorgegeben."
              )
            }
          }

          $script:checks += [ordered]@{
            masterlist_sheet = $masterSheet
            masterlist_profile = $masterProfile
            masterlist_row = [int]$meta.row
            master_value = $masterValue
            ansible_id = [string]$meta.ansible_id
            schritt = [string]$meta.title
            master_beschreibung = [string]$meta.description
            status = $Status
            istwert = Convert-ToText $Actual
            sollwert = Convert-ToText $Expected
            pruefmethode = $Method
            hinweis = ($notes -join " ")
          }
          $script:addedChecks[$Key] = $true
        }

        function Add-BooleanCheck {
          param(
            [string]$Key,
            [bool]$Condition,
            [object]$Actual,
            [object]$Expected,
            [string]$Method,
            [string]$Note = ""
          )
          $status = "NOK"
          if ($Condition) { $status = "OK" }
          Add-Check $Key $status $Actual $Expected $Method $Note
        }

        function Add-IndirectCheck {
          param(
            [string]$Key,
            [bool]$Condition,
            [object]$Actual,
            [object]$Expected,
            [string]$Method,
            [string]$Note = ""
          )
          $status = "NOK"
          if ($Condition) { $status = "Indirekt" }
          Add-Check $Key $status $Actual $Expected $Method $Note
        }

        function Add-NotTestable {
          param(
            [string]$Key,
            [object]$Actual,
            [object]$Expected,
            [string]$Method,
            [string]$Note
          )
          Add-Check $Key "Nicht_Pruefbar" $Actual $Expected $Method $Note
        }

        function Get-UninstallPrograms {
          $items = @()
          $roots = @(
            "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall",
            "HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall"
          )
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            $items += @(Get-ChildItem -Path $root | ForEach-Object {
              $p = Get-ItemProperty -Path $_.PSPath
              if ($p.DisplayName) {
                [pscustomobject]@{
                  Name = [string]$p.DisplayName
                  Version = [string]$p.DisplayVersion
                  Publisher = [string]$p.Publisher
                  InstallLocation = [string]$p.InstallLocation
                }
              }
            })
          }
          return @($items | Sort-Object Name, Version -Unique)
        }

        function Find-Programs {
          param([string]$Pattern)
          return @($programs | Where-Object {
            ([string]$_.Name -match $Pattern) -or
            ([string]$_.Publisher -match $Pattern)
          })
        }

        function Programs-ToText {
          param([object[]]$Items)
          return (@($Items | ForEach-Object {
            ([string]$_.Name + " [" + [string]$_.Version + "]").Trim()
          }) -join " | ")
        }

        function Get-RegistryValueSafe {
          param([string]$Path, [string]$Name)
          if (-not $Path -or -not $Name -or -not (Test-Path $Path)) {
            return $null
          }
          try {
            return (Get-ItemProperty -Path $Path -Name $Name).$Name
          } catch {
            return $null
          }
        }

        function Test-VersionAtLeast {
          param([string]$Actual, [string]$Minimum)
          if ([string]::IsNullOrWhiteSpace($Minimum)) { return $true }
          try {
            return ([version]$Actual -ge [version]$Minimum)
          } catch {
            return $false
          }
        }

        function Get-FilesUnderPaths {
          param([object[]]$Paths, [string]$Pattern = "*")
          $result = @()
          foreach ($path in @($Paths)) {
            if (-not $path -or -not (Test-Path ([string]$path))) { continue }
            try {
              $result += @(Get-ChildItem -Path ([string]$path) -File -Recurse -Filter $Pattern)
            } catch {}
          }
          return @($result)
        }

        function Get-IniValues {
          param([string]$Path)
          $values = @{}
          if (-not $Path -or -not (Test-Path $Path)) { return $values }
          foreach ($line in @(Get-Content -Path $Path)) {
            if ($line -match "^\s*([^;#][^=]*?)\s*=\s*(.*?)\s*$") {
              $values[$Matches[1].Trim()] = $Matches[2].Trim()
            }
          }
          return $values
