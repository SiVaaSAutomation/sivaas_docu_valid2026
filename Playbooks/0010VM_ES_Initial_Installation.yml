          "Vorhandene PDM-Dateien sind ein Indiz; der Integrationsvorgang wird nicht separat protokolliert."

        $wuPolicyPath = "HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate"
        $wuAuPath = $wuPolicyPath + "\AU"
        $wuServer = Get-RegistryValueSafe $wuPolicyPath "WUServer"
        $wuStatusServer = Get-RegistryValueSafe $wuPolicyPath "WUStatusServer"
        $wuTargetGroup = Get-RegistryValueSafe $wuPolicyPath "TargetGroup"
        $wuTargetGroupEnabled = Get-RegistryValueSafe $wuPolicyPath "TargetGroupEnabled"
        $wuAuOptions = Get-RegistryValueSafe $wuAuPath "AUOptions"
        $expectedWsusServer = [string](Get-Param "expected_wsus_server" "")
        $expectedWsusTargetGroup = [string](Get-Param "expected_wsus_target_group" "")
        $expectedAuOptions = @((Get-Param "expected_wsus_au_options" @(3, 4)))
        if ($expectedWsusServer) {
          $wsusOk = (
            [string]$wuServer -ieq $expectedWsusServer -and
            [string]$wuStatusServer -ieq $expectedWsusServer -and
            [int]$wuAuOptions -in @($expectedAuOptions | ForEach-Object { [int]$_ })
          )
          if ($expectedWsusTargetGroup) {
            $wsusOk = (
              $wsusOk -and
              [int]$wuTargetGroupEnabled -eq 1 -and
              [string]$wuTargetGroup -ieq $expectedWsusTargetGroup
            )
          }
          Add-BooleanCheck "VMES0099" $wsusOk `
            ("WUServer=" + [string]$wuServer +
             "; WUStatusServer=" + [string]$wuStatusServer +
             "; TargetGroup=" + [string]$wuTargetGroup +
             "; TargetGroupEnabled=" + [string]$wuTargetGroupEnabled +
             "; AUOptions=" + [string]$wuAuOptions) `
            ("WSUS=" + $expectedWsusServer +
             "; TargetGroup=" + $expectedWsusTargetGroup +
             "; AUOptions=" + ($expectedAuOptions -join ",")) `
            "Direkt/Windows-Update-Registry"
        } else {
          Add-NotTestable "VMES0099" `
            ("WUServer=" + [string]$wuServer +
             "; TargetGroup=" + [string]$wuTargetGroup +
             "; AUOptions=" + [string]$wuAuOptions) `
            "Projekt-WSUS-Konfiguration" `
            "Sollwert fehlt" `
            "expected_wsus_server ist leer."
        }

        Add-NotTestable "VMES0100" `
          "Lokale VEEAM-Komponenten sind kein Nachweis eines Backups." `
          "VEEAM Backup erstellt" `
          "Externes VEEAM-System" `
          "Der erfolgreiche Backup-Job muss auf dem VEEAM-Server geprueft werden."

        $hotfixMap = @{
          "VMES0101" = "KB5053603"
          "VMES0102" = "KB5050187"
          "VMES0103" = "KB5065432"
          "VMES0104" = "KB5065962"
        }
        foreach ($key in $hotfixMap.Keys) {
          $kb = $hotfixMap[$key]
          Add-BooleanCheck $key ($hotfixes -contains $kb) `
            ("Installierte Hotfixes=" + ($hotfixes -join ",")) `
            $kb `
            "Direkt/Get-HotFix"
        }

        $expectedEdgeVersion = [string](Get-Param "expected_edge_version" "")
        $edgeVersions = @($edgePrograms | ForEach-Object { [string]$_.Version })
        if ($expectedEdgeVersion) {
          Add-BooleanCheck "VMES0105" `
            ($edgeVersions -contains $expectedEdgeVersion) `
            ("Edge-Versionen=" + ($edgeVersions -join ",")) `
            $expectedEdgeVersion `
            "Direkt/Uninstall-Registry"
        } else {
          Add-NotTestable "VMES0105" `
            ("Edge-Versionen=" + ($edgeVersions -join ",")) `
            "Vorgegebene Edge-Version" `
            "Sollwert fehlt" `
            "expected_edge_version ist leer."
        }

        $policyDefinitions = "$env:SystemRoot\PolicyDefinitions"
        $policyDefinitionCount = 0
        if (Test-Path $policyDefinitions) {
          try {
            $policyDefinitionCount = @(
              Get-ChildItem $policyDefinitions -Filter "*.admx" -File
            ).Count
          } catch {}
        }
        Add-BooleanCheck "VMES0106" `
          ((Test-Path $policyDefinitions) -and $policyDefinitionCount -gt 0) `
          ("Pfad=" + $policyDefinitions +
           "; ADMX-Dateien=" + $policyDefinitionCount) `
          "C:\Windows\PolicyDefinitions vorhanden und befuellt" `
          "Direkt/Dateisystem"

        Add-BooleanCheck "VMES0107" $firewallOk `
          (@($firewallProfiles | ForEach-Object {
            $_.Name + "=" + $_.Enabled
          }) -join ",") `
          "Firewall nach Security Controller aktiv" `
          "Direkt/Get-NetFirewallProfile"

        $securityUser = [string](Get-Param "expected_security_controller_user" "")
        $securityUserProfile = $null
        if ($securityUser) {
          try {
            $account = New-Object System.Security.Principal.NTAccount($securityUser)
            $sid = $account.Translate(
              [System.Security.Principal.SecurityIdentifier]
            ).Value
            $securityUserProfile = Get-CimInstance Win32_UserProfile |
              Where-Object { $_.SID -eq $sid } |
              Select-Object -First 1
          } catch {}
        }
        Add-IndirectCheck "VMES0108" `
          ($securityUserProfile -and $firewallOk) `
          ("Benutzerprofil=" + [string]$securityUserProfile.LocalPath +
           "; Firewall_OK=" + $firewallOk) `
          ("Security Controller fuer " + $securityUser + " ausgefuehrt") `
          "Indirekt/Benutzerprofil und Firewallstatus" `
          "Ein vorhandenes Profil und der Firewall-Endzustand beweisen den konkreten GUI-Aufruf nicht."

        Add-NotTestable "VMES0109" "" `
          "Masterlistenzeile besitzt keine Beschreibung" `
          "Keine pruefbare Vorgabe" `
          "Die Ansible-ID ist vorhanden, aber Beschreibung und Sollzustand sind leer."

        function Test-HostsDates {
          param([string]$MinDateText)
          if (-not $hostsDate -or -not $lmhostsDate -or -not $MinDateText) {
            return $false
          }
          try {
            $minDate = [datetime]$MinDateText
            return (
              [datetime]$hostsDate -ge $minDate -and
              [datetime]$lmhostsDate -ge $minDate
            )
          } catch {
            return $false
          }
        }

        $minHostsDate110 = [string](Get-Param "expected_hosts_lmhosts_min_date_110" "")
        Add-BooleanCheck "VMES0110" `
          (Test-HostsDates $minHostsDate110) `
          ("HOSTS=" + [string]$hostsDate +
           "; LMHOSTS=" + [string]$lmhostsDate) `
          ("Beide Dateien mindestens vom " + $minHostsDate110) `
          "Direkt/Dateizeitstempel"

        $expectedGateway = [string](Get-Param "expected_terminalbus_gateway" "")
        $actualGateways = @($terminalConfigs | ForEach-Object {
          $_.IPv4DefaultGateway.NextHop
        })
        if ($expectedGateway) {
          Add-BooleanCheck "VMES0111" `
            ($actualGateways -contains $expectedGateway) `
            ("Gateways=" + ($actualGateways -join ",")) `
            $expectedGateway `
            "Direkt/Get-NetIPConfiguration"
        } else {
          Add-NotTestable "VMES0111" `
            ("Gateways=" + ($actualGateways -join ",")) `
            "Terminalbus-Gateway laut Projekt" `
            "Sollwert fehlt" `
            "vm_es_expected_terminalbus_gateway ist nicht gesetzt."
        }

        if (-not $windowsUpdateSearch.performed) {
          Add-NotTestable "VMES0112" $windowsUpdateSearch `
            "Keine neueren Windows-Updates verfuegbar" `
            "Windows Update Agent" `
            "perform_windows_update_search ist false."
        } elseif (-not $windowsUpdateSearch.success) {
          Add-Check "VMES0112" "Nicht_Pruefbar" $windowsUpdateSearch `
            "Keine neueren Windows-Updates verfuegbar" `
            "Windows Update Agent" `
            "Die Updatesuche ist fehlgeschlagen."
        } else {
          Add-BooleanCheck "VMES0112" `
            ([int]$windowsUpdateSearch.missing_count -eq 0) `
            $windowsUpdateSearch `
            "Keine fehlenden, sichtbaren Softwareupdates" `
            "Direkt/Microsoft.Update.Session"
        }

        $minHostsDate113 = [string](Get-Param "expected_hosts_lmhosts_min_date_113" "")
        Add-BooleanCheck "VMES0113" `
          (Test-HostsDates $minHostsDate113) `
          ("HOSTS=" + [string]$hostsDate +
           "; LMHOSTS=" + [string]$lmhostsDate) `
          ("Beide Dateien mindestens vom " + $minHostsDate113) `
          "Direkt/Dateizeitstempel"

        Add-NotTestable "VMES0114" "" `
          "Masterlistenzeile besitzt keine Beschreibung" `
          "Keine pruefbare Vorgabe" `
          "Die Ansible-ID ist vorhanden, aber Beschreibung und Sollzustand sind leer."

        Add-NotTestable "VMES0115" `
          "Lokale VEEAM-Komponenten sind kein Nachweis eines Backups." `
          "VEEAM Backup erstellt" `
          "Externes VEEAM-System" `
          "Der erfolgreiche Backup-Job muss auf dem VEEAM-Server geprueft werden."

        Add-NotTestable "VMES0116" "" `
          "Masterlistenzeile besitzt keine Beschreibung" `
          "Keine pruefbare Vorgabe" `
          "Die Ansible-ID ist vorhanden, aber Beschreibung und Sollzustand sind leer."

        $toolsShare = $shares |
          Where-Object {
            $_.Name -ieq "Tools" -or
            [string]$_.Path -ieq $toolsFolder
          }
        Add-BooleanCheck "VMES0117" (@($toolsShare).Count -eq 0) `
          ("Tools-Freigaben=" +
           (@($toolsShare | ForEach-Object {
             $_.Name + "=" + $_.Path
           }) -join ",")) `
          "Freigabe Tools entfernt; Ordner darf lokal bestehen bleiben" `
          "Direkt/Get-SmbShare"

        Add-NotTestable "VMES0118" "" `
          "Masterlistenzeile besitzt keine Beschreibung" `
          "Keine pruefbare Vorgabe" `
          "Die Ansible-ID ist vorhanden, aber Beschreibung und Sollzustand sind leer."

        Add-NotTestable "VMES0119" `
          ("VM ist fuer diese Online-Pruefung erreichbar; letzter Systemstart=" + $lastBoot) `
          "VM heruntergefahren" `
          "Zeitlich nachgelagerter Schritt" `
          "Eine heruntergefahrene VM kann nicht gleichzeitig per WinRM geprueft werden."

        $winscpVersions = @($winscpPrograms | ForEach-Object { [string]$_.Version })
        Add-BooleanCheck "VMES0120" `
          (@($winscpVersions | Where-Object {
            $_ -eq "6.3.4" -or (Test-VersionAtLeast $_ "6.3.4")
          }).Count -gt 0) `
          ("WinSCP-Versionen=" + ($winscpVersions -join ",")) `
          "WinSCP mindestens Version 6.3.4" `
          "Direkt/Uninstall-Registry"

        $simaticLogonPath = [string](Get-Param "simatic_logon_registry_path" "")
        $simaticLogonName = [string](Get-Param "simatic_logon_auto_logoff_value_name" "")
        if ($simaticLogonPath -and $simaticLogonName) {
          $simaticLogonActual = Get-RegistryValueSafe `
            $simaticLogonPath $simaticLogonName
          $simaticLogonExpected = Get-Param `
            "simatic_logon_auto_logoff_expected_value" 0
          Add-BooleanCheck "VMES0121" `
            ([string]$simaticLogonActual -eq [string]$simaticLogonExpected) `
            $simaticLogonActual $simaticLogonExpected `
            "Direkt/Registry"
        } else {
          $simaticLogonPrograms = @(Find-Programs "(?i)SIMATIC Logon")
          Add-NotTestable "VMES0121" `
            (Programs-ToText $simaticLogonPrograms) `
            "SIMATIC Logon: automatisches Abmelden deaktiviert" `
            "Herstellerspezifische Konfiguration" `
            "Die optionalen SIMATIC-Logon-Registryvariablen sind nicht gesetzt."
        }

        foreach ($entry in $catalog) {
          $key = [string]$entry.key
          if (-not $addedChecks.ContainsKey($key)) {
            Add-NotTestable $key "" ([string]$entry.description) `
              "Keine implementierte technische Pruefmethode" `
              "Die ID ist im Katalog enthalten, besitzt aber noch keine spezifische Prueflogik."
          }
        }

        $result = [ordered]@{
          scan_timestamp = $null
          target_timestamp = (Get-Date).ToString("yyyy-MM-ddTHH:mm:ssK")
          ip = $targetIp
          ansible_reachable = $true
          computername = $env:COMPUTERNAME
          station_type = [string]$env:VALIDATION_STATION_TYPE
          masterlist_sheet = $masterSheet
          masterlist_profile = $masterProfile
          os_caption = [string]$os.Caption
          os_version = [string]$os.Version
          os_build = [string]$os.BuildNumber
          domain = [string]$cs.Domain
          part_of_domain = [bool]$cs.PartOfDomain
          virtualization = $virtualizationText
          checks = @($checks | Sort-Object masterlist_row)
          check_count = @($checks).Count
          error = $null
        }

        $json = $result | ConvertTo-Json -Depth 12 -Compress
        $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
        "VMES_RESULT_B64=" + [System.Convert]::ToBase64String($bytes)
      args:
        no_profile: true
      environment:
        VALIDATION_CATALOG_PATH: >-
          {{ validation_remote_dir }}\validation_catalog.json
        VALIDATION_PARAMETERS_PATH: >-
          {{ validation_remote_dir }}\validation_parameters.json
        VALIDATION_STATION_TYPE: "{{ validation_station_type }}"
        VALIDATION_MASTERLIST_SHEET: "{{ validation_masterlist_sheet }}"
        VALIDATION_MASTERLIST_PROFILE: "{{ validation_masterlist_profile }}"
      register: vm_es_validation_raw
      when:
        - validation_nmap_reachable | default(false) | bool
        - win_ping_result is defined
        - win_ping_result.ping | default('') == 'pong'
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Kodiertes VM-ES-Pruefergebnis aus PowerShell-Ausgabe extrahieren
      ansible.builtin.set_fact:
        vm_es_result_b64: >-
          {{
            (
              vm_es_validation_raw.stdout
              | default('')
              | regex_findall('VMES_RESULT_B64=([A-Za-z0-9+/=]+)')
              | first
            )
            | default('')
          }}
      when:
        - vm_es_validation_raw is defined
        - vm_es_validation_raw.stdout is defined

    - name: VM-ES-Pruefergebnis als Host-Fact speichern
      ansible.builtin.set_fact:
        vm_es_validation_info: >-
          {{ vm_es_result_b64 | b64decode | from_json }}
      when:
        - vm_es_result_b64 is defined
        - vm_es_result_b64 | length > 0

    - name: Diagnose ausgeben, wenn kein Pruefergebnis extrahiert werden konnte
      ansible.builtin.debug:
        msg:
          - "IP: {{ inventory_hostname }}"
          - "Nmap erreichbar: {{ validation_nmap_reachable | default(false) }}"
          - "WinRM-Ping: {{ win_ping_result.ping | default('nicht erreichbar') if win_ping_result is defined else 'nicht ausgefuehrt' }}"
          - "PowerShell RC: {{ vm_es_validation_raw.rc | default('nicht ausgefuehrt') if vm_es_validation_raw is defined else 'nicht ausgefuehrt' }}"
          - "PowerShell stderr: {{ vm_es_validation_raw.stderr | default('') if vm_es_validation_raw is defined else '' }}"
      when: vm_es_validation_info is not defined

    - name: Temporaeres VM-ES-Pruefverzeichnis entfernen
      ansible.windows.win_file:
        path: "{{ validation_remote_dir }}"
        state: absent
      when:
        - validation_nmap_reachable | default(false) | bool
        - win_ping_result is defined
        - win_ping_result.ping | default('') == 'pong'
      failed_when: false
      ignore_unreachable: true


- name: "VM-ES-Pruefprotokolle auf dem Ansible-Controller erzeugen"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    station_type: "VM_ES"
    station_group: "vm_es_validation_targets"
    masterlist_sheet: "VM ES"
    masterlist_profile: "{{ vm_es_masterlist_profile | default('ALL') }}"
    report_prefix: "{{ vm_es_report_prefix | default('0010_vm_es_initial_installation') }}"
    validation_catalog: >-
      {{ hostvars['localhost'].vm_es_validation_catalog | default([]) }}
    report_timestamp: >-
      {{
        hostvars['localhost'].report_timestamp
        | default(lookup('pipe', 'date +%Y%m%d_%H%M%S'))
      }}
    report_timestamp_iso: >-
      {{
        hostvars['localhost'].report_timestamp_iso
        | default(lookup('pipe', 'date -Iseconds'))
      }}
    report_json_path: >-
      {{ result_dir }}/{{ report_prefix }}_{{ report_timestamp }}.json
    report_csv_path: >-
      {{ result_dir }}/{{ report_prefix }}_{{ report_timestamp }}.csv
    report_latest_json_path: >-
      {{ result_dir }}/{{ report_prefix }}_latest.json
    report_latest_csv_path: >-
      {{ result_dir }}/{{ report_prefix }}_latest.csv

  tasks:
    - name: Report-Verzeichnis erzeugen
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0755"

    - name: JSON-Protokoll mit allen VM-ES-Ansible-IDs erzeugen
      ansible.builtin.copy:
        dest: "{{ report_json_path }}"
        mode: "0644"
        content: |
          [
          {% for h in groups[station_group] | default([]) %}
          {% if hostvars[h].vm_es_validation_info is defined %}
          {{
            (
              hostvars[h].vm_es_validation_info
              | combine({
                  'scan_timestamp': report_timestamp_iso,
                  'discovery_group': hostvars[h].validation_discovery_group | default('vm_es'),
                  'discovery_file': hostvars[h].validation_discovery_file | default(''),
                  'discovery_generated_at': hostvars[h].validation_discovery_generated_at | default(''),
                  'nmap_reachable': hostvars[h].validation_nmap_reachable | default(false) | bool,
                  'nmap_winrm_port': hostvars[h].validation_nmap_winrm_port | default(''),
                  'nmap_winrm_scheme': hostvars[h].validation_nmap_winrm_scheme | default(''),
                  'nmap_open_ports': hostvars[h].validation_nmap_open_ports | default('')
                })
            ) | to_nice_json
          }}
          {% else %}
          {
            "scan_timestamp": {{ report_timestamp_iso | to_json }},
            "target_timestamp": null,
            "ip": {{ h | to_json }},
            "discovery_group": {{ hostvars[h].validation_discovery_group | default('vm_es') | to_json }},
            "discovery_file": {{ hostvars[h].validation_discovery_file | default('') | to_json }},
            "discovery_generated_at": {{ hostvars[h].validation_discovery_generated_at | default('') | to_json }},
            "nmap_reachable": {{ hostvars[h].validation_nmap_reachable | default(false) | bool | to_json }},
            "nmap_winrm_port": {{ hostvars[h].validation_nmap_winrm_port | default('') | to_json }},
            "nmap_winrm_scheme": {{ hostvars[h].validation_nmap_winrm_scheme | default('') | to_json }},
            "nmap_open_ports": {{ hostvars[h].validation_nmap_open_ports | default('') | to_json }},
            "ansible_reachable": false,
            "computername": {{ hostvars[h].validation_discovery_computername | default('') | to_json }},
            "station_type": {{ station_type | to_json }},
            "masterlist_sheet": {{ masterlist_sheet | to_json }},
            "masterlist_profile": {{ masterlist_profile | to_json }},
            "os_caption": "",
            "os_version": "",
            "os_build": "",
            "domain": "",
            "part_of_domain": false,
            "virtualization": "",
            "checks": [
            {% for c in validation_catalog %}
              {
                "masterlist_sheet": {{ masterlist_sheet | to_json }},
                "masterlist_profile": {{ masterlist_profile | to_json }},
                "masterlist_row": {{ c.row }},
                "master_value": {{ ('ALL' if masterlist_profile == 'ALL' else c.master_values.get(masterlist_profile, '')) | to_json }},
                "ansible_id": {{ c.ansible_id | to_json }},
                "schritt": {{ c.title | to_json }},
                "master_beschreibung": {{ c.description | to_json }},
                "status": "Nicht_Pruefbar",
                "istwert": "",
                "sollwert": "Nmap erkennt einen offenen WinRM-Port und der Zielrechner ist per WinRM erreichbar",
                "pruefmethode": "Nmap + WinRM",
                "hinweis": {{
                  (
                    'Nmap hat keinen offenen WinRM-Port 5985/5986 erkannt.'
                    if not (hostvars[h].validation_nmap_reachable | default(false) | bool)
                    else 'Nmap hat einen WinRM-Port erkannt, aber WinRM war nicht erreichbar, der Zugriff wurde verweigert oder das PowerShell-Ergebnis konnte nicht ausgewertet werden.'
                  ) | to_json
                }}
              }{% if not loop.last %},{% endif %}
            {% endfor %}
            ],
            "check_count": {{ validation_catalog | length }},
            "error": {{
              (
                'Nmap hat keinen offenen WinRM-Port 5985/5986 erkannt.'
                if not (hostvars[h].validation_nmap_reachable | default(false) | bool)
                else 'Nmap hat einen WinRM-Port erkannt, aber WinRM war nicht erreichbar, der Zugriff wurde verweigert oder das PowerShell-Ergebnis konnte nicht ausgewertet werden.'
              ) | to_json
            }}
          }
          {% endif %}
          {% if not loop.last %},{% endif %}
          {% endfor %}
          ]

    - name: CSV-Protokoll zeilenweise nach VMES-Ansible-ID erzeugen
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import csv
        import json
        from pathlib import Path

        json_path = Path({{ report_json_path | to_json }})
        csv_path = Path({{ report_csv_path | to_json }})
        data = json.loads(json_path.read_text(encoding="utf-8"))

        fieldnames = [
            "Pruefzeit",
            "Zielzeit",
            "IP",
            "Discovery_Gruppe",
            "Discovery_Datei",
            "Discovery_Zeit",
            "Nmap_WinRM_erreichbar",
            "Nmap_WinRM_Port",
            "Nmap_WinRM_Schema",
            "Nmap_offene_WinRM_Ports",
            "Ansible_erreichbar",
            "Computername",
            "Stationstyp",
            "Betriebssystem",
            "OS_Version",
            "OS_Build",
            "Domaene",
            "Domaenenmitglied",
            "Virtualisierung",
            "Masterliste_Blatt",
            "Masterliste_Profil",
            "Masterliste_Zeile",
            "Masterwert",
            "Ansible_ID",
            "Schritt",
            "Master_Beschreibung",
            "Status",
            "Istwert",
            "Sollwert",
            "Pruefmethode",
            "Hinweis",
        ]

        rows = []
        for host in data:
            for check in host.get("checks") or []:
                rows.append({
                    "Pruefzeit": host.get("scan_timestamp", ""),
                    "Zielzeit": host.get("target_timestamp", ""),
                    "IP": host.get("ip", ""),
                    "Discovery_Gruppe": host.get("discovery_group", ""),
                    "Discovery_Datei": host.get("discovery_file", ""),
                    "Discovery_Zeit": host.get("discovery_generated_at", ""),
                    "Nmap_WinRM_erreichbar": host.get("nmap_reachable", False),
                    "Nmap_WinRM_Port": host.get("nmap_winrm_port", ""),
                    "Nmap_WinRM_Schema": host.get("nmap_winrm_scheme", ""),
                    "Nmap_offene_WinRM_Ports": host.get("nmap_open_ports", ""),
                    "Ansible_erreichbar": host.get("ansible_reachable", False),
                    "Computername": host.get("computername", ""),
                    "Stationstyp": host.get("station_type", ""),
                    "Betriebssystem": host.get("os_caption", ""),
                    "OS_Version": host.get("os_version", ""),
                    "OS_Build": host.get("os_build", ""),
                    "Domaene": host.get("domain", ""),
                    "Domaenenmitglied": host.get("part_of_domain", False),
                    "Virtualisierung": host.get("virtualization", ""),
                    "Masterliste_Blatt": check.get(
                        "masterlist_sheet", host.get("masterlist_sheet", "")
                    ),
                    "Masterliste_Profil": check.get(
                        "masterlist_profile", host.get("masterlist_profile", "")
                    ),
                    "Masterliste_Zeile": check.get("masterlist_row", ""),
                    "Masterwert": check.get("master_value", ""),
                    "Ansible_ID": check.get("ansible_id", ""),
                    "Schritt": check.get("schritt", ""),
                    "Master_Beschreibung": check.get("master_beschreibung", ""),
                    "Status": check.get("status", ""),
                    "Istwert": check.get("istwert", ""),
                    "Sollwert": check.get("sollwert", ""),
                    "Pruefmethode": check.get("pruefmethode", ""),
                    "Hinweis": check.get("hinweis", ""),
                })

        def row_number(value):
            try:
                return int(value)
            except (TypeError, ValueError):
                return 0

        rows.sort(key=lambda row: (str(row["IP"]), row_number(row["Masterliste_Zeile"])))

        with csv_path.open("w", encoding="utf-8-sig", newline="") as handle:
            writer = csv.DictWriter(
                handle,
                fieldnames=fieldnames,
                delimiter=";",
                quoting=csv.QUOTE_MINIMAL,
            )
            writer.writeheader()
            writer.writerows(rows)

        summary = {}
        for row in rows:
            status = row.get("Status", "")
            summary[status] = summary.get(status, 0) + 1

        print(json.dumps({
            "csv": str(csv_path),
            "rows": len(rows),
            "hosts": len(data),
            "status": summary,
        }, ensure_ascii=False))
        PY
      args:
        executable: /bin/bash
      register: csv_result
      changed_when: false

    - name: Aktuelle JSON-Datei als latest bereitstellen
      ansible.builtin.copy:
        src: "{{ report_json_path }}"
        dest: "{{ report_latest_json_path }}"
        remote_src: true
        mode: "0644"

    - name: Aktuelle CSV-Datei als latest bereitstellen
      ansible.builtin.copy:
        src: "{{ report_csv_path }}"
        dest: "{{ report_latest_csv_path }}"
        remote_src: true
        mode: "0644"

    - name: VM-ES-Report-Pfade und Statusuebersicht anzeigen
      ansible.builtin.debug:
        msg:
          - "Discovery-Gruppe: groups.vm_es"
          - "Masterlistenblatt: {{ masterlist_sheet }}"
          - "Masterlistenprofil: {{ masterlist_profile }}"
          - "Anzahl Ansible-IDs je VM: {{ validation_catalog | length }}"
          - "JSON: {{ report_json_path }}"
          - "CSV:  {{ report_csv_path }}"
          - "Latest JSON: {{ report_latest_json_path }}"
          - "Latest CSV:  {{ report_latest_csv_path }}"
          - "Zusammenfassung: {{ csv_result.stdout }}"