---

- name: "VM-ES-Zielrechner aus Discovery laden und dynamisch aufnehmen"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    station_type: "VM_ES"
    station_group: "vm_es_validation_targets"
    masterlist_sheet: "VM ES"
    masterlist_profile: "{{ vm_es_masterlist_profile | default('ALL') }}"
    report_prefix: "{{ vm_es_report_prefix | default('0010_vm_es_initial_installation') }}"
    discovery_latest_file: >-
      {{ vm_discovery_file
         | default(result_dir ~ '/vm_discovery_groups_latest.json') }}

    vm_es_default_partitions:
      - drive: "C:"
        expected_size_gb: 100
      - drive: "D:"
        min_size_gb: 1
      - drive: "E:"
        expected_size_gb: 1

    vm_es_expected_partitions_map: >-
      {{
        vm_es_expected_partitions_by_host
        | default({'default': vm_es_default_partitions})
      }}

    vm_es_validation_parameters:
      masterlist_profile: "{{ masterlist_profile }}"
      expected_os_regex: >-
        {{ vm_es_expected_os_regex | default('(?i)Windows Server 2022') }}
      expected_cpu_cores: "{{ vm_es_expected_cpu_cores | default(4) }}"
      expected_ram_gb: "{{ vm_es_expected_ram_gb | default(16) }}"
      expected_disk_sizes_gb: >-
        {{ vm_es_expected_disk_sizes_gb | default([125, 100, 1]) }}
      disk_size_tolerance_gb: >-
        {{ vm_es_disk_size_tolerance_gb
           | default(partition_size_tolerance_gb | default(5)) }}
      expected_locale: "{{ vm_es_expected_locale | default('de-DE') }}"
      expected_geo_id: "{{ vm_es_expected_geo_id | default(94) }}"
      expected_timezone_id: >-
        {{ expected_timezone_id | default('W. Europe Standard Time') }}
      expected_admin_name: "{{ admin_l_user | default('Admin_L') }}"
      expected_password_complexity: >-
        {{ expected_password_complexity | default(0) }}
      expected_min_password_length: >-
        {{ expected_min_password_length | default(0) }}
      expected_max_password_age_days: >-
        {{ expected_max_password_age_days | default(0) }}
      expected_min_password_age_days: >-
        {{ expected_min_password_age_days | default(0) }}
      expected_admin_password_min_set_date: >-
        {{ expected_admin_password_min_set_date | default('') }}
      expected_admin_password_max_age_days: >-
        {{ expected_admin_password_max_age_days | default(0) }}
      expected_eventlog_max_kb: "{{ expected_eventlog_max_kb | default(16384) }}"
      expected_screen_width: "{{ expected_screen_width | default(1920) }}"
      expected_screen_height: "{{ expected_screen_height | default(1080) }}"
      expected_power_plan_regex: >-
        {{ expected_power_plan_regex
           | default('SIMATIC|High performance|Hoechstleistung|Höchstleistung|Ultimate Performance') }}
      expected_present_adapters: >-
        {{
          vm_es_expected_present_adapters
          | default(expected_present_adapters | default(['Terminalbus']))
        }}
      expected_absent_adapters: >-
        {{
          vm_es_expected_absent_adapters
          | default(expected_absent_adapters | default(['Anlagenbus', 'Plantbus']))
        }}
      allowed_enabled_adapter_names: >-
        {{
          vm_es_allowed_enabled_adapter_names
          | default(allowed_enabled_adapter_names | default(['Terminalbus']))
        }}
      expected_terminalbus_adapter_regex: >-
        {{ expected_terminalbus_adapter_regex | default('^Terminalbus$') }}
      expected_terminalbus_gateway: >-
        {{ vm_es_expected_terminalbus_gateway | default('') }}
      expected_dns_servers: >-
        {{
          vm_es_expected_dns_servers
          | default(['10.37.34.11', '10.37.34.12', '10.199.167.12'])
        }}
      expected_dns_suffixes: >-
        {{
          vm_es_expected_dns_suffixes
          | default(['lg.grp', 'linde.lds.grp'])
