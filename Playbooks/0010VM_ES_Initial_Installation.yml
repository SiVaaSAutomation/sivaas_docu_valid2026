    - key: "VMES0084"
      row: 104
      ansible_id: "VMES0084"
      title: "Deaktivieren von Diensten"
      description: "Kompendium Teil F (V10.0): siehe Kapitel 7.2.1\nAb V10: über das SIMATIC PCS 7 Setup mittels Option \"System Hardening\" realisiert. Diese Option ist einmalig auszuführen.\n\nDabei werden die folgenden Dienste deaktiviert:\n• Bluetooth-Audiogateway-Dienst\n• Bluetooth-Unterstützungsdienste\n• Diagnosediensthost\n• Diagnoserichtliniendienst\n• Funkverwaltungsdienst\n• Geolocation-Dienst\n• Leistungsprotokolle und -warnungen\n• Manager für heruntergeladene Karten\n• Siemens Telemetry Connector Service\n• Telefondienst\n• WalletService\n• Windows Media Player-Netzwerkfreigabedienst\n• Windows Presentation Foundation-Schriftartcache\n• Windows-Dienst für mobile Hotspots\n• Windows-Farbsystem\n• Windows-Insider-Dienst\n• Windows-Sofortverbindung - Konfigurationsregistrierungsstelle\n• Xbox Accessory Management Service\n• Xbox Live Authentifizierungs-Manager\n• Xbox Live-Netzwerkservice\n• Xbox Live-Spiele speichern\n• Zahlungs- und NFC/SE-Manager\n• Zertifikatverteilung\n\nOder Auswahl System Hardening im PCS7 Setup\n\nKontrolle dass System Hardening durchgeführt wurde"
      master_values:
        F_TLGDE1064DE001: "n"
        H_ES0180705: "n"
        J_ENG4X31: "n"
        K_ENG4X32: "n"
      master_note: "Durch Option \"System Hardening\" erfolgt"
    - key: "VMES0085"
