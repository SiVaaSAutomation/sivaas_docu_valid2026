      title: "Deaktivierung von SMBv1 "
      description: "Deaktivierung von SMBv1 siehe Kapitel 6.2.4.4 \n- Deaktivieren Sie auf Ihren Systemen eine veraltete Version des SMB-Protokolls, welches bei Kopiervorgängen von Dateien zwischen zwei Systemen verwendet werden kann. Gehen Sie dazu nach der folgenden Anleitung vor: https://support.microsoft.com/de-de/help/2696547 \n\nIm Ordner Scripte gibt es eine Anleitung wie man es übder die PowerShell deaktivieren kann.\nGet-WindowsOptionalFeature -Online -FeatureName SMB1Protocol"
      master_values:
        F_TLGDE1064DE001: "n"
        H_ES0180705: "n"
        J_ENG4X31: "n"
        K_ENG4X32: "n"
      master_note: "Bereits deaktiviert"
    - key: "VMES0087"
      row: 107
      ansible_id: "VMES0087"
      title: "SMBv3-Verschlüsselung"
      description: "Kompendium Teil F (V10.0): siehe Kapitel 7.2.3.2\n\nAuf allen PCS 7 Systemen ist folgender Befehl auszuführen:\nSet-SmbServerConfiguration –EncryptData $true\n\nAuf DCs, WSUS oder Jumphost kann folgender Befehl ausgeführt werden um Shares zu verschlüsseln:\nSet-SmbShare –Name <sharename> -EncryptData $true\n\nDer <sharemame> ist entsprechend der Freigabenamen der benötigten Dateifreigaben anzupassen.\nDie aktuelle Einstellung der SMBv3-Verschlüsselung kann mit folgenden Befehlen überprüft werden.\n\nBei Aktivierung der Verschlüsselung für das komplette System:\nGet-SmbServerConfiguration | Select-Object EncryptData\nBei Verschlüsselung einzelner Dateifreigaben auf einem System:\nGet-SmbConnection | Select-Object -Property Servername, Sharename, encrypted, dialect"
      master_values:
        F_TLGDE1064DE001: ""
        H_ES0180705: "x"
        J_ENG4X31: "x"
        K_ENG4X32: "x"
      master_note: ""
    - key: "VMES0088"
      row: 108
      ansible_id: "VMES0088"
      title: "Deaktivierung von veralteten SSL-/TLS-Kommunikationsverfahren"
      description: "Kompendium Teil F (V10.0): siehe Kapitel 7.2.3.7\n\nIn der Registry sollten folgende Verfahren deaktiviert werden:\n\nDeaktivieren von SSL V2.0\nDeaktivieren von SSL V3.0\nDeaktivieren von TLS V1.0\nDeaktivieren von TLS V1.1\nAktivieren von TLS V1.2\n\nNur Kontrolle, auf vorinstallierten IPCs sind diese empfohlenen Einstellungen bereits vorkonfiguriert\n\nKontrolle mittels SSL_TLS_Registry_query.bat"
      master_values:
        F_TLGDE1064DE001: ""
        H_ES0180705: "n"
        J_ENG4X31: "n"
        K_ENG4X32: "n"
      master_note: "Registryschlüssel fehlen"
    - key: "VMES0089"
      row: 109
      ansible_id: "VMES0089"
      title: "Verwendung von sicheren Cipher Suites"
      description: "Kompendium Teil F (V10.0): siehe Kapitel 7.2.3.8\n\nFolgende TLS V1.2 Cipher Suites (ggf. abhängig von länderspezifischen Anforderungen) mit Perfect Forward\nSecrecy (PFS) wurden auf Kompatibilität mit SIMATIC PCS 7 getestet:\n• TLS_DHE_RSA_WITH_AES_128_GCM_SHA256\n• TLS_DHE_RSA_WITH_AES_128_CBC_SHA256\n• TLS_DHE_RSA_WITH_AES_256_GCM_SHA384\n• TLS_DHE_RSA_WITH_AES_256_CBC_SHA256\n• TLS_DHE_RSA_WITH_CHACHA20_POLY1305_SHA256\n• TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256\n• TLS_ECDHE_RSA_WITH_AES_128_CBC_SHA256\n• TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384\n• TLS_ECDHE_RSA_WITH_AES_256_CBC_SHA384\n• TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305_SHA256\n\nAndere, oben nicht genannte, Cipher Suites sollen explizit deaktiviert werden, z.B.\nTLS_RSA_WITH_3DES_EDE_CBC_SHA.\n\nDie auf den Systemen aktiven Cipher Suites erhalten Sie mit dem folgenden PowershellBefehl:\nGet-TlsCipherSuite | fw\n\nKontrolle ob Deaktivierung notwendig ist"
      master_values:
        F_TLGDE1064DE001: ""
        H_ES0180705: "x"
        J_ENG4X31: "x"
        K_ENG4X32: "x"
      master_note: ""
    - key: "VMES0090"
      row: 110
      ansible_id: "VMES0090"
      title: "Verwendung von sicheren Cipher Suites"
      description: "PowerShell-Befehl Disable-TlsCipherSuite\n- TLS_AES_256_GCM_SHA384\n- TLS_AES_128_GCM_SHA256\n- TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384\n- TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256\n- TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA384\n- TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA256\n- TLS_RSA_WITH_NULL_SHA256\n- TLS_RSA_WITH_NULL_SHA\n- TLS_PSK_WITH_AES_256_GCM_SHA384\n- TLS_PSK_WITH_AES_128_GCM_SHA256\n- TLS_ECDHE_ECDSA_WITH_AES_256_CBC_SHA\n- TLS_ECDHE_ECDSA_WITH_AES_128_CBC_SHA\n- TLS_PSK_WITH_AES_256_CBC_SHA384\n- TLS_PSK_WITH_AES_128_CBC_SHA256\n- TLS_PSK_WITH_NULL_SHA384\n- TLS_PSK_WITH_NULL_SHA256\n- TLS_RSA_WITH_AES_256_GCM_SHA384\n- TLS_RSA_WITH_AES_128_GCM_SHA256\n- TLS_RSA_WITH_AES_256_CBC_SHA256\n- TLS_RSA_WITH_AES_128_CBC_SHA256\n- TLS_RSA_WITH_AES_256_CBC_SHA\n- TLS_RSA_WITH_AES_128_CBC_SHA\n- TLS_RSA_WITH_3DES_EDE_CBC_SHA\n\nDeaktivierung mittels Disable_TLS_Ciphers.ps1"
      master_values:
