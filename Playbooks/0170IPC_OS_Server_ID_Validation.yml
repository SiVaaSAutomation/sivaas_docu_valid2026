---
- name: "0170 IPC OS Server - ID-Pruefung aus Informationsbibliothek"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    ipc_os_server_validation_library_file: >-
      {{
        ipc_information_library_file
        | default(result_dir ~ '/ipc_information_library_latest.json')
      }}
    ipc_os_server_validation_output_file: >-
      {{
        ipc_os_server_id_validation_file
        | default(result_dir ~ '/ipc_os_server_id_validation_latest.json')
      }}
    ipc_os_server_validation_csv_file: >-
      {{
        ipc_os_server_id_validation_csv_file
        | default(result_dir ~ '/ipc_os_server_id_validation_matrix_latest.csv')
      }}
    ipc_os_server_validation_discovery_file: >-
      {{
        ipc_discovery_file
        | default(result_dir ~ '/ipc_discovery_groups_latest.json')
      }}
    ipc_os_server_validation_live_dir: "{{ result_dir }}/.0170_live"
    ipc_os_server_validation_expected_file: "{{ result_dir }}/.0170_live/0170_expected.json"

  tasks:
    - name: Benoetigte Semaphore-Variablen fuer 0170 pruefen
      ansible.builtin.assert:
        that:
          - result_dir is defined
          - result_dir | string | length > 0
          - win_user is defined
          - win_user | string | length > 0
          - win_password is defined
          - win_password | string | length > 0
          - winrm_transport is defined
          - winrm_transport | string | length > 0
          - ipc_es_validation_expected is defined
          - ipc_es_validation_expected is mapping
          - ipc_es_validation_expected.network is defined
          - ipc_es_validation_expected.network.terminalbus is defined
          - ipc_es_validation_expected.network.terminalbus.name_regex is defined
          - ipc_es_validation_expected.network.terminalbus.dns_servers is defined
          - ipc_es_validation_expected.network.terminalbus.wins_servers is defined
          - ipc_es_validation_expected.storage is defined
          - ipc_es_validation_expected.storage.data_drive.expected_size_gb_by_type.OS_Server is defined
          - ipc_es_validation_expected.desktop.screen_saver_by_type.OS_Server is defined
          - ipc_es_validation_expected.desktop.screen_saver_by_type.OS_Server.enabled is defined
          - ipc_es_validation_expected.desktop.screen_saver_by_type.OS_Server.timeout_seconds is defined
          - ipc_es_validation_expected.desktop.screen_saver_by_type.OS_Server.password_protected is defined
          - ipc_es_validation_expected.power.by_type.OS_Server is defined
          - ipc_es_validation_expected.power.by_type.OS_Server.display_timeout_ac_minutes is defined
          - ipc_es_validation_expected.power.by_type.OS_Server.disk_timeout_ac_minutes is defined
          - ipc_es_validation_expected.power.by_type.OS_Server.active_plan_name_regex is defined
          - ipc_es_validation_expected.software.ultravnc_server.expected_installed is defined
          - ipc_es_validation_expected.software.ultravnc_viewer.expected_installed is defined
          - ipc_es_validation_expected.software.ultravnc_viewer.file_association_required is defined
          - ipc_es_validation_expected.software.orcla.expected_installed is defined
          - ipc_es_validation_expected.software.orcla.certificate_expectations.wincc_client_subject_regexes_on_ipc is defined
          - ipc_es_validation_expected.hardening.tls.allowed_cipher_suites is defined
          - ipc_es_validation_expected.hardening.tls.disabled_cipher_suites is defined
          - ipc_es_validation_expected.hardening.tls.enforce_allowed_cipher_suite_only is defined
          - ipc_es_validation_expected.filesystem.project_share.path is defined
          - ipc_es_validation_expected.filesystem.project_share.share_name is defined
          - ipc_es_validation_expected.tools.bgsivaas.executable_path is defined
          - ipc_es_validation_expected.tools.bgsivaas.startup_required is defined
          - ipc_es_validation_expected.tools.bgsivaas.startup_target_regex is defined
          - ipc_es_validation_expected.tools.bgsivaas.run_as_administrator is defined
          - ipc_es_validation_expected.tools.wsus_client_manager.path is defined
          - ipc_es_validation_expected.system.pagefile.required_drives is defined
          - ipc_es_validation_expected.system.pagefile.system_managed is defined
          - ipc_es_validation_expected.system.pagefile.accept_global_automatic_management is defined
          - ipc_es_validation_expected.firmware.bios_checks.IPC0263 is defined
          - ipc_es_validation_expected.firmware.bios_checks.IPC0264 is defined
          - ipc_es_validation_expected.firmware.bios_checks.IPC0265 is defined
          - ipc_es_validation_expected.firmware.bios_checks.IPC0267 is defined
          - ipc_es_validation_expected.firmware.bios_checks.IPC0268 is defined
          - ipc_es_validation_expected.firmware.bios_checks.IPC0269 is defined
          - ipc_es_validation_expected.firmware.bios_checks.IPC0270 is defined
          - ipc_es_validation_expected.firmware.bios_checks.IPC0271 is defined
        fail_msg: >-
          Fuer 0170 fehlt der gemeinsame strukturierte Semaphore-Block
          ipc_es_validation_expected oder darin benoetigte OS_Server-Sollwerte.

    - name: Informationsbibliothek von 0150 pruefen
      ansible.builtin.stat:
        path: "{{ ipc_os_server_validation_library_file }}"
      register: ipc_os_server_validation_library_stat

    - name: Abbrechen wenn Informationsbibliothek fehlt
      ansible.builtin.fail:
        msg: >-
          {{ ipc_os_server_validation_library_file }} wurde nicht gefunden.
          Fuehre zuerst 0000, danach 0120 und anschliessend 0150 aus.
      when: not (ipc_os_server_validation_library_stat.stat.exists | default(false))

    - name: Ausgabeordner fuer 0170 anlegen
      ansible.builtin.file:
        path: "{{ ipc_os_server_validation_output_file | dirname }}"
        state: directory

    - name: Discovery-Datei fuer direkte 0170-Pruefungen pruefen
      ansible.builtin.stat:
        path: "{{ ipc_os_server_validation_discovery_file }}"
      register: ipc_os_server_validation_discovery_stat

    - name: Abbrechen wenn Discovery-Datei fehlt
      ansible.builtin.fail:
        msg: >-
          {{ ipc_os_server_validation_discovery_file }} wurde nicht gefunden.
          Fuehre zuerst 0000IPC_Discovery_Classification.yml aus.
      when: not (ipc_os_server_validation_discovery_stat.stat.exists | default(false))

    - name: Discovery-Datei fuer direkte 0170-Pruefungen einlesen
      ansible.builtin.slurp:
        src: "{{ ipc_os_server_validation_discovery_file }}"
      register: ipc_os_server_validation_discovery_raw

    - name: Discovery-Daten fuer direkte 0170-Pruefungen speichern
      ansible.builtin.set_fact:
        ipc_os_server_validation_discovery_data: >-
          {{ ipc_os_server_validation_discovery_raw.content | b64decode | from_json }}

    - name: OS-Server-Gruppe in Discovery-Datei pruefen
      ansible.builtin.assert:
        that:
          - ipc_os_server_validation_discovery_data.groups is defined
          - ipc_os_server_validation_discovery_data.groups.ipc_os is defined
          - ipc_os_server_validation_discovery_data.groups.ipc_os is iterable
        fail_msg: >-
          In {{ ipc_os_server_validation_discovery_file }} wurde groups.ipc_os nicht gefunden.

    - name: OS-Server-Ziele fuer direkte Read-only-Pruefungen dynamisch anlegen
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: ipc_os_server_0170_live_targets
        ansible_host: "{{ item.ip }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.winrm_port | default(winrm_default_port | default(5985)) | int }}"
        ansible_winrm_scheme: "{{ item.winrm_scheme | default('http') }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(180) }}"
      loop: "{{ ipc_os_server_validation_discovery_data.groups.ipc_os | default([]) }}"
      loop_control:
        label: "{{ item.ip }}"
      no_log: true

    - name: Alte direkte 0170-Zwischenergebnisse entfernen
      ansible.builtin.file:
        path: "{{ ipc_os_server_validation_live_dir }}"
        state: absent

    - name: Verzeichnis fuer direkte 0170-Ergebnisse vorbereiten
      ansible.builtin.file:
        path: "{{ ipc_os_server_validation_live_dir }}"
        state: directory

    - name: Gemeinsame Sollwerte fuer externe 0170-Pythonpruefung bereitstellen
      ansible.builtin.copy:
        dest: "{{ ipc_os_server_validation_expected_file }}"
        content: "{{ ipc_es_validation_expected | to_nice_json }}"

    - name: Erste IPC-OS-Server-IDs aus Informationsbibliothek pruefen
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../Python/0170IPC_OS_Server_ID_Validation.py"
          - build
          - --library
          - "{{ ipc_os_server_validation_library_file }}"
          - --output
          - "{{ ipc_os_server_validation_output_file }}"
          - --csv
          - "{{ ipc_os_server_validation_csv_file }}"
          - --expected
          - "{{ ipc_os_server_validation_expected_file }}"
      register: ipc_os_server_validation_build
      changed_when: true

    - name: Erzeugte 0170-JSON-Datei pruefen
      ansible.builtin.stat:
        path: "{{ ipc_os_server_validation_output_file }}"
      register: ipc_os_server_validation_output_stat

    - name: Abbrechen wenn 0170 keine JSON-Datei erzeugt hat
      ansible.builtin.fail:
        msg: >-
          {{ ipc_os_server_validation_output_file }} wurde nicht erzeugt.
          Generatorausgabe: {{ ipc_os_server_validation_build.stdout | default('') }}
      when: not (ipc_os_server_validation_output_stat.stat.exists | default(false))

    - name: Bibliotheksbasierte 0170-Vorpruefung anzeigen
      ansible.builtin.debug:
        msg:
          - "Nur Computerart OS_Server wird ausgewertet; ES, OS Client und Kein_Zugriff werden ignoriert."
          - "Direkte OS-Server-Sollwertpruefungen umfassen u.a. IPC0046-IPC0048, IPC0063, IPC0070, IPC0073-IPC0077, IPC0083-IPC0084, IPC0087, IPC0089, IPC0148, IPC0152, IPC0160-IPC0161 sowie die vorhandenen System-/Firmwarepruefungen."
          - "Informationsausgaben wie Benutzer, Netzwerkadapter, Domaenen-/OU-Daten und Zertifikate werden kompakt in die Matrix geschrieben."
          - "JSON: {{ ipc_os_server_validation_output_file }}"
          - "CSV: {{ ipc_os_server_validation_csv_file }}"

- name: "0170 IPC OS Server - Direkte Read-only-Pruefungen fuer Snapshot-Luecken"
  hosts: ipc_os_server_0170_live_targets
  gather_facts: false
  become: false
  any_errors_fatal: false

  vars:
    live_expected_allowed_ciphers: "{{ ipc_es_validation_expected.hardening.tls.allowed_cipher_suites }}"
    live_expected_disabled_ciphers: "{{ ipc_es_validation_expected.hardening.tls.disabled_cipher_suites }}"
    live_expected_project_folder: "{{ ipc_es_validation_expected.filesystem.project_share.path }}"

  tasks:
    - name: WinRM-Verbindung fuer direkte 0170-Pruefungen testen
      ansible.windows.win_ping:
      register: ipc_0170_live_ping
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Direkte read-only Pruefungen fuer OS-Server-Endzustaende ausfuehren
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'

        $expectedScreenSaverEnabled = "{{ ipc_es_validation_expected.desktop.screen_saver_by_type.OS_Server.enabled | bool | ternary('true','false') }}" -eq 'true'
        $expectedScreenSaverTimeoutSeconds = {{ ipc_es_validation_expected.desktop.screen_saver_by_type.OS_Server.timeout_seconds | int }}
        $expectedScreenSaverSecure = "{{ ipc_es_validation_expected.desktop.screen_saver_by_type.OS_Server.password_protected | bool | ternary('true','false') }}" -eq 'true'
        $expectedDisplayTimeoutAcMinutes = {{ ipc_es_validation_expected.power.by_type.OS_Server.display_timeout_ac_minutes | int }}
        $expectedDiskTimeoutAcMinutes = {{ ipc_es_validation_expected.power.by_type.OS_Server.disk_timeout_ac_minutes | int }}
        $expectedUltraVncViewerInstalled = "{{ ipc_es_validation_expected.software.ultravnc_viewer.expected_installed | bool | ternary('true','false') }}" -eq 'true'
        $expectedUltraVncViewerVersionRegex = {{ (ipc_es_validation_expected.software.ultravnc_viewer.version_regex | default(ipc_es_validation_expected.software.ultravnc_server.version_regex | default(''))) | to_json }}
        $expectedPowerPlanNameRegex = {{ ipc_es_validation_expected.power.by_type.OS_Server.active_plan_name_regex | to_json }}
        $expectedPowerPlanGuid = {{ ipc_es_validation_expected.power.by_type.OS_Server.active_plan_guid | default('8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c') | to_json }}
        $systemRestoreWindows10Only = "{{ ipc_es_validation_expected.hardening.system_restore.windows10_only | default(true) | bool | ternary('true','false') }}" -eq 'true'
        $expectedSystemRestoreDisabled = "{{ ipc_es_validation_expected.hardening.system_restore.expected_disabled | default(true) | bool | ternary('true','false') }}" -eq 'true'
        $privacyExpectations = ConvertFrom-Json -InputObject @'
        {{ (ipc_es_validation_expected.hardening.privacy | default({})).registry_expectations | default([]) | to_json }}
        '@
        $allowedCipherSuites = ConvertFrom-Json -InputObject @'
        {{ ipc_es_validation_expected.hardening.tls.allowed_cipher_suites | to_json }}
        '@
        $disabledCipherSuites = ConvertFrom-Json -InputObject @'
        {{ ipc_es_validation_expected.hardening.tls.disabled_cipher_suites | to_json }}
        '@
        $expectedFirewallProfiles = ConvertFrom-Json -InputObject @'
        {{ ipc_es_validation_expected.hardening.firewall.required_profiles_enabled | to_json }}
        '@
        $expectedNetworkCategory = {{ ipc_es_validation_expected.hardening.firewall.active_network_category | to_json }}
        $enforceAllowedCipherSuiteOnly = "{{ ipc_es_validation_expected.hardening.tls.enforce_allowed_cipher_suite_only | bool | ternary('true','false') }}" -eq 'true'
        $filesystemExpected = ConvertFrom-Json -InputObject @'
        {{ ipc_es_validation_expected.filesystem | to_json }}
        '@
        $nameResolutionExpected = ConvertFrom-Json -InputObject @'
        {{ ipc_es_validation_expected.filesystem.get('name_resolution_files', {'hosts_path':'C:\\Windows\\System32\\drivers\\etc\\hosts','lmhosts_path':'C:\\Windows\\System32\\drivers\\etc\\lmhosts','require_hosts':true,'require_lmhosts':true}) | to_json }}
        '@
        $expectedVncViewerFirewallRegex = {{ ipc_es_validation_expected.hardening.firewall.get('vnc_viewer_rule_name_regex', '(?i)(VNC.*Viewer|UltraVNC.*Viewer)') | to_json }}
        $requiredDefenderStatusFieldsExpected = ConvertFrom-Json -InputObject @'
        {{ ipc_es_validation_expected.hardening.get('defender', {}).get('required_status_true', ['AMServiceEnabled','AntivirusEnabled','AntispywareEnabled','BehaviorMonitorEnabled','IoavProtectionEnabled','NISEnabled','OnAccessProtectionEnabled','RealTimeProtectionEnabled']) | to_json }}
        '@
        $toolsExpected = ConvertFrom-Json -InputObject @'
        {{ ipc_es_validation_expected.tools | to_json }}
        '@
        $pagefileExpected = ConvertFrom-Json -InputObject @'
        {{ ipc_es_validation_expected.system.pagefile | to_json }}
        '@
        $firmwareExpected = ConvertFrom-Json -InputObject @'
        {{ ipc_es_validation_expected.firmware | to_json }}
        '@
        $expectedVncViewerFileAssociation = "{{ ipc_es_validation_expected.software.ultravnc_viewer.file_association_required | bool | ternary('true','false') }}" -eq 'true'

        function New-ValidationResult {
            param(
                [Parameter(Mandatory=$true)][string]$Id,
                [Parameter(Mandatory=$true)][string]$Name,
                [Parameter(Mandatory=$true)][string]$Status,
                [Parameter(Mandatory=$true)]$Soll,
                [Parameter(Mandatory=$false)]$Ist,
                [Parameter(Mandatory=$true)][string]$Quelle,
                [Parameter(Mandatory=$false)][string]$Hinweis
            )

            $result = [ordered]@{
                id       = $Id
                aufgabe  = $Name
                pruefart = 'SOLLWERT'
                status   = $Status
                soll     = $Soll
                ist      = $Ist
                quelle   = $Quelle
            }
            if ($Hinweis) {
                $result.hinweis = $Hinweis
            }
            return [pscustomobject]$result
        }

        function New-InformationResult {
            param(
                [Parameter(Mandatory=$true)][string]$Id,
                [Parameter(Mandatory=$true)][string]$Name,
                [Parameter(Mandatory=$false)]$Ist,
                [Parameter(Mandatory=$true)][string]$Quelle,
                [Parameter(Mandatory=$false)][string]$Hinweis
            )

            $result = [ordered]@{
                id       = $Id
                aufgabe  = $Name
                pruefart = 'INFORMATION'
                status   = 'INFORMATION'
                ist      = $Ist
                quelle   = $Quelle
            }
            if ($Hinweis) {
                $result.hinweis = $Hinweis
            }
            return [pscustomobject]$result
        }

        function Get-RegistryTreeSnapshot {
            param(
                [Parameter(Mandatory=$true)][string]$RootPath,
                [int]$MaxDepth = 3,
                [int]$MaxValues = 800
            )

            $results = New-Object System.Collections.Generic.List[object]
            if (-not (Test-Path -LiteralPath $RootPath)) {
                return @()
            }

            $queue = New-Object System.Collections.Generic.Queue[object]
            $queue.Enqueue([pscustomobject]@{ Path=$RootPath; Depth=0 })

            while ($queue.Count -gt 0 -and $results.Count -lt $MaxValues) {
                $current = $queue.Dequeue()
                try {
                    $key = Get-Item -LiteralPath $current.Path -ErrorAction Stop
                    foreach ($name in @($key.GetValueNames())) {
                        if ($results.Count -ge $MaxValues) { break }
                        $displayName = if ([string]::IsNullOrEmpty($name)) { '(Default)' } else { $name }
                        $value = $null
                        try { $value = $key.GetValue($name) } catch { }
                        $results.Add([pscustomobject][ordered]@{
                            Path  = $current.Path
                            Name  = $displayName
                            Value = $value
                        })
                    }

                    if ($current.Depth -lt $MaxDepth) {
                        foreach ($child in @(Get-ChildItem -LiteralPath $current.Path -ErrorAction SilentlyContinue)) {
                            $queue.Enqueue([pscustomobject]@{
                                Path=$child.PSPath
                                Depth=($current.Depth + 1)
                            })
                        }
                    }
                } catch { }
            }

            return @($results)
        }

        function Convert-ToSimpleFirmwareValue {
            param($Value)

            if ($null -eq $Value) { return $null }
            if ($Value -is [string]) { return $Value }
            if ($Value -is [bool] -or $Value -is [int] -or $Value -is [long] -or $Value -is [double]) {
                return [string]$Value
            }
            if ($Value -is [System.Array]) {
                return (@($Value | ForEach-Object { [string]$_ }) -join '; ')
            }

            try {
                return [string]$Value
            } catch {
                return $null
            }
        }

        function Get-BiosFirmwareEvidence {
            $records = New-Object System.Collections.Generic.List[object]
            $namespaces = @('root\wmi', 'root\cimv2')
            $classRegex = '(?i)(BIOS|Firmware|UEFI|Setup)'
            $classLimit = 80
            $recordLimit = 600
            $classesSeen = 0

            foreach ($namespace in $namespaces) {
                if ($classesSeen -ge $classLimit -or $records.Count -ge $recordLimit) { break }

                $classes = @()
                try {
                    $classes = @(
                        Get-CimClass -Namespace $namespace -ErrorAction Stop |
                        Where-Object {
                            $_.CimClassName -match $classRegex -and
                            $_.CimClassName -notmatch '(?i)(Event|Trace|Perf|History|Log)'
                        } |
                        Select-Object -First 50
                    )
                } catch { }

                foreach ($class in $classes) {
                    if ($classesSeen -ge $classLimit -or $records.Count -ge $recordLimit) { break }
                    $classesSeen++

                    $instances = @()
                    try {
                        $instances = @(Get-CimInstance -Namespace $namespace -ClassName $class.CimClassName -ErrorAction Stop | Select-Object -First 40)
                    } catch {
                        continue
                    }

                    foreach ($instance in $instances) {
                        if ($records.Count -ge $recordLimit) { break }

                        $props = [ordered]@{}
                        foreach ($property in @($instance.CimInstanceProperties)) {
                            if ($property.Name -match '^__') { continue }
                            $simple = Convert-ToSimpleFirmwareValue $property.Value
                            if ($null -eq $simple) { continue }
                            if ($simple.Length -gt 512) {
                                $simple = $simple.Substring(0, 512)
                            }
                            $props[$property.Name] = $simple
                        }

                        if ($props.Count -eq 0) { continue }

                        $searchParts = @(
                            "Namespace=$namespace",
                            "ClassName=$($class.CimClassName)"
                        )
                        foreach ($entry in $props.GetEnumerator()) {
                            $searchParts += ("{0}={1}" -f $entry.Key, $entry.Value)
                        }

                        $records.Add([pscustomobject][ordered]@{
                            Namespace  = $namespace
                            ClassName  = $class.CimClassName
                            Properties = [pscustomobject]$props
                            SearchText = ($searchParts -join ' | ')
                        })
                    }
                }
            }

            return @($records)
        }

        function Test-BiosFirmwareExpectation {
            param(
                [Parameter(Mandatory=$true)][string]$Id,
                [Parameter(Mandatory=$true)][string]$Name,
                [Parameter(Mandatory=$true)]$Specification,
                [Parameter(Mandatory=$true)]$Evidence
            )

            $labelRegex = [string]$Specification.label_regex
            $valueRegex = [string]$Specification.expected_value_regex
            $forbiddenValueRegex = [string]$Specification.forbidden_value_regex
            $minimumMatches = [int]$Specification.minimum_matches
            if ($minimumMatches -lt 1) { $minimumMatches = 1 }

            $matches = @(
                $Evidence | Where-Object {
                    [string]$_.SearchText -match $labelRegex
                }
            )
            $compliant = @(
                $matches | Where-Object {
                    [string]$_.SearchText -match $valueRegex
                }
            )
            $explicitNonCompliant = @()
            if (-not [string]::IsNullOrWhiteSpace($forbiddenValueRegex)) {
                $explicitNonCompliant = @(
                    $matches | Where-Object {
                        [string]$_.SearchText -match $forbiddenValueRegex
                    }
                )
            }

            if ($matches.Count -eq 0) {
                $status = 'NICHT_PRUEFBAR'
            }
            elseif ($explicitNonCompliant.Count -gt 0) {
                $status = 'NOK'
            }
            elseif ($compliant.Count -ge $minimumMatches) {
                $status = 'OK'
            }
            else {
                # Der Provider hat den Einstellungsnamen geliefert, aber keinen
                # eindeutig interpretierbaren Soll- oder Gegenwert.
                $status = 'NICHT_PRUEFBAR'
            }

            return New-ValidationResult `
                -Id $Id `
                -Name $Name `
                -Status $status `
                -Soll ([ordered]@{
                    LabelRegex=$labelRegex
                    ExpectedValueRegex=$valueRegex
                    ForbiddenValueRegex=$forbiddenValueRegex
                    MinimumMatches=$minimumMatches
                }) `
                -Ist ([ordered]@{
                    MatchingEvidence=@($matches)
                    CompliantEvidence=@($compliant)
                    ExplicitNonCompliantEvidence=@($explicitNonCompliant)
                }) `
                -Quelle 'Direkt/PowerShell/CIM BIOS-Firmware Provider Discovery' `
                -Hinweis 'Ohne auslesbaren BIOS/Firmware-Provider wird kein Wert geraten.'
        }

        function Get-InternationalState {
            param([Parameter(Mandatory=$true)][string]$Path)

            if (-not (Test-Path -LiteralPath $Path)) {
                return [pscustomobject][ordered]@{
                    RegistryPath = $Path
                    Exists       = $false
                    LocaleName   = $null
                    Locale       = $null
                    sLanguage    = $null
                }
            }

            $value = Get-ItemProperty -LiteralPath $Path -ErrorAction Stop
            return [pscustomobject][ordered]@{
                RegistryPath = $Path
                Exists       = $true
                LocaleName   = if ($null -ne $value.LocaleName) { [string]$value.LocaleName } else { $null }
                Locale       = if ($null -ne $value.Locale) { [string]$value.Locale } else { $null }
                sLanguage    = if ($null -ne $value.sLanguage) { [string]$value.sLanguage } else { $null }
            }
        }

        function Test-GermanInternationalState {
            param($State)

            if ($null -eq $State -or -not $State.Exists) {
                return $false
            }

            $localeName = [string]$State.LocaleName
            $locale = [string]$State.Locale
            return (
                $localeName -match '^de-DE$' -or
                $locale -match '^(0000)?0407$'
            )
        }

        $checks = [ordered]@{}
        $information = [ordered]@{}

        # --------------------------------------------------------------
        # IPC0046 / IPC0047
        # Windows legt die klassische Hotkey-Auswahl unter
        # HKCU:\Keyboard Layout\Toggle ab. Der Wert 3 bedeutet
        # "Nicht zugewiesen". Beide Installationsschritte beschreiben
        # denselben technischen Endzustand und werden deshalb gegen
        # dieselbe belastbare Registryquelle bewertet.
        # --------------------------------------------------------------
        $togglePath = 'HKCU:\Keyboard Layout\Toggle'
        $toggleExists = Test-Path -LiteralPath $togglePath
        $toggle = $null
        if ($toggleExists) {
            $toggle = Get-ItemProperty -LiteralPath $togglePath -ErrorAction Stop
        }

        $toggleState = [ordered]@{
            RegistryPath   = $togglePath
            RegistryExists = $toggleExists
            RunAsUser      = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            Hotkey         = if ($toggle) { [string]$toggle.Hotkey } else { $null }
            LanguageHotkey = if ($toggle) { [string]$toggle.'Language Hotkey' } else { $null }
            LayoutHotkey   = if ($toggle) { [string]$toggle.'Layout Hotkey' } else { $null }
        }

        $hotkeysDisabled = (
            $toggleExists -and
            $toggleState.Hotkey -eq '3' -and
            $toggleState.LanguageHotkey -eq '3' -and
            $toggleState.LayoutHotkey -eq '3'
        )
        $hotkeyStatus = if ($hotkeysDisabled) { 'OK' } else { 'NOK' }
        $hotkeySoll = [ordered]@{
            Hotkey         = '3'
            LanguageHotkey = '3'
            LayoutHotkey   = '3'
            Bedeutung      = 'Nicht zugewiesen'
        }

        $checks['IPC0046'] = New-ValidationResult `
            -Id 'IPC0046' `
            -Name 'Hot-Keys abschalten (Auswahl: Keine)' `
            -Status $hotkeyStatus `
            -Soll $hotkeySoll `
            -Ist $toggleState `
            -Quelle 'Direkt/PowerShell/HKCU:\Keyboard Layout\Toggle' `
            -Hinweis 'Die Pruefung bezieht sich auf den Benutzer, unter dem die WinRM-Verbindung ausgefuehrt wird.'

        $checks['IPC0047'] = New-ValidationResult `
            -Id 'IPC0047' `
            -Name 'Tastenkombination fuer Eingabesprachen deaktivieren' `
            -Status $hotkeyStatus `
            -Soll $hotkeySoll `
            -Ist $toggleState `
            -Quelle 'Direkt/PowerShell/HKCU:\Keyboard Layout\Toggle' `
            -Hinweis 'IPC0046 und IPC0047 beschreiben denselben technischen Registry-Endzustand und werden deshalb konsistent bewertet.'

        # --------------------------------------------------------------
        # IPC0048 - Copy Settings fuer Willkommensseite und neue Benutzer
        # .DEFAULT ist der System-/Welcome-Screen-Account. Das Profil fuer
        # neue Benutzer liegt dagegen in C:\Users\Default\NTUSER.DAT.
        # Fuer die Pruefung wird dieses Hive nur temporaer eingebunden,
        # ausgelesen und in jedem Fall wieder entladen. Es werden keine
        # Registrywerte veraendert.
        # --------------------------------------------------------------
        $currentUserIntl = Get-InternationalState 'HKCU:\Control Panel\International'
        $welcomeIntl = Get-InternationalState 'Registry::HKEY_USERS\.DEFAULT\Control Panel\International'

        $defaultHivePath = 'C:\Users\Default\NTUSER.DAT'
        $mountName = 'ANSIBLE_0170_DEFAULT_' + $PID
        $mountRegPath = 'HKU' + [char]92 + $mountName
        $mountProviderPath = 'Registry::HKEY_USERS' + [char]92 + $mountName
        $defaultUserIntl = $null
        $defaultUserReadError = $null
        $hiveLoaded = $false

        try {
            if (-not (Test-Path -LiteralPath $defaultHivePath)) {
                throw "Default-User-Hive wurde nicht gefunden: $defaultHivePath"
            }

            $loadOutput = & reg.exe load $mountRegPath $defaultHivePath 2>&1
            if ($LASTEXITCODE -ne 0) {
                throw ("reg.exe load fehlgeschlagen: " + ($loadOutput -join ' '))
            }
            $hiveLoaded = $true

            $defaultUserIntl = Get-InternationalState ($mountProviderPath + '\Control Panel\International')
        }
        catch {
            $defaultUserReadError = $_.Exception.Message
        }
        finally {
            if ($hiveLoaded) {
                [GC]::Collect()
                [GC]::WaitForPendingFinalizers()
                $unloadOutput = & reg.exe unload $mountRegPath 2>&1
                if ($LASTEXITCODE -ne 0 -and -not $defaultUserReadError) {
                    $defaultUserReadError = "Default-User-Hive konnte nach der Read-only-Pruefung nicht entladen werden: " + ($unloadOutput -join ' ')
                }
            }
        }

        $welcomeGerman = Test-GermanInternationalState $welcomeIntl
        $defaultUserGerman = if ($null -ne $defaultUserIntl) {
            Test-GermanInternationalState $defaultUserIntl
        } else {
            $false
        }

        if ($defaultUserReadError) {
            $ipc0048Status = 'NICHT_PRUEFBAR'
        }
        elseif ($welcomeGerman -and $defaultUserGerman) {
            $ipc0048Status = 'OK'
        }
        else {
            $ipc0048Status = 'NOK'
        }

        $copySettingsIst = [ordered]@{
            CurrentUser      = $currentUserIntl
            WelcomeScreen    = $welcomeIntl
            DefaultUser      = $defaultUserIntl
            DefaultUserHive  = $defaultHivePath
            DefaultUserError = $defaultUserReadError
        }

        $checks['IPC0048'] = New-ValidationResult `
            -Id 'IPC0048' `
            -Name 'Region - Copy Settings fuer Willkommensseite und neue Benutzer' `
            -Status $ipc0048Status `
            -Soll ([ordered]@{
                WelcomeScreen = 'Deutsch (de-DE)'
                NewUsers      = 'Deutsch (de-DE)'
            }) `
            -Ist $copySettingsIst `
            -Quelle 'Direkt/PowerShell/Registry International + C:\Users\Default\NTUSER.DAT' `
            -Hinweis 'Das Default-User-Hive wird nur temporaer eingebunden und ohne Aenderung von Einstellungen wieder entladen.'

        # --------------------------------------------------------------
        # IPC0063 - Netzwerkermittlung und Datei-/Druckerfreigabe.
        # Geprueft wird der wirksame Firewall-Endzustand. Deutsche und
        # englische Anzeigenamen werden beruecksichtigt.
        # --------------------------------------------------------------
        $allFirewallRules = @(Get-NetFirewallRule -PolicyStore ActiveStore -ErrorAction SilentlyContinue)
        $discoveryRules = @($allFirewallRules | Where-Object {
            $_.DisplayGroup -match '^(Netzwerkerkennung|Network Discovery)$'
        })
        $sharingRules = @($allFirewallRules | Where-Object {
            $_.DisplayGroup -match '^(Datei- und Druckerfreigabe|File and Printer Sharing)$'
        })
        function Test-EnabledInboundAllowRule {
            param($Rules)
            return (@($Rules | Where-Object {
                ([string]$_.Enabled -match '^(True|1)$') -and
                ([string]$_.Direction -eq 'Inbound') -and
                ([string]$_.Action -eq 'Allow')
            }).Count -gt 0)
        }
        $discoveryOK = Test-EnabledInboundAllowRule $discoveryRules
        $sharingOK = Test-EnabledInboundAllowRule $sharingRules
        $ipc0063Status = if ($allFirewallRules.Count -eq 0) { 'NICHT_PRUEFBAR' } elseif ($discoveryOK -and $sharingOK) { 'OK' } else { 'NOK' }
        $checks['IPC0063'] = New-ValidationResult `
            -Id 'IPC0063' `
            -Name 'Sichtbarkeit im Netzwerk' `
            -Status $ipc0063Status `
            -Soll ([ordered]@{ NetworkDiscovery='Enabled'; FileAndPrinterSharing='Enabled' }) `
            -Ist ([ordered]@{
                NetworkDiscovery = [ordered]@{ OK=$discoveryOK; Rules=@($discoveryRules | Select-Object Name,DisplayName,DisplayGroup,Enabled,Direction,Action,Profile) }
                FileAndPrinterSharing = [ordered]@{ OK=$sharingOK; Rules=@($sharingRules | Select-Object Name,DisplayName,DisplayGroup,Enabled,Direction,Action,Profile) }
            }) `
            -Quelle 'Direkt/PowerShell/Get-NetFirewallRule ActiveStore'

        # Gemeinsame UltraVNC-Dateipfade fuer IPC0070.
        $uvncRoots = @(
            'C:\Program Files\uvnc bvba\UltraVNC',
            'C:\Program Files\UltraVNC',
            'C:\Program Files (x86)\uvnc bvba\UltraVNC',
            'C:\Program Files (x86)\UltraVNC'
        )
        $uvncServices = @(Get-CimInstance Win32_Service -ErrorAction SilentlyContinue | Where-Object {
            ([string]$_.Name -match '(?i)uvnc|winvnc|ultravnc') -or
            ([string]$_.DisplayName -match '(?i)uvnc|winvnc|ultravnc') -or
            ([string]$_.PathName -match '(?i)uvnc|winvnc|ultravnc')
        })
        foreach ($svc in $uvncServices) {
            $rawPath = [string]$svc.PathName
            if ($rawPath -match '^\s*"([^"]+\.exe)"') { $exe = $Matches[1] }
            elseif ($rawPath -match '^\s*([^\s]+\.exe)') { $exe = $Matches[1] }
            else { $exe = $null }
            if ($exe) {
                $root = Split-Path -Parent $exe
                if ($root -and $uvncRoots -notcontains $root) { $uvncRoots += $root }
            }
        }
        $uvncRoots = @($uvncRoots | Select-Object -Unique)

        # --------------------------------------------------------------
        # IPC0070 - nur UltraVNC Viewer; Version aus Semaphore.
        # --------------------------------------------------------------
        $viewerPaths = @()
        foreach ($root in $uvncRoots) {
            $viewerPaths += (Join-Path $root 'vncviewer.exe')
        }
        $viewerExisting = @($viewerPaths | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -Unique)
        $viewerVersions = @()
        foreach ($viewerPath in $viewerExisting) {
            try {
                $versionInfo = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($viewerPath)
                $viewerVersions += [pscustomobject][ordered]@{
                    Path=$viewerPath
                    FileVersion=[string]$versionInfo.FileVersion
                    ProductVersion=[string]$versionInfo.ProductVersion
                }
            } catch {
                $viewerVersions += [pscustomobject][ordered]@{
                    Path=$viewerPath
                    FileVersion=$null
                    ProductVersion=$null
                }
            }
        }

        $viewerPresent = ($viewerExisting.Count -gt 0)
        $viewerPresenceOK = ($viewerPresent -eq $expectedUltraVncViewerInstalled)
        $viewerVersionKnown = $true
        $viewerVersionOK = $true
        if ($expectedUltraVncViewerInstalled -and -not [string]::IsNullOrWhiteSpace($expectedUltraVncViewerVersionRegex)) {
            $viewerVersionKnown = ($viewerVersions.Count -gt 0)
            $viewerVersionOK = $viewerVersionKnown -and (@(
                $viewerVersions | Where-Object {
                    (([string]$_.FileVersion + ' ' + [string]$_.ProductVersion) -match $expectedUltraVncViewerVersionRegex)
                }
            ).Count -gt 0)
        }

        if (-not $viewerPresenceOK) {
            $ipc0070Status = 'NOK'
        }
        elseif (-not $viewerVersionKnown) {
            $ipc0070Status = 'NICHT_PRUEFBAR'
        }
        elseif ($viewerVersionOK) {
            $ipc0070Status = 'OK'
        }
        else {
            $ipc0070Status = 'NOK'
        }

        $checks['IPC0070'] = New-ValidationResult `
            -Id 'IPC0070' `
            -Name 'UltraVNC Viewer installieren' `
            -Status $ipc0070Status `
            -Soll ([ordered]@{
                UltraVNCViewer=$expectedUltraVncViewerInstalled
                VersionRegex=$expectedUltraVncViewerVersionRegex
            }) `
            -Ist ([ordered]@{
                ViewerPresent=$viewerPresent
                ViewerPaths=@($viewerExisting)
                ViewerVersions=@($viewerVersions)
            }) `
            -Quelle 'Direkt/PowerShell/vncviewer.exe FileVersion' `
            -Hinweis 'IPC0070 bewertet bewusst nur den Viewer; der Server wird hier nicht als Voraussetzung verwendet.'

        # --------------------------------------------------------------
        # IPC0073 - Restore-Image-Ordner muss geloescht sein.
        # --------------------------------------------------------------
        $imagesPath = 'D:\Images'
        $imagesExists = Test-Path -LiteralPath $imagesPath
        $checks['IPC0073'] = New-ValidationResult `
            -Id 'IPC0073' `
            -Name 'Restore Image loeschen' `
            -Status $(if (-not $imagesExists) { 'OK' } else { 'NOK' }) `
            -Soll ([ordered]@{ Path=$imagesPath; Exists=$false }) `
            -Ist ([ordered]@{ Path=$imagesPath; Exists=$imagesExists }) `
            -Quelle 'Direkt/PowerShell/Test-Path'

        # --------------------------------------------------------------
        # IPC0074 / IPC0075 - Taskleisten-Endzustand im aktuellen Benutzer.
        # --------------------------------------------------------------
        $explorerAdvanced = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\Advanced'
        $advanced = if (Test-Path -LiteralPath $explorerAdvanced) { Get-ItemProperty -LiteralPath $explorerAdvanced -ErrorAction SilentlyContinue } else { $null }
        $disablePreview = if ($advanced -and $advanced.PSObject.Properties.Name -contains 'DisablePreviewDesktop') { [int]$advanced.DisablePreviewDesktop } else { $null }
        $glomLevel = if ($advanced -and $advanced.PSObject.Properties.Name -contains 'TaskbarGlomLevel') { [int]$advanced.TaskbarGlomLevel } else { $null }
        $searchMode = if ($advanced -and $advanced.PSObject.Properties.Name -contains 'SearchboxTaskbarMode') { [int]$advanced.SearchboxTaskbarMode } else { $null }
        $ipc0074Status = if ($null -eq $advanced -or $null -eq $disablePreview -or $null -eq $glomLevel) { 'NICHT_PRUEFBAR' } elseif ($disablePreview -eq 1 -and $glomLevel -eq 1) { 'OK' } else { 'NOK' }
        $checks['IPC0074'] = New-ValidationResult `
            -Id 'IPC0074' `
            -Name 'Taskleiste' `
            -Status $ipc0074Status `
            -Soll ([ordered]@{ AeroPeek='aus'; DisablePreviewDesktop=1; Gruppierung='wenn Taskleiste voll'; TaskbarGlomLevel=1 }) `
            -Ist ([ordered]@{ RegistryPath=$explorerAdvanced; DisablePreviewDesktop=$disablePreview; TaskbarGlomLevel=$glomLevel }) `
            -Quelle 'Direkt/PowerShell/HKCU Explorer Advanced' `
            -Hinweis 'HKCU bezieht sich auf den Benutzer, unter dem WinRM ausgefuehrt wird.'

        $ipc0075Status = if ($null -eq $advanced -or $null -eq $searchMode) { 'NICHT_PRUEFBAR' } elseif ($searchMode -eq 1) { 'OK' } else { 'NOK' }
        $checks['IPC0075'] = New-ValidationResult `
            -Id 'IPC0075' `
            -Name 'Lupe zur Suche in Taskleiste' `
            -Status $ipc0075Status `
            -Soll ([ordered]@{ SearchboxTaskbarMode=1; Darstellung='Suchsymbol' }) `
            -Ist ([ordered]@{ RegistryPath=$explorerAdvanced; SearchboxTaskbarMode=$searchMode }) `
            -Quelle 'Direkt/PowerShell/HKCU Explorer Advanced' `
            -Hinweis 'HKCU bezieht sich auf den Benutzer, unter dem WinRM ausgefuehrt wird.'

        # --------------------------------------------------------------
        # IPC0076 - Desktopicons Computer/Netzwerk/Papierkorb sichtbar und
        # drei unerwuenschte Common-Desktop-Verknuepfungen nicht vorhanden.
        # --------------------------------------------------------------
        $iconPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\HideDesktopIcons\NewStartPanel'
        $iconProps = if (Test-Path -LiteralPath $iconPath) { Get-ItemProperty -LiteralPath $iconPath -ErrorAction SilentlyContinue } else { $null }
        function Get-DesktopIconVisible {
            param([string]$Clsid, [bool]$DefaultVisible)
            if ($iconProps -and $iconProps.PSObject.Properties.Name -contains $Clsid) {
                return ([int]$iconProps.$Clsid -eq 0)
            }
            return $DefaultVisible
        }
        $computerClsid = '{20D04FE0-3AEA-1069-A2D8-08002B30309D}'
        $networkClsid = '{F02C1A0D-BE21-4350-88B0-7367FC96EF3C}'
        $recycleClsid = '{645FF040-5081-101B-9F08-00AA002F954E}'
        $computerVisible = Get-DesktopIconVisible $computerClsid $false
        $networkVisible = Get-DesktopIconVisible $networkClsid $false
        $recycleVisible = Get-DesktopIconVisible $recycleClsid $true
        $commonDesktop = [Environment]::GetFolderPath('CommonDesktopDirectory')
        if ([string]::IsNullOrWhiteSpace($commonDesktop)) { $commonDesktop = 'C:\Users\Public\Desktop' }
        $forbiddenNames = @('Create Restore USB','File Explorer','Internet Explorer')
        $forbiddenFound = @()
        if (Test-Path -LiteralPath $commonDesktop) {
            foreach ($item in @(Get-ChildItem -LiteralPath $commonDesktop -Force -ErrorAction SilentlyContinue)) {
                $base = [System.IO.Path]::GetFileNameWithoutExtension($item.Name)
                if ($forbiddenNames -contains $base) { $forbiddenFound += $item.FullName }
            }
        }
        $desktopOK = $computerVisible -and $networkVisible -and $recycleVisible -and ($forbiddenFound.Count -eq 0)
        $checks['IPC0076'] = New-ValidationResult `
            -Id 'IPC0076' `
            -Name 'Desktop: Computer Netzwerk Papierkorb' `
            -Status $(if ($desktopOK) { 'OK' } else { 'NOK' }) `
            -Soll ([ordered]@{
                ComputerVisible=$true
                NetworkVisible=$true
                RecycleBinVisible=$true
                CommonDesktopAbsent=@($forbiddenNames)
            }) `
            -Ist ([ordered]@{
                RegistryPath=$iconPath
                ComputerVisible=$computerVisible
                NetworkVisible=$networkVisible
                RecycleBinVisible=$recycleVisible
                CommonDesktop=$commonDesktop
                ForbiddenFound=@($forbiddenFound)
            }) `
            -Quelle 'Direkt/PowerShell/HKCU DesktopIcons + CommonDesktopDirectory' `
            -Hinweis 'HKCU bezieht sich auf den Benutzer, unter dem WinRM ausgefuehrt wird.'

        # --------------------------------------------------------------
        # IPC0077 - Edge-Desktopverknuepfungen entfernt und erneute
        # Erstellung bei Installation/Updates verhindert.
        # --------------------------------------------------------------
        $desktopDirs = @(
                [Environment]::GetFolderPath('DesktopDirectory'),
                [Environment]::GetFolderPath('CommonDesktopDirectory'),
                'C:\Users\Public\Desktop'
            ) |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) } |
                Select-Object -Unique

            $edgeShortcuts = @()
            foreach ($desktopDir in $desktopDirs) {
                if (-not (Test-Path -LiteralPath $desktopDir -PathType Container)) { continue }

                $edgeShortcuts += @(
                    Get-ChildItem -LiteralPath $desktopDir -File -Force -ErrorAction SilentlyContinue |
                    Where-Object { $_.BaseName -match '(?i)Microsoft\s*Edge|^Edge$' } |
                    Select-Object Name, BaseName, FullName
                )
            }
            
        $edgeShortcuts = @()
        foreach ($desktopDir in $desktopDirs) {
            if (-not (Test-Path -LiteralPath $desktopDir -PathType Container)) { continue }
            $edgeShortcuts += @(
                Get-ChildItem -LiteralPath $desktopDir -File -Force -ErrorAction SilentlyContinue |
                Where-Object { $_.BaseName -match '(?i)Microsoft\s*Edge|^Edge$' } |
                Select-Object Name, BaseName, FullName
            )
        }

        $edgeUpdatePolicyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\EdgeUpdate'
        $createShortcutDefault = $null
        $removeShortcutDefault = $null
        if (Test-Path -LiteralPath $edgeUpdatePolicyPath) {
            $edgeUpdatePolicy = Get-ItemProperty -LiteralPath $edgeUpdatePolicyPath -ErrorAction SilentlyContinue
            if ($edgeUpdatePolicy -and $edgeUpdatePolicy.PSObject.Properties.Name -contains 'CreateDesktopShortcutDefault') {
                $createShortcutDefault = [int]$edgeUpdatePolicy.CreateDesktopShortcutDefault
            }
            if ($edgeUpdatePolicy -and $edgeUpdatePolicy.PSObject.Properties.Name -contains 'RemoveDesktopShortcutDefault') {
                $removeShortcutDefault = [int]$edgeUpdatePolicy.RemoveDesktopShortcutDefault
            }
        }

        $shortcutAbsent = (@($edgeShortcuts).Count -eq 0)
        $createPrevented = ($createShortcutDefault -eq 0)
        $removeOnUpdate = ($removeShortcutDefault -in @(1,2))
        $ipc0077OK = $shortcutAbsent -and $createPrevented -and $removeOnUpdate

        $checks['IPC0077'] = New-ValidationResult `
            -Id 'IPC0077' `
            -Name 'Microsoft Edge Verknuepfung loeschen' `
            -Status $(if ($ipc0077OK) { 'OK' } else { 'NOK' }) `
            -Soll ([ordered]@{
                DesktopShortcutAbsent=$true
                CreateDesktopShortcutDefault=0
                RemoveDesktopShortcutDefault='1 oder 2'
            }) `
            -Ist ([ordered]@{
                EdgeShortcuts=@($edgeShortcuts)
                ShortcutAbsent=$shortcutAbsent
                RegistryPath=$edgeUpdatePolicyPath
                CreateDesktopShortcutDefault=$createShortcutDefault
                RemoveDesktopShortcutDefault=$removeShortcutDefault
            }) `
            -Quelle 'Direkt/PowerShell/Desktop + Microsoft Edge Update Policy' `
            -Hinweis 'Die Policywerte verhindern die automatische Neuerstellung bzw. entfernen Edge-Desktopverknuepfungen bei Updates.'

        # IPC0083 - Bildschirmschoner fuer OS Server.
        $screenPolicyPath = 'HKCU:\Software\Policies\Microsoft\Windows\Control Panel\Desktop'
        $screenUserPath = 'HKCU:\Control Panel\Desktop'
        function Get-PreferredDesktopValue {
            param([string]$Name)
            foreach ($path in @($screenPolicyPath, $screenUserPath)) {
                if (-not (Test-Path -LiteralPath $path)) { continue }
                $item = Get-ItemProperty -LiteralPath $path -ErrorAction SilentlyContinue
                if ($item -and $item.PSObject.Properties.Name -contains $Name) {
                    return [pscustomobject]@{ Path=$path; Name=$Name; Value=[string]$item.$Name }
                }
            }
            return $null
        }
        $screenActive = Get-PreferredDesktopValue 'ScreenSaveActive'
        $screenTimeout = Get-PreferredDesktopValue 'ScreenSaveTimeOut'
        $screenSecure = Get-PreferredDesktopValue 'ScreenSaverIsSecure'
        $screenTimeoutSeconds = $null
        if ($null -ne $screenTimeout) {
            $parsedScreenTimeout = 0
            if ([int]::TryParse([string]$screenTimeout.Value, [ref]$parsedScreenTimeout)) {
                $screenTimeoutSeconds = $parsedScreenTimeout
            }
        }
        $screenKnown = ($null -ne $screenActive)
        if ($expectedScreenSaverEnabled) {
            $screenKnown = $screenKnown -and ($null -ne $screenTimeoutSeconds) -and ($null -ne $screenSecure)
            $screenOK = $screenKnown -and ([string]$screenActive.Value -eq '1') -and ($screenTimeoutSeconds -eq $expectedScreenSaverTimeoutSeconds) -and ([string]$screenSecure.Value -eq $(if ($expectedScreenSaverSecure) { '1' } else { '0' }))
        } else {
            $screenOK = $screenKnown -and ([string]$screenActive.Value -eq '0')
        }
        $ipc0083Status = if (-not $screenKnown) { 'NICHT_PRUEFBAR' } elseif ($screenOK) { 'OK' } else { 'NOK' }
        $checks['IPC0083'] = New-ValidationResult `
            -Id 'IPC0083' `
            -Name 'Bildschirmschoner aktivieren (SE + ES)' `
            -Status $ipc0083Status `
            -Soll ([ordered]@{ ComputerType='OS_Server'; Enabled=$expectedScreenSaverEnabled; TimeoutSeconds=$expectedScreenSaverTimeoutSeconds; PasswordProtected=$expectedScreenSaverSecure }) `
            -Ist ([ordered]@{ ScreenSaveActive=$screenActive; ScreenSaveTimeOut=$screenTimeout; ScreenSaveTimeOutParsedSeconds=$screenTimeoutSeconds; ScreenSaverIsSecure=$screenSecure; RunAsUser=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name }) `
            -Quelle 'Direkt/PowerShell/HKCU ScreenSaver Policy + Control Panel Desktop' `
            -Hinweis 'Bildschirmschonerwerte sind benutzerbezogen; geprueft wird der Benutzer der WinRM-Verbindung.'


        # IPC0084 - Gegenpruefung "Bildschirmschoner deaktiviert".
        # Ist der Bildschirmschoner deaktiviert, wird IPC0083 NOK und
        # IPC0084 OK. Damit bleibt der reale Endzustand transparent.
        if (-not $screenKnown) {
            $ipc0084Status = 'NICHT_PRUEFBAR'
        }
        elseif ([string]$screenActive.Value -eq '0') {
            $ipc0084Status = 'OK'
        }
        else {
            $ipc0084Status = 'NOK'
        }
        $checks['IPC0084'] = New-ValidationResult `
            -Id 'IPC0084' `
            -Name 'Bildschirmschoner deaktivieren' `
            -Status $ipc0084Status `
            -Soll ([ordered]@{ ScreenSaveActive=0 }) `
            -Ist ([ordered]@{ ScreenSaveActive=$screenActive; RunAsUser=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name }) `
            -Quelle 'Direkt/PowerShell/HKCU ScreenSaver Policy + Control Panel Desktop' `
            -Hinweis 'Diese Gegenpruefung zeigt explizit, ob der Bildschirmschoner deaktiviert ist.'

        # IPC0087 - aktiver Plan + Display/Disk niemals ausschalten.
        function Get-PowerCfgCurrentIndexes {
            param([string]$SubGroup, [string]$Setting)
            $raw = @(& powercfg.exe /query SCHEME_CURRENT $SubGroup $Setting 2>&1)
            if ($LASTEXITCODE -ne 0) { return [pscustomobject]@{ Succeeded=$false; ACSeconds=$null; DCSeconds=$null; Raw=@($raw) } }
            $hexValues = @([regex]::Matches(($raw -join "`n"), '0x[0-9A-Fa-f]{8}') | ForEach-Object { $_.Value })
            if ($hexValues.Count -lt 2) { return [pscustomobject]@{ Succeeded=$false; ACSeconds=$null; DCSeconds=$null; Raw=@($raw) } }
            $ac = [Convert]::ToInt64($hexValues[$hexValues.Count - 2].Substring(2), 16)
            $dc = [Convert]::ToInt64($hexValues[$hexValues.Count - 1].Substring(2), 16)
            [pscustomobject]@{ Succeeded=$true; ACSeconds=$ac; DCSeconds=$dc; Raw=@($raw) }
        }

        $activePlan = $null
        try {
            $activePlan = Get-CimInstance -Namespace root\cimv2\power -ClassName Win32_PowerPlan -Filter "IsActive='True'" -ErrorAction Stop |
                Select-Object -First 1 ElementName,InstanceID,IsActive
        } catch { }

        $displayTimeout = Get-PowerCfgCurrentIndexes 'SUB_VIDEO' 'VIDEOIDLE'
        $diskTimeout = Get-PowerCfgCurrentIndexes 'SUB_DISK' 'DISKIDLE'
        $expectedDisplaySeconds = $expectedDisplayTimeoutAcMinutes * 60
        $expectedDiskSeconds = $expectedDiskTimeoutAcMinutes * 60
        $planName = if ($activePlan) { [string]$activePlan.ElementName } else { $null }
        $planInstanceId = if ($activePlan) { [string]$activePlan.InstanceID } else { $null }
        $planGuid = $null
        if ($planInstanceId -match '\{([0-9A-Fa-f-]{36})\}') { $planGuid = $Matches[1].ToLowerInvariant() }
        $planKnown = -not [string]::IsNullOrWhiteSpace($planName)
        if (-not [string]::IsNullOrWhiteSpace($expectedPowerPlanGuid)) {
            $planOK = ($null -ne $planGuid -and $planGuid -ieq $expectedPowerPlanGuid.Trim('{}'))
        }
        else {
            $planOK = $planKnown -and ($planName -match $expectedPowerPlanNameRegex)
        }
        $powerDetailKnown = ($displayTimeout.Succeeded -and $diskTimeout.Succeeded)
        $timeoutsOK = $powerDetailKnown -and
            ([int64]$displayTimeout.ACSeconds -eq [int64]$expectedDisplaySeconds) -and
            ([int64]$diskTimeout.ACSeconds -eq [int64]$expectedDiskSeconds)

        if (-not $planKnown -or -not $powerDetailKnown) {
            $ipc0087Status = 'NICHT_PRUEFBAR'
        }
        elseif ($planOK -and $timeoutsOK) {
            $ipc0087Status = 'OK'
        }
        else {
            $ipc0087Status = 'NOK'
        }

        $checks['IPC0087'] = New-ValidationResult `
            -Id 'IPC0087' `
            -Name 'Energieoptionen auf Hoechstleistung setzen' `
            -Status $ipc0087Status `
            -Soll ([ordered]@{
                ComputerType='OS_Server'
                ActivePlanNameRegex=$expectedPowerPlanNameRegex
                ActivePlanGuid=$expectedPowerPlanGuid
                DisplayTimeoutACMinutes=$expectedDisplayTimeoutAcMinutes
                DiskTimeoutACMinutes=$expectedDiskTimeoutAcMinutes
            }) `
            -Ist ([ordered]@{
                ActivePowerPlan=$activePlan
                PlanName=$planName
                PlanGuid=$planGuid
                PlanMatches=$planOK
                DisplayTimeoutACSeconds=$displayTimeout.ACSeconds
                DisplayTimeoutDCSeconds=$displayTimeout.DCSeconds
                DiskTimeoutACSeconds=$diskTimeout.ACSeconds
                DiskTimeoutDCSeconds=$diskTimeout.DCSeconds
            }) `
            -Quelle 'Direkt/PowerShell/Win32_PowerPlan + powercfg /query SCHEME_CURRENT' `
            -Hinweis 'IPC0087 bewertet den aktiven Energiesparplan sowie Display- und Festplatten-AC-Timeout gemeinsam.'

        # IPC0089 - Starten und Wiederherstellen.
        $bcdBootMgr = @(& bcdedit.exe /enum '{bootmgr}' 2>&1)
        $bootTimeout = $null
        $displayBootMenu = $null
        foreach ($line in $bcdBootMgr) {
            if ([string]$line -match '(?i)^\s*timeout\s+(\d+)\s*$') { $bootTimeout = [int]$Matches[1] }
            if ([string]$line -match '(?i)^\s*displaybootmenu\s+(\S+)\s*$') { $displayBootMenu = [string]$Matches[1] }
        }
        $bootListDisabled = (($null -ne $bootTimeout -and $bootTimeout -eq 0) -or ([string]$displayBootMenu -match '^(?i:no|nein)$'))
        $recoveryConfig = @(Get-CimInstance Win32_OSRecoveryConfiguration -ErrorAction SilentlyContinue | Select-Object -First 1)
        $autoReboot = if ($recoveryConfig.Count -gt 0) { [bool]$recoveryConfig[0].AutoReboot } else { $null }
        $verifiableKnown = (($null -ne $bootTimeout -or $null -ne $displayBootMenu) -and $null -ne $autoReboot)
        $verifiableOK = ($verifiableKnown -and $bootListDisabled -and $autoReboot)
        if (-not $verifiableKnown) { $ipc0089Status = 'NICHT_PRUEFBAR' } elseif (-not $verifiableOK) { $ipc0089Status = 'NOK' } else { $ipc0089Status = 'NICHT_PRUEFBAR' }
        $checks['IPC0089'] = New-ValidationResult `
            -Id 'IPC0089' `
            -Name 'Starten und Wiederherstellen anpassen' `
            -Status $ipc0089Status `
            -Soll ([ordered]@{ OperatingSystemListDisplayed=$false; RecoveryOptionsDisplaySeconds=5; AutoReboot=$true }) `
            -Ist ([ordered]@{ BootManagerTimeout=$bootTimeout; DisplayBootMenu=$displayBootMenu; OperatingSystemListDisabled=$bootListDisabled; RecoveryOptionsDisplaySeconds=$null; RecoveryOptionsDisplaySecondsEvaluation='NICHT_BELASTBAR_DIREKT_AUSLESBAR'; AutoReboot=$autoReboot; BcdEditRaw=@($bcdBootMgr) }) `
            -Quelle 'Direkt/PowerShell/bcdedit + Win32_OSRecoveryConfiguration' `
            -Hinweis 'Die 5-s-Wiederherstellungsanzeige wird nicht erfunden. Wenn Bootliste und AutoReboot korrekt sind, bleibt IPC0089 deshalb NICHT_PRUEFBAR statt faelschlich OK.'

        # --------------------------------------------------------------
        # IPC0094 / IPC0095 - Zertifikatpfad-/Root-AutoUpdate-Richtlinien.
        # Direkte Registrypruefung als belastbarer Fallback zum GPO-Snapshot.
        # --------------------------------------------------------------
        $chainConfigPath = 'HKLM:\SOFTWARE\Policies\Microsoft\SystemCertificates\ChainEngine\Config'
        $chainConfigExists = Test-Path -LiteralPath $chainConfigPath
        $chainOptions = $null
        if ($chainConfigExists) {
            $chainConfig = Get-ItemProperty -LiteralPath $chainConfigPath -ErrorAction SilentlyContinue
            if ($chainConfig -and $chainConfig.PSObject.Properties.Name -contains 'Options') {
                $chainOptions = $chainConfig.Options
            }
        }
        $ipc0094Status = if (-not $chainConfigExists) { 'NOK' } elseif ($null -eq $chainOptions) { 'NOK' } else { 'OK' }
        $checks['IPC0094'] = New-ValidationResult `
            -Id 'IPC0094' `
            -Name 'Einstellungen fuer die Ueberpruefung des Zertifikatpfades - Netzwerkabruf definieren' `
            -Status $ipc0094Status `
            -Soll ([ordered]@{ PolicyDefined=$true; RegistryPath=$chainConfigPath; OptionsValuePresent=$true }) `
            -Ist ([ordered]@{ RegistryPath=$chainConfigPath; Exists=$chainConfigExists; Options=$chainOptions }) `
            -Quelle 'Direkt/PowerShell/Registry ChainEngine\\Config'

        $authRootPath = 'HKLM:\SOFTWARE\Wow6432Node\Policies\Microsoft\SystemCertificates\AuthRoot'
        $authRootExists = Test-Path -LiteralPath $authRootPath
        $disableRootAutoUpdate = $null
        if ($authRootExists) {
            $authRoot = Get-ItemProperty -LiteralPath $authRootPath -ErrorAction SilentlyContinue
            if ($authRoot -and $authRoot.PSObject.Properties.Name -contains 'DisableRootAutoUpdate') {
                $disableRootAutoUpdate = [int]$authRoot.DisableRootAutoUpdate
            }
        }
        $ipc0095Status = if ($null -eq $disableRootAutoUpdate) { 'NOK' } elseif ($disableRootAutoUpdate -eq 0) { 'OK' } else { 'NOK' }
        $checks['IPC0095'] = New-ValidationResult `
            -Id 'IPC0095' `
            -Name 'DisableRootAutoUpdate auf 0 setzen' `
            -Status $ipc0095Status `
            -Soll ([ordered]@{ RegistryPath=$authRootPath; DisableRootAutoUpdate=0 }) `
            -Ist ([ordered]@{ RegistryPath=$authRootPath; Exists=$authRootExists; DisableRootAutoUpdate=$disableRootAutoUpdate }) `
            -Quelle 'Direkt/PowerShell/Registry AuthRoot'

        # --------------------------------------------------------------
        # IPC0148 - Computerschutz/System Restore deaktiviert.
        # --------------------------------------------------------------
        $osInfo = Get-CimInstance Win32_OperatingSystem -ErrorAction SilentlyContinue
        $osCaption = if ($osInfo) { [string]$osInfo.Caption } else { $null }
        $isWindows10 = ($osInfo -and ($osCaption -match '(?i)\bWindows\s+10\b'))

        if ($systemRestoreWindows10Only -and -not $isWindows10) {
            $checks['IPC0148'] = New-ValidationResult `
                -Id 'IPC0148' `
                -Name 'Computerschutz deaktivieren' `
                -Status 'IGNORIERT' `
                -Soll ([ordered]@{ Windows10Only=$true; Disabled=$expectedSystemRestoreDisabled }) `
                -Ist ([ordered]@{ OSCaption=$osCaption }) `
                -Quelle 'Direkt/PowerShell/SystemRestore' `
                -Hinweis 'Laut Sollwert nur fuer Windows-10-Systeme relevant.'
        }
        else {
            $srPolicyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\SystemRestore'
            $disableSr = $null
            $disableConfig = $null
            if (Test-Path -LiteralPath $srPolicyPath) {
                $srPolicy = Get-ItemProperty -LiteralPath $srPolicyPath -ErrorAction SilentlyContinue
                if ($srPolicy -and $srPolicy.PSObject.Properties.Name -contains 'DisableSR') { $disableSr = [int]$srPolicy.DisableSR }
                if ($srPolicy -and $srPolicy.PSObject.Properties.Name -contains 'DisableConfig') { $disableConfig = [int]$srPolicy.DisableConfig }
            }

            $srConfig = $null
            try {
                $srConfig = Get-CimInstance -Namespace root/default -ClassName SystemRestoreConfig -ErrorAction Stop
            } catch { }

            $srDisabled = $null
            $sourceDecision = $null
            if ($null -ne $disableSr) {
                $srDisabled = ($disableSr -eq 1)
                $sourceDecision = 'DisableSR policy'
            }
            elseif ($srConfig -and $null -ne $srConfig.RPSessionInterval) {
                $srDisabled = ([uint64]$srConfig.RPSessionInterval -eq 0)
                $sourceDecision = 'SystemRestoreConfig.RPSessionInterval'
            }

            $ipc0148Status = if ($null -eq $srDisabled) {
                'NICHT_PRUEFBAR'
            }
            elseif ($srDisabled -eq $expectedSystemRestoreDisabled) {
                'OK'
            }
            else {
                'NOK'
            }

            $checks['IPC0148'] = New-ValidationResult `
                -Id 'IPC0148' `
                -Name 'Computerschutz deaktivieren' `
                -Status $ipc0148Status `
                -Soll ([ordered]@{ Disabled=$expectedSystemRestoreDisabled }) `
                -Ist ([ordered]@{
                    OSCaption=$osCaption
                    DisableSR=$disableSr
                    DisableConfig=$disableConfig
                    RPSessionInterval=if($srConfig){$srConfig.RPSessionInterval}else{$null}
                    DecisionSource=$sourceDecision
                    Disabled=$srDisabled
                }) `
                -Quelle 'Direkt/PowerShell/SystemRestore policy + SystemRestoreConfig'
        }

        # --------------------------------------------------------------
        # IPC0152 - Datenschutz-Einstellungen als echte Sollwertpruefung.
        # Die konkrete Baseline ist absichtlich Semaphore-gesteuert, da
        # die verfuegbaren Privacy-Schalter von Windows-Version und Image
        # abhaengen koennen.
        # --------------------------------------------------------------
        $privacyResults = @()
        $privacyAllOK = $true
        $privacyConfigured = (@($privacyExpectations).Count -gt 0)

        foreach ($spec in @($privacyExpectations)) {
            $path = [string]$spec.path
            $name = [string]$spec.name
            $expectedValue = $spec.expected_value
            $exists = $false
            $actualValue = $null
            $readError = $null

            try {
                if (Test-Path -LiteralPath $path) {
                    $item = Get-ItemProperty -LiteralPath $path -ErrorAction Stop
                    if ($item.PSObject.Properties.Name -contains $name) {
                        $exists = $true
                        $actualValue = $item.$name
                    }
                }
            }
            catch {
                $readError = $_.Exception.Message
            }

            $entryOK = $exists -and ([string]$actualValue -eq [string]$expectedValue)
            if (-not $entryOK) { $privacyAllOK = $false }

            $privacyResults += [pscustomobject][ordered]@{
                Path=$path
                Name=$name
                ExpectedValue=$expectedValue
                Exists=$exists
                ActualValue=$actualValue
                OK=$entryOK
                Error=$readError
            }
        }

        if (-not $privacyConfigured) {
            $ipc0152Status = 'NICHT_PRUEFBAR'
        }
        elseif ($privacyAllOK) {
            $ipc0152Status = 'OK'
        }
        else {
            $ipc0152Status = 'NOK'
        }

        $checks['IPC0152'] = New-ValidationResult `
            -Id 'IPC0152' `
            -Name 'Datenschutz-Einstellungen deaktivieren' `
            -Status $ipc0152Status `
            -Soll ([ordered]@{ RegistryExpectations=@($privacyExpectations) }) `
            -Ist ([ordered]@{
                User=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name
                Results=@($privacyResults)
            }) `
            -Quelle 'Direkt/PowerShell/Windows Privacy Registry' `
            -Hinweis 'Ohne hardening.privacy.registry_expectations wird kein pauschaler Privacy-Sollwert erfunden.'

        # --------------------------------------------------------------
        # IPC0166 - Windows-Firewall fuer alle geforderten Profile aktiv
        # und alle aktuell zugeordneten Netzwerkprofile auf Private.
        # --------------------------------------------------------------
        $firewallProfiles = @(Get-NetFirewallProfile -ErrorAction SilentlyContinue |
            Select-Object Name,Enabled,DefaultInboundAction,DefaultOutboundAction)
        $connectionProfiles = @(Get-NetConnectionProfile -ErrorAction SilentlyContinue |
            Select-Object InterfaceAlias,InterfaceIndex,Name,NetworkCategory,IPv4Connectivity,IPv6Connectivity)

        $missingFirewallProfiles = @()
        $disabledFirewallProfiles = @()
        foreach ($requiredProfile in @($expectedFirewallProfiles)) {
            $matching = @($firewallProfiles | Where-Object { [string]$_.Name -ieq [string]$requiredProfile })
            if ($matching.Count -eq 0) {
                $missingFirewallProfiles += [string]$requiredProfile
                continue
            }
            foreach ($profile in $matching) {
                if (-not [bool]$profile.Enabled) {
                    $disabledFirewallProfiles += [string]$profile.Name
                }
            }
        }
        $nonPrivateProfiles = @($connectionProfiles | Where-Object {
            [string]$_.NetworkCategory -ine [string]$expectedNetworkCategory
        })

        if ($firewallProfiles.Count -eq 0 -or $connectionProfiles.Count -eq 0) {
            $ipc0166Status = 'NICHT_PRUEFBAR'
        }
        elseif ($missingFirewallProfiles.Count -gt 0 -or $disabledFirewallProfiles.Count -gt 0 -or $nonPrivateProfiles.Count -gt 0) {
            $ipc0166Status = 'NOK'
        }
        else {
            $ipc0166Status = 'OK'
        }

        $checks['IPC0166'] = New-ValidationResult `
            -Id 'IPC0166' `
            -Name 'Windows-Firewall' `
            -Status $ipc0166Status `
            -Soll ([ordered]@{
                RequiredFirewallProfilesEnabled=@($expectedFirewallProfiles)
                NetworkCategory=$expectedNetworkCategory
            }) `
            -Ist ([ordered]@{
                FirewallProfiles=@($firewallProfiles)
                ConnectionProfiles=@($connectionProfiles)
                MissingFirewallProfiles=@($missingFirewallProfiles)
                DisabledFirewallProfiles=@($disabledFirewallProfiles)
                NonPrivateConnectionProfiles=@($nonPrivateProfiles)
            }) `
            -Quelle 'Direkt/PowerShell/Get-NetFirewallProfile + Get-NetConnectionProfile' `
            -Hinweis 'Nur Netzwerkprofile mit einer aktuellen Windows-Netzwerkprofilzuordnung koennen als Domain/Private/Public bewertet werden.'

        # --------------------------------------------------------------
        # IPC0160 / IPC0161 - aktive TLS Cipher Suites.
        # Get-TlsCipherSuite ist read-only. IPC0160 erzwingt die erlaubte
        # Liste; IPC0161 prueft, dass die explizite Sperrliste nicht aktiv ist.
        # --------------------------------------------------------------
        if (-not (Get-Command Get-TlsCipherSuite -ErrorAction SilentlyContinue)) {
            foreach ($id in @('IPC0160','IPC0161')) {
                $checks[$id] = New-ValidationResult `
                    -Id $id `
                    -Name 'Verwendung von sicheren Cipher Suites' `
                    -Status 'NICHT_PRUEFBAR' `
                    -Soll 'Cipher-Suite-Sollwerte aus Semaphore' `
                    -Ist 'Get-TlsCipherSuite ist auf diesem System nicht verfuegbar.' `
                    -Quelle 'Direkt/PowerShell/Get-TlsCipherSuite'
            }
        }
        else {
            $activeCipherSuites = @(
                Get-TlsCipherSuite -ErrorAction Stop |
                ForEach-Object { [string]$_.Name } |
                Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
            )

            $allowed = @($allowedCipherSuites | ForEach-Object { [string]$_ })
            $disabled = @($disabledCipherSuites | ForEach-Object { [string]$_ })

            $missingAllowed = @(
                $allowed | Where-Object {
                    $wanted = $_
                    -not ($activeCipherSuites | Where-Object { $_ -ieq $wanted })
                }
            )
            $unexpectedActive = @()
            if ($enforceAllowedCipherSuiteOnly) {
                $unexpectedActive = @(
                    $activeCipherSuites | Where-Object {
                        $active = $_
                        -not ($allowed | Where-Object { $_ -ieq $active })
                    }
                )
            }

            $ipc0160Ok = (
                $missingAllowed.Count -eq 0 -and
                (-not $enforceAllowedCipherSuiteOnly -or $unexpectedActive.Count -eq 0)
            )
            $checks['IPC0160'] = New-ValidationResult `
                -Id 'IPC0160' `
                -Name 'Verwendung von sicheren Cipher Suites - Allowlist' `
                -Status $(if($ipc0160Ok){'OK'}else{'NOK'}) `
                -Soll ([ordered]@{
                    AllowedCipherSuites=$allowed
                    EnforceAllowedCipherSuiteOnly=$enforceAllowedCipherSuiteOnly
                }) `
                -Ist ([ordered]@{
                    ActiveCipherSuites=$activeCipherSuites
                    MissingAllowedCipherSuites=$missingAllowed
                    UnexpectedActiveCipherSuites=$unexpectedActive
                }) `
                -Quelle 'Direkt/PowerShell/Get-TlsCipherSuite'

            $activeForbidden = @(
                $disabled | Where-Object {
                    $wanted = $_
                    $activeCipherSuites | Where-Object { $_ -ieq $wanted }
                }
            )
            $ipc0161Ok = ($activeForbidden.Count -eq 0)
            $checks['IPC0161'] = New-ValidationResult `
                -Id 'IPC0161' `
                -Name 'Verwendung von sicheren Cipher Suites - Sperrliste' `
                -Status $(if($ipc0161Ok){'OK'}else{'NOK'}) `
                -Soll ([ordered]@{ DisabledCipherSuites=$disabled }) `
                -Ist ([ordered]@{
                    ActiveCipherSuites=$activeCipherSuites
                    ActiveForbiddenCipherSuites=$activeForbidden
                }) `
                -Quelle 'Direkt/PowerShell/Get-TlsCipherSuite'
        }

        # --------------------------------------------------------------
        # IPC0167 - D:\Projekt existiert.
        # --------------------------------------------------------------
        $projectPath = [string]$filesystemExpected.project_share.path
        $projectExists = Test-Path -LiteralPath $projectPath -PathType Container
        $checks['IPC0167'] = New-ValidationResult `
            -Id 'IPC0167' `
            -Name 'D:\Projekt vorhanden' `
            -Status $(if($projectExists){'OK'}else{'NOK'}) `
            -Soll ([ordered]@{ Path=$projectPath; Exists=$true }) `
            -Ist ([ordered]@{ Path=$projectPath; Exists=$projectExists }) `
            -Quelle 'Direkt/PowerShell/Test-Path'

        # --------------------------------------------------------------
        # IPC0168 - D:\Projekt Freigabe- und NTFS-Berechtigungen.
        # --------------------------------------------------------------
        $projectSpec = $filesystemExpected.project_share
        $projectShareName = [string]$projectSpec.share_name
        $projectFolder = [string]$projectSpec.path
        $projectFolderExists = Test-Path -LiteralPath $projectFolder -PathType Container
        $projectShare = $null
        $projectShareAccess = @()
        $projectAcl = $null
        $shareReadOK = $false
        $aclReadOK = $false

        if ($projectFolderExists) {
            try { $projectShare = Get-SmbShare -Name $projectShareName -ErrorAction Stop } catch { }
            if ($projectShare) {
                try {
                    $projectShareAccess = @(Get-SmbShareAccess -Name $projectShareName -ErrorAction Stop)
                    $shareReadOK = $true
                } catch { }
            }
            try {
                $projectAcl = Get-Acl -LiteralPath $projectFolder -ErrorAction Stop
                $aclReadOK = $true
            } catch { }
        }

        $sharePermissionEvaluation = @()
        foreach ($req in @($projectSpec.share_permissions)) {
            $matches = @($projectShareAccess | Where-Object {
                ([string]$_.AccountName -match [string]$req.identity_regex) -and
                ([string]$_.AccessControlType -notmatch '(?i)Deny') -and
                ([string]$_.AccessRight -ieq [string]$req.access_right)
            })
            $sharePermissionEvaluation += [pscustomobject][ordered]@{
                IdentityRegex=[string]$req.identity_regex
                RequiredAccessRight=[string]$req.access_right
                MatchingEntries=@($matches | Select-Object AccountName,AccessControlType,AccessRight)
                Compliant=($matches.Count -gt 0)
            }
        }

        $ntfsPermissionEvaluation = @()
        foreach ($req in @($projectSpec.ntfs_permissions)) {
            $matches = @()
            if ($projectAcl) {
                $matches = @($projectAcl.Access | Where-Object {
                    ([string]$_.AccessControlType -ieq 'Allow') -and
                    ([string]$_.IdentityReference -match [string]$req.identity_regex)
                })
            }
            $compliantMatches = @($matches | Where-Object {
                $rightsText = [string]$_.FileSystemRights
                $allRights = $true
                foreach ($requiredRight in @($req.required_rights)) {
                    if ($rightsText -notmatch [regex]::Escape([string]$requiredRight)) {
                        $allRights = $false
                        break
                    }
                }
                $allRights
            })
            $ntfsPermissionEvaluation += [pscustomobject][ordered]@{
                IdentityRegex=[string]$req.identity_regex
                RequiredRights=@($req.required_rights)
                MatchingEntries=@($matches | Select-Object IdentityReference,FileSystemRights,AccessControlType,IsInherited)
                Compliant=($compliantMatches.Count -gt 0)
            }
        }

        $sharePathOK = ($projectShare -and ([string]$projectShare.Path).TrimEnd('\') -ieq $projectFolder.TrimEnd('\'))
        $sharePermissionsOK = ($sharePermissionEvaluation.Count -eq @($projectSpec.share_permissions).Count -and @($sharePermissionEvaluation | Where-Object { -not $_.Compliant }).Count -eq 0)
        $ntfsPermissionsOK = ($ntfsPermissionEvaluation.Count -eq @($projectSpec.ntfs_permissions).Count -and @($ntfsPermissionEvaluation | Where-Object { -not $_.Compliant }).Count -eq 0)

        if (-not $projectFolderExists -or -not $projectShare) {
            $ipc0168Status = 'NOK'
        }
        elseif (-not $shareReadOK -or -not $aclReadOK) {
            $ipc0168Status = 'NICHT_PRUEFBAR'
        }
        elseif ($sharePathOK -and $sharePermissionsOK -and $ntfsPermissionsOK) {
            $ipc0168Status = 'OK'
        }
        else {
            $ipc0168Status = 'NOK'
        }

        $projectShareSummary = if ($projectShare) { $projectShare | Select-Object Name,Path,Description,ShareState } else { $null }
        $projectNtfsOwner = if ($projectAcl) { [string]$projectAcl.Owner } else { $null }

        $checks['IPC0168'] = New-ValidationResult `
            -Id 'IPC0168' `
            -Name 'D:\Projekt Freigabe- und NTFS-Berechtigungen' `
            -Status $ipc0168Status `
            -Soll $projectSpec `
            -Ist ([ordered]@{
                FolderExists=$projectFolderExists
                Share=$projectShareSummary
                SharePermissions=@($projectShareAccess | Select-Object AccountName,AccessControlType,AccessRight)
                SharePermissionEvaluation=@($sharePermissionEvaluation)
                NtfsOwner=$projectNtfsOwner
                NtfsPermissionEvaluation=@($ntfsPermissionEvaluation)
            }) `
            -Quelle 'Direkt/PowerShell/Get-SmbShare + Get-SmbShareAccess + Get-Acl' `
            -Hinweis 'Zusaetzliche geerbte Standard-ACEs sind zulaessig; alle geforderten Rechte muessen vorhanden sein.'

        # --------------------------------------------------------------
        # IPC0182 - BGSiVaaS lokal unter C:\Programme\Siemens vorhanden.
        # IPC0183/IPC0184 - kompakte Ausfuehrungs-/Autorun-Evidenz.
        # --------------------------------------------------------------
        $bgSpec = $toolsExpected.bgsivaas
        $bgExePath = [string]$bgSpec.executable_path
        $bgInstallPath = [string]$bgSpec.install_path
        if ([string]::IsNullOrWhiteSpace($bgInstallPath)) {
            if (-not [string]::IsNullOrWhiteSpace($bgExePath)) { $bgInstallPath = Split-Path -Parent $bgExePath }
            else { $bgInstallPath = 'C:\Programme\Siemens\BGSiVaaS' }
        }
        $bgInstallExists = (Test-Path -LiteralPath $bgInstallPath) -or (-not [string]::IsNullOrWhiteSpace($bgExePath) -and (Test-Path -LiteralPath $bgExePath -PathType Leaf))
        $checks['IPC0182'] = New-ValidationResult `
            -Id 'IPC0182' `
            -Name 'BGSiVaaS lokal vorhanden' `
            -Status $(if($bgInstallExists){'OK'}else{'NOK'}) `
            -Soll ([ordered]@{ InstallPath=$bgInstallPath; Exists=$true }) `
            -Ist ([ordered]@{ InstallPath=$bgInstallPath; ExecutablePath=$bgExePath; Exists=$bgInstallExists }) `
            -Quelle 'Direkt/PowerShell/Test-Path'

        $startupDirs = @(
            [Environment]::GetFolderPath([Environment+SpecialFolder]::CommonStartup),
            [Environment]::GetFolderPath([Environment+SpecialFolder]::Startup)
        ) | Where-Object { $_ -and (Test-Path -LiteralPath $_ -PathType Container) }
        $bgStartupItems = @()
        $shell = $null
        try { $shell = New-Object -ComObject WScript.Shell } catch { }
        foreach ($startupDir in $startupDirs) {
            foreach ($file in @(Get-ChildItem -LiteralPath $startupDir -File -Force -ErrorAction SilentlyContinue)) {
                $targetPath = $null; $arguments = $null; $runAsUser = $null
                if ($file.Extension -ieq '.lnk' -and $shell) {
                    try {
                        $shortcut = $shell.CreateShortcut($file.FullName)
                        $targetPath = [string]$shortcut.TargetPath
                        $arguments = [string]$shortcut.Arguments
                    } catch { }
                    try {
                        $bytes = [System.IO.File]::ReadAllBytes($file.FullName)
                        if ($bytes.Length -ge 24) {
                            $linkFlags = [BitConverter]::ToUInt32($bytes,20)
                            $runAsUser = (($linkFlags -band 0x00002000) -ne 0)
                        }
                    } catch { }
                }
                $searchable = ([string]$file.Name + ' ' + [string]$targetPath + ' ' + [string]$arguments)
                if ($searchable -match '(?i)BGSiVaaS|BGInfo') {
                    $bgStartupItems += [pscustomobject][ordered]@{
                        Source='Startup'
                        Name=$file.Name
                        FullName=$file.FullName
                        TargetPath=$targetPath
                        Arguments=$arguments
                        RunAsAdministrator=$runAsUser
                    }
                }
            }
        }

        $bgProcesses = @()
        foreach ($proc in @(Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { ([string]$_.Name -ieq 'BGSiVaas.exe') -or ([string]$_.ExecutablePath -match '(?i)BGSiVaaS') })) {
            $owner = $null
            try {
                $ownerResult = Invoke-CimMethod -InputObject $proc -MethodName GetOwner -ErrorAction Stop
                if ($ownerResult.ReturnValue -eq 0) { $owner = (([string]$ownerResult.Domain) + '\' + ([string]$ownerResult.User)).Trim('\') }
            } catch { }
            $bgProcesses += [pscustomobject][ordered]@{
                Source='RunningProcess'
                Name=[string]$proc.Name
                ProcessId=$proc.ProcessId
                ExecutablePath=[string]$proc.ExecutablePath
                CommandLine=[string]$proc.CommandLine
                Owner=$owner
                Running=$true
            }
        }

        $bgPrefetch = @()
        if (Test-Path -LiteralPath 'C:\Windows\Prefetch' -PathType Container) {
            $bgPrefetch = @(Get-ChildItem -LiteralPath 'C:\Windows\Prefetch' -Filter 'BGSIVAAS*.pf' -File -ErrorAction SilentlyContinue | Select-Object Name,FullName,LastWriteTimeUtc)
        }
        $bgLocalUsers = @()
        try {
            $adminGroup = Get-LocalGroup -SID 'S-1-5-32-544' -ErrorAction Stop
            $adminNames = @((Get-LocalGroupMember -Group $adminGroup -ErrorAction SilentlyContinue | ForEach-Object { [string]$_.Name }))
            $bgLocalUsers = @(Get-LocalUser -ErrorAction Stop | ForEach-Object {
                $simpleName = [string]$_.Name
                [pscustomobject][ordered]@{
                    Name=$simpleName
                    Enabled=$_.Enabled
                    LastLogon=$_.LastLogon
                    IsLocalAdministrator=(@($adminNames | Where-Object { $_ -match ([regex]::Escape([string][char]92) + [regex]::Escape($simpleName) + '$') }).Count -gt 0)
                }
            })
        } catch { }

        $bgInfoAutoruns = @($bgStartupItems)
        $bgInfoAutoruns += @($bgProcesses)
        foreach ($pf in $bgPrefetch) {
            $bgInfoAutoruns += [pscustomobject][ordered]@{ Source='Prefetch'; Name=$pf.Name; FullName=$pf.FullName; LastWriteTimeUtc=$pf.LastWriteTimeUtc }
        }
        $bgSimple = [ordered]@{ BGInfoAutoruns=@($bgInfoAutoruns); LocalUsers=@($bgLocalUsers) }
        $information['IPC0183'] = New-InformationResult `
            -Id 'IPC0183' `
            -Name 'BGSiVaaS als Administrator ausgefuehrt / ausgefuehrt' `
            -Ist $bgSimple `
            -Quelle 'Direkt/PowerShell/Startup + Win32_Process + Prefetch + LocalUsers' `
            -Hinweis 'RunAsAdministrator aus .lnk ist ein belastbarer Konfigurationshinweis; Prozessbesitzer allein beweist keine Token-Elevation.'
        $information['IPC0184'] = New-InformationResult `
            -Id 'IPC0184' `
            -Name 'BGSiVaaS Ausfuehrungsevidenz' `
            -Ist $bgSimple `
            -Quelle 'Direkt/PowerShell/Startup + Win32_Process + Prefetch + LocalUsers'

        # IPC0187 - VNC Server eingehend, Allow, fuer Domain/Private/Public.
        function Test-AllFirewallProfiles {
            param($Profile)
            $p = [string]$Profile
            return ($p -match '(?i)^(Any|All)$') -or (($p -match '(?i)Domain') -and ($p -match '(?i)Private') -and ($p -match '(?i)Public'))
        }
        $vncServerRules = @($allFirewallRules | Where-Object {
            (([string]$_.DisplayName + ' ' + [string]$_.Name + ' ' + [string]$_.DisplayGroup) -match '(?i)VNC') -and
            ([string]$_.Enabled -match '^(True|1)$') -and
            ([string]$_.Direction -eq 'Inbound') -and
            ([string]$_.Action -eq 'Allow') -and
            (Test-AllFirewallProfiles $_.Profile)
        })
        $checks['IPC0187'] = New-ValidationResult `
            -Id 'IPC0187' `
            -Name 'VNC Server Firewallregel fuer alle Profile' `
            -Status $(if($allFirewallRules.Count -eq 0){'NICHT_PRUEFBAR'}elseif($vncServerRules.Count -gt 0){'OK'}else{'NOK'}) `
            -Soll ([ordered]@{ Enabled=$true; Direction='Inbound'; Action='Allow'; Profiles=@('Domain','Private','Public') }) `
            -Ist @($vncServerRules | Select-Object Name,DisplayName,DisplayGroup,Enabled,Direction,Action,Profile) `
            -Quelle 'Direkt/PowerShell/Get-NetFirewallRule ActiveStore'

        # IPC0188 - hosts und lmhosts vorhanden.
        $hostsPath = [string]$nameResolutionExpected.hosts_path
        $lmhostsPath = [string]$nameResolutionExpected.lmhosts_path
        if ([string]::IsNullOrWhiteSpace($hostsPath)) { $hostsPath = 'C:\Windows\System32\drivers\etc\hosts' }
        if ([string]::IsNullOrWhiteSpace($lmhostsPath)) { $lmhostsPath = 'C:\Windows\System32\drivers\etc\lmhosts' }
        $requireHosts = if ($null -ne $nameResolutionExpected.require_hosts) { [bool]$nameResolutionExpected.require_hosts } else { $true }
        $requireLmhosts = if ($null -ne $nameResolutionExpected.require_lmhosts) { [bool]$nameResolutionExpected.require_lmhosts } else { $true }
        $hostsExists = Test-Path -LiteralPath $hostsPath -PathType Leaf
        $lmhostsExists = Test-Path -LiteralPath $lmhostsPath -PathType Leaf
        $ipc0188Ok = ((-not $requireHosts) -or $hostsExists) -and ((-not $requireLmhosts) -or $lmhostsExists)
        $checks['IPC0188'] = New-ValidationResult `
            -Id 'IPC0188' `
            -Name 'hosts/lmhosts Dateien vorhanden' `
            -Status $(if($ipc0188Ok){'OK'}else{'NOK'}) `
            -Soll ([ordered]@{ Hosts=$hostsPath; HostsExists=$requireHosts; Lmhosts=$lmhostsPath; LmhostsExists=$requireLmhosts }) `
            -Ist ([ordered]@{ HostsExists=$hostsExists; LmhostsExists=$lmhostsExists }) `
            -Quelle 'Direkt/PowerShell/Test-Path'

        # IPC0200 - WSUSClientManager vorhanden; WSUS-Status als Zusatzinfo.
        # --------------------------------------------------------------
        $wsusTool = $toolsExpected.wsus_client_manager
        $wsusToolPath = [string]$wsusTool.path
        $wsusToolExists = Test-Path -LiteralPath $wsusToolPath -PathType Container
        $wsusPolicyPath = 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate'
        $wsusAuPath = Join-Path $wsusPolicyPath 'AU'
        $wuserver = $null
        $wuStatusServer = $null
        $useWuServer = $null
        if (Test-Path -LiteralPath $wsusPolicyPath) {
            try {
                $wuPolicy = Get-ItemProperty -LiteralPath $wsusPolicyPath -ErrorAction Stop
                $wuserver = [string]$wuPolicy.WUServer
                $wuStatusServer = [string]$wuPolicy.WUStatusServer
            } catch { }
        }
        if (Test-Path -LiteralPath $wsusAuPath) {
            try {
                $auPolicy = Get-ItemProperty -LiteralPath $wsusAuPath -ErrorAction Stop
                if ($null -ne $auPolicy.UseWUServer) { $useWuServer = [int]$auPolicy.UseWUServer }
            } catch { }
        }

        $wsusReachable = $null
        $wsusHost = $null
        $wsusPort = $null
        if (-not [string]::IsNullOrWhiteSpace($wuserver)) {
            try {
                $uri = [uri]$wuserver
                $wsusHost = $uri.Host
                $wsusPort = if ($uri.IsDefaultPort) {
                    if ($uri.Scheme -eq 'https') { 443 } else { 80 }
                } else { $uri.Port }

                $client = New-Object System.Net.Sockets.TcpClient
                try {
                    $async = $client.BeginConnect($wsusHost, $wsusPort, $null, $null)
                    $connected = $async.AsyncWaitHandle.WaitOne(3000, $false)
                    if ($connected) {
                        $client.EndConnect($async)
                        $wsusReachable = $client.Connected
                    } else {
                        $wsusReachable = $false
                    }
                } finally {
                    $client.Close()
                }
            } catch {
                $wsusReachable = $false
            }
        }

        $expectedWsusToolExists = [bool]$wsusTool.expected_exists
        $ipc0200Ok = ($wsusToolExists -eq $expectedWsusToolExists)
        $checks['IPC0200'] = New-ValidationResult `
            -Id 'IPC0200' `
            -Name 'WSUSClientManager ablegen' `
            -Status $(if($ipc0200Ok){'OK'}else{'NOK'}) `
            -Soll ([ordered]@{
                Path=$wsusToolPath
                Exists=$expectedWsusToolExists
            }) `
            -Ist ([ordered]@{
                FolderExists=$wsusToolExists
                WUServer=$wuserver
                WUStatusServer=$wuStatusServer
                UseWUServer=$useWuServer
                WsusActive=($useWuServer -eq 1 -and -not [string]::IsNullOrWhiteSpace($wuserver))
                WsusHost=$wsusHost
                WsusPort=$wsusPort
                WsusTcpReachable=$wsusReachable
            }) `
            -Quelle 'Direkt/PowerShell/Test-Path + WindowsUpdate Policy + TCP probe' `
            -Hinweis 'OK/NOK bezieht sich auf den geforderten WSUSClientManager-Ordner; WSUS-Aktivitaet und Erreichbarkeit werden zusaetzlich dokumentiert.'

        # --------------------------------------------------------------
        # IPC0234 - Auslagerungsdatei C: und D: systemverwaltet.
        # Microsoft unterscheidet Laufzeitnutzung (Win32_PageFileUsage)
        # und konfigurierte Einstellungen (Win32_PageFileSetting).
        # --------------------------------------------------------------
        $pagefileComputer = $null
        $pagefileSettings = @()
        $pagefileUsage = @()
        $pagingFilesRegistry = @()

        try { $pagefileComputer = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop } catch { }
        try { $pagefileSettings = @(Get-CimInstance Win32_PageFileSetting -ErrorAction Stop) } catch { }
        try { $pagefileUsage = @(Get-CimInstance Win32_PageFileUsage -ErrorAction Stop) } catch { }

        try {
            $mm = Get-ItemProperty -LiteralPath 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager\Memory Management' -ErrorAction Stop
            $pagingFilesRegistry = @($mm.PagingFiles)
        } catch { }

        $globalAutomatic = if ($pagefileComputer) { [bool]$pagefileComputer.AutomaticManagedPagefile } else { $null }
        $expectedSystemManaged = [bool]$pagefileExpected.system_managed
        $acceptGlobalAutomatic = [bool]$pagefileExpected.accept_global_automatic_management
        $requiredPagefileDrives = @(
        $pagefileExpected.required_drives | ForEach-Object {
                ([string]$_).TrimEnd([char]92).ToUpperInvariant()
            }
        )

        $pagefileDriveResults = @()
        foreach ($drive in $requiredPagefileDrives) {
            if (-not $drive.EndsWith(':')) { $drive = $drive + ':' }
            $wantedPath = ($drive + '\pagefile.sys')

            $settingMatches = @(
                $pagefileSettings | Where-Object {
                    ([string]$_.Name).Trim().ToLowerInvariant() -eq $wantedPath.ToLowerInvariant()
                }
            )
            $usageMatches = @(
                $pagefileUsage | Where-Object {
                    ([string]$_.Name).Trim().ToLowerInvariant() -eq $wantedPath.ToLowerInvariant()
                }
            )

            $perDriveSystemManaged = (
                $settingMatches.Count -gt 0 -and
                @($settingMatches | Where-Object {
                    [int64]$_.InitialSize -eq 0 -and [int64]$_.MaximumSize -eq 0
                }).Count -gt 0
            )

            $globalManagedAndActive = (
                $acceptGlobalAutomatic -and
                $globalAutomatic -eq $true -and
                $usageMatches.Count -gt 0
            )

            $fixedSizeConfigured = (
                $settingMatches.Count -gt 0 -and
                @($settingMatches | Where-Object {
                    [int64]$_.InitialSize -gt 0 -or [int64]$_.MaximumSize -gt 0
                }).Count -gt 0
            )

            if ($expectedSystemManaged) {
                $compliant = ($perDriveSystemManaged -or $globalManagedAndActive)
            }
            else {
                $compliant = (
                    $fixedSizeConfigured -and
                    $globalAutomatic -ne $true
                )
            }

            $pagefileDriveResults += [pscustomobject][ordered]@{
                Drive=$drive
                ExpectedPath=$wantedPath
                SettingMatches=@($settingMatches | Select-Object Name,InitialSize,MaximumSize)
                UsageMatches=@($usageMatches | Select-Object Name,AllocatedBaseSize,CurrentUsage,PeakUsage,TempPageFile)
                PerDriveSystemManaged=$perDriveSystemManaged
                GlobalAutomaticManagedAndActive=$globalManagedAndActive
                FixedSizeConfigured=$fixedSizeConfigured
                Compliant=$compliant
            }
        }

        if (-not $pagefileComputer) {
            $ipc0234Status = 'NICHT_PRUEFBAR'
        }
        elseif (@($pagefileDriveResults | Where-Object { -not $_.Compliant }).Count -eq 0) {
            $ipc0234Status = 'OK'
        }
        else {
            $ipc0234Status = 'NOK'
        }

        $checks['IPC0234'] = New-ValidationResult `
            -Id 'IPC0234' `
            -Name 'Auslagerungsdatei konfigurieren' `
            -Status $ipc0234Status `
            -Soll ([ordered]@{
                RequiredDrives=$requiredPagefileDrives
                SystemManaged=$expectedSystemManaged
                AcceptGlobalAutomaticManagement=$acceptGlobalAutomatic
            }) `
            -Ist ([ordered]@{
                AutomaticManagedPagefile=$globalAutomatic
                PageFileSettings=@($pagefileSettings | Select-Object Name,InitialSize,MaximumSize)
                PageFileUsage=@($pagefileUsage | Select-Object Name,AllocatedBaseSize,CurrentUsage,PeakUsage,TempPageFile)
                PagingFilesRegistry=@($pagingFilesRegistry)
                DriveEvaluation=@($pagefileDriveResults)
            }) `
            -Quelle 'Direkt/PowerShell/Win32_ComputerSystem + Win32_PageFileSetting + Win32_PageFileUsage'

        # --------------------------------------------------------------
        # IPC0245 - VNC-Viewer-Zugriff fuer alle Netzwerkprofile.
        # --------------------------------------------------------------
        $viewerFirewallRuleRegex = [string]$expectedVncViewerFirewallRegex
        $viewerFirewallEvidence = @()
        foreach ($rule in $allFirewallRules) {
            $application = $null
            try { $application = ($rule | Get-NetFirewallApplicationFilter -ErrorAction Stop).Program } catch { }
            $haystack = ([string]$rule.Name + ' ' + [string]$rule.DisplayName + ' ' + [string]$rule.DisplayGroup + ' ' + [string]$application)
            $isViewerRule = ($haystack -match $viewerFirewallRuleRegex) -or ([string]$application -match '(?i)vncviewer\.exe$')
            if (-not $isViewerRule) { continue }
            $allProfiles = Test-AllFirewallProfiles $rule.Profile
            $viewerFirewallEvidence += [pscustomobject][ordered]@{
                Name=[string]$rule.Name
                DisplayName=[string]$rule.DisplayName
                Enabled=[string]$rule.Enabled
                Direction=[string]$rule.Direction
                Action=[string]$rule.Action
                Profile=[string]$rule.Profile
                Program=[string]$application
                AllProfiles=$allProfiles
                Compliant=(([string]$rule.Enabled -match '^(True|1)$') -and ([string]$rule.Action -eq 'Allow') -and $allProfiles)
            }
        }
        $ipc0245Status = if ($allFirewallRules.Count -eq 0) { 'NICHT_PRUEFBAR' } elseif (@($viewerFirewallEvidence | Where-Object Compliant).Count -gt 0) { 'OK' } else { 'NOK' }
        $checks['IPC0245'] = New-ValidationResult `
            -Id 'IPC0245' `
            -Name 'VNC-Viewer Firewallregel alle Profile' `
            -Status $ipc0245Status `
            -Soll ([ordered]@{ ViewerRule=$true; Enabled=$true; Action='Allow'; Profiles=@('Domain','Private','Public') }) `
            -Ist @($viewerFirewallEvidence) `
            -Quelle 'Direkt/PowerShell/Get-NetFirewallRule + Get-NetFirewallApplicationFilter'

        # IPC0246 - Windows Firewall fuer Domain/Private/Public aktiv.
        $firewallProfilesLive = @(Get-NetFirewallProfile -Profile Domain,Private,Public -ErrorAction SilentlyContinue)
        $requiredProfileNames = @('Domain','Private','Public')
        $missingFirewallProfiles = @($requiredProfileNames | Where-Object { $wanted=$_; -not ($firewallProfilesLive | Where-Object { [string]$_.Name -ieq $wanted }) })
        $disabledFirewallProfiles = @($firewallProfilesLive | Where-Object { -not [bool]$_.Enabled })
        $ipc0246Status = if ($firewallProfilesLive.Count -eq 0) { 'NICHT_PRUEFBAR' } elseif ($missingFirewallProfiles.Count -eq 0 -and $disabledFirewallProfiles.Count -eq 0) { 'OK' } else { 'NOK' }
        $checks['IPC0246'] = New-ValidationResult `
            -Id 'IPC0246' `
            -Name 'Firewall fuer alle Profile aktiviert' `
            -Status $ipc0246Status `
            -Soll ([ordered]@{ Domain=$true; Private=$true; Public=$true }) `
            -Ist ([ordered]@{ Profiles=@($firewallProfilesLive | Select-Object Name,Enabled,DefaultInboundAction,DefaultOutboundAction); Missing=@($missingFirewallProfiles) }) `
            -Quelle 'Direkt/PowerShell/Get-NetFirewallProfile'

        # IPC0247 - Defender Manipulationsschutz aus.
        # --------------------------------------------------------------
        $mpStatus = $null
        try {
            if (Get-Command Get-MpComputerStatus -ErrorAction SilentlyContinue) {
                $mpStatus = Get-MpComputerStatus -ErrorAction Stop
            }
        } catch { }

        $tamperValue = if ($mpStatus) { $mpStatus.IsTamperProtected } else { $null }
        if ($null -eq $tamperValue) {
            $ipc0247Status = 'NICHT_PRUEFBAR'
        }
        elseif ([bool]$tamperValue -eq $false) {
            $ipc0247Status = 'OK'
        }
        else {
            $ipc0247Status = 'NOK'
        }

        $checks['IPC0247'] = New-ValidationResult `
            -Id 'IPC0247' `
            -Name 'Defender Einstellungen korrigieren - Manipulationsschutz' `
            -Status $ipc0247Status `
            -Soll ([ordered]@{ IsTamperProtected=$false }) `
            -Ist ([ordered]@{ IsTamperProtected=$tamperValue }) `
            -Quelle 'Direkt/PowerShell/Get-MpComputerStatus'

        # --------------------------------------------------------------
        # IPC0250 - Zuverlässigkeitsbasierter Schutz / Downloads blockieren
        # soll NICHT aktiviert sein.
        #
        # Der explizite, belastbare Policywert ist SmartScreenPuaEnabled.
        # Ohne expliziten Wert wird nicht aus einem UI-Default geraten.
        # --------------------------------------------------------------
        $smartScreenPuaCandidates = @()
        foreach ($candidate in @(
            [pscustomobject]@{ Scope='HKLM Policy'; Path='HKLM:\SOFTWARE\Policies\Microsoft\Edge'; Name='SmartScreenPuaEnabled' },
            [pscustomobject]@{ Scope='HKLM Recommended'; Path='HKLM:\SOFTWARE\Policies\Microsoft\Edge\Recommended'; Name='SmartScreenPuaEnabled' },
            [pscustomobject]@{ Scope='HKCU Policy'; Path='HKCU:\SOFTWARE\Policies\Microsoft\Edge'; Name='SmartScreenPuaEnabled' },
            [pscustomobject]@{ Scope='HKCU Edge'; Path='HKCU:\SOFTWARE\Microsoft\Edge'; Name='SmartScreenPuaEnabled' }
        )) {
            if (-not (Test-Path -LiteralPath $candidate.Path)) { continue }
            try {
                $property = Get-ItemProperty -LiteralPath $candidate.Path -Name $candidate.Name -ErrorAction Stop
                $value = $property.($candidate.Name)
                $smartScreenPuaCandidates += [pscustomobject][ordered]@{
                    Scope=$candidate.Scope
                    Path=$candidate.Path
                    Name=$candidate.Name
                    Value=$value
                }
            } catch { }
        }

        if ($smartScreenPuaCandidates.Count -eq 0) {
            $ipc0250Status = 'NICHT_PRUEFBAR'
        }
        elseif (@($smartScreenPuaCandidates | Where-Object { [int]$_.Value -ne 0 }).Count -gt 0) {
            $ipc0250Status = 'NOK'
        }
        else {
            $ipc0250Status = 'OK'
        }

        $checks['IPC0250'] = New-ValidationResult `
            -Id 'IPC0250' `
            -Name 'Defender Zuverlässigkeitsbasierter Schutz - Downloads blockieren deaktiviert' `
            -Status $ipc0250Status `
            -Soll ([ordered]@{
                SmartScreenPuaEnabled=0
                Reference='Microsoft Defender SmartScreen / PUA download blocking'
            }) `
            -Ist ([ordered]@{
                ExplicitRegistryValues=@($smartScreenPuaCandidates)
            }) `
            -Quelle 'Direkt/PowerShell/Microsoft Edge SmartScreenPuaEnabled Registry' `
            -Hinweis 'Fehlt ein expliziter Registry-/Policywert, bleibt die UI-Einstellung NICHT_PRUEFBAR.'

        # --------------------------------------------------------------
        # IPC0251 - Defender Sicherheitsstatus muss in Ordnung sein.
        # --------------------------------------------------------------
        $requiredDefenderStatusFields = @($requiredDefenderStatusFieldsExpected)
        $defenderHealth = @()
        if ($mpStatus) {
            foreach ($field in $requiredDefenderStatusFields) {
                $exists = ($mpStatus.PSObject.Properties.Name -contains $field)
                $value = if($exists){$mpStatus.$field}else{$null}
                $defenderHealth += [pscustomobject][ordered]@{ Name=$field; Available=$exists; Value=$value; Compliant=($exists -and [bool]$value) }
            }
        }
        if (-not $mpStatus) {
            $ipc0251Status = 'NICHT_PRUEFBAR'
        }
        elseif (@($defenderHealth | Where-Object { -not $_.Available }).Count -gt 0) {
            $ipc0251Status = 'NICHT_PRUEFBAR'
        }
        elseif (@($defenderHealth | Where-Object { -not $_.Compliant }).Count -gt 0) {
            $ipc0251Status = 'NOK'
        }
        else {
            $ipc0251Status = 'OK'
        }
        $defenderSignatureLastUpdated = if ($mpStatus) { $mpStatus.AntivirusSignatureLastUpdated } else { $null }
        $checks['IPC0251'] = New-ValidationResult `
            -Id 'IPC0251' `
            -Name 'Defender Sicherheitsstatus i.O.' `
            -Status $ipc0251Status `
            -Soll ([ordered]@{ RequiredTrue=@($requiredDefenderStatusFields) }) `
            -Ist ([ordered]@{ StatusFields=@($defenderHealth); AntivirusSignatureLastUpdated=$defenderSignatureLastUpdated }) `
            -Quelle 'Direkt/PowerShell/Get-MpComputerStatus' `
            -Hinweis 'IPC0247 (Manipulationsschutz) und IPC0250 (Downloads blockieren) werden separat bewertet.'

        # --------------------------------------------------------------
        # IPC0252 - nur pruefen, ob UltraVNC Viewer installiert/vorhanden ist.
        # --------------------------------------------------------------
        if ($expectedUltraVncViewerInstalled) { $ipc0252Ok = $viewerPresent } else { $ipc0252Ok = -not $viewerPresent }
        $checks['IPC0252'] = New-ValidationResult `
            -Id 'IPC0252' `
            -Name 'UltraVNC Viewer installiert' `
            -Status $(if($ipc0252Ok){'OK'}else{'NOK'}) `
            -Soll ([ordered]@{ ExpectedInstalled=$expectedUltraVncViewerInstalled }) `
            -Ist ([ordered]@{ ViewerPresent=$viewerPresent; ViewerPaths=@($viewerExisting); ViewerVersions=@($viewerVersions) }) `
            -Quelle 'Direkt/PowerShell/vncviewer.exe'

        # IPC0263-IPC0271 - BIOS/Firmware-Sollwerte.
        # --------------------------------------------------------------
        $biosFirmwareEvidence = @(Get-BiosFirmwareEvidence)

        $checks['IPC0263'] = Test-BiosFirmwareExpectation `
            -Id 'IPC0263' `
            -Name 'USB Boot deaktiviert lassen' `
            -Specification $firmwareExpected.bios_checks.IPC0263 `
            -Evidence $biosFirmwareEvidence

        $checks['IPC0264'] = Test-BiosFirmwareExpectation `
            -Id 'IPC0264' `
            -Name 'WLAN deaktivieren' `
            -Specification $firmwareExpected.bios_checks.IPC0264 `
            -Evidence $biosFirmwareEvidence

        $checks['IPC0265'] = Test-BiosFirmwareExpectation `
            -Id 'IPC0265' `
            -Name 'Super IO Configuration' `
            -Specification $firmwareExpected.bios_checks.IPC0265 `
            -Evidence $biosFirmwareEvidence

        # IPC0267 kombiniert BIOS-Einstellung "Password Severity = Standard"
        # mit SMBIOS AdminPasswordStatus.
        $ipc0267Base = Test-BiosFirmwareExpectation `
            -Id 'IPC0267' `
            -Name 'Zugang über Passwort schützen - Password Severity' `
            -Specification $firmwareExpected.bios_checks.IPC0267 `
            -Evidence $biosFirmwareEvidence

        $computerSystemSecurity = $null
        try { $computerSystemSecurity = Get-CimInstance Win32_ComputerSystem -ErrorAction Stop } catch { }
        $adminPasswordStatus = if ($computerSystemSecurity) { $computerSystemSecurity.AdminPasswordStatus } else { $null }
        $expectedAdminPasswordStatus = [int]$firmwareExpected.bios_checks.IPC0267.admin_password_status_expected

        if ($null -ne $adminPasswordStatus -and [int]$adminPasswordStatus -eq 0) {
            $ipc0267Status = 'NOK'
        }
        elseif ([string]$ipc0267Base.status -eq 'NOK') {
            $ipc0267Status = 'NOK'
        }
        elseif (
            $null -ne $adminPasswordStatus -and
            [int]$adminPasswordStatus -eq $expectedAdminPasswordStatus -and
            [string]$ipc0267Base.status -eq 'OK'
        ) {
            $ipc0267Status = 'OK'
        }
        else {
            $ipc0267Status = 'NICHT_PRUEFBAR'
        }

        $checks['IPC0267'] = New-ValidationResult `
            -Id 'IPC0267' `
            -Name 'Zugang über Passwort schützen' `
            -Status $ipc0267Status `
            -Soll ([ordered]@{
                PasswordSeverity='Standard'
                AdminPasswordStatus=$expectedAdminPasswordStatus
            }) `
            -Ist ([ordered]@{
                PasswordSeverityEvidence=$ipc0267Base.ist
                AdminPasswordStatus=$adminPasswordStatus
            }) `
            -Quelle 'Direkt/PowerShell/CIM BIOS Provider + Win32_ComputerSystem.AdminPasswordStatus' `
            -Hinweis 'AdminPasswordStatus=1 bedeutet aktiv; fehlt die Password-Severity-Evidenz, bleibt die Gesamtprüfung NICHT_PRUEFBAR.'

        $checks['IPC0268'] = Test-BiosFirmwareExpectation `
            -Id 'IPC0268' `
            -Name 'Start bei Strom ein - Previous State' `
            -Specification $firmwareExpected.bios_checks.IPC0268 `
            -Evidence $biosFirmwareEvidence

        $checks['IPC0269'] = Test-BiosFirmwareExpectation `
            -Id 'IPC0269' `
            -Name 'Aufwecken über Netzwerk deaktivieren' `
            -Specification $firmwareExpected.bios_checks.IPC0269 `
            -Evidence $biosFirmwareEvidence

        $checks['IPC0270'] = Test-BiosFirmwareExpectation `
            -Id 'IPC0270' `
            -Name 'Num Lock ON bei Start' `
            -Specification $firmwareExpected.bios_checks.IPC0270 `
            -Evidence $biosFirmwareEvidence

        $checks['IPC0271'] = Test-BiosFirmwareExpectation `
            -Id 'IPC0271' `
            -Name 'Festplatte als erstes Start-Medium' `
            -Specification $firmwareExpected.bios_checks.IPC0271 `
            -Evidence $biosFirmwareEvidence

            [pscustomobject][ordered]@{
                host   = $env:COMPUTERNAME
                ip     = '{{ ansible_host | default(inventory_hostname) }}'
                checks = $checks
                informationen = $information
            } | ConvertTo-Json -Depth 12 -Compress
      register: ipc_0170_live_checks
      changed_when: false
      failed_when: false
      when: ipc_0170_live_ping.ping | default('') == 'pong'

    - name: Direkte 0170-Pruefergebnisse lokal speichern
      ansible.builtin.copy:
        content: "{{ ipc_0170_live_checks.stdout | trim }}\n"
        dest: "{{ result_dir }}/.0170_live/{{ ansible_host | default(inventory_hostname) }}.json"
      delegate_to: localhost
      become: false
      when:
        - ipc_0170_live_ping.ping | default('') == 'pong'
        - ipc_0170_live_checks is defined
        - ipc_0170_live_checks.rc | default(1) == 0
        - ipc_0170_live_checks.stdout | default('') | trim | length > 0

- name: "0170 IPC OS Server - Live-Ergebnisse in JSON und CSV zusammenfuehren"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    ipc_os_server_validation_output_file: >-
      {{
        ipc_os_server_id_validation_file
        | default(result_dir ~ '/ipc_os_server_id_validation_latest.json')
      }}
    ipc_os_server_validation_csv_file: >-
      {{
        ipc_os_server_id_validation_csv_file
        | default(result_dir ~ '/ipc_os_server_id_validation_matrix_latest.csv')
      }}

  tasks:
    - name: Direkte Ergebnisse atomar in 0170-Protokolle uebernehmen
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../Python/0170IPC_OS_Server_ID_Validation.py"
          - merge
          - --output
          - "{{ ipc_os_server_validation_output_file }}"
          - --csv
          - "{{ ipc_os_server_validation_csv_file }}"
          - --live-dir
          - "{{ result_dir }}/.0170_live"
      register: ipc_0170_merge
      changed_when: true

    - name: Finale 0170-Ergebnisse einlesen
      ansible.builtin.slurp:
        src: "{{ ipc_os_server_validation_output_file }}"
      register: ipc_0170_final_raw

    - name: Finale 0170-Zusammenfassung anzeigen
      ansible.builtin.debug:
        msg:
          - "Nur IPC OS Server wurde ausgewertet; ES und OS Client wurden ignoriert."
          - "JSON: {{ ipc_os_server_validation_output_file }}"
          - "CSV: {{ ipc_os_server_validation_csv_file }}"
          - >-
            Zusammenfassung:
            {{ (ipc_0170_final_raw.content | b64decode | from_json).summary }}