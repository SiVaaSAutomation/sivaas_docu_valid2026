---
- name: "0170 IPC OS Server - ID-Pruefung aus Informationsbibliothek"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    ipc_os_server_validation_library_file: >-
      {{
        ipc_information_library_file
        | default(result_dir ~ '/ipc_information_library_latest.json')
      }}
    ipc_os_server_validation_output_file: >-
      {{
        ipc_os_server_id_validation_file
        | default(result_dir ~ '/ipc_os_server_id_validation_latest.json')
      }}
    ipc_os_server_validation_csv_file: >-
      {{
        ipc_os_server_id_validation_csv_file
        | default(result_dir ~ '/ipc_os_server_id_validation_matrix_latest.csv')
      }}
    ipc_os_server_validation_discovery_file: >-
      {{
        ipc_discovery_file
        | default(result_dir ~ '/ipc_discovery_groups_latest.json')
      }}
    ipc_os_server_validation_live_dir: "{{ result_dir }}/.0170_live"
    ipc_os_server_validation_expected_file: "{{ result_dir }}/.0170_live/0170_expected.json"

  tasks:
    - name: Benoetigte Semaphore-Variablen fuer 0170 pruefen
      ansible.builtin.assert:
        that:
          - result_dir is defined
          - result_dir | string | length > 0
          - win_user is defined
          - win_user | string | length > 0
          - win_password is defined
          - win_password | string | length > 0
          - winrm_transport is defined
          - winrm_transport | string | length > 0
          - ipc_os_server_validation_expected is defined
          - ipc_os_server_validation_expected is mapping
          - ipc_os_server_validation_expected.time is defined
          - ipc_os_server_validation_expected.time.timezone_id is defined
          - ipc_os_server_validation_expected.keyboard is defined
          - ipc_os_server_validation_expected.keyboard.allowed_layout_ids is defined
          - ipc_os_server_validation_expected.keyboard.exact_layout_count is defined
          - ipc_os_server_validation_expected.accounts is defined
          - ipc_os_server_validation_expected.accounts.admin_l_user is defined
          - ipc_os_server_validation_expected.network is defined
          - ipc_os_server_validation_expected.network.terminalbus_adapter_regex is defined
          - ipc_os_server_validation_expected.network.present_adapters is defined
          - ipc_os_server_validation_expected.network.absent_adapters is defined
          - ipc_os_server_validation_expected.network.allowed_enabled_adapter_names is defined
          - ipc_os_server_validation_expected.domain is defined
          - ipc_os_server_validation_expected.domain.computer_ou_regex is defined
          - ipc_os_server_validation_expected.vnc_firewall is defined
          - ipc_os_server_validation_expected.vnc_firewall.rule_name_patterns is defined
          - ipc_os_server_validation_expected.power is defined
          - ipc_os_server_validation_expected.power.active_plan_name_regex is defined
          - ipc_os_server_validation_expected.services is defined
          - ipc_os_server_validation_expected.services.disabled_patterns is defined
          - ipc_os_server_validation_expected.hardening is defined
          - ipc_os_server_validation_expected.hardening.tls is defined
          - ipc_os_server_validation_expected.hardening.tls.disabled_protocols is defined
          - ipc_os_server_validation_expected.hardening.tls.enabled_protocols is defined
          - ipc_os_server_validation_expected.hardening.tls.allowed_cipher_suites is defined
          - ipc_os_server_validation_expected.hardening.tls.disabled_cipher_suites is defined
          - ipc_os_server_validation_expected.filesystem is defined
          - ipc_os_server_validation_expected.filesystem.project_folder is defined
          - ipc_os_server_validation_expected.filesystem.project_share is defined
          - ipc_os_server_validation_expected.desktop is defined
          - ipc_os_server_validation_expected.desktop.screen_saver is defined
          - ipc_os_server_validation_expected.desktop.screen_saver.enabled is defined
          - ipc_os_server_validation_expected.desktop.screen_saver.timeout_seconds is defined
          - ipc_os_server_validation_expected.desktop.screen_saver.password_protected is defined
          - ipc_os_server_validation_expected.firmware is defined
          - ipc_os_server_validation_expected.firmware.bios_checks is defined
          - ipc_os_server_validation_expected.firmware.bios_checks.IPC0263 is defined
          - ipc_os_server_validation_expected.firmware.bios_checks.IPC0264 is defined
          - ipc_os_server_validation_expected.firmware.bios_checks.IPC0265 is defined
          - ipc_os_server_validation_expected.firmware.bios_checks.IPC0267 is defined
          - ipc_os_server_validation_expected.firmware.bios_checks.IPC0268 is defined
          - ipc_os_server_validation_expected.firmware.bios_checks.IPC0269 is defined
          - ipc_os_server_validation_expected.firmware.bios_checks.IPC0270 is defined
          - ipc_os_server_validation_expected.firmware.bios_checks.IPC0271 is defined
        fail_msg: >-
          Fuer 0170 fehlt der strukturierte Semaphore-Block
          ipc_os_server_validation_expected oder darin benoetigte OS-Server-Sollwerte.

    - name: Informationsbibliothek von 0150 pruefen
      ansible.builtin.stat:
        path: "{{ ipc_os_server_validation_library_file }}"
      register: ipc_os_server_validation_library_stat

    - name: Abbrechen wenn Informationsbibliothek fehlt
      ansible.builtin.fail:
        msg: >-
          {{ ipc_os_server_validation_library_file }} wurde nicht gefunden.
          Fuehre zuerst 0000, danach 0120 und anschliessend 0150 aus.
      when: not (ipc_os_server_validation_library_stat.stat.exists | default(false))

    - name: Ausgabeordner fuer 0170 anlegen
      ansible.builtin.file:
        path: "{{ ipc_os_server_validation_output_file | dirname }}"
        state: directory

    - name: Discovery-Datei fuer direkte 0170-Pruefungen pruefen
      ansible.builtin.stat:
        path: "{{ ipc_os_server_validation_discovery_file }}"
      register: ipc_os_server_validation_discovery_stat

    - name: Abbrechen wenn Discovery-Datei fehlt
      ansible.builtin.fail:
        msg: >-
          {{ ipc_os_server_validation_discovery_file }} wurde nicht gefunden.
          Fuehre zuerst 0000IPC_Discovery_Classification.yml aus.
      when: not (ipc_os_server_validation_discovery_stat.stat.exists | default(false))

    - name: Discovery-Datei fuer direkte 0170-Pruefungen einlesen
      ansible.builtin.slurp:
        src: "{{ ipc_os_server_validation_discovery_file }}"
      register: ipc_os_server_validation_discovery_raw

    - name: Discovery-Daten fuer direkte 0170-Pruefungen speichern
      ansible.builtin.set_fact:
        ipc_os_server_validation_discovery_data: >-
          {{ ipc_os_server_validation_discovery_raw.content | b64decode | from_json }}

    - name: OS-Server-Gruppe in Discovery-Datei pruefen
      ansible.builtin.assert:
        that:
          - ipc_os_server_validation_discovery_data.groups is defined
          - ipc_os_server_validation_discovery_data.groups.ipc_os is defined
          - ipc_os_server_validation_discovery_data.groups.ipc_os is iterable
        fail_msg: >-
          In {{ ipc_os_server_validation_discovery_file }} wurde groups.ipc_os nicht gefunden.

    - name: OS-Server-Ziele fuer direkte Read-only-Pruefungen dynamisch anlegen
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: ipc_os_server_0170_live_targets
        ansible_host: "{{ item.ip }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.winrm_port | default(winrm_default_port | default(5985)) | int }}"
        ansible_winrm_scheme: "{{ item.winrm_scheme | default('http') }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(180) }}"
      loop: "{{ ipc_os_server_validation_discovery_data.groups.ipc_os | default([]) }}"
      loop_control:
        label: "{{ item.ip }}"
      no_log: true

    - name: Alte direkte 0170-Zwischenergebnisse entfernen
      ansible.builtin.file:
        path: "{{ ipc_os_server_validation_live_dir }}"
        state: absent

    - name: Verzeichnis fuer direkte 0170-Ergebnisse vorbereiten
      ansible.builtin.file:
        path: "{{ ipc_os_server_validation_live_dir }}"
        state: directory

    - name: OS-Server-Sollwerte fuer externe 0170-Pythonpruefung bereitstellen
      ansible.builtin.copy:
        dest: "{{ ipc_os_server_validation_expected_file }}"
        content: >-
          {{
            {
              'timezone_id': ipc_os_server_validation_expected.time.timezone_id,
              'keyboard': ipc_os_server_validation_expected.keyboard,
              'initial_user_name': ipc_os_server_validation_expected.accounts.initial_user_name | default('User'),
              'admin_l_user': ipc_os_server_validation_expected.accounts.admin_l_user,
              'firewall_rule_name_patterns': ipc_os_server_validation_expected.vnc_firewall.rule_name_patterns,
              'terminalbus_adapter_regex': ipc_os_server_validation_expected.network.terminalbus_adapter_regex,
              'enable_lmhosts': ipc_os_server_validation_expected.network.enable_lmhosts | default(0),
              'network_adapter_name_regex': ipc_os_server_validation_expected.network.adapter_name_regex | default('.*'),
              'excluded_network_adapter_name_regex': ipc_os_server_validation_expected.network.excluded_adapter_name_regex | default('(?!)'),
              'present_adapters': ipc_os_server_validation_expected.network.present_adapters,
              'absent_adapters': ipc_os_server_validation_expected.network.absent_adapters,
              'allowed_enabled_adapter_names': ipc_os_server_validation_expected.network.allowed_enabled_adapter_names,
              'computer_ou_regex': ipc_os_server_validation_expected.domain.computer_ou_regex,
              'power_plan_regex': ipc_os_server_validation_expected.power.active_plan_name_regex,
              'disabled_service_patterns': ipc_os_server_validation_expected.services.disabled_patterns,
              'disabled_schannel_protocols': ipc_os_server_validation_expected.hardening.tls.disabled_protocols,
              'enabled_schannel_protocols': ipc_os_server_validation_expected.hardening.tls.enabled_protocols,
              'allowed_tls12_cipher_suites': ipc_os_server_validation_expected.hardening.tls.allowed_cipher_suites,
              'disabled_cipher_suites': ipc_os_server_validation_expected.hardening.tls.disabled_cipher_suites,
              'project_folder': ipc_os_server_validation_expected.filesystem.project_folder,
              'project_share': ipc_os_server_validation_expected.filesystem.project_share,
              'hup_name_regex': ipc_os_server_validation_expected.software.hup.name_regex | default('(?i)HUP')
            } | to_nice_json
          }}

    - name: Erste IPC-OS-Server-IDs aus Informationsbibliothek pruefen
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../Python/0170IPC_OS_Server_ID_Validation.py"
          - build
          - --library
          - "{{ ipc_os_server_validation_library_file }}"
          - --output
          - "{{ ipc_os_server_validation_output_file }}"
          - --csv
          - "{{ ipc_os_server_validation_csv_file }}"
          - --expected
          - "{{ ipc_os_server_validation_expected_file }}"
      register: ipc_os_server_validation_build
      changed_when: true

    - name: Erzeugte 0170-JSON-Datei pruefen
      ansible.builtin.stat:
        path: "{{ ipc_os_server_validation_output_file }}"
      register: ipc_os_server_validation_output_stat

    - name: Abbrechen wenn 0170 keine JSON-Datei erzeugt hat
      ansible.builtin.fail:
        msg: >-
          {{ ipc_os_server_validation_output_file }} wurde nicht erzeugt.
          Generatorausgabe: {{ ipc_os_server_validation_build.stdout | default('') }}
      when: not (ipc_os_server_validation_output_stat.stat.exists | default(false))

    - name: Bibliotheksbasierte 0170-Vorpruefung anzeigen
      ansible.builtin.debug:
        msg:
          - "Nur Computerart OS_Server wird ausgewertet; ES, OS Client und Kein_Zugriff werden ignoriert."
          - "JSON: {{ ipc_os_server_validation_output_file }}"
          - "CSV: {{ ipc_os_server_validation_csv_file }}"

- name: "0170 IPC OS Server - Direkte Read-only-Pruefungen fuer Snapshot-Luecken"
  hosts: ipc_os_server_0170_live_targets
  gather_facts: false
  become: false
  any_errors_fatal: false

  vars:
    live_expected_allowed_ciphers: "{{ ipc_os_server_validation_expected.hardening.tls.allowed_cipher_suites }}"
    live_expected_disabled_ciphers: "{{ ipc_os_server_validation_expected.hardening.tls.disabled_cipher_suites }}"
    live_expected_project_folder: "{{ ipc_os_server_validation_expected.filesystem.project_folder }}"

  tasks:
    - name: WinRM-Verbindung fuer direkte 0170-Pruefungen testen
      ansible.windows.win_ping:
      register: ipc_0170_live_ping
      changed_when: false
      failed_when: false
      ignore_unreachable: true

    - name: Direkte read-only Pruefungen fuer OS-Server-Endzustaende ausfuehren
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'Stop'
        $ProgressPreference = 'SilentlyContinue'

        function New-Check {
            param(
                [Parameter(Mandatory=$true)][string]$Name,
                [Parameter(Mandatory=$false)][Nullable[bool]]$Ok,
                [Parameter(Mandatory=$true)]$Soll,
                [Parameter(Mandatory=$false)]$Ist,
                [Parameter(Mandatory=$true)][string]$Quelle,
                [Parameter(Mandatory=$true)][string]$Sollwertquelle
            )
            [pscustomobject][ordered]@{
                status = if ($null -eq $Ok) { 'NICHT_PRUEFBAR' } elseif ($Ok) { 'OK' } else { 'NOK' }
                aufgabe = $Name
                soll = $Soll
                ist = $Ist
                quelle = $Quelle
                sollwertquelle = $Sollwertquelle
            }
        }

        function New-Information {
            param(
                [Parameter(Mandatory=$true)][string]$Name,
                [Parameter(Mandatory=$false)]$Information,
                [Parameter(Mandatory=$true)][string]$Quelle,
                [Parameter(Mandatory=$true)][string]$Hinweis
            )
            $hasInformation = $null -ne $Information
            [pscustomobject][ordered]@{
                pruefart = 'INDIREKT'
                status = if ($hasInformation) { 'INFORMATION' } else { 'KEINE_INFORMATION' }
                manuelle_bewertung_erforderlich = $true
                aufgabe = $Name
                information = $Information
                quelle = $Quelle
                hinweis = $Hinweis
            }
        }

        $checks = [ordered]@{}
        $information = [ordered]@{}

        $firmwareExpected = ConvertFrom-Json -InputObject @'
        {{ ipc_os_server_validation_expected.firmware | to_json }}
        '@

        function Convert-ToSimpleFirmwareValue {
            param($Value)
            if ($null -eq $Value) { return $null }
            if ($Value -is [string]) { return $Value }
            if ($Value -is [System.Array]) { return (@($Value | ForEach-Object { [string]$_ }) -join '; ') }
            try { return [string]$Value } catch { return $null }
        }

        function Get-BiosFirmwareEvidence {
            $records = New-Object System.Collections.Generic.List[object]
            foreach ($namespace in @('root\wmi','root\cimv2')) {
                $classes = @()
                try {
                    $classes = @(Get-CimClass -Namespace $namespace -ErrorAction Stop |
                        Where-Object { $_.CimClassName -match '(?i)(BIOS|Firmware|UEFI|Setup)' -and $_.CimClassName -notmatch '(?i)(Event|Trace|Perf|History|Log)' } |
                        Select-Object -First 50)
                } catch { }
                foreach ($class in $classes) {
                    $instances = @()
                    try { $instances = @(Get-CimInstance -Namespace $namespace -ClassName $class.CimClassName -ErrorAction Stop | Select-Object -First 40) } catch { continue }
                    foreach ($instance in $instances) {
                        $props = [ordered]@{}
                        foreach ($property in @($instance.CimInstanceProperties)) {
                            if ($property.Name -match '^__') { continue }
                            $simple = Convert-ToSimpleFirmwareValue $property.Value
                            if ($null -ne $simple) { $props[$property.Name] = $simple }
                        }
                        if ($props.Count -eq 0) { continue }
                        $search = @("Namespace=$namespace","ClassName=$($class.CimClassName)")
                        foreach ($entry in $props.GetEnumerator()) { $search += ("{0}={1}" -f $entry.Key,$entry.Value) }
                        $records.Add([pscustomobject]@{ Namespace=$namespace; ClassName=$class.CimClassName; Properties=[pscustomobject]$props; SearchText=($search -join ' | ') })
                    }
                }
            }
            return @($records)
        }

        function Test-BiosFirmwareExpectation {
            param([string]$Id,[string]$Name,$Specification,$Evidence)
            $labelRegex = [string]$Specification.label_regex
            $valueRegex = [string]$Specification.expected_value_regex
            $forbiddenValueRegex = [string]$Specification.forbidden_value_regex
            $minimumMatches = [int]$Specification.minimum_matches
            if ($minimumMatches -lt 1) { $minimumMatches = 1 }
            $matches = @($Evidence | Where-Object { [string]$_.SearchText -match $labelRegex })
            $compliant = @($matches | Where-Object { [string]$_.SearchText -match $valueRegex })
            $nonCompliant = @()
            if (-not [string]::IsNullOrWhiteSpace($forbiddenValueRegex)) { $nonCompliant = @($matches | Where-Object { [string]$_.SearchText -match $forbiddenValueRegex }) }
            $ok = $null
            if ($matches.Count -eq 0) { $ok = $null }
            elseif ($nonCompliant.Count -gt 0) { $ok = $false }
            elseif ($compliant.Count -ge $minimumMatches) { $ok = $true }
            else { $ok = $null }
            return New-Check -Name $Name -Ok $ok -Soll @{ LabelRegex=$labelRegex; ExpectedValueRegex=$valueRegex; ForbiddenValueRegex=$forbiddenValueRegex; MinimumMatches=$minimumMatches } -Ist @{ MatchingEvidence=$matches; CompliantEvidence=$compliant; ExplicitNonCompliantEvidence=$nonCompliant } -Quelle 'Direkt/PowerShell/CIM BIOS-Firmware Provider Discovery' -Sollwertquelle 'Semaphore: ipc_os_server_validation_expected.firmware'
        }

        # IPC0047 - klassische Eingabesprachen-Hotkeys auf "Nicht zugewiesen".
        $togglePath = 'HKCU:\Keyboard Layout\Toggle'
        $toggleExists = Test-Path -LiteralPath $togglePath
        $toggle = if ($toggleExists) { Get-ItemProperty -LiteralPath $togglePath -ErrorAction Stop } else { $null }
        $toggleState = [ordered]@{
            RegistryPath = $togglePath
            RegistryExists = $toggleExists
            RunAsUser = [System.Security.Principal.WindowsIdentity]::GetCurrent().Name
            Hotkey = if ($toggle) { [string]$toggle.Hotkey } else { $null }
            LanguageHotkey = if ($toggle) { [string]$toggle.'Language Hotkey' } else { $null }
            LayoutHotkey = if ($toggle) { [string]$toggle.'Layout Hotkey' } else { $null }
        }
        $checks['IPC0047'] = New-Check `
            -Name 'Tastenkombination für Eingabesprachen deaktivieren' `
            -Ok ($toggleExists -and $toggleState.Hotkey -eq '3' -and $toggleState.LanguageHotkey -eq '3' -and $toggleState.LayoutHotkey -eq '3') `
            -Soll @{ Hotkey='3'; LanguageHotkey='3'; LayoutHotkey='3'; Bedeutung='Nicht zugewiesen' } `
            -Ist $toggleState `
            -Quelle 'Direkt/PowerShell/HKCU Keyboard Layout Toggle' `
            -Sollwertquelle 'Aufgabenliste'


        # IPC0046 - gleicher technischer Endzustand wie IPC0047.
        $checks['IPC0046'] = New-Check `
            -Name 'Hot-Keys abschalten (Auswahl: Keine)' `
            -Ok ($toggleExists -and $toggleState.Hotkey -eq '3' -and $toggleState.LanguageHotkey -eq '3' -and $toggleState.LayoutHotkey -eq '3') `
            -Soll @{ Hotkey='3'; LanguageHotkey='3'; LayoutHotkey='3'; Bedeutung='Nicht zugewiesen' } `
            -Ist $toggleState `
            -Quelle 'Direkt/PowerShell/HKCU Keyboard Layout Toggle' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0063 - Netzwerkermittlung und Datei-/Druckerfreigabe.
        $allFirewallRules = @(Get-NetFirewallRule -PolicyStore ActiveStore -ErrorAction SilentlyContinue)
        $discoveryRules = @($allFirewallRules | Where-Object { $_.DisplayGroup -match '^(Netzwerkerkennung|Network Discovery)$' })
        $sharingRules = @($allFirewallRules | Where-Object { $_.DisplayGroup -match '^(Datei- und Druckerfreigabe|File and Printer Sharing)$' })
        function Test-EnabledInboundAllowRule {
            param($Rules)
            return (@($Rules | Where-Object {
                ([string]$_.Enabled -match '^(True|1)$') -and
                ([string]$_.Direction -eq 'Inbound') -and
                ([string]$_.Action -eq 'Allow')
            }).Count -gt 0)
        }
        $discoveryOK = Test-EnabledInboundAllowRule $discoveryRules
        $sharingOK = Test-EnabledInboundAllowRule $sharingRules
        $checks['IPC0063'] = New-Check `
            -Name 'Sichtbarkeit im Netzwerk' `
            -Ok ($allFirewallRules.Count -gt 0 -and $discoveryOK -and $sharingOK) `
            -Soll @{ NetworkDiscovery='Enabled'; FileAndPrinterSharing='Enabled' } `
            -Ist @{ NetworkDiscovery=@($discoveryRules | Select-Object Name,DisplayName,Enabled,Direction,Action,Profile); FileAndPrinterSharing=@($sharingRules | Select-Object Name,DisplayName,Enabled,Direction,Action,Profile) } `
            -Quelle 'Direkt/PowerShell/Get-NetFirewallRule ActiveStore' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0070 / IPC0252 - UltraVNC Viewer direkt im Dateisystem pruefen.
        $viewerPaths = @(
            'C:\Program Files\uvnc bvba\UltraVNC\vncviewer.exe',
            'C:\Program Files\UltraVNC\vncviewer.exe',
            'C:\Program Files (x86)\uvnc bvba\UltraVNC\vncviewer.exe',
            'C:\Program Files (x86)\UltraVNC\vncviewer.exe'
        )
        $viewerExisting = @($viewerPaths | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf })
        $viewerPresent = ($viewerExisting.Count -gt 0)
        $checks['IPC0070'] = New-Check `
            -Name 'UltraVNC Viewer installieren' `
            -Ok $viewerPresent `
            -Soll @{ ViewerInstalled=$true } `
            -Ist @{ ViewerPresent=$viewerPresent; ViewerPaths=$viewerExisting } `
            -Quelle 'Direkt/PowerShell/Test-Path UltraVNC Viewer' `
            -Sollwertquelle 'Aufgabenliste'

        $vncProgId = $null
        $vncOpenCommand = $null
        try { $vncProgId = [string](Get-Item -LiteralPath 'Registry::HKEY_CLASSES_ROOT\.vnc' -ErrorAction Stop).GetValue('') } catch { }
        if (-not [string]::IsNullOrWhiteSpace($vncProgId)) {
            try { $vncOpenCommand = [string](Get-Item -LiteralPath ("Registry::HKEY_CLASSES_ROOT\{0}\shell\open\command" -f $vncProgId) -ErrorAction Stop).GetValue('') } catch { }
        }
        $associationPresent = (-not [string]::IsNullOrWhiteSpace($vncOpenCommand) -and $vncOpenCommand -match '(?i)vncviewer\.exe')
        $expectedAssociation = "{{ ipc_os_server_validation_expected.software.ultravnc_viewer.file_association_required | default(true) | bool | ternary('true','false') }}" -eq 'true'
        $checks['IPC0252'] = New-Check `
            -Name 'UltraVNC-Viewer nachinstallieren' `
            -Ok ($viewerPresent -and (-not $expectedAssociation -or $associationPresent)) `
            -Soll @{ ViewerInstalled=$true; VncFileAssociation=$expectedAssociation } `
            -Ist @{ ViewerPresent=$viewerPresent; ViewerPaths=$viewerExisting; VncProgId=$vncProgId; VncOpenCommand=$vncOpenCommand; AssociationPresent=$associationPresent } `
            -Quelle 'Direkt/PowerShell/UltraVNC Dateisystem + HKCR .vnc' `
            -Sollwertquelle 'Aufgabenliste/Semaphore'

        # IPC0083 - Bildschirmschoner fuer OS Server.
        $screenPolicyPath = 'HKCU:\Software\Policies\Microsoft\Windows\Control Panel\Desktop'
        $screenUserPath = 'HKCU:\Control Panel\Desktop'
        function Get-DesktopValue {
            param([string]$Name)
            foreach ($path in @($screenPolicyPath,$screenUserPath)) {
                if (-not (Test-Path -LiteralPath $path)) { continue }
                $item = Get-ItemProperty -LiteralPath $path -ErrorAction SilentlyContinue
                if ($item -and $item.PSObject.Properties.Name -contains $Name) { return [string]$item.$Name }
            }
            return $null
        }
        $screenActive = Get-DesktopValue 'ScreenSaveActive'
        $screenTimeout = Get-DesktopValue 'ScreenSaveTimeOut'
        $screenSecure = Get-DesktopValue 'ScreenSaverIsSecure'
        $expectedScreenEnabled = "{{ ipc_os_server_validation_expected.desktop.screen_saver.enabled | bool | ternary('true','false') }}" -eq 'true'
        $expectedScreenTimeout = {{ ipc_os_server_validation_expected.desktop.screen_saver.timeout_seconds | int }}
        $expectedScreenSecure = "{{ ipc_os_server_validation_expected.desktop.screen_saver.password_protected | bool | ternary('true','false') }}" -eq 'true'
        $screenOk = (([string]$screenActive -eq $(if($expectedScreenEnabled){'1'}else{'0'})) -and ([int]$screenTimeout -eq $expectedScreenTimeout) -and ([string]$screenSecure -eq $(if($expectedScreenSecure){'1'}else{'0'})))
        $checks['IPC0083'] = New-Check `
            -Name 'Bildschirmschoner aktivieren (SE + ES)' `
            -Ok $screenOk `
            -Soll @{ Enabled=$expectedScreenEnabled; TimeoutSeconds=$expectedScreenTimeout; PasswordProtected=$expectedScreenSecure } `
            -Ist @{ ScreenSaveActive=$screenActive; ScreenSaveTimeOut=$screenTimeout; ScreenSaverIsSecure=$screenSecure; RunAsUser=[System.Security.Principal.WindowsIdentity]::GetCurrent().Name } `
            -Quelle 'Direkt/PowerShell/HKCU Desktop ScreenSaver' `
            -Sollwertquelle 'Semaphore: ipc_os_server_validation_expected.desktop.screen_saver'

        # IPC0073 - D:\Images muss geloescht sein.
        $imagesPath = 'D:\Images'
        $imagesExists = Test-Path -LiteralPath $imagesPath
        $checks['IPC0073'] = New-Check `
            -Name 'Restore Image löschen' `
            -Ok (-not $imagesExists) `
            -Soll @{ Path=$imagesPath; Exists=$false } `
            -Ist @{ Path=$imagesPath; Exists=$imagesExists } `
            -Quelle 'Direkt/PowerShell/Test-Path' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0076 - explizit zu loeschende Verknuepfungen duerfen nicht existieren.
        $desktopDirs = @(
            [Environment]::GetFolderPath('CommonDesktopDirectory'),
            [Environment]::GetFolderPath('DesktopDirectory')
        ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique
        $forbiddenNames = @('Create Restore USB','File Explorer','Internet Explorer')
        $foundForbidden = @()
        foreach ($desktopDir in $desktopDirs) {
            if (-not (Test-Path -LiteralPath $desktopDir -PathType Container)) { continue }
            $foundForbidden += @(Get-ChildItem -LiteralPath $desktopDir -File -Force -ErrorAction SilentlyContinue | Where-Object { $forbiddenNames -contains $_.BaseName } | Select-Object Name, BaseName, FullName)
        }
        $checks['IPC0076'] = New-Check `
            -Name 'Desktop-Verknüpfungen bereinigen' `
            -Ok (@($foundForbidden).Count -eq 0) `
            -Soll @{ AbsentShortcuts=$forbiddenNames } `
            -Ist @{ CheckedDesktopDirectories=@($desktopDirs); FoundForbiddenShortcuts=@($foundForbidden) } `
            -Quelle 'Direkt/PowerShell/Desktop und CommonDesktop' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0077 - Edge-Verknuepfung: Dateizustand ist direkt lesbar, die
        # konkrete REG-Datei/Policy wird ohne bekanntes Schema nur als Evidenz ausgegeben.
        $edgeShortcuts = @()
        foreach ($desktopDir in $desktopDirs) {
            if (-not (Test-Path -LiteralPath $desktopDir -PathType Container)) { continue }
            $edgeShortcuts += @(Get-ChildItem -LiteralPath $desktopDir -File -Force -ErrorAction SilentlyContinue | Where-Object { $_.BaseName -match '(?i)Microsoft\s*Edge|^Edge$' } | Select-Object Name, BaseName, FullName)
        }
        $information['IPC0077'] = New-Information `
            -Name 'Microsoft Edge Verknüpfung löschen' `
            -Information @{ EdgeShortcuts=@($edgeShortcuts); ShortcutAbsent=(@($edgeShortcuts).Count -eq 0) } `
            -Quelle 'Direkt/PowerShell/Desktop und CommonDesktop' `
            -Hinweis 'Verknuepfungszustand wird direkt ausgegeben; der genaue Registry-Wert der verwendeten REG-Datei ist nicht vorgegeben.'

        # IPC0089 - Bootliste aus + AutoReboot an. Die 5-s-Recovery-Anzeige
        # bleibt Zusatzinformation, da kein stabiler eindeutiger Registry-Key vorgegeben ist.
        $recovery = Get-CimInstance -ClassName Win32_OSRecoveryConfiguration -ErrorAction Stop
        $bcdRaw = (& bcdedit.exe /enum '{bootmgr}' 2>&1 | Out-String).Trim()
        $bootTimeout = $null
        $timeoutMatch = [regex]::Match($bcdRaw, '(?im)^\s*(?:timeout|zeitlimit)\s+(\d+)\s*$')
        if ($timeoutMatch.Success) { $bootTimeout = [int]$timeoutMatch.Groups[1].Value }
        $displayBootMenu = $null
        $displayMatch = [regex]::Match($bcdRaw, '(?im)^\s*displaybootmenu\s+(Yes|No|Ja|Nein)\s*$')
        if ($displayMatch.Success) { $displayBootMenu = $displayMatch.Groups[1].Value }
        $bootListDisabled = ($bootTimeout -eq 0 -or $displayBootMenu -in @('No','Nein'))
        $autoReboot = [bool]$recovery.AutoReboot
        $checks['IPC0089'] = New-Check `
            -Name 'Starten und Wiederherstellen anpassen' `
            -Ok ($bootListDisabled -and $autoReboot) `
            -Soll @{ OperatingSystemListDisplayed=$false; AutoReboot=$true; RecoveryOptionsDisplaySeconds=5; RecoveryOptionsDisplaySecondsEvaluation='INFORMATION_ONLY' } `
            -Ist @{ BootManagerTimeoutSeconds=$bootTimeout; DisplayBootMenu=$displayBootMenu; OperatingSystemListDisabled=$bootListDisabled; AutoReboot=$autoReboot; BcdBootManagerRaw=$bcdRaw } `
            -Quelle 'Direkt/PowerShell/bcdedit + Win32_OSRecoveryConfiguration' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0160 / IPC0161 - tatsaechlich aktive Cipher Suites direkt lesen.
        $activeCipherNames = @()
        if (Get-Command Get-TlsCipherSuite -ErrorAction SilentlyContinue) {
            $activeCipherNames = @(Get-TlsCipherSuite -ErrorAction Stop | ForEach-Object { [string]$_.Name } | Where-Object { $_ } | Select-Object -Unique)
        }
        $requiredCiphers = @('{{ live_expected_allowed_ciphers | to_json }}' | ConvertFrom-Json)
        $disabledCiphers = @('{{ live_expected_disabled_ciphers | to_json }}' | ConvertFrom-Json)
        $missingRequired = @($requiredCiphers | Where-Object { $_ -notin $activeCipherNames })
        $stillEnabledForbidden = @($disabledCiphers | Where-Object { $_ -in $activeCipherNames })
        $checks['IPC0160'] = New-Check `
            -Name 'Verwendung von sicheren Cipher Suites' `
            -Ok ($requiredCiphers.Count -gt 0 -and $missingRequired.Count -eq 0) `
            -Soll @{ RequiredActive=$requiredCiphers } `
            -Ist @{ ActiveCipherSuites=$activeCipherNames; MissingRequired=$missingRequired } `
            -Quelle 'Direkt/PowerShell/Get-TlsCipherSuite' `
            -Sollwertquelle 'Semaphore: expected_allowed_tls12_cipher_suites'
        $checks['IPC0161'] = New-Check `
            -Name 'Unsichere/nicht freigegebene Cipher Suites deaktivieren' `
            -Ok ($disabledCiphers.Count -gt 0 -and $stillEnabledForbidden.Count -eq 0) `
            -Soll @{ RequiredDisabled=$disabledCiphers } `
            -Ist @{ ActiveCipherSuites=$activeCipherNames; StillEnabledForbidden=$stillEnabledForbidden } `
            -Quelle 'Direkt/PowerShell/Get-TlsCipherSuite' `
            -Sollwertquelle 'Semaphore: expected_disabled_cipher_suites'

        # IPC0167 - Projektordner direkt pruefen.
        $projectPath = '{{ live_expected_project_folder }}'
        $projectExists = Test-Path -LiteralPath $projectPath -PathType Container
        $checks['IPC0167'] = New-Check `
            -Name 'Projektordner anlegen' `
            -Ok $projectExists `
            -Soll @{ Path=$projectPath; Exists=$true } `
            -Ist @{ Path=$projectPath; Exists=$projectExists } `
            -Quelle 'Direkt/PowerShell/Test-Path' `
            -Sollwertquelle 'Semaphore: expected_project_folder'

        # IPC0200 - WSUSClientManager-Verzeichnis.
        $wsusClientPath = 'C:\Programme\WSUSClientManager'
        $wsusClientExists = Test-Path -LiteralPath $wsusClientPath -PathType Container
        $checks['IPC0200'] = New-Check `
            -Name 'WSUSClientManager ablegen' `
            -Ok $wsusClientExists `
            -Soll @{ Path=$wsusClientPath; Exists=$true } `
            -Ist @{ Path=$wsusClientPath; Exists=$wsusClientExists } `
            -Quelle 'Direkt/PowerShell/Test-Path' `
            -Sollwertquelle 'Aufgabenliste'

        # IPC0263-IPC0271 - BIOS/Firmware-Endzustaende; identisches Provider-Prinzip wie 0160.
        $biosFirmwareEvidence = @(Get-BiosFirmwareEvidence)
        $checks['IPC0263'] = Test-BiosFirmwareExpectation -Id 'IPC0263' -Name 'USB Boot deaktiviert lassen' -Specification $firmwareExpected.bios_checks.IPC0263 -Evidence $biosFirmwareEvidence
        $checks['IPC0264'] = Test-BiosFirmwareExpectation -Id 'IPC0264' -Name 'WLAN deaktivieren' -Specification $firmwareExpected.bios_checks.IPC0264 -Evidence $biosFirmwareEvidence
        $checks['IPC0265'] = Test-BiosFirmwareExpectation -Id 'IPC0265' -Name 'Super IO Configuration' -Specification $firmwareExpected.bios_checks.IPC0265 -Evidence $biosFirmwareEvidence
        $ipc0267 = Test-BiosFirmwareExpectation -Id 'IPC0267' -Name 'Zugang ueber Passwort schuetzen - Password Severity' -Specification $firmwareExpected.bios_checks.IPC0267 -Evidence $biosFirmwareEvidence
        $adminPasswordStatus = $null
        try { $adminPasswordStatus = (Get-CimInstance Win32_ComputerSystem -ErrorAction Stop).AdminPasswordStatus } catch { }
        $expectedAdminPasswordStatus = [int]$firmwareExpected.bios_checks.IPC0267.admin_password_status_expected
        $severityOk = if ($ipc0267.status -eq 'OK') { $true } elseif ($ipc0267.status -eq 'NOK') { $false } else { $null }
        $passwordOk = if ($null -eq $adminPasswordStatus) { $null } else { ([int]$adminPasswordStatus -eq $expectedAdminPasswordStatus) }
        $combined0267 = if ($severityOk -eq $false -or $passwordOk -eq $false) { $false } elseif ($severityOk -eq $true -and $passwordOk -eq $true) { $true } else { $null }
        $checks['IPC0267'] = New-Check -Name 'Zugang ueber Passwort schuetzen' -Ok $combined0267 -Soll @{ PasswordSeverity='Standard'; AdminPasswordStatus=$expectedAdminPasswordStatus } -Ist @{ PasswordSeverityEvidence=$ipc0267.ist; AdminPasswordStatus=$adminPasswordStatus } -Quelle 'Direkt/PowerShell/CIM BIOS Provider + Win32_ComputerSystem.AdminPasswordStatus' -Sollwertquelle 'Semaphore/Aufgabenliste'
        $checks['IPC0268'] = Test-BiosFirmwareExpectation -Id 'IPC0268' -Name 'Start bei Strom ein - Previous State' -Specification $firmwareExpected.bios_checks.IPC0268 -Evidence $biosFirmwareEvidence
        $checks['IPC0269'] = Test-BiosFirmwareExpectation -Id 'IPC0269' -Name 'Aufwecken ueber Netzwerk deaktivieren' -Specification $firmwareExpected.bios_checks.IPC0269 -Evidence $biosFirmwareEvidence
        $checks['IPC0270'] = Test-BiosFirmwareExpectation -Id 'IPC0270' -Name 'Num Lock ON bei Start' -Specification $firmwareExpected.bios_checks.IPC0270 -Evidence $biosFirmwareEvidence
        $checks['IPC0271'] = Test-BiosFirmwareExpectation -Id 'IPC0271' -Name 'Festplatte als erstes Start-Medium' -Specification $firmwareExpected.bios_checks.IPC0271 -Evidence $biosFirmwareEvidence

        [pscustomobject][ordered]@{
            checks = [pscustomobject]$checks
            informationen = [pscustomobject]$information
        } | ConvertTo-Json -Depth 20 -Compress
      register: ipc_0170_live_checks
      changed_when: false
      failed_when: false
      when: ipc_0170_live_ping.ping | default('') == 'pong'

    - name: Direkte 0170-Pruefergebnisse lokal speichern
      ansible.builtin.copy:
        content: "{{ ipc_0170_live_checks.stdout | trim }}"

        dest: "{{ result_dir }}/.0170_live/{{ ansible_host | default(inventory_hostname) }}.json"
      delegate_to: localhost
      become: false
      when:
        - ipc_0170_live_ping.ping | default('') == 'pong'
        - ipc_0170_live_checks is defined
        - ipc_0170_live_checks.rc | default(1) == 0
        - ipc_0170_live_checks.stdout | default('') | trim | length > 0

- name: "0170 IPC OS Server - Live-Ergebnisse in JSON und CSV zusammenfuehren"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    ipc_os_server_validation_output_file: >-
      {{
        ipc_os_server_id_validation_file
        | default(result_dir ~ '/ipc_os_server_id_validation_latest.json')
      }}
    ipc_os_server_validation_csv_file: >-
      {{
        ipc_os_server_id_validation_csv_file
        | default(result_dir ~ '/ipc_os_server_id_validation_matrix_latest.csv')
      }}

  tasks:
    - name: Direkte Ergebnisse atomar in 0170-Protokolle uebernehmen
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ playbook_dir }}/../Python/0170IPC_OS_Server_ID_Validation.py"
          - merge
          - --output
          - "{{ ipc_os_server_validation_output_file }}"
          - --csv
          - "{{ ipc_os_server_validation_csv_file }}"
          - --live-dir
          - "{{ result_dir }}/.0170_live"
      register: ipc_0170_merge
      changed_when: true

    - name: Finale 0170-Ergebnisse einlesen
      ansible.builtin.slurp:
        src: "{{ ipc_os_server_validation_output_file }}"
      register: ipc_0170_final_raw

    - name: Finale 0170-Zusammenfassung anzeigen
      ansible.builtin.debug:
        msg:
          - "Nur IPC OS Server wurde ausgewertet; ES und OS Client wurden ignoriert."
          - "JSON: {{ ipc_os_server_validation_output_file }}"
          - "CSV: {{ ipc_os_server_validation_csv_file }}"
          - >-
            Zusammenfassung:
            {{ (ipc_0170_final_raw.content | b64decode | from_json).summary }}