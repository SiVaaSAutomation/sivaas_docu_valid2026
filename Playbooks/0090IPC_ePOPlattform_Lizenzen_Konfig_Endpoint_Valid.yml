            ("ID0234_SC_CLI_Passwort", "ID0234_SC_CLI_Passwort_vergeben"),
            ("ID0237_Abfragen_importiert", "ID0237_Abfragen_importiert"),
            ("ID0238_Berichte_importiert", "ID0238_Berichte_importiert"),
            ("ID0241_Systemstruktur", "ID0241_Systemstruktur_und_Agents"),
            ("ID0245_ENS_Platform_Paket", "ID0245_ENS_Platform_Paket"),
            ("ID0247_ENS_Threat_Prevention_Paket", "ID0247_ENS_Threat_Prevention_Paket"),
            ("ID0248_AMCore_Content_Paket", "ID0248_AMCore_Content_Paket"),
            ("ID0249_Exploit_Prevention_Content", "ID0249_Exploit_Prevention_Content"),
            ("ID0251_ENS_Common_Extension", "ID0251_ENS_Common_Extension"),
            ("ID0253_ENS_Threat_Prevention_Extension", "ID0253_ENS_Threat_Prevention_Extension"),
            ("ID0255_Tag_Katalog", "ID0255_Tag_Katalog_importiert"),
            ("ID0258_Trellix_Agent_Richtlinien", "ID0258_Trellix_Agent_Richtlinien_importiert"),
            ("ID0259_ENS_Common_Richtlinien", "ID0259_ENS_Common_Richtlinien_importiert"),
            ("ID0260_ENS_TP_Richtlinien", "ID0260_ENS_TP_Richtlinien_importiert"),
            ("ID0261_Solidcore_Richtlinien", "ID0261_Solidcore_Richtlinien_importiert"),
            ("ID0263_Richtlinienzuweisungsregeln", "ID0263_Richtlinienzuweisungsregeln_importiert"),
            ("ID0265_Richtlinienzuweisungen", "ID0265_Richtlinienzuweisungen_importiert"),
            ("ID0266_ENS_CLI_Passwort", "ID0266_ENS_CLI_Passwort_vergeben"),
            ("ID0267_ENS_Abfragen", "ID0267_ENS_Abfragen_importiert"),
            ("ID0269_Solidcore_Regeln", "ID0269_Solidcore_Regeln_importiert"),
            ("ID0271_Dashboards", "ID0271_Dashboards_importiert"),
            ("ID0273_ServerTasks", "ID0273_ServerTasks_importiert"),
            ("ID0274_AV_Download_Task", "ID0274_AV_Download_Task_angepasst"),
            ("ID0275_ClientTask_Katalog", "ID0275_ClientTask_Katalog_importiert"),
            ("ID0278_ENS_installiert", "ID0278_ENS_auf_Zielsystem_installiert"),
            ("ID0279_Sicherheit_aktualisiert", "ID0279_ENS_Sicherheit_aktualisiert"),
            ("ID0280_ENS_Version", "ID0280_ENS_Version"),
        ]

        base_fields = [
            "Zeitstempel_Pruefung",
            "Zeitstempel_Zielsystem",
            "IP",
            "Ansible_erreichbar",
            "Computername",
            "FQDN",
            "Domaene_Workgroup",
            "Domaenenmitglied",
            "Betriebssystem",
            "OS_Version",
            "WinRM_Port",
            "WinRM_Schema",
            "WinRM_Offene_Ports",
            "Rolle_ePO_Server",
            "Rolle_ENS_Endpoint",
            "Fehler",
        ]

        fieldnames = list(base_fields)
        for _, column_name in check_columns:
            fieldnames.append(column_name)
            fieldnames.append(column_name + "_Details")

        def check_status(checks, key):
            if not checks:
                return ""
            value = checks.get(key)
            if not isinstance(value, dict):
                return "NICHT_PRUEFBAR"
            return value.get("status", "")

        def check_details(checks, key):
            if not checks:
                return ""
            value = checks.get(key)
            if not isinstance(value, dict):
                return ""
            details = value.get("details", "")
            evidence = value.get("evidence")
            if evidence not in (None, ""):
                try:
                    evidence_text = json.dumps(
                        evidence,
                        ensure_ascii=False,
                        sort_keys=True,
                    )
                except TypeError:
                    evidence_text = str(evidence)
                return f"{details} | Evidence={evidence_text}"
            return details

        rows = []
        for item in data:
            roles = item.get("roles") or {}
            row = {
                "Zeitstempel_Pruefung": item.get("scan_timestamp", ""),
                "Zeitstempel_Zielsystem": item.get("target_timestamp", ""),
                "IP": item.get("ip", ""),
                "Ansible_erreichbar": item.get("ansible_reachable", False),
                "Computername": item.get("computername", ""),
                "FQDN": item.get("fqdn", ""),
                "Domaene_Workgroup": item.get("domain") or item.get("workgroup") or "",
                "Domaenenmitglied": item.get("part_of_domain", ""),
                "Betriebssystem": item.get("os_caption", ""),
                "OS_Version": item.get("os_version", ""),
                "WinRM_Port": item.get("winrm_port", ""),
                "WinRM_Schema": item.get("winrm_scheme", ""),
                "WinRM_Offene_Ports": item.get("winrm_open_ports", ""),
                "Rolle_ePO_Server": roles.get("epo_server", False),
                "Rolle_ENS_Endpoint": roles.get("ens_endpoint", False),
                "Fehler": item.get("error", ""),
            }
            checks = item.get("checks") or {}
            for key, column_name in check_columns:
                row[column_name] = check_status(checks, key)
                row[column_name + "_Details"] = check_details(checks, key)
            rows.append(row)

        with csv_path.open("w", encoding="utf-8-sig", newline="") as file_handle:
            writer = csv.DictWriter(
                file_handle,
                fieldnames=fieldnames,
                delimiter=";",
            )
            writer.writeheader()
            writer.writerows(rows)
        PY
      args:
        executable: /bin/bash
      changed_when: true

