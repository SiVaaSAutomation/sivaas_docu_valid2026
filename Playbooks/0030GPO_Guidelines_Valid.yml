---
- name: OS-Server V10.0 Teilnehmer im Zielnetz erkennen
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  # vars:
  #   # In Semaphore als Environment/Extra Variables ueberschreiben.
  #   # Mehrere Netze sind moeglich, z. B.: "192.168.123.0/24 192.168.124.0/24"
  #   target_network: "192.168.123.0/24"

  #   winrm_port: 5985
  #   winrm_transport: ntlm
  #   result_dir: "./reports"

  tasks:
    - name: Pruefen, ob benoetigte Semaphore-Variablen uebergeben wurden
      ansible.builtin.assert:
        that:
          - target_network is defined
          - nmap_binary is defined
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - result_dir is defined
          - target_network | string | length > 0
          - nmap_binary | string | length > 0
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - result_dir | string | length > 0
        fail_msg: >-
          Es fehlen benoetigte Semaphore-Variablen:
          target_network, nmap_binary, win_user, win_password,
          winrm_transport und result_dir.

    - name: Zeitstempel fuer Report setzen
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        report_timestamp_iso: "{{ lookup('pipe', 'date -Iseconds') }}"

    - name: Pruefen, ob nmap auf dem Ansible-Controller vorhanden ist
      ansible.builtin.command: "{{ nmap_binary }} --version"
      register: nmap_check
      changed_when: false
      failed_when: false

    - name: Abbrechen, wenn nmap fehlt
      ansible.builtin.fail:
        msg: "nmap ist auf dem Ansible-Controller nicht installiert. Installation z. B.: sudo apt install nmap"
      when: nmap_check.rc != 0

    - name: Pruefen, ob Windows-Zugangsdaten uebergeben wurden
      ansible.builtin.assert:
        that:
          - win_user is defined
          - win_password is defined
        fail_msg: >-
          Fuer die OS-Server-V10.0-Pruefung muessen win_user und win_password uebergeben werden,
          z. B. ueber Semaphore Environment/Extra Variables oder Ansible Vault.

    - name: Netzwerk nach offenen WinRM-Ports 5985 und 5986 scannen
      ansible.builtin.shell: |
        set -o pipefail
        {{ nmap_binary }} -n -Pn -p 5985,5986 --open {{ target_network }} -oG - |
        awk '
          /Ports:/ {
            host=$2
            has_http = ($0 ~ /5985\/open\/tcp/)
            has_https = ($0 ~ /5986\/open\/tcp/)

            if (has_https) {
              ports = has_http ? "5985,5986" : "5986"
              print host ";5986;https;" ports
            } else if (has_http) {
              print host ";5985;http;5985"
            }
          }
        '
      args:
        executable: /bin/bash
      register: scan_result
      changed_when: false

    - name: Gefundene IP-Adressen und WinRM-Infos speichern
      ansible.builtin.set_fact:
        discovered_winrm_hosts: "{{ scan_result.stdout_lines | unique | list }}"
        discovered_ips: "{{ scan_result.stdout_lines | map('regex_replace', ';.*$', '') | unique | list }}"

    - name: Gefundene WinRM-Teilnehmer anzeigen
      ansible.builtin.debug:
        var: discovered_winrm_hosts

    - name: Gefundene IP-Adressen anzeigen
      ansible.builtin.debug:
        var: discovered_ips

    - name: Hinweis ausgeben, wenn keine WinRM-Teilnehmer gefunden wurden
      ansible.builtin.debug:
        msg: >-
          Es wurden keine Hosts mit offenem WinRM-Port 5985/5986 im Zielnetz {{ target_network }} gefunden.
          Der Report enthaelt dann nur die Kopfzeile. Pruefe target_network, Firewall und WinRM.
      when: discovered_winrm_hosts | length == 0

    - name: Gefundene WinRM-Hosts temporaer in das Inventory aufnehmen
      ansible.builtin.add_host:
        name: "{{ item.split(';')[0] }}"
        groups: os_server_check_targets
        ansible_host: "{{ item.split(';')[0] }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.split(';')[1] | int }}"
        ansible_winrm_scheme: "{{ item.split(';')[2] }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(120) }}"
        discovered_winrm_open_ports: "{{ item.split(';')[3] }}"
      loop: "{{ discovered_winrm_hosts }}"
      no_log: true

    - name: Dynamische PCS7-Zielgruppe anzeigen
      ansible.builtin.debug:
        msg: "{{ groups['os_server_check_targets'] | default([]) }}"

- name: OS-Server V10.0 Einstellungen auf Windows-Zielen pruefen
  hosts: os_server_check_targets
  gather_facts: false
  ignore_unreachable: true

  vars:
    remote_validation_dir: "{{ os_server_validation_remote_dir }}"
    remote_validation_script: "{{ os_server_validation_remote_dir }}\\os_server_v10_validation.ps1"
    remote_validation_json: "{{ os_server_validation_remote_dir }}\\os_server_v10_validation.json"

    required_os_server_v10_vars:
      - os_server_validation_remote_dir
      - expected_timezone_id
      - expected_present_adapters
      - expected_absent_adapters
      - allowed_enabled_adapter_names
      - expected_password_complexity
      - expected_min_password_length
      - expected_max_password_age_days
      - expected_min_password_age_days
      - expected_eventlog_max_kb
      - expected_screen_width
      - expected_screen_height
      - expected_power_plan_regex
      - hosts_lmhosts_required
      - expected_hosts_lmhosts_entries
      - expected_hosts_lmhosts_min_date_109
      - expected_hosts_lmhosts_min_date_112
      - expected_vnc_ini_paths
      - expected_bginfo_paths
      - expected_bginfo_run_contains
      - expected_pcs7_user
      - expected_pcs7_groups
      - expected_project_folder
      - expected_project_share
      - ntp_wizard_required
      - expected_ntp_wizard_paths
      - expected_wsus_server
      - expected_wsus_target_group
      - expected_wsus_au_options
      - expected_hotfix_ids
      - expected_edge_version
      - perform_windows_update_search
      - windows_update_search_timeout_seconds
      - expected_admin_password_min_set_date
      - expected_admin_password_max_age_days
      - expected_lifebeat_dcom_accounts

  tasks:
    - name: Pruefen, ob alle OS-Server-V10-Sollwertvariablen aus Semaphore vorhanden sind
      ansible.builtin.assert:
        that:
          - required_os_server_v10_vars | difference(vars.keys() | list) | length == 0
        fail_msg: >-
          Es fehlen folgende Semaphore-Variablen:
          {{ required_os_server_v10_vars | difference(vars.keys() | list) | join(', ') }}

    - name: WinRM-Verbindung testen
      ansible.windows.win_ping:
      register: win_ping_result
      changed_when: false
      failed_when: false
      ignore_errors: true
      ignore_unreachable: true

    - name: OS-Server-V10.0-Pruefung als temporaeres PowerShell-Skript ausfuehren
      block:
        - name: Temp-Ordner fuer OS-Server-Pruefung auf Zielsystem erstellen
          ansible.windows.win_file:
            path: "{{ remote_validation_dir }}"
            state: directory

        - name: OS-Server-V10.0-Pruefskript auf Zielsystem kopieren
          ansible.windows.win_copy:
            dest: "{{ remote_validation_script }}"
            content: "{{ lookup('template', (playbook_dir | dirname) ~ '/PowershellBatch/os_server_v10_validation.ps1') }}"
            force: true
          register: os_server_script_copy
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: Pruefen, ob PowerShell-Pruefskript auf Zielsystem vorhanden ist
          ansible.windows.win_stat:
            path: "{{ remote_validation_script }}"
          register: os_server_script_file
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: Diagnose nach Kopieren des PowerShell-Pruefskripts anzeigen
          ansible.builtin.debug:
            msg:
              - "Host: {{ inventory_hostname }}"
              - "Remote-Skriptpfad: {{ remote_validation_script }}"
              - "Kopier-Task failed: {{ os_server_script_copy.failed | default(false) }}"
              - "Kopier-Task msg: {{ os_server_script_copy.msg | default('') }}"
              - "Skriptdatei vorhanden: {{ os_server_script_file.stat.exists | default(false) }}"
              - "Skriptdatei Groesse: {{ os_server_script_file.stat.size | default('') }}"

        - name: OS-Server-V10.0-Pruefskript auf Zielsystem ausfuehren
          ansible.windows.win_shell: |
            $ScriptPath = {{ remote_validation_script | to_json }}

            if (-not (Test-Path -LiteralPath $ScriptPath)) {
                Write-Error "Pruefskript nicht gefunden: $ScriptPath"
                exit 10
            }

            powershell.exe -NoProfile -ExecutionPolicy Bypass -File $ScriptPath
            exit $LASTEXITCODE
          register: os_server_raw
          when:
            - os_server_script_file is defined
            - os_server_script_file.stat.exists | default(false)
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: Pruefen, ob Ergebnis-JSON auf Zielsystem erzeugt wurde
          ansible.windows.win_stat:
            path: "{{ remote_validation_json }}"
          register: os_server_json_file
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: Ergebnis-JSON vom Zielsystem zum Ansible-Controller zurueckholen
          ansible.builtin.slurp:
            src: "{{ remote_validation_json }}"
          register: os_server_json_slurp
          when:
            - os_server_json_file is defined
            - os_server_json_file.stat.exists | default(false)
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

        - name: OS-Server-Pruefergebnis-JSON dekodieren
          ansible.builtin.set_fact:
            os_server_json_text: >-
              {{
                os_server_json_slurp.content
                | b64decode
                | regex_replace('^\ufeff', '')
                | trim
              }}
          when:
            - os_server_json_slurp is defined
            - os_server_json_slurp.content is defined
            - os_server_json_slurp.content | length > 0

        - name: OS-Server-Pruefergebnis als Host-Fact speichern
          ansible.builtin.set_fact:
            os_server_validation: "{{ os_server_json_text | from_json }}"
          when:
            - os_server_json_text is defined
            - os_server_json_text | length > 0
          failed_when: false
          ignore_errors: true

      always:
        - name: Temp-Ordner und PowerShell-Pruefskript auf Zielsystem entfernen
          ansible.windows.win_file:
            path: "{{ remote_validation_dir }}"
            state: absent
          changed_when: false
          failed_when: false
          ignore_errors: true
          ignore_unreachable: true

      when:
        - win_ping_result is defined
        - win_ping_result.ping | default('') == 'pong'

    - name: Diagnose anzeigen, wenn kein OS-Server-JSON gespeichert wurde
      ansible.builtin.debug:
        msg:
          - "Host: {{ inventory_hostname }}"
          - "WinRM-Ping: {{ win_ping_result.ping | default('KEIN_PONG') }}"
          - "WinRM-Unreachable: {{ win_ping_result.unreachable | default(false) }}"
          - "WinRM-Message: {{ win_ping_result.msg | default('') }}"
          - "PowerShell-RC: {{ os_server_raw.rc | default('NICHT_AUSGEFUEHRT') }}"
          - "PowerShell-STDERR: {{ os_server_raw.stderr | default('') }}"
          - "PowerShell-STDOUT-Anfang: {{ (os_server_raw.stdout | default(''))[:3000] }}"
          - "Ergebnisdatei vorhanden: {{ os_server_json_file.stat.exists | default(false) }}"
      when:
        - os_server_validation is not defined


- name: OS-Server V10.0 CSV-Report lokal auf dem Ansible-Controller erzeugen
  hosts: localhost
  gather_facts: false
  # vars:
  #   result_dir: "./reports"
  tasks:
    - name: Zeitstempel fuer Report sicherstellen
      ansible.builtin.set_fact:
        report_timestamp: "{{ hostvars['localhost']['report_timestamp'] | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"
        report_timestamp_iso: "{{ hostvars['localhost']['report_timestamp_iso'] | default(lookup('pipe', 'date -Iseconds')) }}"

    - name: Report-Verzeichnis erzeugen
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0755"

    - name: JSON-Report erzeugen
      ansible.builtin.copy:
        dest: "{{ result_dir }}/os_server_v10_validation_{{ report_timestamp }}.json"
        mode: "0644"
        content: |
          [
          {% for h in groups['os_server_check_targets'] | default([]) %}
          {% set hv = hostvars[h] if h in hostvars else {} %}
          {% set fallback = {
            'scan_timestamp': report_timestamp_iso,
            'target_timestamp': '',
            'ip': h,
            'ansible_reachable': false,
            'computername': '',
            'fqdn': '',
            'domain': '',
            'workgroup': '',
            'part_of_domain': '',
            'os_caption': '',
            'os_version': '',
            'winrm_port': hv.ansible_port | default(''),
            'winrm_scheme': hv.ansible_winrm_scheme | default(''),
            'winrm_open_ports': hv.discovered_winrm_open_ports | default(''),
            'checks': {},
            'error': hv.win_ping_result.msg | default('Host nicht per WinRM erreichbar oder Zugriff verweigert')
          } %}
          {% if h in hostvars and hostvars[h].os_server_validation is defined %}
          {{ (hostvars[h].os_server_validation | combine({'scan_timestamp': report_timestamp_iso})) | to_nice_json }}{% if not loop.last %},{% endif %}
          {% else %}
          {{ fallback | to_nice_json }}{% if not loop.last %},{% endif %}
          {% endif %}
          {% endfor %}
          ]

    - name: CSV-Report aus JSON erzeugen
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import csv
        import json
        from pathlib import Path

        result_dir = Path("{{ result_dir }}")
        json_path = result_dir / "os_server_v10_validation_{{ report_timestamp }}.json"
        csv_path = result_dir / "os_server_v10_validation_{{ report_timestamp }}.csv"

        data = json.loads(json_path.read_text(encoding="utf-8"))

        check_columns = [
            ("ID21_Kennwortrichtlinie", "ID21_Kennwortrichtlinie_anpassen"),
            ("ID23_Admin_Konto", "ID23_Administrator_Konto"),
            ("ID30_Shutdown_Eventlog", "ID30_Ereignisprotokollierung_Herunterfahren"),
            ("ID31_Windows_Zeitgeber", "ID31_Windows_Zeitgeber"),
            ("ID32_Eventlog_Groesse", "ID32_Maximale_Ereignisprotokollgroesse"),
            ("ID33_Lifebeat_DCOM", "ID33_Lifebeat_Monitoring"),
            ("ID35_Zeitzone", "ID35_Zeitzone"),
            ("ID36_Starten_Wiederherstellen", "ID36_Starten_und_Wiederherstellen"),
            ("ID37_Netzwerkidentifikation", "ID37_Netzwerkidentifikation"),
            ("ID38_Terminalbus_SimaticShell", "ID38_Terminalbus_SimaticShell"),
            ("ID40_Redundanzbus_SimaticShell", "ID40_Redundanzbus_SimaticShell"),
            ("ID43_Ueberfluessige_NICs", "ID43_Ueberfluessige_Netzwerkkarten"),
            ("ID44_Anlagenbus_entfernen", "ID44_Anlagenbus_entfernen"),
            ("ID45_Ueberfluessige_NICs_Anlagenbus", "ID45_Ueberfluessige_Netzwerkkarten"),
            ("ID47_HOSTS_LMHOSTS", "ID47_HOSTS_LMHOSTS"),
            ("ID48_Bildschirmaufloesung", "ID48_Bildschirmaufloesung"),
            ("ID49_CTRL_ALT_DEL", "ID49_STRG_ALT_ENTF_deaktivieren"),
            ("ID50_IE_Zertifikatpruefung", "ID50_IE_Zertifikatpruefung"),
            ("ID51_IE_Sicherheitszone", "ID51_Internetoptionen_Sicherheitszone"),
            ("ID55_UltraVNC_Firewall", "ID55_UltraVNC_Server_Programmregel"),
            ("ID56_VNC_Server_Config", "ID56_VNC_Server_konfigurieren"),
            ("ID57_VNC_Verbindungstest", "ID57_VNC_Verbindungstest"),
            ("ID67_BGInfo", "ID67_BGInfo"),
            ("ID74_PCS7_Benutzer", "ID74_PCS7_Benutzergruppen"),
            ("ID75_Projektordner_Freigabe", "ID75_Projektordner_Freigabe_NTFS"),
            ("ID76_NTP_Wizard", "ID76_NTP_Wizard"),
            ("ID79_SMB_Signierung", "ID79_SMB_Signierung"),
            ("ID81_SMBv3_Verschluesselung", "ID81_SMBv3_Verschluesselung"),
            ("ID86_ALM_Lizenzserver", "ID86_ALM_Lizenzserver"),
            ("ID87_Energieoptionen", "ID87_Energieoptionen_Hoechstleistung"),
            ("ID88_Security_Controller", "ID88_Security_Controller"),
            ("ID89_VNC5800", "ID89_VNC5800"),
            ("ID89_VNC5900", "ID89_VNC5900"),
            ("ID91_AutoRun_AutoPlay", "ID91_AutoRun_AutoPlay"),
            ("ID93_WSUS", "ID93_WSUS_Server"),
            ("ID95_KB5053603", "ID95_KB5053603"),
            ("ID96_KB5050187", "ID96_KB5050187"),
            ("ID97_KB5065432", "ID97_KB5065432"),
            ("ID98_KB5065962", "ID98_KB5065962"),
            ("ID99_Edge_Update", "ID99_Microsoft_Edge_Update"),
            ("ID100_RSOP_PolicyDefinitions", "ID100_RSOP_PolicyDefinitions"),
            ("ID101_Firewall_aktiv", "ID101_Firewall_aktivieren"),
            ("ID104_Bildschirmeinstellungen", "ID104_Bildschirmeinstellungen"),
            ("ID105_Autologon", "ID105_Autologon"),
            ("ID107_Fehlerberichte", "ID107_OS_Server_Fehlerberichte"),
            ("ID109_HOSTS_LMHOSTS", "ID109_HOSTS_LMHOSTS"),
            ("ID111_Windows_Updates", "ID111_Kontrolle_Windows_Updates"),
            ("ID112_HOSTS_LMHOSTS", "ID112_HOSTS_LMHOSTS"),
            ("ID114_SIMATIC_Logon", "ID114_SIMATIC_Logon"),
        ]

        base_fields = [
            "Zeitstempel_Pruefung",
            "Zeitstempel_Zielsystem",
            "IP",
            "Ansible_erreichbar",
            "Computername",
            "FQDN",
            "Domaene_Workgroup",
            "Domaenenmitglied",
            "Betriebssystem",
            "OS_Version",
            "WinRM_Port",
            "WinRM_Schema",
            "WinRM_Offene_Ports",
            "Fehler",
        ]

        fieldnames = list(base_fields)
        for _, column_name in check_columns:
            fieldnames.append(column_name)
            fieldnames.append(column_name + "_Details")

        def check_status(checks, key):
            if not checks:
                return ""
            value = checks.get(key)
            if not isinstance(value, dict):
                return "NICHT_PRUEFBAR"
            return value.get("status", "")

        def check_details(checks, key):
            if not checks:
                return ""
            value = checks.get(key)
            if not isinstance(value, dict):
                return ""
            details = value.get("details", "")
            evidence = value.get("evidence")
            if evidence not in (None, ""):
                try:
                    evidence_text = json.dumps(evidence, ensure_ascii=False, sort_keys=True)
                except TypeError:
                    evidence_text = str(evidence)
                return f"{details} | Evidence={evidence_text}"
            return details

        rows = []
        for item in data:
            reachable = bool(item.get("ansible_reachable"))
            row = {
                "Zeitstempel_Pruefung": item.get("scan_timestamp", ""),
                "Zeitstempel_Zielsystem": item.get("target_timestamp", ""),
                "IP": item.get("ip", ""),
                "Ansible_erreichbar": item.get("ansible_reachable", False),
                "Computername": item.get("computername", ""),
                "FQDN": item.get("fqdn", ""),
                "Domaene_Workgroup": item.get("domain") or item.get("workgroup") or "",
                "Domaenenmitglied": item.get("part_of_domain", ""),
                "Betriebssystem": item.get("os_caption", ""),
                "OS_Version": item.get("os_version", ""),
                "WinRM_Port": item.get("winrm_port", ""),
                "WinRM_Schema": item.get("winrm_scheme", ""),
                "WinRM_Offene_Ports": item.get("winrm_open_ports", ""),
                "Fehler": item.get("error", ""),
            }
            checks = item.get("checks") or {}
            for key, column_name in check_columns:
                row[column_name] = check_status(checks, key)
                row[column_name + "_Details"] = check_details(checks, key)
            rows.append(row)

        with csv_path.open("w", encoding="utf-8-sig", newline="") as fh:
            writer = csv.DictWriter(fh, fieldnames=fieldnames, delimiter=";")
            writer.writeheader()
            writer.writerows(rows)
        PY
      args:
        executable: /bin/bash
      changed_when: true

    - name: Pfade der erzeugten Reports anzeigen
      ansible.builtin.debug:
        msg:
          - "JSON: {{ result_dir }}/os_server_v10_validation_{{ report_timestamp }}.json"
          - "CSV:  {{ result_dir }}/os_server_v10_validation_{{ report_timestamp }}.csv"
