---
# Statuswerte: OK, NOK, Indirekt, Nicht_Pruefbar.

- name: "OS_Client-Zielrechner bestimmen und dynamisch in das Inventory aufnehmen"
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    station_type: "OS_Client"
    station_group: "ipc_os_client_validation_targets"
    masterlist_column: "Z"
    report_prefix: "ipc_os_client_installation_z73"

    discovery_latest_file: "{{ ipc_discovery_file | default(result_dir ~ '/ipc_discovery_groups_latest.json') }}"
    expected_computername: "{{ ipc_os_client_computername | default('OSC02') }}"
    expected_computername_by_ip: "{{ ipc_os_client_computername_by_ip | default({}) }}"
    expected_os_pattern: "Windows 10"

    expected_terminalbus_prefix: "{{ ipc_terminalbus_prefix | default('192.168.210') }}"
    expected_prefix_length: "{{ ipc_terminalbus_prefix_length | default(24) }}"
    expected_gateway: "{{ ipc_terminalbus_gateway | default('192.168.210.251') }}"
    expected_adapter_pattern: "{{ ipc_terminalbus_adapter_pattern | default('(?i)(Terminalbus|TerminalBus-IF1-X01|LAN Adapter #01)') }}"
    expected_bios_pattern: "{{ ipc_expected_bios_pattern | default('SW480_480M22') }}"
    expected_bios_release_date: "{{ ipc_expected_bios_release_date | default('2022-10-12') }}"
    expected_ultravnc_version: "{{ ipc_expected_ultravnc_version | default('1.4.3.6') }}"
    expected_admin_name: "{{ ipc_expected_admin_name | default('Admin_L') }}"
    expected_locale: "{{ ipc_expected_locale | default('de-DE') }}"
    expected_geo_id: "{{ ipc_expected_geo_id | default(94) }}"
    expected_time_zone: "{{ ipc_expected_time_zone | default('W. Europe Standard Time') }}"

    # Optional für die direkte Prüfung von IPC0042.
    # Ohne diese Variablen wird der Terminalbusadapter geprüft und IPC0042 als Indirekt protokolliert.
    comm_registry_path: "{{ ipc_comm_registry_path | default('') }}"
    comm_remote_value_name: "{{ ipc_comm_remote_value_name | default('') }}"
    comm_psk_value_name: "{{ ipc_comm_psk_value_name | default('') }}"
    comm_adapter_value_name: "{{ ipc_comm_adapter_value_name | default('') }}"


  tasks:
    - name: Zeitstempel für Report setzen
      ansible.builtin.set_fact:
        report_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        report_timestamp_iso: "{{ lookup('pipe', 'date -Iseconds') }}"

    - name: Benötigte Semaphore-Variablen prüfen
      ansible.builtin.assert:
        that:
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - nmap_binary is defined
          - result_dir is defined
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - nmap_binary | string | length > 0
          - result_dir | string | length > 0
        fail_msg: >-
          Erforderlich sind win_user, win_password, winrm_transport,
          nmap_binary und result_dir.

    - name: Discovery-Gruppendatei prüfen
      ansible.builtin.stat:
        path: "{{ discovery_latest_file }}"
      register: discovery_file_stat

    - name: Abbrechen, wenn die Discovery-Gruppendatei fehlt
      ansible.builtin.assert:
        that:
          - discovery_file_stat.stat.exists | default(false)
          - discovery_file_stat.stat.isreg | default(false)
        fail_msg: >-
          Die Datei {{ discovery_latest_file }} wurde nicht gefunden.
          Zuerst 0000IPC_Discovery_Classification.yml ausführen oder
          ipc_discovery_file auf die richtige Datei setzen.

    - name: Discovery-Gruppendatei einlesen
      ansible.builtin.slurp:
        src: "{{ discovery_latest_file }}"
      register: discovery_file_raw

    - name: Discovery-Daten aus JSON übernehmen
      ansible.builtin.set_fact:
        ipc_discovery_data: "{{ discovery_file_raw.content | b64decode | from_json }}"

    - name: Struktur der Discovery-Datei prüfen
      ansible.builtin.assert:
        that:
          - ipc_discovery_data is mapping
          - ipc_discovery_data.groups is defined
          - ipc_discovery_data.groups is mapping
          - ipc_discovery_data.groups.ipc_os_client is defined
          - ipc_discovery_data.groups.ipc_os_client is sequence
        fail_msg: >-
          {{ discovery_latest_file }} enthält keine gültige Gruppe
          groups.ipc_os_client. Bitte 0000IPC_Discovery_Classification.yml
          erneut ausführen.

    - name: OS-Clients aus der Discovery-Gruppe übernehmen
      ansible.builtin.set_fact:
        ipc_os_client_discovery_hosts: >-
          {{
            ipc_discovery_data.groups.ipc_os_client
            | selectattr('ip', 'defined')
            | selectattr('ip', 'string')
            | list
          }}

    - name: Geladene OS-Client-Zielmenge anzeigen
      ansible.builtin.debug:
        msg:
          - "Discovery-Datei: {{ discovery_latest_file }}"
          - "Discovery-Zeit: {{ ipc_discovery_data.generated_at | default('') }}"
          - "Stationstyp: {{ station_type }}"
          - "OS-Client-IP-Adressen: {{ ipc_os_client_discovery_hosts | map(attribute='ip') | list }}"
          - "Anzahl OS-Client-Zielrechner: {{ ipc_os_client_discovery_hosts | length }}"

    - name: Hinweis ausgeben, wenn kein OS-Client klassifiziert wurde
      ansible.builtin.debug:
        msg: >-
          In groups.ipc_os_client sind keine IP-Adressen enthalten. Die Prüfung
          enthält deshalb keine Zielrechner; JSON und CSV werden ohne
          Ergebniszeilen erzeugt.
      when: ipc_os_client_discovery_hosts | length == 0

 





- name: "OS_Client-Validierungsprotokoll auf dem Ansible-Controller erzeugen"
  hosts: localhost
  gather_facts: false

  vars:
    station_type: "OS_Client"
    station_group: "ipc_os_client_validation_targets"
    masterlist_column: "Z"
    report_prefix: "ipc_os_client_installation_z73"
 
  tasks:
    - name: Report-Zeitstempel sicherstellen
      ansible.builtin.set_fact:
        report_timestamp: "{{ hostvars['localhost'].report_timestamp | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"
        report_timestamp_iso: "{{ hostvars['localhost'].report_timestamp_iso | default(lookup('pipe', 'date -Iseconds')) }}"

    - name: Report-Verzeichnis erzeugen
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0755"

    - name: JSON-Protokoll mit allen Masterlistenzeilen erzeugen
      ansible.builtin.copy:
        dest: "{{ result_dir }}/{{ report_prefix }}_{{ report_timestamp }}.json"
        mode: "0644"
        content: |
          [
          {% for h in groups[station_group] | default([]) %}
          {% if hostvars[h].ipc_validation_info is defined %}
          {{
            (
              hostvars[h].ipc_validation_info
              | combine({
                  'scan_timestamp': report_timestamp_iso,
                  'discovery_group': hostvars[h].validation_discovery_group | default('ipc_os_client'),
                  'discovery_file': hostvars[h].validation_discovery_file | default(''),
                  'discovery_generated_at': hostvars[h].validation_discovery_generated_at | default(''),
                  'nmap_reachable': hostvars[h].validation_nmap_reachable | default(false) | bool,
                  'nmap_winrm_port': hostvars[h].validation_nmap_winrm_port | default(''),
                  'nmap_winrm_scheme': hostvars[h].validation_nmap_winrm_scheme | default(''),
                  'nmap_open_ports': hostvars[h].validation_nmap_open_ports | default('')
                })
            ) | to_nice_json
          }}
          {% else %}
          {
            "scan_timestamp": {{ report_timestamp_iso | to_json }},
            "target_timestamp": null,
            "ip": {{ h | to_json }},
            "discovery_group": {{ hostvars[h].validation_discovery_group | default('ipc_os_client') | to_json }},
            "discovery_file": {{ hostvars[h].validation_discovery_file | default('') | to_json }},
            "discovery_generated_at": {{ hostvars[h].validation_discovery_generated_at | default('') | to_json }},
            "nmap_reachable": {{ hostvars[h].validation_nmap_reachable | default(false) | bool | to_json }},
            "nmap_winrm_port": {{ hostvars[h].validation_nmap_winrm_port | default('') | to_json }},
            "nmap_winrm_scheme": {{ hostvars[h].validation_nmap_winrm_scheme | default('') | to_json }},
            "nmap_open_ports": {{ hostvars[h].validation_nmap_open_ports | default('') | to_json }},
            "ansible_reachable": false,
            "computername": "",
            "station_type": {{ station_type | to_json }},
            "masterlist_column": {{ masterlist_column | to_json }},
            "os_caption": "",
            "os_version": "",
            "checks": [
            {% for c in validation_catalog %}
              {
                "masterlist_row": {{ c.row }},
                "masterlist_column": {{ masterlist_column | to_json }},
                "ansible_id": {{ c.ansible_id | to_json }},
                "schritt": {{ c.title | to_json }},
                "status": "Nicht_Pruefbar",
                "istwert": "",
                "sollwert": "Nmap erkennt offenen WinRM-Port und Zielrechner ist per WinRM erreichbar",
                "pruefmethode": "Nmap + WinRM",
                "hinweis": {{
                  (
                    'Nmap hat keinen offenen WinRM-Port 5985/5986 erkannt'
                    if not (hostvars[h].validation_nmap_reachable | default(false) | bool)
                    else 'Nmap hat einen WinRM-Port erkannt, aber WinRM war nicht erreichbar oder der Zugriff wurde verweigert'
                  ) | to_json
                }}
              }{% if not loop.last %},{% endif %}
            {% endfor %}
            ],
            "error": {{
              (
                'Nmap hat keinen offenen WinRM-Port 5985/5986 erkannt'
                if not (hostvars[h].validation_nmap_reachable | default(false) | bool)
                else 'Nmap hat einen WinRM-Port erkannt, aber WinRM war nicht erreichbar oder der Zugriff wurde verweigert'
              ) | to_json
            }}
          }
          {% endif %}
          {% if not loop.last %},{% endif %}
          {% endfor %}
          ]

    - name: CSV-Protokoll zeilenweise nach Ansible-ID erzeugen
      ansible.builtin.shell: |
        set -euo pipefail
        "{{ ansible_playbook_python }}" - <<'PY'
        import csv
        import json
        from pathlib import Path

        json_path = Path("{{ result_dir }}/{{ report_prefix }}_{{ report_timestamp }}.json")
        csv_path = Path("{{ result_dir }}/{{ report_prefix }}_{{ report_timestamp }}.csv")
        data = json.loads(json_path.read_text(encoding="utf-8"))

        fieldnames = [
            "Pruefzeit",
            "IP",
            "Discovery_Gruppe",
            "Discovery_Zeit",
            "Nmap_WinRM_erreichbar",
            "Nmap_WinRM_Port",
            "Nmap_WinRM_Schema",
            "Nmap_offene_WinRM_Ports",
            "Ansible_erreichbar",
            "Computername",
            "Stationstyp",
            "Masterliste_Spalte",
            "Masterliste_Zeile",
            "Ansible_ID",
            "Schritt",
            "Status",
            "Istwert",
            "Sollwert",
            "Pruefmethode",
            "Hinweis",
        ]

        rows = []
        for host in data:
            checks = host.get("checks") or []
            for check in checks:
                rows.append({
                    "Pruefzeit": host.get("scan_timestamp", ""),
                    "IP": host.get("ip", ""),
                    "Discovery_Gruppe": host.get("discovery_group", ""),
                    "Discovery_Zeit": host.get("discovery_generated_at", ""),
                    "Nmap_WinRM_erreichbar": host.get("nmap_reachable", False),
                    "Nmap_WinRM_Port": host.get("nmap_winrm_port", ""),
                    "Nmap_WinRM_Schema": host.get("nmap_winrm_scheme", ""),
                    "Nmap_offene_WinRM_Ports": host.get("nmap_open_ports", ""),
                    "Ansible_erreichbar": host.get("ansible_reachable", False),
                    "Computername": host.get("computername", ""),
                    "Stationstyp": host.get("station_type", ""),
                    "Masterliste_Spalte": check.get("masterlist_column", host.get("masterlist_column", "")),
                    "Masterliste_Zeile": check.get("masterlist_row", ""),
                    "Ansible_ID": check.get("ansible_id", ""),
                    "Schritt": check.get("schritt", ""),
                    "Status": check.get("status", ""),
                    "Istwert": check.get("istwert", ""),
                    "Sollwert": check.get("sollwert", ""),
                    "Pruefmethode": check.get("pruefmethode", ""),
                    "Hinweis": check.get("hinweis", ""),
                })

        rows.sort(key=lambda r: (str(r["IP"]), int(r["Masterliste_Zeile"] or 0)))

        with csv_path.open("w", encoding="utf-8-sig", newline="") as f:
            writer = csv.DictWriter(
                f,
                fieldnames=fieldnames,
                delimiter=";",
                quoting=csv.QUOTE_MINIMAL,
            )
            writer.writeheader()
            writer.writerows(rows)

        summary = {}
        for row in rows:
            summary[row["Status"]] = summary.get(row["Status"], 0) + 1
        print(json.dumps({"csv": str(csv_path), "rows": len(rows), "status": summary}, ensure_ascii=False))
        PY
      args:
        executable: /bin/bash
      register: csv_result
      changed_when: false

    - name: Report-Pfade und Statusübersicht anzeigen
      ansible.builtin.debug:
        msg:
          - "JSON: {{ result_dir }}/{{ report_prefix }}_{{ report_timestamp }}.json"
          - "CSV:  {{ result_dir }}/{{ report_prefix }}_{{ report_timestamp }}.csv"
          - "Zusammenfassung: {{ csv_result.stdout }}"