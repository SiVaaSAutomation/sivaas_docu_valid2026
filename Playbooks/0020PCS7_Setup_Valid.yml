---
- name: Netzwerkteilnehmer erkennen und PCS7-Pruefziele vorbereiten
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Zeitstempel fuer Report setzen
      ansible.builtin.set_fact:
        report_file_timestamp: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"
        report_csv_timestamp: "{{ lookup('pipe', 'date +\"%Y-%m-%d %H:%M:%S\"') }}"

    - name: Pruefen, ob benoetigte Semaphore-Variablen uebergeben wurden
      ansible.builtin.assert:
        that:
          - target_network is defined
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - nmap_binary is defined
          - result_dir is defined
          - target_network | string | length > 0
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - nmap_binary | string | length > 0
          - result_dir | string | length > 0
        fail_msg: >-
          Es fehlen benoetigte Variablen aus der Semaphore-Variablengruppe.
          Erforderlich sind: target_network, win_user, win_password,
          winrm_transport, nmap_binary und result_dir.

    - name: Pruefen, ob nmap auf dem Ansible-Controller vorhanden ist
      ansible.builtin.command: "{{ nmap_binary }} --version"
      register: nmap_check
      changed_when: false
      failed_when: false

    - name: Abbrechen, wenn nmap fehlt
      ansible.builtin.fail:
        msg: >-
          nmap ist auf dem Ansible-Controller unter {{ nmap_binary }} nicht
          ausfuehrbar. Installation pruefen: sudo apt install nmap
      when: nmap_check.rc != 0

    - name: Alle erkennbaren Netzwerkteilnehmer und offene WinRM-Ports suchen
      ansible.builtin.shell: |
        set -o pipefail

        declare -A participant_seen
        declare -A winrm_port
        declare -A winrm_scheme
        declare -A winrm_open_ports

        while IFS= read -r ip; do
          if [ -n "$ip" ]; then
            participant_seen["$ip"]=1
          fi
        done < <(
          {{ nmap_binary | quote }} -n -sn {{ target_network | quote }} -oG - |
          awk '/Status: Up/ { print $2 }'
        )

        while IFS=';' read -r ip selected_port selected_scheme open_ports; do
          if [ -n "$ip" ]; then
            participant_seen["$ip"]=1
            winrm_port["$ip"]="$selected_port"
            winrm_scheme["$ip"]="$selected_scheme"
            winrm_open_ports["$ip"]="$open_ports"
          fi
        done < <(
          {{ nmap_binary | quote }} -n -Pn -p 5985,5986 --open {{ target_network | quote }} -oG - |
          awk '
            /Ports:/ {
              host=$2
              has_http = ($0 ~ /5985\/open\/tcp/)
              has_https = ($0 ~ /5986\/open\/tcp/)

              if (has_https) {
                ports = has_http ? "5985,5986" : "5986"
                print host ";5986;https;" ports
              } else if (has_http) {
                print host ";5985;http;5985"
              }
            }
          '
        )

        for ip in "${!participant_seen[@]}"; do
          printf '%s;%s;%s;%s\n' \
            "$ip" \
            "${winrm_port[$ip]:-}" \
            "${winrm_scheme[$ip]:-}" \
            "${winrm_open_ports[$ip]:-}"
        done | sort -V
      args:
        executable: /bin/bash
      register: network_scan_result
      changed_when: false

    - name: Gefundene Teilnehmer speichern
      ansible.builtin.set_fact:
        discovered_participant_records: "{{ network_scan_result.stdout_lines | default([]) }}"
        discovered_ips: >-
          {{ network_scan_result.stdout_lines
             | default([])
             | map('regex_replace', ';.*$', '')
             | list }}

    - name: Abbrechen, wenn keine Netzwerkteilnehmer erkannt wurden
      ansible.builtin.fail:
        msg: "Im Zielnetz {{ target_network }} wurden keine Netzwerkteilnehmer erkannt."
      when: discovered_ips | length == 0

    - name: Alle Teilnehmer zum Laufzeit-Inventar hinzufuegen
      ansible.builtin.add_host:
        name: "{{ item.split(';')[0] }}"
        groups: discovered_pcs7_participants
        ansible_host: "{{ item.split(';')[0] }}"
        discovered_winrm_port: "{{ item.split(';')[1] }}"
        discovered_winrm_scheme: "{{ item.split(';')[2] }}"
        discovered_winrm_open_ports: "{{ item.split(';')[3] }}"
      loop: "{{ discovered_participant_records }}"
      changed_when: false

    - name: Teilnehmer mit offenem WinRM-Port als PCS7-Pruefziel hinzufuegen
      ansible.builtin.add_host:
        name: "{{ item.split(';')[0] }}"
        groups: pcs7_check_targets
        ansible_host: "{{ item.split(';')[0] }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.split(';')[1] | int }}"
        ansible_winrm_scheme: "{{ item.split(';')[2] }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(120) }}"
        discovered_winrm_open_ports: "{{ item.split(';')[3] }}"
      loop: "{{ discovered_participant_records }}"
      when: item.split(';')[1] | length > 0
      no_log: true
      changed_when: false

    - name: Gefundene Teilnehmer anzeigen
      ansible.builtin.debug:
        msg:
          - "Alle Teilnehmer: {{ discovered_ips }}"
          - "WinRM-Pruefziele: {{ groups['pcs7_check_targets'] | default([]) }}"


- name: PCS7-Rolle erkennen und Installation sowie Konfiguration pruefen
  hosts: pcs7_check_targets
  gather_facts: false
  ignore_unreachable: true

  vars:
    effective_pcs7_setup_log_path: >-
      {{ pcs7_setup_log_path
         | default('C:\\ProgramData\\Siemens\\Automation\\Logfiles\\Setup\\RS') }}
    effective_non_pcs7_mtu_required: "{{ non_pcs7_mtu_required | default(false) | bool }}"
    effective_wins_server_required: "{{ wins_server_required | default(false) | bool }}"

  tasks:
    - name: Ansible-Erreichbarkeit standardmaessig auf false setzen
      ansible.builtin.set_fact:
        pcs7_ansible_reachable: false

    - name: WinRM-Verbindung testen
      ansible.windows.win_ping:
      register: win_ping_result
      changed_when: false
      failed_when: false

    - name: Erfolgreiche WinRM-Verbindung speichern
      ansible.builtin.set_fact:
        pcs7_ansible_reachable: true
      when:
        - win_ping_result is defined
        - win_ping_result.ping | default('') == 'pong'

    - name: PCS7-Komponenten, Rechnerart und ID-Pruefungen auslesen
      ansible.windows.win_shell: |
        $ErrorActionPreference = 'SilentlyContinue'
        $ProgressPreference = 'SilentlyContinue'

        function Get-UninstallPrograms {
          $roots = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall'
          )

          $items = @()
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            foreach ($key in Get-ChildItem -Path $root -ErrorAction SilentlyContinue) {
              $props = Get-ItemProperty -Path $key.PSPath -ErrorAction SilentlyContinue
              if ([string]::IsNullOrWhiteSpace([string]$props.DisplayName)) { continue }
              $items += [ordered]@{
                name = [string]$props.DisplayName
                version = [string]$props.DisplayVersion
                publisher = [string]$props.Publisher
                install_date = [string]$props.InstallDate
                install_location = [string]$props.InstallLocation
                registry_key = [string]$key.Name
              }
            }
          }
          return @($items | Sort-Object name, version -Unique)
        }

        function Get-WindowsFeaturesSafe {
          $features = @()
          if (Get-Command Get-WindowsFeature -ErrorAction SilentlyContinue) {
            $features = @(Get-WindowsFeature | ForEach-Object {
              [ordered]@{
                name = [string]$_.Name
                display_name = [string]$_.DisplayName
                state = if ($_.Installed) { 'Enabled' } else { 'Disabled' }
              }
            })
          } elseif (Get-Command Get-WindowsOptionalFeature -ErrorAction SilentlyContinue) {
            $features = @(Get-WindowsOptionalFeature -Online | ForEach-Object {
              [ordered]@{
                name = [string]$_.FeatureName
                display_name = [string]$_.FeatureName
                state = [string]$_.State
              }
            })
          }
          return $features
        }

        function Get-LocalGroupsSafe {
          $groups = @()
          try {
            $computer = [ADSI]("WinNT://" + $env:COMPUTERNAME + ",computer")
            $groups = @($computer.Children | Where-Object {
              $_.SchemaClassName -eq 'group'
            } | ForEach-Object { [string]$_.Name })
          } catch {}
          return @($groups | Sort-Object -Unique)
        }

        function Get-NetworkDetailsSafe {
          $result = @()
          if (-not (Get-Command Get-NetAdapter -ErrorAction SilentlyContinue)) {
            return $result
          }

          foreach ($adapter in Get-NetAdapter -IncludeHidden:$false -ErrorAction SilentlyContinue) {
            $bindings = @()
            if (Get-Command Get-NetAdapterBinding -ErrorAction SilentlyContinue) {
              $bindings = @(Get-NetAdapterBinding -Name $adapter.Name -ErrorAction SilentlyContinue | ForEach-Object {
                [ordered]@{
                  display_name = [string]$_.DisplayName
                  component_id = [string]$_.ComponentID
                  enabled = [bool]$_.Enabled
                }
              })
            }

            $power = $null
            if (Get-Command Get-NetAdapterPowerManagement -ErrorAction SilentlyContinue) {
              $pm = Get-NetAdapterPowerManagement -Name $adapter.Name -ErrorAction SilentlyContinue
              if ($pm) {
                $power = [ordered]@{
                  allow_computer_to_turn_off_device = [string]$pm.AllowComputerToTurnOffDevice
                  wake_on_magic_packet = [string]$pm.WakeOnMagicPacket
                  wake_on_pattern = [string]$pm.WakeOnPattern
                }
              }
            }

            $result += [ordered]@{
              name = [string]$adapter.Name
              description = [string]$adapter.InterfaceDescription
              status = [string]$adapter.Status
              mac_address = [string]$adapter.MacAddress
              link_speed = [string]$adapter.LinkSpeed
              bindings = $bindings
              power_management = $power
            }
          }
          return $result
        }

        function Join-Evidence {
          param([object[]]$Values)
          return (@($Values | Where-Object {
            -not [string]::IsNullOrWhiteSpace([string]$_)
          } | Select-Object -Unique) -join ' | ')
        }

        $checks = New-Object System.Collections.Generic.List[object]

        function Add-Check {
          param(
            [string]$Id,
            [string]$Description,
            [string]$Status,
            [string]$Actual,
            [string]$Expected,
            [string]$SourceSheet
          )
          $checks.Add([ordered]@{
            id = $Id
            description = $Description
            status = $Status
            actual = $Actual
            expected = $Expected
            source_sheet = $SourceSheet
          }) | Out-Null
        }

        function Find-Evidence {
          param([string]$Pattern)
          return @($searchCorpus | Where-Object { [string]$_ -match $Pattern } | Select-Object -First 20 -Unique)
        }

        function Add-EvidenceCheck {
          param(
            [string]$Id,
            [string]$Description,
            [string]$Pattern,
            [string]$Expected,
            [string]$SourceSheet,
            [bool]$Relevant = $true
          )
          if (-not $Relevant) {
            Add-Check $Id $Description 'NICHT_RELEVANT' '' $Expected $SourceSheet
            return
          }
          $matches = @(Find-Evidence $Pattern)
          if ($matches.Count -gt 0) {
            Add-Check $Id $Description 'OK' (Join-Evidence $matches) $Expected $SourceSheet
          } else {
            Add-Check $Id $Description 'NOK' 'Kein passender Installationsnachweis gefunden' $Expected $SourceSheet
          }
        }

        function Add-BoolCheck {
          param(
            [string]$Id,
            [string]$Description,
            [bool]$Passed,
            [string]$Actual,
            [string]$Expected,
            [string]$SourceSheet,
            [bool]$Relevant = $true,
            [bool]$Checkable = $true
          )
          if (-not $Relevant) {
            Add-Check $Id $Description 'NICHT_RELEVANT' '' $Expected $SourceSheet
          } elseif (-not $Checkable) {
            Add-Check $Id $Description 'NICHT_PRUEFBAR' $Actual $Expected $SourceSheet
          } elseif ($Passed) {
            Add-Check $Id $Description 'OK' $Actual $Expected $SourceSheet
          } else {
            Add-Check $Id $Description 'NOK' $Actual $Expected $SourceSheet
          }
        }

        function Add-ProgramDefinitions {
          param([object[]]$Definitions, [string]$SourceSheet)
          foreach ($definition in $Definitions) {
            $relevant = $true
            if ($definition.Contains('relevant')) {
              $relevant = [bool]$definition.relevant
            }
            Add-EvidenceCheck `
              ([string]$definition.id) `
              ([string]$definition.description) `
              ([string]$definition.pattern) `
              ([string]$definition.expected) `
              $SourceSheet `
              $relevant
          }
        }

        $computerSystem = Get-CimInstance Win32_ComputerSystem
        $operatingSystem = Get-CimInstance Win32_OperatingSystem
        $programs = @(Get-UninstallPrograms)
        $features = @(Get-WindowsFeaturesSafe)
        $services = @(Get-CimInstance Win32_Service | ForEach-Object {
          [ordered]@{
            name = [string]$_.Name
            display_name = [string]$_.DisplayName
            state = [string]$_.State
            start_mode = [string]$_.StartMode
            path_name = [string]$_.PathName
          }
        })
        $localGroups = @(Get-LocalGroupsSafe)
        $networkAdapters = @(Get-NetworkDetailsSafe)

        $setupLogPath = "{{ effective_pcs7_setup_log_path }}"
        $setupLogs = @()
        $setupLogLines = @()
        if (Test-Path $setupLogPath) {
          $setupLogs = @(Get-ChildItem -Path $setupLogPath -Filter '*.txt' -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 12 |
            ForEach-Object {
              [ordered]@{
                file_name = [string]$_.Name
                full_name = [string]$_.FullName
                last_write_time = $_.LastWriteTime.ToString('yyyy-MM-ddTHH:mm:ss')
                size_bytes = [int64]$_.Length
              }
            })

          foreach ($log in $setupLogs | Select-Object -First 5) {
            $setupLogLines += @(Select-String -Path $log.full_name `
              -Pattern '(?i)(PCS\s*7|PCS7|SIMATIC|WinCC|STEP\s*7|CEMAT|Management Agent|Management Console|Industry Library|SENTRON|SIMOCODE|S7 F|Safety Matrix|SITOP|Drive ES|PTE400|PowerControl|PH Ready|Process Historian|UC0?2|SP\s*1)' `
              -ErrorAction SilentlyContinue |
              Select-Object -First 250 |
              ForEach-Object { ([string]$_.Line).Trim() } |
              Where-Object { $_ } |
              Select-Object -Unique)
          }
        }

        $programEvidence = @($programs | ForEach-Object {
          (([string]$_.name) + ' ' + ([string]$_.version) + ' ' + ([string]$_.publisher)).Trim()
        })
        $serviceEvidence = @($services | ForEach-Object {
          (([string]$_.display_name) + ' ' + ([string]$_.name) + ' ' + ([string]$_.path_name)).Trim()
        })
        $featureEvidence = @($features | Where-Object { $_.state -match '(?i)Enabled|Installed' } | ForEach-Object {
          (([string]$_.display_name) + ' ' + ([string]$_.name)).Trim()
        })
        $searchCorpus = @($programEvidence + $serviceEvidence + $featureEvidence + $setupLogLines + @($setupLogs.file_name))

        $manufacturerModel = (([string]$computerSystem.Manufacturer) + ' ' + ([string]$computerSystem.Model)).Trim()
        $isVirtual = $manufacturerModel -match '(?i)(VMware|Virtual Machine|VirtualBox|KVM|QEMU|Xen|HVM domU|Parallels|Bochs|OpenStack)'
        $isSiemensIPC = (-not $isVirtual) -and ($manufacturerModel -match '(?i)(Siemens|SIMATIC\s*IPC|IPC[0-9]{2,4})')

        $pcs7CoreEvidence = @(Find-Evidence '(?i)(PCS\s*7|PCS7|WinCC|SIMATIC Manager|STEP\s*7|CFC|SFC|SIMATIC BATCH|Route Control|CEMAT|Process Historian|PH Ready)')
        $pcs7Detected = $pcs7CoreEvidence.Count -gt 0
        $engineeringEvidence = @(Find-Evidence '(?i)(PCS\s*7.*Engineering|SIMATIC Manager|STEP\s*7|CFC|SFC|BATCH.*Engineering|Route Control.*Engineering)')
        $serverEvidence = @(Find-Evidence '(?i)(PCS\s*7.*OS.*Server|OS[- ]?Server|WinCC.*Server|Server Redundancy|WinCC Redundancy)')
        $clientEvidence = @(Find-Evidence '(?i)(PCS\s*7.*OS.*Client|OS[- ]?Client|WinCC.*Client|WebNavigator Client)')
        $adFeatureEvidence = @($features | Where-Object {
          $_.name -match '(?i)(AD-Domain-Services|DirectoryServices-DomainController)' -and
          $_.state -match '(?i)Enabled|Installed'
        })
        $domainControllerDetected = ($computerSystem.DomainRole -ge 4) -or ($adFeatureEvidence.Count -gt 0)
        $orclaEvidence = @(Find-Evidence '(?i)(ORCLA|Watchdog.*OPC|OPC UA Server)')

        $engineeringScore = 0
        $serverScore = 0
        $clientScore = 0
        if ($engineeringEvidence.Count -gt 0) { $engineeringScore += 6 }
        if (@(Find-Evidence '(?i)(CFC|SFC|STEP\s*7|SIMATIC Manager)').Count -gt 0) { $engineeringScore += 3 }
        if (@(Find-Evidence '(?i)SIMATIC.*Management.*Console').Count -gt 0) { $engineeringScore += 1 }
        if ($serverEvidence.Count -gt 0) { $serverScore += 6 }
        if (@(Find-Evidence '(?i)(Redundancy|Archive Server|Process Historian|PH Ready)').Count -gt 0) { $serverScore += 2 }
        if ($clientEvidence.Count -gt 0) { $clientScore += 6 }
        if (@(Find-Evidence '(?i)WebNavigator Client').Count -gt 0) { $clientScore += 2 }

        $role = 'Unbekannt'
        $highestScore = [Math]::Max($engineeringScore, [Math]::Max($serverScore, $clientScore))
        if ($highestScore -gt 0) {
          if ($engineeringScore -eq $highestScore) {
            $role = 'ES'
          } elseif ($serverScore -eq $highestScore) {
            $role = 'OS Server'
          } else {
            $role = 'OS Client'
          }
        }

        $category = 'Nicht klassifiziert'
        $specialSubtype = ''
        $classificationNote = ''
        $followUpPlaybooks = @()

        # Die Plattform und die Windows-Rolle werden vor der PCS7-Rolle bewertet.
        # Dadurch bleiben Rechner ohne PCS 7 gueltige, pruefbare Teilnehmer.
        if ($isVirtual) {
          if ($domainControllerDetected) {
            $category = 'VM DC'
            $specialSubtype = 'VM DC'
            $role = 'Keine PCS7-Rolle'
            $classificationNote = 'Virtuelle Maschine mit Domain-Controller-Rolle; PCS7-Installationspruefungen sind nicht relevant.'
            $followUpPlaybooks = @('0010Initial', '0030GPO_Guidelines', '0040OS_Server_Systemhardening')
          } elseif ($role -eq 'ES') {
            $category = 'VM ES'
          } elseif ($role -eq 'OS Server') {
            $category = 'VM OS Server'
          } elseif ($role -eq 'OS Client') {
            $category = 'VM OS Client'
          } elseif (-not $pcs7Detected) {
            $category = 'VM Windows ohne PCS7'
            $role = 'Keine PCS7-Rolle'
            $classificationNote = 'Virtuelle Windows-Maschine ohne erkannten PCS7-Kern; PCS7-IDs werden als NICHT_RELEVANT ausgegeben.'
            $followUpPlaybooks = @('0010Initial', '0030GPO_Guidelines', '0040OS_Server_Systemhardening')
          } else {
            $category = 'VM PCS7-Rolle unklar'
            $specialSubtype = 'PCS7-Komponenten ohne eindeutige Rolle'
            $classificationNote = 'PCS7-Komponenten erkannt, aber keine eindeutige Zuordnung zu ES, OS Server oder OS Client moeglich.'
          }
        } else {
          if ($domainControllerDetected -and $isSiemensIPC) {
            $category = 'IPC besondere Konfiguration'
            $specialSubtype = 'IPC DC'
            $role = 'Keine PCS7-Rolle'
            $classificationNote = 'Siemens IPC mit Domain-Controller-Rolle.'
            $followUpPlaybooks = @('0010Initial', '0030GPO_Guidelines', '0040OS_Server_Systemhardening', '0070IPC_Windows_Basis', '0080IPC_Patches_GPO_WSUSClient', '0090IPC_ePOPlattform')
          } elseif ($domainControllerDetected) {
            $category = 'Physischer Windows DC'
            $specialSubtype = 'Physischer DC ohne sichere IPC-Erkennung'
            $role = 'Keine PCS7-Rolle'
            $classificationNote = 'Domain Controller erkannt, Hardware aber nicht eindeutig als Siemens IPC identifiziert.'
            $followUpPlaybooks = @('0010Initial', '0030GPO_Guidelines', '0040OS_Server_Systemhardening')
          } elseif ($role -eq 'ES') {
            $category = 'IPC besondere Konfiguration'
            $specialSubtype = 'IPC ES'
          } elseif ($role -eq 'OS Server') {
            $category = 'IPC OS Server'
          } elseif ($role -eq 'OS Client') {
            $category = 'IPC OS Client'
          } elseif ($isSiemensIPC -and -not $pcs7Detected -and $orclaEvidence.Count -eq 0) {
            $category = 'IPC ohne PCS7'
            $role = 'Keine PCS7-Rolle'
            $classificationNote = 'Siemens IPC ohne erkannten PCS7-Kern und ohne eindeutige Spezialsoftware; PCS7-IDs werden als NICHT_RELEVANT ausgegeben.'
            $followUpPlaybooks = @('0010Initial', '0030GPO_Guidelines', '0040OS_Server_Systemhardening', '0070IPC_Windows_Basis', '0080IPC_Patches_GPO_WSUSClient', '0090IPC_ePOPlattform')
          } elseif ($isSiemensIPC -or $orclaEvidence.Count -gt 0) {
            $category = 'IPC besondere Konfiguration'
            $specialSubtype = 'IPC Spezialrolle unbekannt'
            $classificationNote = 'IPC beziehungsweise ORCLA-Komponenten erkannt, Spezialrolle aber nicht eindeutig bestimmbar.'
          } elseif (-not $pcs7Detected) {
            $category = 'Physischer Windows-Rechner ohne PCS7'
            $role = 'Keine PCS7-Rolle'
            $classificationNote = 'Physischer Windows-Rechner ohne erkannten PCS7-Kern; keine sichere Siemens-IPC-Erkennung.'
            $followUpPlaybooks = @('0010Initial', '0030GPO_Guidelines', '0040OS_Server_Systemhardening')
          } else {
            $category = 'Physischer PCS7-Rechner Rolle unklar'
            $specialSubtype = 'PCS7-Komponenten ohne eindeutige Rolle'
            $classificationNote = 'PCS7-Komponenten erkannt, Plattform beziehungsweise PCS7-Rolle aber nicht eindeutig zuordenbar.'
          }
        }

        $scoreValues = @($engineeringScore, $serverScore, $clientScore) | Sort-Object -Descending
        $scoreDifference = if ($scoreValues.Count -ge 2) { $scoreValues[0] - $scoreValues[1] } else { $scoreValues[0] }
        $classificationConfidence = 'niedrig'
        if ($highestScore -ge 6 -and $scoreDifference -ge 3) {
          $classificationConfidence = 'hoch'
        } elseif ($highestScore -ge 4) {
          $classificationConfidence = 'mittel'
        }
        if ($domainControllerDetected) {
          $classificationConfidence = 'hoch'
        } elseif ($category -in @('VM Windows ohne PCS7', 'IPC ohne PCS7')) {
          $classificationConfidence = 'mittel'
        }

        $nonPcs7MtuRequired = [System.Convert]::ToBoolean('{{ effective_non_pcs7_mtu_required }}')
        $winsServerRequired = [System.Convert]::ToBoolean('{{ effective_wins_server_required }}')

        $expectedAddons = @()
        try {
          $expectedAddons = @(ConvertFrom-Json @'
        {{ pcs7_expected_addons | default([]) | to_json }}
        '@)
        } catch {}
        function Is-AddonRelevant {
          param([string]$AddonName, [string]$EvidencePattern)
          return (($expectedAddons -contains $AddonName) -or (@(Find-Evidence $EvidencePattern).Count -gt 0))
        }

        $pcs7V10Pattern = '(?i)((PCS\s*7|PCS7).*(V?10|10\.)|(V?10|10\.).*(PCS\s*7|PCS7))'
        $pcs7Sp1Pattern = '(?i)((PCS\s*7|PCS7|SIMATIC).*(SP\s*1|10\.0+\.?1)|SP\s*1.*(PCS\s*7|PCS7|SIMATIC))'
        $smaPattern = '(?i)SIMATIC.*Management.*Agent'
        $smcPattern = '(?i)SIMATIC.*Management.*Console'
        $v7LibraryPattern = '(?i)(PCS\s*7.*(Basis|Base).*Library.*V7|Faceplate.*V7|SIMATIC_PCS7_Lib_V7)'
        $cematPattern = '(?i)CEMAT'
        $phReadyPattern = '(?i)(PH\s*Ready|Process Historian)'

        $terminalAdapters = @($networkAdapters | Where-Object { $_.name -match '(?i)terminal' })
        $terminalProfinetBindings = @($terminalAdapters | ForEach-Object {
          @($_.bindings | Where-Object {
            $_.display_name -match '(?i)(PROFINET|PNIO)' -or $_.component_id -match '(?i)(PROFINET|PNIO)'
          })
        })
        $terminalBusCheckable = ($terminalAdapters.Count -gt 0 -and $terminalProfinetBindings.Count -gt 0)
        $terminalBusPassed = $terminalBusCheckable -and (@($terminalProfinetBindings | Where-Object { $_.enabled }).Count -eq 0)
        $terminalBusActual = if ($terminalAdapters.Count -eq 0) {
          'Kein Adapter mit Name Terminalbus gefunden'
        } elseif ($terminalProfinetBindings.Count -eq 0) {
          'Terminalbus gefunden, aber keine eindeutig erkennbare PROFINET-/PNIO-Bindung'
        } else {
          Join-Evidence @($terminalAdapters | ForEach-Object {
            $adapter = $_
            $bindingText = @($adapter.bindings | Where-Object {
              $_.display_name -match '(?i)(PROFINET|PNIO)' -or $_.component_id -match '(?i)(PROFINET|PNIO)'
            } | ForEach-Object { $_.display_name + '=' + $_.enabled }) -join ', '
            $adapter.name + ': ' + $bindingText
          })
        }

        $physicalPowerResults = @($networkAdapters | Where-Object {
          $_.status -match '(?i)Up' -and $_.name -notmatch '(?i)(Loopback|Bluetooth|vEthernet|Teredo|isatap)'
        } | ForEach-Object {
          $value = if ($_.power_management) { [string]$_.power_management.allow_computer_to_turn_off_device } else { '' }
          [ordered]@{
            name = $_.name
            value = $value
            enabled = ($value -match '(?i)Enabled|True|1')
            checkable = -not [string]::IsNullOrWhiteSpace($value)
          }
        })
        $powerCheckable = ($physicalPowerResults.Count -gt 0 -and @($physicalPowerResults | Where-Object { -not $_.checkable }).Count -eq 0)
        $powerPassed = $powerCheckable -and (@($physicalPowerResults | Where-Object { $_.enabled }).Count -eq 0)
        $powerActual = Join-Evidence @($physicalPowerResults | ForEach-Object { $_.name + '=' + $_.value })

        $mtuInterfaces = @()
        if (Get-Command Get-NetIPInterface -ErrorAction SilentlyContinue) {
          $mtuInterfaces = @(Get-NetIPInterface -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object {
            $_.InterfaceAlias -notmatch '(?i)(Loopback|Teredo|isatap)'
          } | ForEach-Object {
            [ordered]@{
              interface_alias = [string]$_.InterfaceAlias
              interface_index = [int]$_.InterfaceIndex
              connection_state = [string]$_.ConnectionState
              mtu = [int]$_.NlMtuBytes
            }
          })
        }
        $mtuTargetInterfaces = @($mtuInterfaces | Where-Object { $_.interface_alias -match '(?i)terminal' })
        if ($mtuTargetInterfaces.Count -eq 0) {
          $mtuTargetInterfaces = @($mtuInterfaces | Where-Object { $_.connection_state -match '(?i)Connected' })
        }
        $mtuCheckable = $mtuTargetInterfaces.Count -gt 0
        $mtu1494Passed = $mtuCheckable -and (@($mtuTargetInterfaces | Where-Object { $_.mtu -ne 1494 }).Count -eq 0)
        $mtuActual = Join-Evidence @($mtuTargetInterfaces | ForEach-Object {
          $_.interface_alias + '=' + $_.mtu
        })
        if ([string]::IsNullOrWhiteSpace($mtuActual)) {
          $mtuActual = 'Keine geeignete IPv4-Netzwerkschnittstelle fuer die MTU-Pruefung gefunden'
        }

        $winsFeatureEvidence = @($features | Where-Object {
          ($_.name + ' ' + $_.display_name) -match '(?i)(^|\s)WINS($|\s|-Server)' -and
          $_.state -match '(?i)Enabled|Installed'
        })
        $winsInstalled = $winsFeatureEvidence.Count -gt 0
        $winsActual = Join-Evidence @($features | Where-Object {
          ($_.name + ' ' + $_.display_name) -match '(?i)(^|\s)WINS($|\s|-Server)'
        } | ForEach-Object { $_.name + '=' + $_.state })
        if ([string]::IsNullOrWhiteSpace($winsActual)) {
          $winsActual = 'WINS-Server nicht installiert'
        }

        $adActual = Join-Evidence @($adFeatureEvidence | ForEach-Object { $_.name + '=' + $_.state })
        if ([string]::IsNullOrWhiteSpace($adActual)) {
          $adActual = 'DomainRole=' + [string]$computerSystem.DomainRole
        }

        $netFx3Enabled = @($features | Where-Object {
          $_.name -match '(?i)(NET-Framework-Core|NetFx3)' -and $_.state -match '(?i)Enabled|Installed'
        }).Count -gt 0
        $netFx3Actual = Join-Evidence @($features | Where-Object {
          $_.name -match '(?i)(NET-Framework-Core|NetFx3)'
        } | ForEach-Object { $_.name + '=' + $_.state })

        $simaticGroups = @($localGroups | Where-Object { $_ -match '(?i)(SIMATIC|WinCC|HMI)' })
        $simaticGroupsPassed = @($simaticGroups | Where-Object { $_ -match '(?i)SIMATIC HMI' }).Count -gt 0
        $simaticGroupsActual = Join-Evidence $simaticGroups

