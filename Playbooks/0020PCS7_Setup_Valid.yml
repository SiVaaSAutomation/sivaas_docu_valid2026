        known_id_descriptions.update({
            'VM-DC-0169': 'MTU 1494 bei Systemen ohne PCS 7 einstellen',
            'VM-DC-0170': 'Active Directory-Domaenendienste installieren',
            'VM-DC-0171': 'WINS-Server installieren',
        })

        all_ids = set(known_ids)
        descriptions = dict(known_id_descriptions)
        for item in data:
            for check in item.get("checks") or []:
                check_id = str(check.get("id") or "").strip()
                if not check_id:
                    continue
                all_ids.add(check_id)
                descriptions.setdefault(check_id, str(check.get("description") or ""))
        all_ids = sorted(all_ids, key=natural_key)

        for item in data:
            existing = {
                str(check.get("id")): check
                for check in (item.get("checks") or [])
                if check.get("id")
            }
            checks_by_id = {}
            for check_id in all_ids:
                check = existing.get(check_id)
                if check:
                    checks_by_id[check_id] = {
                        "description": check.get("description", descriptions.get(check_id, "")),
                        "status": check.get("status", ""),
                        "actual": check.get("actual", ""),
                        "expected": check.get("expected", ""),
                        "source_sheet": check.get("source_sheet", ""),
                    }
                elif (
                    item.get("ansible_reachable")
                    and item.get("category") in {
                        "VM DC",
                        "VM Windows ohne PCS7",
                        "VM OS Server",
                        "VM OS Client",
                        "VM ES",
                        "IPC ohne PCS7",
                        "IPC OS Server",
                        "IPC OS Client",
                        "Physischer Windows DC",
                        "Physischer Windows-Rechner ohne PCS7",
                    }
                    or (
                        item.get("ansible_reachable")
                        and item.get("category") == "IPC besondere Konfiguration"
                        and item.get("special_subtype") in {"IPC ES", "IPC DC"}
                    )
                ):
                    checks_by_id[check_id] = {
                        "description": descriptions.get(check_id, ""),
                        "status": "NICHT_RELEVANT",
                        "actual": "",
                        "expected": "",
                        "source_sheet": "",
                    }
                else:
                    reason = (
                        "Rechnerart nicht eindeutig klassifiziert"
                        if item.get("ansible_reachable")
                        else "WinRM nicht erreichbar oder Auswertung fehlgeschlagen"
                    )
                    checks_by_id[check_id] = {
                        "description": descriptions.get(check_id, ""),
                        "status": "NICHT_PRUEFBAR",
                        "actual": reason,
                        "expected": "",
                        "source_sheet": "",
                    }
            item["checks_by_id"] = checks_by_id
            item["check_summary"] = {
                "ok": sum(1 for value in checks_by_id.values() if value["status"] == "OK"),
                "nok": sum(1 for value in checks_by_id.values() if value["status"] == "NOK"),
                "nicht_relevant": sum(
                    1 for value in checks_by_id.values()
                    if value["status"] == "NICHT_RELEVANT"
                ),
                "nicht_pruefbar": sum(
                    1 for value in checks_by_id.values()
                    if value["status"] == "NICHT_PRUEFBAR"
                ),
            }

        json_path.write_text(
            json.dumps(data, ensure_ascii=False, indent=2),
            encoding="utf-8",
        )

        base_fields = [
            "Zeitstempel_Pruefung",
            "Zeitstempel_Zielsystem",
            "IP_Adresse",
            "Ansible_erreichbar",
            "Computername",
            "Hersteller",
            "Modell",
            "Betriebssystem",
            "OS_Version",
            "OS_Build",
            "Domaene",
            "Domaenenrolle",
            "Plattform_erkannt",
            "PCS7_erkannt",
            "PCS7_Rolle_erkannt",
            "Kategorie",
            "Spezialtyp",
            "Klassifikationssicherheit",
            "Klassifikationshinweis",
            "Weitere_Pruefplaybooks",
            "Engineering_Score",
            "OS_Server_Score",
            "OS_Client_Score",
            "PCS7_Komponenten",
            "Pruefungen_OK",
            "Pruefungen_NOK",
            "Pruefungen_NICHT_RELEVANT",
            "Pruefungen_NICHT_PRUEFBAR",
            "WinRM_Port",
            "WinRM_Schema",
            "WinRM_offene_Ports",
            "Fehler",
        ]

        id_fields = []
        for check_id in all_ids:
            id_fields.extend([f"{check_id}_Status", f"{check_id}_Istwert"])

        rows = []
        for item in data:
            scores = item.get("classification_scores") or {}
            summary = item.get("check_summary") or {}
            checks = item.get("checks_by_id") or {}
            row = {
                "Zeitstempel_Pruefung": item.get("scan_timestamp", ""),
                "Zeitstempel_Zielsystem": item.get("target_timestamp", ""),
                "IP_Adresse": item.get("ip", ""),
                "Ansible_erreichbar": item.get("ansible_reachable", False),
                "Computername": item.get("computername", ""),
                "Hersteller": item.get("manufacturer", ""),
                "Modell": item.get("model", ""),
                "Betriebssystem": item.get("os_caption", ""),
                "OS_Version": item.get("os_version", ""),
                "OS_Build": item.get("os_build", ""),
                "Domaene": item.get("domain", ""),
                "Domaenenrolle": item.get("domain_role", ""),
                "Plattform_erkannt": item.get("platform_detected", ""),
                "PCS7_erkannt": item.get("pcs7_detected", False),
                "PCS7_Rolle_erkannt": item.get("pcs7_role_detected", ""),
                "Kategorie": item.get("category", ""),
                "Spezialtyp": item.get("special_subtype", ""),
                "Klassifikationssicherheit": item.get("classification_confidence", ""),
                "Klassifikationshinweis": item.get("classification_note", ""),
                "Weitere_Pruefplaybooks": " | ".join(item.get("applicable_follow_up_playbooks") or []),
                "Engineering_Score": scores.get("engineering", ""),
                "OS_Server_Score": scores.get("os_server", ""),
                "OS_Client_Score": scores.get("os_client", ""),
                "PCS7_Komponenten": component_text(item.get("pcs7_components")),
                "Pruefungen_OK": summary.get("ok", 0),
                "Pruefungen_NOK": summary.get("nok", 0),
                "Pruefungen_NICHT_RELEVANT": summary.get("nicht_relevant", 0),
                "Pruefungen_NICHT_PRUEFBAR": summary.get("nicht_pruefbar", 0),
                "WinRM_Port": item.get("winrm_port", ""),
                "WinRM_Schema": item.get("winrm_scheme", ""),
                "WinRM_offene_Ports": item.get("winrm_open_ports", ""),
                "Fehler": item.get("error", ""),
            }

            for check_id in all_ids:
                check = checks.get(check_id)
                if check:
                    row[f"{check_id}_Status"] = check.get("status", "")
                    row[f"{check_id}_Istwert"] = check.get("actual", "")
                else:
                    row[f"{check_id}_Status"] = "NICHT_PRUEFBAR"
                    row[f"{check_id}_Istwert"] = "Pruefdefinition fehlt"
            rows.append(row)

        with csv_path.open("w", encoding="utf-8-sig", newline="") as handle:
            writer = csv.DictWriter(
                handle,
                fieldnames=base_fields + id_fields,
                delimiter=";",
                extrasaction="ignore",
            )
            writer.writeheader()
            writer.writerows(rows)
        PY
      args:
        executable: /bin/bash
      changed_when: true

    - name: Pfade der erzeugten Reports anzeigen
      ansible.builtin.debug:
        msg:
          - "JSON: {{ result_dir }}/0020_pcs7_kategorisierung_{{ report_file_timestamp }}.json"
          - "CSV:  {{ result_dir }}/0020_pcs7_kategorisierung_{{ report_file_timestamp }}.csv"