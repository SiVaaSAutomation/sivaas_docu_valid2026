            if ($specialSubtype -eq 'IPC ES') {
              Add-ProgramDefinitions @(
                @{ id='IPC-ES-0076'; description='.NET Framework 3.5 SP1 installieren'; pattern='(?i)(NET-Framework-Core|NetFx3|\.NET Framework 3\.5)'; expected='.NET Framework 3.5 vorhanden' },
                @{ id='IPC-ES-0078'; description='PCS 7 V10 installieren - Engineering Station'; pattern='(?i)(PCS\s*7.*Engineering|SIMATIC Manager|STEP\s*7|CFC|SFC)'; expected='PCS 7 Engineering-Komponenten vorhanden' },
                @{ id='IPC-ES-0081'; description='PCS 7 V7 Basis Library installieren'; pattern=$v7LibraryPattern; expected='V7 Basis Library vorhanden' },
                @{ id='IPC-ES-0082'; description='PCS7 Bibliothek ueber Rahmensetup installieren'; pattern='(?i)PCS\s*7.*(Basis|Base).*Library.*V?10'; expected='PCS 7 Basis Library V10 vorhanden' },
                @{ id='IPC-ES-0083'; description='PTE400 V10.0 installieren'; pattern='(?i)PTE\s*400'; expected='PTE400 V10 vorhanden' },
                @{ id='IPC-ES-0084'; description='SENTRON 3WL/3VL V10 installieren'; pattern='(?i)SENTRON.*(3WL|3VL)'; expected='SENTRON 3WL/3VL V10 vorhanden' },
                @{ id='IPC-ES-0085'; description='SENTRON PAC V10 installieren'; pattern='(?i)SENTRON.*PAC'; expected='SENTRON PAC V10 vorhanden' },
                @{ id='IPC-ES-0086'; description='SIMOCODE pro PCS7 V10.0 installieren'; pattern='(?i)SIMOCODE.*V?10'; expected='SIMOCODE pro PCS7 V10 vorhanden' },
                @{ id='IPC-ES-0087'; description='SIMOCODE Migration Legacy V10.0 installieren'; pattern='(?i)SIMOCODE.*(Migration|Legacy).*V?10'; expected='SIMOCODE Migration Legacy V10 vorhanden' },
                @{ id='IPC-ES-0089'; description='S7 F Systems V6.4 SP1 installieren'; pattern='(?i)S7\s*F\s*Systems.*6\.4.*SP\s*1'; expected='S7 F Systems V6.4 SP1 vorhanden' },
                @{ id='IPC-ES-0091'; description='Industry Library V10.0 installieren'; pattern='(?i)Industry.*Library.*V?10'; expected='Industry Library V10 vorhanden' },
                @{ id='IPC-ES-0092'; description='PowerControl freigegebenen Stand installieren'; pattern='(?i)PowerControl'; expected='PowerControl laut TPI vorhanden'; relevant=(Is-AddonRelevant 'PowerControl' '(?i)PowerControl') },
                @{ id='IPC-ES-0093'; description='PowerControl Update installieren'; pattern='(?i)PowerControl.*(Update|Upd|SP)'; expected='Freigegebenes PowerControl-Update vorhanden'; relevant=(Is-AddonRelevant 'PowerControl' '(?i)PowerControl') },
                @{ id='IPC-ES-0094'; description='DriveES PCS 7 APL V10.0 installieren'; pattern='(?i)Drive\s*ES.*PCS\s*7.*APL.*V?10'; expected='Drive ES PCS7 APL V10 vorhanden' },
                @{ id='IPC-ES-0095'; description='SITOP PCS 7 APL V4.0 installieren'; pattern='(?i)SITOP.*PCS\s*7.*APL.*V?4'; expected='SITOP PCS7 APL V4 vorhanden' },
                @{ id='IPC-ES-0096'; description='SIMATIC Safety Matrix V6.3 SP1 installieren'; pattern='(?i)Safety.*Matrix.*6\.3.*SP\s*1'; expected='Safety Matrix V6.3 SP1 vorhanden' },
                @{ id='IPC-ES-0099'; description='PCS 7 V10 UC02 installieren'; pattern='(?i)(UC\s*0?2|Update Collection\s*0?2)'; expected='PCS 7 V10 UC02 vorhanden' },
                @{ id='IPC-ES-0134'; description='SIMATIC IPC ORCLA installieren und konfigurieren'; pattern='(?i)ORCLA'; expected='ORCLA vorhanden' }
              ) 'IPC ES'
              Add-BoolCheck 'IPC-ES-0080' 'SIMATIC Shell Terminalbus konfigurieren' ($terminalAdapters.Count -gt 0) (Join-Evidence @($terminalAdapters.name)) 'Adapter Terminalbus vorhanden' 'IPC ES'
              Add-BoolCheck 'IPC-ES-0129' 'PROFINET-IO-Protokoll am Terminalbus deaktivieren' $terminalBusPassed $terminalBusActual 'PROFINET-/PNIO-Bindung am Terminalbus deaktiviert' 'IPC ES' $true $terminalBusCheckable
              Add-BoolCheck 'IPC-ES-0131' 'Energieverwaltung produktiver Netzwerkadapter deaktivieren' $powerPassed $powerActual 'Computer darf produktive Adapter nicht ausschalten' 'IPC ES' $true $powerCheckable
              Add-BoolCheck 'IPC-ES-0135' '.NET Framework 3.5 aktivieren' $netFx3Enabled $netFx3Actual '.NET Framework 3.5 aktiviert' 'IPC ES'
              Add-BoolCheck 'IPC-ES-0138' 'Master-ES-Rolle eindeutig festlegen' ($engineeringScore -gt 0) ('Engineering-Score=' + $engineeringScore) 'Engineering-Station eindeutig erkannt' 'IPC ES'
            } elseif ($specialSubtype -eq 'IPC DC') {
              Add-ProgramDefinitions @(
                @{ id='IPC-DC-0075'; description='ORCLA Setupdatei ausfuehren'; pattern='(?i)ORCLA'; expected='ORCLA vorhanden' },
                @{ id='IPC-DC-0076'; description='Watchdog und OPC UA Server aktivieren'; pattern='(?i)(Watchdog|OPC UA Server)'; expected='Watchdog und OPC-UA-Komponenten vorhanden' }
              ) 'IPC DC'
              Add-BoolCheck 'IPC-DC-0216' 'Energieverwaltung produktiver Netzwerkadapter deaktivieren' $powerPassed $powerActual 'Computer darf produktive Adapter nicht ausschalten' 'IPC DC' $true $powerCheckable
              Add-BoolCheck 'IPC-DC-0217' 'MTU 1494 bei Systemen ohne PCS 7 einstellen' $mtu1494Passed $mtuActual 'MTU 1494 an den laut TPI betroffenen Netzwerkadaptern' 'IPC DC' $nonPcs7MtuRequired $mtuCheckable
              Add-BoolCheck 'IPC-DC-0218' 'Active Directory-Domaenendienste installieren' $domainControllerDetected $adActual 'AD-Domaenendienste installiert beziehungsweise DomainRole >= 4' 'IPC DC'
            } else {
              # Spezial-IPC erkannt, aber keine eindeutige ES-/DC-Unterrolle.
              # Die ID-Pruefungen werden im Report als NICHT_PRUEFBAR ausgegeben.
            }
          }
        }

        $checkSummary = [ordered]@{
          ok = @($checks | Where-Object { $_.status -eq 'OK' }).Count
          nok = @($checks | Where-Object { $_.status -eq 'NOK' }).Count
          nicht_relevant = @($checks | Where-Object { $_.status -eq 'NICHT_RELEVANT' }).Count
          nicht_pruefbar = @($checks | Where-Object { $_.status -eq 'NICHT_PRUEFBAR' }).Count
        }

        $pcs7Components = @($programs | Where-Object {
          ($_.name + ' ' + $_.publisher) -match '(?i)(Siemens|SIMATIC|PCS\s*7|PCS7|WinCC|STEP\s*7|CEMAT|SENTRON|SIMOCODE|Industry Library|Safety Matrix|SITOP|Drive ES|PTE400|PowerControl|ORCLA)'
        })

        $result = [ordered]@{
          target_timestamp = (Get-Date).ToString('yyyy-MM-ddTHH:mm:ssK')
          ip = "{{ inventory_hostname }}"
          ansible_reachable = $true
          computername = [string]$env:COMPUTERNAME
          manufacturer = [string]$computerSystem.Manufacturer
          model = [string]$computerSystem.Model
          domain = [string]$computerSystem.Domain
          domain_role = [int]$computerSystem.DomainRole
          part_of_domain = [bool]$computerSystem.PartOfDomain
          os_caption = [string]$operatingSystem.Caption
          os_version = [string]$operatingSystem.Version
          os_build = [string]$operatingSystem.BuildNumber
          platform_detected = if ($isVirtual) { 'VM' } elseif ($isSiemensIPC) { 'Siemens IPC' } else { 'Physisch/Unbekannt' }
          pcs7_detected = [bool]$pcs7Detected
          pcs7_role_detected = $role
          category = $category
          special_subtype = $specialSubtype
          classification_confidence = $classificationConfidence
          classification_note = $classificationNote
          applicable_follow_up_playbooks = $followUpPlaybooks
          classification_scores = [ordered]@{
            engineering = $engineeringScore
            os_server = $serverScore
            os_client = $clientScore
          }
          classification_evidence = [ordered]@{
            pcs7_core = $pcs7CoreEvidence
            pcs7_detected = [bool]$pcs7Detected
            engineering = $engineeringEvidence
            os_server = $serverEvidence
            os_client = $clientEvidence
            domain_controller = $domainControllerDetected
            orcla = $orclaEvidence
          }
          winrm_port = "{{ ansible_port | default('') }}"
          winrm_scheme = "{{ ansible_winrm_scheme | default('') }}"
          winrm_open_ports = "{{ discovered_winrm_open_ports | default('') }}"
          pcs7_setup_log_path = $setupLogPath
          pcs7_setup_log_exists = (Test-Path $setupLogPath)
          pcs7_setup_logs = $setupLogs
          pcs7_components = $pcs7Components
          installed_programs = $programs
          windows_features = $features
          relevant_services = @($services | Where-Object {
            ($_.name + ' ' + $_.display_name) -match '(?i)(SIMATIC|Siemens|WinCC|PCS|CEMAT|ORCLA|OPC|Sybase|SQL)'
          })
          local_pcs7_groups = $simaticGroups
          network_adapters = $networkAdapters
          checks = @($checks)
          check_summary = $checkSummary
          error = $null
        }

        $result | ConvertTo-Json -Depth 14 -Compress
      register: pcs7_raw
      when: pcs7_ansible_reachable | bool
      changed_when: false
      failed_when: false

    - name: PCS7-Pruefergebnis als Host-Fact speichern
      ansible.builtin.set_fact:
        pcs7_validation_result: "{{ pcs7_raw.stdout | trim | from_json }}"
      when:
        - pcs7_ansible_reachable | bool
        - pcs7_raw is defined
        - pcs7_raw.rc | default(1) == 0
        - pcs7_raw.stdout is defined
        - pcs7_raw.stdout | trim | length > 0


- name: JSON- und ID-basierten CSV-Report erzeugen
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Pruefen, ob der Ablagepfad vorhanden ist
      ansible.builtin.stat:
        path: "{{ result_dir }}"
      register: report_directory_status

    - name: Abbrechen, wenn der Ablagepfad existiert, aber kein Ordner ist
      ansible.builtin.fail:
        msg: >-
          Der konfigurierte Ablagepfad {{ result_dir }} existiert,
          ist aber kein Verzeichnis.
      when:
        - report_directory_status.stat.exists | bool
        - not (report_directory_status.stat.isdir | default(false) | bool)

    - name: Ablageordner erzeugen
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0750"

    - name: JSON-Report erzeugen
      ansible.builtin.copy:
        dest: "{{ result_dir }}/0020_pcs7_kategorisierung_{{ report_file_timestamp }}.json"
        mode: "0644"
        content: |
          [
          {% for h in discovered_ips %}
          {% set fallback = {
            'target_timestamp': '',
            'ip': h,
            'ansible_reachable': false,
            'computername': '',
            'manufacturer': '',
            'model': '',
            'domain': '',
            'domain_role': '',
            'part_of_domain': '',
            'os_caption': '',
            'os_version': '',
            'os_build': '',
            'platform_detected': 'Nicht pruefbar',
            'pcs7_detected': false,
            'pcs7_role_detected': 'Nicht pruefbar',
            'category': 'Nicht klassifiziert',
