            Add-BoolCheck 'VM-C-0155' 'PROFINET-IO-Protokoll am Terminalbus deaktivieren' $terminalBusPassed $terminalBusActual 'PROFINET-/PNIO-Bindung am Terminalbus deaktiviert' 'VM OS Client' $true $terminalBusCheckable
            Add-BoolCheck 'VM-C-0157' '.NET Framework 3.5 aktivieren' $netFx3Enabled $netFx3Actual '.NET Framework 3.5 aktiviert' 'VM OS Client'
