  tasks:
    - name: Ergebnisliste initialisieren
      ansible.builtin.set_fact:
        validation_results_map: {}
        validation_scan_timestamp: "{{ lookup('pipe', 'date -Iseconds') }}"
        validation_hostname: ""
        validation_ip: "{{ ansible_host | default(inventory_hostname) }}"
        validation_os_info: {}
        validation_collected: {}
        validation_results: []

    - name: WinRM-Verbindung testen
      ansible.windows.win_ping:
      register: validation_win_ping
      changed_when: false
      ignore_errors: true
      ignore_unreachable: true

    - name: CONNECTIVITY bei WinRM-Fehler setzen
      ansible.builtin.set_fact:
        validation_results: >-
          {{
            [
              {
                'ansible_id': 'CONNECTIVITY',
                'schritt': 'WinRM-Verbindung',
                'status': validation_status_nok,
                'check_type': 'connectivity',
                'istwert': 'win_ping fehlgeschlagen',
                'sollwert': 'win_ping erfolgreich',
                'pruefmethode': 'ansible.windows.win_ping',
                'hinweis': validation_win_ping.msg | default('Host nicht erreichbar oder Authentifizierung fehlgeschlagen'),
                'evidence': validation_win_ping | to_json,
                'timestamp': validation_scan_timestamp
              }
            ]
          }}
      when: validation_win_ping.ping | default('') != 'pong'

    - block:
        - name: Default-Ergebnisdatensaetze fuer alle CSV-Schritte vorbereiten
          ansible.builtin.set_fact:
            validation_results_map: >-
              {{
                validation_results_map
                | combine({
                    item.ansible_id: {
                      'ansible_id': item.ansible_id,
                      'schritt': item.schritt,
                      'status': validation_status_info,
                      'check_type': 'catalog',
                      'istwert': 'Keine technische Prüfung implementiert',
                      'sollwert': item.sollwert | default(''),
                      'pruefmethode': 'CSV-Katalog',
                      'hinweis': 'Manuelle Prüfung oder reine Dokumentation erforderlich',
                      'evidence': '',
                      'timestamp': validation_scan_timestamp
                    }
                  }, recursive=True)
              }}
          loop: "{{ validation_step_catalog }}"

        - name: Basisinformationen lesen
          ansible.windows.win_shell: |
            $result = [ordered]@{}
            $result.Hostname = $env:COMPUTERNAME
            $result.OS = Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
            $result.TimeZone = (Get-TimeZone).Id
            $result.PowerPlan = (powercfg /GETACTIVESCHEME) -join " "
            $result.ComputerSystem = Get-CimInstance Win32_ComputerSystem | Select-Object Domain, PartOfDomain, Manufacturer, Model
            $result.Bios = Get-CimInstance Win32_BIOS | Select-Object SMBIOSBIOSVersion, Manufacturer, ReleaseDate
            $result.NetAdapter = @(Get-NetAdapter | Select-Object Name, Status, InterfaceDescription, MacAddress, LinkSpeed)
            $result.NetConfig = @(Get-NetIPConfiguration | ForEach-Object {
              [PSCustomObject]@{
                InterfaceAlias = $_.InterfaceAlias
                IPv4Address = @($_.IPv4Address | ForEach-Object { $_.IPAddress })
                IPv4DefaultGateway = @($_.IPv4DefaultGateway | ForEach-Object { $_.NextHop })
                DnsServer = @($_.DNSServer.ServerAddresses)
              }
            })
            $result.Volumes = @(Get-Volume | Where-Object { $_.DriveLetter } | Select-Object DriveLetter, FileSystemLabel, Size, SizeRemaining)
            $result.Services = @(Get-Service | Select-Object Name, DisplayName, Status, StartType)
            $result.Features = [ordered]@{
              NetFx3 = (Get-WindowsFeature -Name NET-Framework-Core -ErrorAction SilentlyContinue | Select-Object Name, InstallState)
              IIS = (Get-WindowsFeature -Name Web-Server -ErrorAction SilentlyContinue | Select-Object Name, InstallState)
              MSMQ = (Get-WindowsFeature -Name MSMQ-Server -ErrorAction SilentlyContinue | Select-Object Name, InstallState)
              SNMP = (Get-WindowsCapability -Online | Where-Object { $_.Name -match 'SNMP' } | Select-Object Name, State)
            }
            $result.OptionalFeatures = @(
              Get-WindowsOptionalFeature -Online -ErrorAction SilentlyContinue |
              Select-Object FeatureName, State
            )
            $result.HotFixes = @(Get-HotFix | Select-Object HotFixID, InstalledOn, Description)
            $result.Shares = @(Get-SmbShare | Select-Object Name, Path, Description)
            $result.SmbServerConfiguration = Get-SmbServerConfiguration | Select-Object EnableSecuritySignature, RequireSecuritySignature, EncryptData
            $result.FirewallProfiles = @(Get-NetFirewallProfile | Select-Object Name, Enabled, DefaultInboundAction, DefaultOutboundAction)
            $result.FirewallRulesVnc = @(
              Get-NetFirewallRule -PolicyStore ActiveStore -ErrorAction SilentlyContinue |
              Where-Object { $_.DisplayName -match 'VNC' -or $_.Name -match 'VNC' } |
              ForEach-Object {
                $pf = Get-NetFirewallPortFilter -AssociatedNetFirewallRule $_ -ErrorAction SilentlyContinue
                [PSCustomObject]@{
                  Name = $_.Name
                  DisplayName = $_.DisplayName
                  Enabled = $_.Enabled
                  Profile = $_.Profile
                  Action = $_.Action
                  LocalPort = $pf.LocalPort
                }
              }
            )
            $result.Registry = [ordered]@{}
            $sysPol = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
            $sysPolVal = Get-ItemProperty -Path $sysPol -ErrorAction SilentlyContinue
            $result.Registry.LocalAccountTokenFilterPolicy = $sysPolVal.LocalAccountTokenFilterPolicy
            $result.Registry.EnableLUA = $sysPolVal.EnableLUA
            $result.Registry.ConsentPromptBehaviorAdmin = $sysPolVal.ConsentPromptBehaviorAdmin
            $result.Registry.PromptOnSecureDesktop = $sysPolVal.PromptOnSecureDesktop

            $searchPath = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Search'
            $searchVal = Get-ItemProperty -Path $searchPath -ErrorAction SilentlyContinue
            $result.Registry.SearchboxTaskbarMode = $searchVal.SearchboxTaskbarMode

            $wuPath = '{{ ipc_update_policy_registry_path | default("HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\WindowsUpdate") }}'
            $wuVal = Get-ItemProperty -Path $wuPath -ErrorAction SilentlyContinue
            $result.Registry.ElevateNonAdmins = $wuVal.{{ ipc_update_policy_value_name | default('ElevateNonAdmins') }}

            $result.Registry.SChannel = @()
            foreach ($p in @('SSL 2.0','SSL 3.0','TLS 1.0','TLS 1.1','TLS 1.2')) {
              $serverPath = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$p\Server"
              $clientPath = "HKLM:\SYSTEM\CurrentControlSet\Control\SecurityProviders\SCHANNEL\Protocols\$p\Client"
              $serverEnabled = $null
              $clientEnabled = $null
              if (Test-Path $serverPath) { $serverEnabled = (Get-ItemProperty -Path $serverPath -ErrorAction SilentlyContinue).Enabled }
              if (Test-Path $clientPath) { $clientEnabled = (Get-ItemProperty -Path $clientPath -ErrorAction SilentlyContinue).Enabled }
              $result.Registry.SChannel += [PSCustomObject]@{
                Protocol = $p
                ServerEnabled = $serverEnabled
                ClientEnabled = $clientEnabled
              }
            }

            $netbtPath = 'HKLM:\SYSTEM\CurrentControlSet\Services\NetBT\Parameters\Interfaces'
            $lmhosts = @()
            $wins = @()
            if (Test-Path $netbtPath) {
              Get-ChildItem $netbtPath -ErrorAction SilentlyContinue | ForEach-Object {
                $item = Get-ItemProperty -Path $_.PSPath -ErrorAction SilentlyContinue
                $lmhosts += [PSCustomObject]@{
                  Interface = $_.PSChildName
                  EnableLMHOSTS = $item.EnableLMHOSTS
                }
                $wins += [PSCustomObject]@{
                  Interface = $_.PSChildName
                  NameServerList = $item.NameServerList
                }
              }
            }
            $result.Registry.LMHOSTS = $lmhosts
            $result.Registry.WINS = $wins

            $result.TlsCipherSuites = @(Get-TlsCipherSuite | Select-Object -ExpandProperty Name)

            $result.Paths = [ordered]@{}
            $result.Paths.UltraVncIni = @(
              {% for p in expected_vnc_ini_paths | default([]) %}
              if (Test-Path '{{ p }}') { '{{ p }}' }
              {% endfor %}
            )
            $result.Paths.BgInfo = @(
              {% for p in expected_bginfo_paths | default([]) %}
              if (Test-Path '{{ p }}') { '{{ p }}' }
              {% endfor %}
            )
            $result.Paths.ProjectFolderExists = Test-Path '{{ expected_project_folder | default("D:\\Projekte") }}'
            $result.Paths.ImagesFolderExists = Test-Path 'D:\Images'

            $result.Certificates = @(
              Get-ChildItem Cert:\LocalMachine\Root -ErrorAction SilentlyContinue |
              Select-Object Subject, Thumbprint, NotAfter
            )

            $result.LocalUsers = @(Get-LocalUser | Select-Object Name, Enabled, PasswordNeverExpires, LastLogon)
            $result.LocalGroups = @(Get-LocalGroup | Select-Object Name)
            $result.LocalGroupMembers = @(
              Get-LocalGroup | ForEach-Object {
                $groupName = $_.Name
                try {
                  Get-LocalGroupMember -Group $groupName -ErrorAction Stop | ForEach-Object {
                    [PSCustomObject]@{
                      Group = $groupName
                      Member = $_.Name
                      ObjectClass = $_.ObjectClass
                    }
                  }
                } catch {}
              }
            )

            $result.SnmpService = Get-Service -Name SNMP -ErrorAction SilentlyContinue | Select-Object Name, Status, StartType
            $result.W32Time = Get-Service -Name W32Time -ErrorAction SilentlyContinue | Select-Object Name, Status, StartType

            try {
              $dn = ([adsisearcher]"(&(objectCategory=computer)(name=$env:COMPUTERNAME))").FindOne().Properties.distinguishedname
              $result.OU = [string]$dn
            } catch {
              $result.OU = ''
            }

            $result | ConvertTo-Json -Depth 12 -Compress
          register: validation_collected_raw
          changed_when: false
          failed_when: false

