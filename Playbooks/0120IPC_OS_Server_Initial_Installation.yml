---
- name: "0120 IPC OS Server - Discovery einlesen und Zielsysteme vorbereiten"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  vars:
    # Die PowerShell-Skripte liegen im Repository auf derselben Ebene wie
    # der Ordner Playbooks:
    #   <Repository>/Playbooks/0120IPC_OS_Server_Initial_Installation.yml
    #   <Repository>/PowershellBatch/1.ps1 ... 6.ps1
    validation_script_source_dir: "{{ playbook_dir }}/../PowershellBatch"

    # Exemplarische Skriptnamen. Spaeter einfach durch die echten Namen ersetzen.
    validation_script_names:
      - "Initial_Valid.ps1"
      - "GPOs_Valid.ps1"
      - "Certificates_Services_Drivers_Valid.ps1"
      - "Firewall_SMB_Patch_Valid.ps1"
      - "Software_PCS7_Components_Valid.ps1"
     

  tasks:
    - name: Benoetigte Semaphore-Variablen pruefen
      ansible.builtin.assert:
        that:
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - result_dir is defined
          - win_user | string | length > 0
          - win_password | string | length > 0
          - winrm_transport | string | length > 0
          - result_dir | string | length > 0
        fail_msg: >-
          Benoetigt werden mindestens win_user, win_password,
          winrm_transport und result_dir.

    - name: Pfad zur IPC-Discovery-Datei festlegen
      ansible.builtin.set_fact:
        validation_discovery_file: >-
          {{
            ipc_discovery_file
            | default(result_dir ~ '/ipc_discovery_groups_latest.json')
          }}
        validation_run_id: "{{ lookup('pipe', 'date +%Y%m%d_%H%M%S') }}"

    - name: IPC-Discovery-Datei pruefen
      ansible.builtin.stat:
        path: "{{ validation_discovery_file }}"
      register: validation_discovery_stat

    - name: Abbrechen wenn IPC-Discovery-Datei fehlt
      ansible.builtin.fail:
        msg: >-
          {{ validation_discovery_file }} wurde nicht gefunden.
          Fuehre zuerst 0000IPC_Discovery_Classification.yml aus.
      when: not (validation_discovery_stat.stat.exists | default(false))

    - name: IPC-Discovery-Datei einlesen
      ansible.builtin.slurp:
        src: "{{ validation_discovery_file }}"
      register: validation_discovery_raw

    - name: IPC-Discovery-Daten speichern
      ansible.builtin.set_fact:
        validation_discovery_data: >-
          {{ validation_discovery_raw.content | b64decode | from_json }}

    - name: Pruefen ob Gruppe ipc_os vorhanden ist
      ansible.builtin.assert:
        that:
          - validation_discovery_data.groups is defined
          - validation_discovery_data.groups.ipc_os is defined
        fail_msg: >-
          In {{ validation_discovery_file }} wurde groups.ipc_os nicht gefunden.

    - name: Lokalen Basis-Ergebnisordner anlegen
      ansible.builtin.file:
        path: "{{ result_dir }}"
        state: directory
        mode: "0755"

    - name: PowerShell-Pruefskripte auf dem Controller pruefen
      ansible.builtin.stat:
        path: "{{ validation_script_source_dir }}/{{ item }}"
      loop: "{{ validation_script_names }}"
      register: validation_script_stats
      loop_control:
        label: "{{ item }}"

    - name: Abbrechen wenn ein PowerShell-Pruefskript fehlt
      ansible.builtin.fail:
        msg: >-
          PowerShell-Skript fehlt:
          {{ item.stat.path | default(validation_script_source_dir ~ '/' ~ item.item) }}
      loop: "{{ validation_script_stats.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: not (item.stat.exists | default(false))

    - name: IPC-OS-Server-Hosts dynamisch aus Discovery-JSON anlegen
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: ipc_os_server_validation_targets
        ansible_host: "{{ item.ip }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.winrm_port | default(winrm_default_port | default(5985)) | int }}"
        ansible_winrm_scheme: "{{ item.winrm_scheme | default('http') }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(90) }}"
        validation_script_source_dir: "{{ validation_script_source_dir }}"
        validation_script_names: "{{ validation_script_names }}"
        validation_run_id: "{{ validation_run_id }}"
      loop: "{{ validation_discovery_data.groups.ipc_os | default([]) }}"
      loop_control:
        label: "{{ item.ip }}"
      no_log: true

    - name: Gefundene IPC-OS-Server-Ziele anzeigen
      ansible.builtin.debug:
        msg:
          - "Discovery-Datei: {{ validation_discovery_file }}"
          - "IPC OS Server Anzahl: {{ validation_discovery_data.groups.ipc_os | default([]) | length }}"
          - "IPC OS Server IPs: {{ validation_discovery_data.groups.ipc_os | default([]) | map(attribute='ip') | list }}"

    - name: Hinweis wenn keine IPC OS Server vorhanden sind
      ansible.builtin.debug:
        msg: >-
          In groups.ipc_os sind keine OS-Server-Zielsysteme enthalten.
          Es werden keine PowerShell-Pruefungen ausgefuehrt.
      when: validation_discovery_data.groups.ipc_os | default([]) | length == 0


- name: "0120 IPC OS Server - PowerShell-Pruefungen ausfuehren und Ergebnisse einsammeln"
  hosts: ipc_os_server_validation_targets
  gather_facts: false
  become: false
  any_errors_fatal: false

  vars:
    # Temporaerer Basisordner auf dem Windows-Zielsystem
    validation_remote_base_dir: 'C:\temp\AnsibleValidation'

    # Hier liegen nur die PowerShell-Pruefskripte
    validation_remote_script_dir: '{{ validation_remote_base_dir }}\skripte'

    # Hier erzeugen die PowerShell-Skripte ihre JSON-Ergebnisse
    validation_remote_result_dir: '{{ validation_remote_base_dir }}\result'

    # Dauerhafte Ergebnisablage auf der Ansible-VM
    validation_local_host_result_dir: >-
      {{ result_dir }}/{{ ansible_host | default(inventory_hostname) }}

  tasks:
    - name: Lokalen Ergebnisordner fuer diese IP anlegen
      ansible.builtin.file:
        path: "{{ validation_local_host_result_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      become: false

    - name: WinRM-Verbindung vor der Pruefung testen
      ansible.windows.win_ping:
      register: validation_win_ping
      changed_when: false

    - name: Pruefablauf ausfuehren
      block:
        - name: Temporaere Validierungsordner auf Zielrechner anlegen
          ansible.windows.win_file:
            path: "{{ item }}"
            state: directory
          loop:
            - "{{ validation_remote_script_dir }}"
            - "{{ validation_remote_result_dir }}"

        - name: PowerShell-Pruefskripte auf Zielrechner kopieren
          ansible.windows.win_copy:
            src: "{{ validation_script_source_dir }}/{{ item }}"
            dest: "{{ validation_remote_script_dir }}\\{{ item }}"
          loop: "{{ validation_script_names }}"
          loop_control:
            label: "{{ item }}"

        - name: PowerShell-Pruefskripte nacheinander ausfuehren
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Continue'
            Set-Location -LiteralPath '{{ validation_remote_script_dir }}'

            # Einheitlicher Ausgabeordner fuer die Pruefskripte.
            # Ein Pruefskript kann diesen Wert optional verwenden.
            $env:VALIDATION_RESULT_DIR = '{{ validation_remote_result_dir }}'
            $env:VALIDATION_TARGET_IP = '{{ ansible_host | default(inventory_hostname) }}'

            & powershell.exe `
              -NoLogo `
              -NoProfile `
              -NonInteractive `
              -ExecutionPolicy Bypass `
              -File '{{ validation_remote_script_dir }}\{{ item }}'

            exit $LASTEXITCODE
          args:
            chdir: "{{ validation_remote_script_dir }}"
          loop: "{{ validation_script_names }}"
          loop_control:
            label: "{{ item }}"
          register: validation_script_execution
          changed_when: false
          failed_when: false

        - name: Fehlgeschlagene PowerShell-Pruefskripte speichern
          ansible.builtin.set_fact:
            validation_failed_scripts: >-
              {{
                validation_script_execution.results
                | selectattr('rc', 'defined')
                | rejectattr('rc', 'equalto', 0)
                | list
              }}

        - name: Erzeugte JSON-Dateien auf Zielrechner suchen
          ansible.windows.win_find:
            paths:
              - "{{ validation_remote_result_dir }}"
            patterns:
              - "*.json"
            recurse: true
            file_type: file
          register: validation_remote_json_files
          changed_when: false

        - name: Gefundene JSON-Dateien anzeigen
          ansible.builtin.debug:
            msg: >-
              {{ ansible_host | default(inventory_hostname) }}:
              {{ validation_remote_json_files.files | default([]) | length }}
              JSON-Datei(en) erzeugt.

        - name: JSON-Ergebnisse auf Ansible-VM kopieren
          ansible.builtin.fetch:
            src: "{{ item.path }}"
            dest: "{{ validation_local_host_result_dir }}/"
            flat: true
            fail_on_missing: true
          loop: "{{ validation_remote_json_files.files | default([]) }}"
          loop_control:
            label: "{{ item.filename | default(item.path) }}"

      rescue:
        - name: Fehler des Pruefablaufs merken
          ansible.builtin.set_fact:
            validation_workflow_error: >-
              {{ ansible_failed_result.msg | default(ansible_failed_result | to_json) }}

      always:
        - name: Temporaere Skripte und Ergebnisdateien vom Zielrechner entfernen
          ansible.windows.win_file:
            path: "{{ validation_remote_base_dir }}"
            state: absent
          register: validation_cleanup
          failed_when: false

        - name: Cleanup-Ergebnis anzeigen
          ansible.builtin.debug:
            msg: >-
              Temporaerer Arbeitsordner {{ validation_remote_base_dir }} auf
              {{ ansible_host | default(inventory_hostname) }} wurde
              {{ 'entfernt' if not (validation_cleanup.failed | default(false)) else 'NICHT vollstaendig entfernt' }}.

    - name: Fehler melden wenn der Pruefablauf selbst fehlgeschlagen ist
      ansible.builtin.fail:
        msg: >-
          Pruefablauf auf {{ ansible_host | default(inventory_hostname) }} fehlgeschlagen:
          {{ validation_workflow_error }}
          Der Cleanup wurde trotzdem ausgefuehrt.
      when: validation_workflow_error is defined

    - name: Fehler melden wenn keine JSON-Datei erzeugt wurde
      ansible.builtin.fail:
        msg: >-
          Auf {{ ansible_host | default(inventory_hostname) }} wurde von den
          PowerShell-Pruefskripten keine JSON-Datei im temporaeren Arbeitsordner erzeugt.
          Die Skripte muessen ihre JSON-Ausgaben in das aktuelle Arbeitsverzeichnis
          oder nach $env:VALIDATION_RESULT_DIR schreiben.
      when:
        - validation_workflow_error is not defined
        - validation_remote_json_files is defined
        - validation_remote_json_files.files | default([]) | length == 0

    - name: Fehlerhafte PowerShell-Skripte nach Ergebnisuebernahme melden
      ansible.builtin.fail:
        msg: >-
          Auf {{ ansible_host | default(inventory_hostname) }} sind folgende
          PowerShell-Pruefskripte mit einem Fehlercode beendet worden:
          {{ validation_failed_scripts | map(attribute='item') | list }}.
          Vorhandene JSON-Ergebnisse wurden zuvor auf die Ansible-VM kopiert
          und der temporaere Zielordner wurde entfernt.
      when:
        - validation_workflow_error is not defined
        - validation_failed_scripts is defined
        - validation_failed_scripts | length > 0

    - name: Erfolgreiche Ergebnisablage anzeigen
      ansible.builtin.debug:
        msg:
          - "IP: {{ ansible_host | default(inventory_hostname) }}"
          - "Lokaler Ergebnisordner: {{ validation_local_host_result_dir }}"
          - "JSON-Dateien: {{ validation_remote_json_files.files | default([]) | map(attribute='filename') | list }}"
      when:
        - validation_workflow_error is not defined
        - validation_remote_json_files is defined
        - validation_remote_json_files.files | default([]) | length > 0
        - validation_failed_scripts | default([]) | length == 0