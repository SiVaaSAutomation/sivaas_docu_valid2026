---
- name: "0120 IPC OS Server Validation vorbereiten"
  hosts: localhost
  connection: local
  become: false
  gather_facts: false

  tasks:
    - name: Pruefen, ob benoetigte Semaphore-Variablen uebergeben wurden
      ansible.builtin.assert:
        that:
          - target_network is defined
          - nmap_binary is defined
          - win_user is defined
          - win_password is defined
          - winrm_transport is defined
          - result_dir is defined
          - pcs7_setup_log_path is defined
        fail_msg: >-
          Es fehlen Variablen (target_network, nmap_binary, win_user,
          win_password, winrm_transport, result_dir, pcs7_setup_log_path).

    - name: IPC-Discovery-Datei einlesen
      ansible.builtin.slurp:
        src: "{{ ipc_discovery_file | default(result_dir ~ '/ipc_discovery_groups_latest.json') }}"
      register: validation_discovery_file_raw

    - name: IPC-Discovery-Daten speichern
      ansible.builtin.set_fact:
        validation_discovery_data: "{{ validation_discovery_file_raw.content | b64decode | from_json }}"

    - name: IP-Adressen aus der Gruppe IPC OS Server speichern
      ansible.builtin.set_fact:
        validation_target_ips: >-
          {{
            validation_discovery_data.groups.ipc_os_server
            | default([])
            | selectattr('ip', 'defined')
            | map(attribute='ip')
            | map('string')
            | map('trim')
            | reject('equalto', '')
            | unique
            | list
          }}

    - name: Hinweis wenn keine OS-Server gefunden wurden
      ansible.builtin.debug:
        msg: "Keine IP-Adressen in groups.ipc_os_server gefunden."
      when: validation_target_ips | length == 0

    - name: IP-Adressen nach offenen WinRM-Ports scannen
      ansible.builtin.shell: |
        set -o pipefail
        {{ nmap_binary }} -n -Pn -p 5985,5986 --open {{ validation_target_ips | join(' ') }} -oG - |
        awk '
          /Ports:/ {
            host=$2
            has_http = ($0 ~ /5985\/open\/tcp/)
            has_https = ($0 ~ /5986\/open\/tcp/)
            if (has_https) {
              ports = has_http ? "5985,5986" : "5986"
              print host ";5986;https;" ports
            } else if (has_http) {
              print host ";5985;http;5985"
            }
          }
        '
      register: validation_scan_result
      when: validation_target_ips | length > 0
      changed_when: false

    - name: Hosts in das temporaere Inventory aufnehmen
      ansible.builtin.add_host:
        name: "{{ item.split(';')[0] }}"
        groups: ipc_os_server_validation_targets
        ansible_host: "{{ item.split(';')[0] }}"
        ansible_connection: winrm
        ansible_user: "{{ win_user }}"
        ansible_password: "{{ win_password }}"
        ansible_port: "{{ item.split(';')[1] | int }}"
        ansible_winrm_scheme: "{{ item.split(';')[2] }}"
        ansible_winrm_transport: "{{ winrm_transport }}"
        ansible_winrm_server_cert_validation: ignore
        ansible_winrm_operation_timeout_sec: "{{ winrm_operation_timeout_sec | default(60) }}"
        ansible_winrm_read_timeout_sec: "{{ winrm_read_timeout_sec | default(180) }}"
        discovered_winrm_open_ports: "{{ item.split(';')[3] }}"
      loop: "{{ validation_scan_result.stdout_lines | default([]) }}"
      no_log: true

